  </script>
  <script>
  (function(){
    var history = null;        // {date: {snapshots: [{time, items}]}}
    var latest = null;         // {time, items}
    var dates = [];            // sorted dates
    var curDate = null;
    var curSnapIdx = -1;       // -1 = latest
    function el(id){ return document.getElementById(id); }

    // ===== 数据加载 =====
    function loadFromEmbed(){
      if(_embed && _embed.items && _embed.items.length){
        latest = { time: _embed.time, items: _embed.items };
        history = {};
        var d = (new Date()).toISOString().slice(0,10);
        history[d] = { snapshots: [{ time: _embed.time, items: _embed.items }] };
        return true;
      }
      return false;
    }

    function loadFromServer(){
      fetch('speedrank_history.json?t=' + Date.now())
        .then(function(r){
          if(!r.ok){ console.warn('[speedrank] server returned', r.status, '- using embedded data'); return null; }
          return r.json();
        })
        .then(function(d){
          if(d && Object.keys(d).length){
            history = d;
            dates = Object.keys(d).sort();
            curDate = dates[dates.length-1];
            var snaps = d[curDate].snapshots;
            latest = snaps[snaps.length-1];
          } else if(!latest){
            loadFromEmbed();
          }
          renderAll();
        })
        .catch(function(e){
          console.warn('[speedrank] fetch error:', e.message, '- using embedded data');
          if(!latest){ loadFromEmbed(); }
          renderAll();
        });
    }

    // ===== 渲染 =====
    function renderAll(){
      if(!latest){ el('update-bar').textContent = '暂无数据（交易日 9:30-15:00 每5分钟自动快照）'; return; }
      el('update-bar').innerHTML = '最新快照: <b>' + (latest.time || '-') + '</b> · 每5分钟自动刷新 · 页面每300秒自动重载';
      el('st-time').textContent = latest.time;
      if(history){
        dates = Object.keys(history).sort();
        el('st-days').textContent = dates.join(' ');
        var today = dates[dates.length-1];
        el('st-snap').textContent = history[today] ? history[today].snapshots.length : 0;
      }
      renderNav();
      renderTable();
    }

    function renderNav(){
      var nav = el('time-nav');
      nav.innerHTML = '';
      if(!history || !dates.length) return;
      var today = dates[dates.length-1];
      var snaps = history[today].snapshots;
      // 按钮: 最新 + 每个快照
      var btns = [];
      var latestBtn = document.createElement('button');
      latestBtn.className = 'tn latest' + (curSnapIdx === -1 ? ' active' : '');
      latestBtn.textContent = '⏱ 最新 ' + (latest ? latest.time : '');
      latestBtn.onclick = function(){ curSnapIdx = -1; renderNav(); renderTable(); };
      nav.appendChild(latestBtn);
      for(var i = snaps.length - 1; i >= 0; i--){
        (function(idx){
          var b = document.createElement('button');
          b.className = 'tn' + (curSnapIdx === idx ? ' active' : '');
          b.textContent = snaps[idx].time;
          b.onclick = function(){ curSnapIdx = idx; renderNav(); renderTable(); };
          nav.appendChild(b);
        })(i);
      }
    }

    function getSnapItems(){
      if(curSnapIdx === -1 || !history){ return latest ? latest.items : []; }
      var today = dates[dates.length-1];
      var snaps = history[today].snapshots;
      return (snaps[curSnapIdx] && snaps[curSnapIdx].items) || [];
    }

    // 上一轮 items (用于涨速对比)
    function getPrevItems(){
      if(!history || !dates.length) return null;
      var today = dates[dates.length-1];
      var snaps = history[today].snapshots;
      var idx = curSnapIdx === -1 ? snaps.length - 1 : curSnapIdx;
      if(idx <= 0) return null;
      return snaps[idx-1].items;
    }

    // 连续上榜次数: 从当前快照往前数
    function countStreak(code){
      if(!history || !dates.length) return 0;
      var today = dates[dates.length-1];
      var snaps = history[today].snapshots;
      var idx = curSnapIdx === -1 ? snaps.length - 1 : curSnapIdx;
      var c = 0;
      for(var i = idx; i >= 0; i--){
        var found = false;
        for(var j = 0; j < snaps[i].items.length; j++){
          if(snaps[i].items[j].code === code){ found = true; break; }
        }
        if(found) c++; else break;
      }
      return c;
    }

    function renderTable(){
      var items = getSnapItems();
      var tbody = el('tbody');
      if(!items.length){ tbody.innerHTML = '<tr><td colspan="11" class="empty">暂无数据</td></tr>'; return; }
      var prev = getPrevItems();
      var prevMap = {};
      if(prev){ prev.forEach(function(p){ prevMap[p.code] = p; }); }
      var html = '';
      items.forEach(function(it, i){
        var cls = i === 0 ? 'r1' : (i === 1 ? 'r2' : (i === 2 ? 'r3' : ''));
        var prevIt = prevMap[it.code];
        var delta = '';
        if(prevIt && prevIt.speed != null && it.speed != null){
          var d = it.speed - prevIt.speed;
          if(d > 0.01) delta = '<span class="delta-up">▲+' + d.toFixed(2) + '</span>';
          else if(d < -0.01) delta = '<span class="delta-down">▼' + d.toFixed(2) + '</span>';
          else delta = '<span class="delta-flat">—</span>';
        } else {
          delta = '<span class="delta-flat">—</span>';
        }
        var chgCls = (it.chg_pct != null && it.chg_pct >= 0) ? 'up' : 'down';
        var streak = countStreak(it.code);
        var streakHtml = streak >= 2 ? '<span class="cnt-badge">' + streak + '</span>' : (streak === 1 ? '<span class="cnt-badge" style="opacity:0.5">1</span>' : '');
        var rowHot = (curSnapIdx === -1 && i < 3) ? ' class="hot"' : '';
        html += '<tr' + rowHot + '>'
          + '<td class="rank ' + cls + '">' + (i+1) + '</td>'
          + '<td class="code">' + it.code + '</td>'
          + '<td class="name" onclick="openKlineModal(\'' + it.code + '\',this.textContent)">' + it.name + '</td>'
          + '<td class="speed up">' + (it.speed != null ? it.speed.toFixed(2) : '-') + '%</td>'
          + '<td>' + delta + '</td>'
          + '<td class="' + chgCls + '">' + (it.chg_pct != null ? it.chg_pct.toFixed(2) : '-') + '%</td>'
          + '<td>' + (it.price != null ? it.price.toFixed(2) : '-') + '</td>'
          + '<td>' + (it.turnover != null ? it.turnover.toFixed(2) : '-') + '%</td>'
          + '<td>' + (it.vol_ratio != null ? it.vol_ratio.toFixed(2) : '-') + '</td>'
          + '<td>' + (it.amount_yi != null ? it.amount_yi.toFixed(1) : '-') + '</td>'
          + '<td>' + streakHtml + '</td>'
          + '</tr>';
      });
      tbody.innerHTML = html;
    }

    // ===== init =====
    if(!loadFromEmbed()){ el('update-bar').textContent = '暂无内嵌数据'; }
    loadFromServer();
  })();
  </script>
