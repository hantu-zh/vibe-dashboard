  <script>

  (function(){

    var history = null;        // {date: {snapshots: [{time, items}]}}

    var latest = null;         // {time, items}

    var dates = [];            // sorted dates

    var curDate = null;

    var curSnapIdx = -1;       // -1 = latest

    function el(id){ return document.getElementById(id); }



    // ===== 数据加载 =====

    function loadFromEmbed(){

      if(_embed && _embed.items && _embed.items.length){

        latest = { time: _embed.time, items: _embed.items };

        history = {};

        var d = (new Date()).toISOString().slice(0,10);

        history[d] = { snapshots: [{ time: _embed.time, items: _embed.items }] };

        return true;

      }

      return false;

    }



    function loadFromServer(){

      fetch('speedrank_history.json?t=' + Date.now())

        .then(function(r){

          if(!r.ok){ console.warn('[speedrank] server returned', r.status, '- using embedded data'); return null; }

          return r.json();

        })

        .then(function(d){

          if(d && Object.keys(d).length){

            history = d;

            dates = Object.keys(d).sort();

            curDate = dates[dates.length-1];

            var snaps = d[curDate].snapshots;

            latest = snaps[snaps.length-1];

          } else if(!latest){

            loadFromEmbed();

          }

          renderAll();

        })

        .catch(function(e){

          console.warn('[speedrank] fetch error:', e.message, '- using embedded data');

          if(!latest){ loadFromEmbed(); }

          renderAll();

        });

    }



    // ===== 渲染 =====

    function renderAll(){

      if(!latest){ el('update-bar').textContent = '暂无数据（交易日 9:30-15:00 每5分钟自动快照）'; return; }

      el('update-bar').innerHTML = '最新快照: <b>' + (latest.time || '-') + '</b> · 每5分钟自动刷新 · 页面每300秒自动重载';

      el('st-time').textContent = latest.time;

      if(history){

        dates = Object.keys(history).sort();

        el('st-days').textContent = dates.join(' ');

        var today = dates[dates.length-1];

        el('st-snap').textContent = history[today] ? history[today].snapshots.length : 0;

      }

      renderNav();

      renderTable();

    }



    function renderNav(){

      var nav = el('time-nav');

      nav.innerHTML = '';

      if(!history || !dates.length) return;

      var today = dates[dates.length-1];

      var snaps = history[today].snapshots;

      // 按钮: 最新 + 每个快照

      var btns = [];

      var latestBtn = document.createElement('button');

      latestBtn.className = 'tn latest' + (curSnapIdx === -1 ? ' active' : '');

      latestBtn.textContent = '⏱ 最新 ' + (latest ? latest.time : '');

      latestBtn.onclick = function(){ curSnapIdx = -1; renderNav(); renderTable(); };

      nav.appendChild(latestBtn);

      for(var i = snaps.length - 1; i >= 0; i--){

        (function(idx){

          var b = document.createElement('button');

          b.className = 'tn' + (curSnapIdx === idx ? ' active' : '');

          b.textContent = snaps[idx].time;

          b.onclick = function(){ curSnapIdx = idx; renderNav(); renderTable(); };

          nav.appendChild(b);

        })(i);

      }

    }



    function getSnapItems(){

      if(curSnapIdx === -1 || !history){ return latest ? latest.items : []; }

      var today = dates[dates.length-1];

      var snaps = history[today].snapshots;

      return (snaps[curSnapIdx] && snaps[curSnapIdx].items) || [];

    }



    // 上一轮 items (用于涨速对比)

    function getPrevItems(){

      if(!history || !dates.length) return null;

      var today = dates[dates.length-1];

      var snaps = history[today].snapshots;

      var idx = curSnapIdx === -1 ? snaps.length - 1 : curSnapIdx;

      if(idx <= 0) return null;

      return snaps[idx-1].items;

    }



    // 连续上榜次数: 从当前快照往前数

    function countStreak(code){

      if(!history || !dates.length) return 0;

      var today = dates[dates.length-1];

      var snaps = history[today].snapshots;

      var idx = curSnapIdx === -1 ? snaps.length - 1 : curSnapIdx;

      var c = 0;

      for(var i = idx; i >= 0; i--){

        var found = false;

        for(var j = 0; j < snaps[i].items.length; j++){

          if(snaps[i].items[j].code === code){ found = true; break; }

        }

        if(found) c++; else break;

      }

      return c;

    }



    function renderTable(){

      var items = getSnapItems();

      var tbody = el('tbody');

      if(!items.length){ tbody.innerHTML = '<tr><td colspan="11" class="empty">暂无数据</td></tr>'; return; }

      var prev = getPrevItems();

      var prevMap = {};

      if(prev){ prev.forEach(function(p){ prevMap[p.code] = p; }); }

      var html = '';

      items.forEach(function(it, i){

        var cls = i === 0 ? 'r1' : (i === 1 ? 'r2' : (i === 2 ? 'r3' : ''));

        var prevIt = prevMap[it.code];

        var delta = '';

        if(prevIt && prevIt.speed != null && it.speed != null){

          var d = it.speed - prevIt.speed;

          if(d > 0.01) delta = '<span class="delta-up">▲+' + d.toFixed(2) + '</span>';

          else if(d < -0.01) delta = '<span class="delta-down">▼' + d.toFixed(2) + '</span>';

          else delta = '<span class="delta-flat">—</span>';

        } else {

          delta = '<span class="delta-flat">—</span>';

        }

        var chgCls = (it.chg_pct != null && it.chg_pct >= 0) ? 'up' : 'down';

        var streak = countStreak(it.code);

        var streakHtml = streak >= 2 ? '<span class="cnt-badge">' + streak + '</span>' : (streak === 1 ? '<span class="cnt-badge" style="opacity:0.5">1</span>' : '');

        var rowHot = (curSnapIdx === -1 && i < 3) ? ' class="hot"' : '';

        html += '<tr' + rowHot + '>'

          + '<td class="rank ' + cls + '">' + (i+1) + '</td>'

          + '<td class="code">' + it.code + '</td>'

          + '<td class="name" onclick="openStock(\'' + it.code + '\',this.textContent)">' + it.name + '</td>'

          + '<td class="speed up">' + (it.speed != null ? it.speed.toFixed(2) : '-') + '%</td>'

          + '<td>' + delta + '</td>'

          + '<td class="' + chgCls + '">' + (it.chg_pct != null ? it.chg_pct.toFixed(2) : '-') + '%</td>'

          + '<td>' + (it.price != null ? it.price.toFixed(2) : '-') + '</td>'

          + '<td>' + (it.turnover != null ? it.turnover.toFixed(2) : '-') + '%</td>'

          + '<td>' + (it.vol_ratio != null ? it.vol_ratio.toFixed(2) : '-') + '</td>'

          + '<td>' + (it.amount_yi != null ? it.amount_yi.toFixed(1) : '-') + '</td>'

          + '<td>' + streakHtml + '</td>'

          + '</tr>';

      });

      tbody.innerHTML = html;

    }



    // ===== init =====





    // ===== K 线弹窗适配：在弹窗右侧注入「今日涨速时间线」侧栏 =====

    function openStock(code, name){

      window.__srLastCode = code;

      window.__srLastName = name;

      if (typeof window.openKlineModal === 'function') window.openKlineModal(code, name);

    }

    window.openStock = openStock;



    // kline_popup.js 渲染完 K 线后会调用这个钩子（如未定义则完全无影响）

    window.__KLINE_POPUP_RENDERED__ = function (body, code, name) {

      var pop = body && body.parentElement;

      if (!pop || !code || !history || !dates || !dates.length) return;

      // 兜底：清掉上次渲染可能残留的布局类（弹窗容器是复用的，innerHTML 重置不会清 class）

      body.classList.remove('has-aside-layout');

      var today = dates[dates.length - 1];

      var snaps = history[today] && history[today].snapshots;

      if (!snaps || !snaps.length) return;

      var rows = [], colorIdx = 0;

      var STOCK_COLORS = ['#36a2eb','#9966ff','#ff9f40','#ff6384','#4bc0c0'];

      snaps.forEach(function (s, si) {

        s.items.forEach(function (it, j) {

          if (it.code === code) {

            rows.push({ time: s.time, speed: it.speed, chg: it.chg_pct, price: it.price, rank: j + 1 });

            if (si === snaps.length - 1) colorIdx = j;

          }

        });

      });

      // 同一 code 在同一个 hook 调用里只注入一次（多次 render 重新渲染时复用 aside）

      if (body.querySelector('.sr-tl-aside')) {

        // 已经注入过，只更新数据（罕见分支：用户切换日/周/月后 aside 内容不变，因为是涨速图）

        return;

      }

      if (rows.length < 2) {

        // 同一 body 不能重复注入

        if (body.querySelector('.sr-tl-aside')) return;

        var mainE = document.createElement('div'); mainE.className = 'sr-kl-main';

        // appendChild 本身就是移动节点：循环会自然消耗 firstChild，不会死循环

        while (body.firstChild) mainE.appendChild(body.firstChild);

        var empty = document.createElement('aside');

        empty.className = 'sr-tl-aside';

        empty.innerHTML = '<h4>⚡ 今日涨速</h4><div class="sr-tl-empty">今日仅抓到 ' + rows.length + ' 个快照，<br>暂无可绘曲线</div>';

        body.appendChild(mainE);

        body.appendChild(empty);

        body.classList.add('has-aside-layout');

        return;

      }

      var main2 = document.createElement('div'); main2.className = 'sr-kl-main';

      // appendChild 本身就是移动节点：循环会自然消耗 firstChild，不会死循环

      while (body.firstChild) main2.appendChild(body.firstChild);

      var aside = document.createElement('aside');

      aside.className = 'sr-tl-aside';

      aside.innerHTML =

        '<h4>⚡ 今日涨速时间线 <span class="sr-tl-meta">' + today + ' · ' + rows.length + ' 快照</span></h4>' +

        '<div class="sr-tl-svg"></div>' +

        '<div class="sr-tl-info">色 = 当前榜排名；<br>悬停看涨速与涨跌</div>';

      body.appendChild(main2);

      body.appendChild(aside);

      body.classList.add('has-aside-layout');

      renderSpeedTimeline(aside.querySelector('.sr-tl-svg'), rows, colorIdx, STOCK_COLORS);

    };



    function renderSpeedTimeline(container, rows, colorIdx, STOCK_COLORS){

      if (!container) return;

      var W = 280, H = 132;

      var padL = 30, padR = 8, padT = 8, padB = 18;

      var plotW = W - padL - padR, plotH = H - padT - padB;

      var vals = rows.map(function (r) { return r.speed; });

      var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);

      if (mn === mx) { mn -= 0.5; mx += 0.5; }

      var span = mx - mn;

      if (span < 0.5) { mn -= (0.5 - span) / 2; mx += (0.5 - span) / 2; span = mx - mn; }

      function X(i) { return padL + (rows.length <= 1 ? 0 : i / (rows.length - 1) * plotW); }

      function Y(v) { return padT + (mx - v) / span * plotH; }

      var color = STOCK_COLORS[colorIdx % STOCK_COLORS.length];

      var pts = rows.map(function (r, i) { return X(i).toFixed(1) + ',' + Y(r.speed).toFixed(1); }).join(' ');

      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';

      if (mn < 0 && mx > 0) {

        var y0 = Y(0);

        svg += '<line x1="' + padL + '" y1="' + y0.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y0.toFixed(1) + '" stroke="rgba(255,255,255,0.28)" stroke-dasharray="3 2"/>';

      }

      for (var g = 0; g <= 3; g++) {

        var gy = padT + g / 3 * plotH;

        var gv = mx - g / 3 * span;

        svg += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + gy.toFixed(1) + '" stroke="rgba(255,255,255,0.08)"/>';

        svg += '<text x="' + (padL - 4) + '" y="' + (gy + 3).toFixed(1) + '" text-anchor="end" fill="rgba(255,255,255,0.55)" font-size="9">' + gv.toFixed(1) + '</text>';

      }

      svg += '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linejoin="round"/>';

      var step = Math.max(1, Math.ceil(rows.length / 6));

      rows.forEach(function (r, i) {

        svg += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(r.speed).toFixed(1) + '" r="2.0" fill="' + color + '"/>';

        if (i % step === 0 || i === rows.length - 1) {

          svg += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 4) + '" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="8">' + r.time + '</text>';

        }

      });

      svg += '</svg>';

      container.innerHTML = svg;

    }



    if(!loadFromEmbed()){ el('update-bar').textContent = '暂无内嵌数据'; }

    loadFromServer();

  })();

  </script>
