    var VAR_COLORS = {IF:'#36a2eb', IH:'#9966ff', IC:'#ff9f40', IM:'#ff6384'};
    var VAR_NAMES = {IF:'沪深300', IH:'上证50', IC:'中证500', IM:'中证1000'};
    // 指数名称 -> 腾讯/东财完整符号（用于点击看K线；前缀与个股不同，需显式映射）
    var INDEX_SYM = {'上证指数':'sh000001','深证成指':'sz399001','创业板指':'sz399006','沪深300':'sh000300','上证50':'sh000016','中证500':'sh000905','中证1000':'sz399852','科创50':'sh000688'};
    function el(id){ return document.getElementById(id); }
    function fmt(n){ return (n>=0?'+':'') + n.toLocaleString('en-US'); }

    function renderCffex(){
      var data = window._cffex;
      var dates = Object.keys(data).sort();
      if(!dates.length){ var g = el('cffex-gauges'); if(g) g.innerHTML = '<div class="cffex-empty">暂无数据</div>'; return; }
      var latestDate = dates[dates.length-1];
      var latest = data[latestDate];
      var de = el('cffex-date');
      if(de) de.textContent = '数据日期 ' + latestDate + ' · 中金所前20会员';
      var sum = el('cffex-summary');
      if(sum) sum.innerHTML = (latest.summary || '');
      renderPlainLang(latest, data, dates);
      renderGauges(latest);
      renderTrend(data, dates);
      renderSeats(latest, data, dates);
      renderSingleReview();
    }

    function seatLink(name){
      return '<span class="seat-name-link" data-seat-name="'+name.replace(/"/g,'&quot;')+'">'+name+'</span>';
    }

    function initSeatPopup(){
      var overlay = el('seat-popup-overlay');
      var close = el('seat-popup-close');
      if(!overlay) return;
      document.addEventListener('click', function(e){
        var node = e.target;
        while(node && node !== document){
          if(node.classList && node.classList.contains('seat-name-link') && node.dataset.seatName){
            e.preventDefault();
            openSeatPopup(node.dataset.seatName);
            return;
          }
          node = node.parentNode;
        }
      });
      close && close.addEventListener('click', function(){ overlay.style.display = 'none'; });
      overlay.addEventListener('click', function(e){ if(e.target === overlay) overlay.style.display = 'none'; });
      document.addEventListener('keydown', function(e){ if(e.key === 'Escape') overlay.style.display = 'none'; });
    }

    function openSeatPopup(name){
      var data = window._cffex || {};
      var dates = Object.keys(data).filter(function(d){ return d.startsWith('20'); }).sort();
      var N = 20;
      dates = dates.slice(-N);
      var series = { long: [], short: [], net: [] };
      var hasLongShort = false;
      dates.forEach(function(d){
        var ds = data[d] && data[d].seats ? data[d].seats : [];
        var found = null;
        for(var i=0;i<ds.length;i++){ if(ds[i].name === name){ found = ds[i]; break; } }
        series.long.push(found ? found.long : null);
        series.short.push(found ? found.short : null);
        series.net.push(found ? found.net : null);
        if(found && (found.long != null || found.short != null)) hasLongShort = true;
      });

      var W = 720, H = 300, padL = 52, padR = 18, padT = 22, padB = 42;
      var plotW = W - padL - padR, plotH = H - padT - padB;
      var all = [];
      dates.forEach(function(d,i){
        ['long','short','net'].forEach(function(k){ if(series[k][i]!=null) all.push(series[k][i]); });
      });
      if(!all.length) all = [-1,1];
      var yMin = Math.min.apply(null, all), yMax = Math.max.apply(null, all);
      var pad = (yMax - yMin)*0.12 || Math.max(Math.abs(yMax),1)*0.12;
      yMin -= pad; yMax += pad;
      if(yMin > 0) yMin = 0;
      if(yMax < 0) yMax = 0;
      function X(i){ return padL + (dates.length<=1?plotW/2: i/(dates.length-1)*plotW); }
      function Y(v){ return padT + (yMax-v)/(yMax-yMin)*plotH; }
      var zeroY = Y(0);
      var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
      svg += '<line x1="'+padL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+zeroY.toFixed(1)+'" stroke="rgba(255,255,255,0.35)" stroke-dasharray="4 3"/>';
      svg += '<text x="'+(padL-8)+'" y="'+(zeroY+4).toFixed(1)+'" text-anchor="end" fill="rgba(255,255,255,0.55)" font-size="10">0</text>';
      [yMin, yMax].forEach(function(t){
        var yy = Y(t);
        svg += '<text x="'+(padL-8)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" fill="rgba(255,255,255,0.45)" font-size="9">'+(t/10000).toFixed(1)+'万</text>';
      });
      var colors = hasLongShort ? {long:'#ff5252', short:'#00e676', net:'#ff9800'} : {net:'#ff9800'};
      var labels = hasLongShort ? {long:'多仓', short:'空仓', net:'净持仓'} : {net:'净持仓'};
      var keys = hasLongShort ? ['long','short','net'] : ['net'];
      keys.forEach(function(k){
        var pts = [];
        series[k].forEach(function(v,i){ if(v!=null) pts.push(X(i).toFixed(1)+','+Y(v).toFixed(1)); });
        if(pts.length > 1){
          svg += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+colors[k]+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
        }
        // 端点圆点
        series[k].forEach(function(v,i){
          if(v!=null) svg += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.5" fill="'+colors[k]+'"/>';
        });
      });
      // X 轴日期：稀疏显示避免重叠
      var step = Math.ceil(dates.length / 6);
      dates.forEach(function(d,i){
        if(i % step === 0 || i === dates.length-1){
          var xx = X(i);
          svg += '<text x="'+xx.toFixed(1)+'" y="'+(H-14)+'" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="9">'+d.slice(5)+'</text>';
        }
      });
      svg += '</svg>';

      el('seat-popup-title').textContent = name + ' · 近'+dates.length+'日持仓走势';
      el('seat-popup-chart').innerHTML = svg;
      var legHtml = '';
      keys.forEach(function(k){
        legHtml += '<span><i style="background:'+colors[k]+'"></i>'+labels[k]+'</span>';
      });
      el('seat-popup-legend').innerHTML = legHtml;
      el('seat-popup-overlay').style.display = 'flex';
    }

    function renderPlainLang(latest, data, dates){
      var box = el('cffex-plain');
      if(!box) return;
      function w(n){ return (n/10000).toFixed(2); }
      function pct(n){ return (n*100).toFixed(1); }
      var heaviest = VARS[0], hn = latest[VARS[0]].net;
      VARS.forEach(function(x){ if(latest[x].net < hn){ hn = latest[x].net; heaviest = x; } });
      var crowded = VARS[0], cr = latest[VARS[0]].net_ratio;
      VARS.forEach(function(x){ if(latest[x].net_ratio < cr){ cr = latest[x].net_ratio; crowded = x; } });
      var prev = (dates.length >= 2) ? data[dates[dates.length-2]] : null;
      var seats = latest.seats || [];
      var shortSeat = null, longSeat = null;
      seats.forEach(function(s){
        if(shortSeat===null || s.net < shortSeat.net) shortSeat = s;
        if(longSeat===null || s.net > longSeat.net) longSeat = s;
      });
      var html = '<b>白话解读：</b>简单说，大资金现在整体在“防守”，手里有大量空单压着。';
      html += '其中<b>'+VAR_NAMES[heaviest]+'</b>最被看衰（净空 <span class="hl">'+w(latest[heaviest].net)+'万手</span>）；';
      html += '<b>'+VAR_NAMES[crowded]+'</b>挤满了空头（净空比 <span class="hl">'+pct(latest[crowded].net_ratio)+'%</span>）。';
      if(prev){
        var chg = [];
        VARS.forEach(function(x){
          var d = latest[x].net - prev[x].net;
          if(Math.abs(d) >= 300) chg.push(VAR_NAMES[x]+(d>0 ? '空头回补 '+w(d)+'万手' : '加空 '+w(-d)+'万手'));
        });
        if(chg.length) html += '<br>相比前一交易日：'+chg.join('；')+'。';
      }
      if(shortSeat) html += '带头做空的是<b>'+shortSeat.name+'</b>（净空 '+w(shortSeat.net)+'万手），';
      if(longSeat && longSeat.net>0) html += '对面撑着的是<b>'+longSeat.name+'</b>（净多 '+w(longSeat.net)+'万手）。';
      html += '<br><br><b>对散户的参考：</b>① 别追小盘题材，机构正在砸那边；② 蓝筹有资金在慢慢回补，但还没到反转的时候；③ 整体偏空，控制仓位，等空头明显撤退（比如主力净空大幅减少）再考虑加仓。';
      box.innerHTML = html;
    }

    function renderSingleReview(){
      Promise.all([
        fetch('market_review.json?t=' + Date.now()).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }),
        fetch('midday_review.json?t=' + Date.now()).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; })
      ]).then(function(revs){
        var marketRev = revs[0];
        var middayRev = revs[1];
        var marketBox = el('market-review');
        var middayBox = el('midday-review');
        if(marketBox) marketBox.style.display = 'none';
        if(middayBox) middayBox.style.display = 'none';

        if(!marketRev && !middayRev) return;

        // 同时展示：午盘点评在上、收盘点评在下（各盒子独立渲染，互不影响）
        if(middayRev){
          renderReviewData(middayRev, 'midday');
          if(middayBox) middayBox.style.display = '';
        }
        if(marketRev){
          renderReviewData(marketRev, 'market');
          if(marketBox) marketBox.style.display = '';
        }
      });
    }

    function renderReviewData(rev, prefix){
      if(!rev) return;
      var domPrefix = (prefix === 'market') ? 'review' : 'midday';
      var periodEl = el(domPrefix + '-period');
      var indicesEl = el(domPrefix + '-indices');
      var sectorsEl = el(domPrefix + '-sectors');
      var moneyEl = el(domPrefix + '-money');
      var outlookEl = el(domPrefix + '-outlook');
      var sourceEl = el(domPrefix + '-source');
      var box = el(prefix + '-review');

      var period = rev.period || (prefix === 'market' ? '收盘' : '午间');
      if(periodEl) periodEl.textContent = '【' + period + '点评】' + rev.date + ' ' + rev.time;

      var idx = rev.indices || {};
      var idxParts = [];
      ['上证指数','深证成指','创业板指','沪深300','科创50'].forEach(function(n){
        var d = idx[n]; if(!d) return;
        var chg = d.chg || 0;
        var sign = chg >= 0 ? '+' : '';
        var arrow = chg > 0 ? '\u25b2' : (chg < 0 ? '\u25bc' : '-');
        var sym = INDEX_SYM[n];
        var label = sym ? '<a class="stock-name" data-kline-sym="'+sym+'" href="https://quote.eastmoney.com/'+sym+'.html">'+n+'</a>' : n;
        idxParts.push(arrow + label + ': ' + (d.price||'--') + ' ' + sign + chg + '%');
      });
      if(indicesEl) indicesEl.innerHTML = idxParts.join('  ');

      var secs = rev.sectors || [];
      var secParts = [];
      secs.forEach(function(s){
        var chg = s.chg || 0;
        var sign = chg >= 0 ? '+' : '';
        secParts.push(s.name + ' ' + sign + chg + '%');
      });
      if(sectorsEl) sectorsEl.textContent = '热点: ' + secParts.join(' | ');

      var money = rev.money || {};
      var mainYi = money.total_main_yi || 0;
      var mainSign = mainYi >= 0 ? '+' : '';
      if(moneyEl) moneyEl.textContent = '资金: 主力净' + mainSign + mainYi + '亿  |  涨停 ' + (rev.limit_count||0) + '+只';

      var outlook = rev.outlook || {};
      var rec = outlook.recommendation || '';
      if(outlookEl) outlookEl.textContent = rec;

      if(sourceEl) sourceEl.textContent = '数据来源: 东方财富/腾讯证券' + (prefix === 'midday' ? '/财联社' : '');

      var shChg = (idx['\u4e0a\u8bc1\u6307\u6570'] || {}).chg || 0;
      if(box){ box.className = 'review-box' + (shChg > 0.3 ? ' pos' : (shChg < -0.3 ? ' neg' : '')); }
    }

    function renderGauges(latest){
      var html = '';
      VARS.forEach(function(v){
        var d = latest[v]; if(!d) return;
        var ratio = d.net_ratio || 0;
        var pct = Math.max(0, Math.min(1, (ratio+1)/2));
        var color = ratio >= 0 ? '#ff5252' : '#00e676';
        var r = 70, cx = 90, cy = 90;
        var endAngle = Math.PI * (1 - pct);
        var ex = cx + r*Math.cos(endAngle);
        var ey = cy - r*Math.sin(endAngle);
        var large = pct > 0.5 ? 1 : 0;
        var fg = '';
        if(pct > 0.002){
          fg = '<path d="M ' + (cx-r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 ' + large + ' 1 ' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round"/>';
        }
        var pctTxt = (ratio*100).toFixed(1) + '%';
        var netTxt = (d.net/10000).toFixed(2) + '万手';
        html += '<div class="cffex-gauge">'
          + '<svg viewBox="0 0 180 112" width="100%" height="112">'
          + '<path d="M ' + (cx-r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx+r) + ' ' + cy + '" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="12" stroke-linecap="round"/>'
          + fg
          + '<text x="90" y="82" text-anchor="middle" fill="' + color + '" font-size="22" font-weight="bold">' + pctTxt + '</text>'
          + '<text x="90" y="100" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-size="11">' + netTxt + '</text>'
          + '</svg>'
          + '<div class="cffex-gauge-label">' + v + '<span>' + VAR_NAMES[v] + '</span></div>'
          + '</div>';
      });
      el('cffex-gauges').innerHTML = html;
    }

    function renderTrend(data, dates){
      var W = 700, H = 270, padL = 48, padR = 18, padT = 18, padB = 28;
      var plotW = W - padL - padR, plotH = H - padT - padB;
      var series = {}, allVals = [];
      VARS.forEach(function(v){
        series[v] = dates.map(function(d){ var x = data[d][v]; return x ? x.net_ratio : null; });
        series[v].forEach(function(val){ if(val!=null) allVals.push(val); });
      });
      var yMin = Math.min.apply(null, allVals);
      var yMax = Math.max.apply(null, allVals);
      var pad = (yMax - yMin)*0.18 || 0.02;
      yMin -= pad; yMax += pad;
      if(yMin > 0) yMin = 0;
      if(yMax < 0) yMax = 0;
      function X(i){ return padL + (dates.length<=1?0: i/(dates.length-1)*plotW); }
      function Y(val){ return padT + (yMax-val)/(yMax-yMin)*plotH; }
      var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" preserveAspectRatio="xMidYMid meet">';
      var zeroY = Y(0);
      svg += '<line x1="'+padL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+zeroY.toFixed(1)+'" stroke="rgba(255,255,255,0.35)" stroke-dasharray="4 3"/>';
      svg += '<text x="'+(padL-6)+'" y="'+(zeroY+4).toFixed(1)+'" text-anchor="end" fill="rgba(255,255,255,0.5)" font-size="10">0</text>';
      [yMin, (yMin+yMax)/2, yMax].forEach(function(t){
        var yy = Y(t);
        svg += '<text x="'+(padL-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end" fill="rgba(255,255,255,0.4)" font-size="9">'+(t*100).toFixed(1)+'%</text>';
      });
      VARS.forEach(function(v){
        var pts = [];
        series[v].forEach(function(val, i){ if(val==null) return; pts.push(X(i).toFixed(1)+','+Y(val).toFixed(1)); });
        if(pts.length > 1){
          svg += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+VAR_COLORS[v]+'" stroke-width="2" stroke-linejoin="round"/>';
        }
      });
      var labels = ['06-12','06-27','07-12','07-24'];
      labels.forEach(function(lab){
        var idx = -1;
        for(var i=0;i<dates.length;i++){ if(dates[i].slice(5)===lab){ idx=i; break; } }
        if(idx>=0){
          var xx = X(idx);
          svg += '<text x="'+xx.toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-size="9">'+lab+'</text>';
        }
      });
      svg += '</svg>';
      el('cffex-trend').innerHTML = svg;
    }

    function makeSpark(series, isNeg){
      if(!series || series.length < 2) return '<span style="color:rgba(255,255,255,0.3)">—</span>';
      var w=66, h=22, pad=3;
      var min=Math.min.apply(null,series), max=Math.max.apply(null,series);
      if(min===max){ min-=1; max+=1; }
      var span=max-min;
      function X(i){ return pad + (series.length<=1?0: i/(series.length-1)*(w-2*pad)); }
      function Y(v){ return (h-pad) - (v-min)/span*(h-2*pad); }
      var pts = series.map(function(v,i){ return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
      var color = isNeg ? '#00e676' : '#ff5252';
      var svg = '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="vertical-align:middle">';
      if(min<0 && max>0){
        var y0 = Y(0);
        svg += '<line x1="'+pad+'" y1="'+y0.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+y0.toFixed(1)+'" stroke="rgba(255,255,255,0.22)" stroke-width="0.5"/>';
      }
      svg += '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linejoin="round"/>';
      var li = series.length-1;
      svg += '<circle cx="'+X(li).toFixed(1)+'" cy="'+Y(series[li]).toFixed(1)+'" r="1.8" fill="'+color+'"/>';
      svg += '</svg>';
      return svg;
    }

    function wordCls(w){
      return w === '加多' ? 'add-long'
           : w === '减多' ? 'cut-long'
           : w === '加空' ? 'add-short'
           : w === '减空' ? 'cut-short'
           : 'flat';
    }

    function renderSeats(latest, data, dates){
      var box = el('cffex-seats');
      var seats = latest.seats || [];
      if(!seats.length){ box.innerHTML = '<div class="cffex-empty">暂无席位数据</div>'; return; }
      var N = 5;
      var recent = (dates && dates.length) ? dates.slice(-N) : [];
      var hist = {};
      recent.forEach(function(d){
        var ds = data[d]; if(!ds || !ds.seats) return;
        ds.seats.forEach(function(s){ (hist[s.name] = hist[s.name] || {})[d] = s.net; });
      });
      // 条形长度基准：当日最大绝对净持仓
      var maxAbs = 0;
      seats.forEach(function(s){ if(Math.abs(s.net) > maxAbs) maxAbs = Math.abs(s.net); });
      if(!maxAbs) maxAbs = 1;
      function wan(v){ return (Math.abs(v)/10000).toFixed(2); }

      var head = '<table class="cffex-seat-tbl"><thead><tr><th>席位</th><th>净持仓</th><th>单日变化</th><th class="trend-col">5日趋势</th></tr></thead><tbody>';
      var rows = '';
      seats.slice().sort(function(a,b){ return Math.abs(b.net)-Math.abs(a.net); }).forEach(function(s){
        var isShort = s.net < 0;                       // 净空=绿，净多=红（沿用 .neg/.pos 配色）
        var cls = isShort ? 'neg' : 'pos';
        var color = isShort ? '#00e676' : '#ff5252';
        var chg = (s.net_chg == null) ? 0 : s.net_chg;
        // 变化语义：净空席位 chg<0 是加空、chg>0 是减空；净多席位 chg>0 是加多、chg<0 是减多
        var word = (chg === 0) ? '持平'
                 : (isShort ? (chg < 0 ? '加空' : '减空') : (chg > 0 ? '加多' : '减多'));
        var w = Math.abs(s.net)/maxAbs*100;
        var series = recent.map(function(d){ return (hist[s.name] && hist[s.name][d]!=null) ? hist[s.name][d] : null; }).filter(function(x){ return x!=null; });
        rows += '<tr><td class="cffex-seat-name">'+seatLink(s.name)
          + '<span class="seat-dir '+cls+'">'+(isShort?'净空':'净多')+'</span></td>'
          + '<td class="'+cls+'" style="white-space:nowrap;">'
          +   '<span class="seat-bar"><i style="width:'+w.toFixed(1)+'%;background:'+color+'"></i></span>'
          +   (s.net/10000).toFixed(2)+'万手</td>'
          + '<td class="'+cls+'" style="white-space:nowrap;">'
          +   '<span class="chg-word '+wordCls(word)+'">'+word+'</span>'+wan(chg)+'万手</td>'
          + '<td class="trend-col">'+makeSpark(series, isShort)+'</td></tr>';
      });
      box.innerHTML = head + rows + '</tbody></table>';

      // 分栏速览：净空榜 / 净多榜（与表格同源数据，组内按绝对净持仓降序）
      var boardBox = el('cffex-boards');
      if (boardBox) {
        var grps = { short: [], long: [] };
        seats.forEach(function(s){ (s.net < 0 ? grps.short : grps.long).push(s); });
        grps.short.sort(function(a,b){ return Math.abs(b.net)-Math.abs(a.net); });
        grps.long.sort(function(a,b){ return Math.abs(b.net)-Math.abs(a.net); });
        function boardCard(list, cls, title, color){
          var h = '<div class="cffex-board '+cls+'"><h4>'+title+'（'+list.length+' 家）</h4>';
          list.forEach(function(s){
            var chg = (s.net_chg == null) ? 0 : s.net_chg;
            var word = (chg === 0) ? '持平'
                     : (s.net < 0 ? (chg < 0 ? '加空' : '减空') : (chg > 0 ? '加多' : '减多'));
            h += '<div class="cffex-board-row"><span class="cffex-seat-name">'+seatLink(s.name)+'</span>'
              +  '<span class="num" style="color:'+color+';">'
              +  (Math.abs(s.net)/10000).toFixed(2)+'万手 '
              +  '<span class="chg-word '+wordCls(word)+'" style="margin-right:0;">'+word+'</span></span></div>';
          });
          return h + '</div>';
        }
        boardBox.innerHTML = boardCard(grps.short, 'short', '净空榜', '#00e676')
                           + boardCard(grps.long, 'long', '净多榜', '#ff5252');
      }
    }

    renderCffex();
    initSeatPopup();
    // 运行时拉取最新数据覆盖（带 cache-busting），失败则保留内嵌数据
    fetch('cffex_net_position.json?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ window._cffex = d; renderCffex(); })
      .catch(function(e){ console.warn('[cffex] fetch failed, use embedded data', e); });
  })();
  </script>

    excludeSelectors: ['#us-stock-list','.us-stock-panel','.us-stock-container','.us-table-wrap','.us-table','.us-picks-header','[data-no-kline]']
