  var _yimengLoaded = false;

  // ===== Live quotes (Tencent gtimg, ticking during session) =====
  var _currentTab = 0;
  var _liveTimer = null;
  var _lastDataTime = '';

  function fullCodeOf(code) {
    code = String(code || '');
    if (/^(8|4|92)/.test(code)) return 'bj' + code;
    if (code.charAt(0) === '6') return 'sh' + code;
    return 'sz' + code;
  }

  function beijingNow() {
    var n = new Date();
    var utc = n.getTime() + n.getTimezoneOffset() * 60000;
    return new Date(utc + 8 * 3600000);
  }

  function marketState() {
    var b = beijingNow();
    var day = b.getDay();
    if (day === 0 || day === 6) return 'closed';
    var hm = b.getHours() * 60 + b.getMinutes();
    if (hm < 9 * 60 + 15) return 'pre';
    if (hm < 11 * 60 + 30) return 'open';
    if (hm < 13 * 60) return 'lunch';
    if (hm < 15 * 60 + 5) return 'open';
    return 'closed';
  }

  function collectCodes() {
    var seen = {}, codes = [];
    (_data.stocks || []).forEach(function(s){ if (s.code) { var fc = fullCodeOf(s.code); if (!seen[fc]) { seen[fc] = 1; codes.push(fc); } } });
    (_data.yimeng || []).forEach(function(s){ if (s.code) { var fc = fullCodeOf(s.code); if (!seen[fc]) { seen[fc] = 1; codes.push(fc); } } });
    return codes;
  }

  function applyLiveBatch(codes) {
    var changed = false;
    codes.forEach(function(fc) {
      var raw = window['v_' + fc];
      if (!raw) return;
      var f = raw.split('~');
      var price = parseFloat(f[3]);
      var chg = parseFloat(f[32]);
      var turnover = parseFloat(f[38]);
      var dt = f[30] || '';
      if (isNaN(price)) return;
      var code = fc.substr(2);
      (_data.stocks || []).forEach(function(s){ if (s.code === code) { s.price = price; s.change_pct = chg; s.turnover = turnover; changed = true; } });
      (_data.yimeng || []).forEach(function(s){ if (s.code === code) { s.price = price; s.change_pct = chg; s.change = chg; s.turnover = turnover; changed = true; } });
      if (dt) _lastDataTime = dt;
    });
    if (changed) { renderTable(_currentTab); }
    updateLiveStamp();
  }

  function refreshLive() {
    var codes = collectCodes();
    if (!codes.length) return;
    var url = 'https://qt.gtimg.cn/q=' + codes.join(',') + '&_=' + Date.now();
    var sc = document.createElement('script');
    sc.onload = function() {
      try { applyLiveBatch(codes); } catch (e) {}
      if (sc.parentNode) sc.parentNode.removeChild(sc);
    };
    sc.onerror = function() {
      setLiveStatus('Live feed failed (network)', true);
      if (sc.parentNode) sc.parentNode.removeChild(sc);
    };
    sc.src = url;
    document.head.appendChild(sc);
  }

  function setLiveStatus(txt, isErr) {
    var el = document.getElementById('liveStatus');
    if (!el) return;
    el.textContent = (isErr ? '[!] ' : '[*] ') + txt;
    el.className = 'live-badge' + (isErr ? ' live-err' : '');
  }

  function fmtDataTime(dt) {
    if (!dt || dt.length < 12) return '';
    return dt.substr(4, 2) + '-' + dt.substr(6, 2) + ' ' + dt.substr(8, 2) + ':' + dt.substr(10, 2);
  }

  function updateLiveStamp() {
    var el = document.getElementById('liveTime');
    if (el && _lastDataTime) el.textContent = 'Quote time ' + fmtDataTime(_lastDataTime);
  }

  function startLiveLoop() {
    stopLiveLoop();
    function tick() {
      var st = marketState();
      if (st === 'open') {
        setLiveStatus('Live - refreshing every 15s', false);
        refreshLive();
      } else if (st === 'pre') {
        setLiveStatus('Pre-market - goes live at 09:30', false);
      } else if (st === 'lunch') {
        setLiveStatus('Lunch break - resumes 13:00', false);
      } else {
        setLiveStatus('Closed - showing latest close', false);
      }
    }
    tick();
    _liveTimer = setInterval(tick, 15000);
  }

  function stopLiveLoop() {
    if (_liveTimer) { clearInterval(_liveTimer); _liveTimer = null; }
  }

  var _sortCol = 0, _sortDir = 'desc';

  var tabs = [
    { label: '全部', sub: null },
    { label: '🚀 突破型', sub: 'breakout' },
    { label: '📈 量价齐升', sub: 'volume' },
    { label: '🛡️ 抗跌型', sub: 'resilient' },
    { label: '💎 创新高', sub: 'newhigh' },
    { label: '🔥 益盟强买', sub: 'yimeng', loading: false }
  ];

  function init() {
    renderTabs(0);
    renderTable(0);
    loadYimengData();
    if (location.protocol.indexOf('http') === 0) {
      startLiveLoop();
    }
  }

  function loadYimengData() {
    // 直接以 file:// 打开时，fetch 本地 json 会被 CORS 拦截，
    // 此时直接用 HTML 内嵌的 _data.yimeng（由 strong_update.py 维护），不发起请求。
    if (location.protocol.indexOf('http') !== 0) {
      _yimengLoaded = !!(_data.yimeng && _data.yimeng.length > 0);
      return;
    }
    // 在 http/https 下尝试动态刷新（数据在 stocks 字段）
    fetch('strongbuy_data.json?t=' + Date.now())
      .then(function(r) {
        if (!r.ok) throw new Error('not found');
        return r.json();
      })
      .then(function(data) {
        var yimengList = data.yimeng || [];
        var radarList = data.stocks || [];
        if (yimengList.length > 0) {
          _data.yimeng = yimengList;
          _yimengLoaded = true;
        }
        // 不再用 yimeng_data.json 的 stocks/updated 覆盖主数据（由 strong_update.py 维护）
        // 远程数据已加载，无论哪个tab当前都刷新
        var activeIdx = Array.from(document.querySelectorAll('.tab'))
          .indexOf(document.querySelector('.tab.active'));
        if (activeIdx >= 0 && tabs[activeIdx]) {
          renderTable(activeIdx);
          updateMeta();
        }
      })
      .catch(function() {
        // 拉取失败（如未部署 yimeng_data.json），保留内嵌数据
        _yimengLoaded = !!(_data.yimeng && _data.yimeng.length > 0);
      });
  }

  function updateMeta() {
    var meta = document.getElementById('metaMain');
    if (!meta) meta = document.getElementById('meta');
    var base = '更新时间: ' + _data.updated + ' | 共 ' + _data.stocks.length + ' 只强势股';
    var yimengNote = _yimengLoaded && _data.yimeng.length > 0
      ? ' | 益盟强买数据已加载（' + _data.yimeng.length + '只）'
      : ' | 益盟强买: 暂无数据';
    meta.textContent = base + yimengNote;
  }

  function renderTabs(activeIdx) {
    _currentTab = activeIdx;
    var el = document.getElementById('tabs');
    el.innerHTML = '';
    tabs.forEach(function(t, i) {
      var btn = document.createElement('button');
      btn.className = 'tab' + (i === activeIdx ? ' active' : '');
      btn.textContent = t.label;
      btn.onclick = function() { renderTabs(i); renderTable(i); };
      el.appendChild(btn);
    });
  }

  function isYimengTab(idx) {
    return tabs[idx] && tabs[idx].sub === 'yimeng';
  }

  function _norm(s, isY) {
  if (!isY) return s;
  return {
    code: s.code, name: s.name,
    price: s.price != null ? s.price : s.last_price,
    change_pct: s.change_pct != null ? s.change_pct : (s.change != null ? s.change : 0),
    turnover: s.turnover != null ? s.turnover : (s.hs != null ? s.hs : 0),
    volume: s.volume != null ? s.volume : (s.amount_yi != null ? s.amount_yi : 0),
    score: s.score || 0,
    reason: s.reason || (s.tags ? s.tags.join(' ') : ''),
    tag: s.tag || 'yimeng',
    change_5d: s.change_5d || 0,
    consec_days: s.consec_days || 0,
    main_ratio: s.main_ratio || 0
  };
}

function renderTable(tabIdx) {
    updateMeta();
    var sub = tabs[tabIdx].sub;
    var isYimeng = isYimengTab(tabIdx);
    var rawStocks = isYimeng ? (_data.yimeng || []) : (sub ? _data.stocks.filter(function(s) { return s.tag === sub; }) : _data.stocks);
    var stocks = isYimeng ? rawStocks.map(function(s) { return _norm(s, true); }) : rawStocks;

    if (stocks.length === 0 && isYimeng) {
      document.getElementById('content').innerHTML =
        '<div class="no-data">🔥 益盟强买暂无数据<br><p>可能原因：数据尚未更新（交易时段运行脚本后即可见）</p></div>';
      return;
    }
    if (stocks.length === 0) {
      document.getElementById('content').innerHTML = '<div class="no-data">暂无数据</div>';
      return;
    }

    stocks.sort(function(a, b) {
      var va, vb;
      if (_sortCol === 0) { va = a.code; vb = b.code; }
      else if (_sortCol === 1) { va = a.name; vb = b.name; }
      else if (_sortCol === 2) { va = Number(a.price) || 0; vb = Number(b.price) || 0; }
      else if (_sortCol === 3) { va = Number(a.change_pct) || 0; vb = Number(b.change_pct) || 0; }
      else if (_sortCol === 4) { va = Number(a.turnover) || 0; vb = Number(b.turnover) || 0; }
      else if (_sortCol === 5) { va = Number(a.change_5d) || 0; vb = Number(b.change_5d) || 0; }
      else if (_sortCol === 6) { va = Number(a.volume) || 0; vb = Number(b.volume) || 0; }
      else if (_sortCol === 7) { va = a.tag || ''; vb = b.tag || ''; }
      else if (_sortCol === 8) { va = Number(a.consec_days) || 0; vb = Number(b.consec_days) || 0; }
      else if (_sortCol === 9) { va = Number(a.main_ratio) || 0; vb = Number(b.main_ratio) || 0; }
      else { va = Number(a.score) || 0; vb = Number(b.score) || 0; }
      if (typeof va === 'string') return _sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      return _sortDir === 'asc' ? va - vb : (vb - va);
    });

    var tagLabel = {
      breakout: '🚀突破', volume: '📈量价', resilient: '🛡️抗跌', newhigh: '💎新高',
      addposition: '➕增仓', bigfund: '🐷大单', yimeng: '🔥强买'
    };
    var tagClass = {
      breakout: 'tag-breakout', volume: 'tag-volume', resilient: 'tag-resilient', newhigh: 'tag-newhigh',
      addposition: 'tag-addposition', bigfund: 'tag-bigfund', yimeng: 'tag-yimeng'
    };

    var h = '<table>';

    if (isYimeng) {
      // 益盟强买专属列
      h += '<tr>';
      h += '<th>代码</th>';
      h += '<th onclick="sortBy(1)">名称</th>';
      h += '<th onclick="sortBy(2)">现价</th>';
      h += '<th onclick="sortBy(3)">涨跌幅</th>';
      h += '<th onclick="sortBy(4)">换手率</th>';
      h += '<th onclick="sortBy(8)" class="tooltip" title="主力连续净流入天数">🔴连飘</th>';
      h += '<th onclick="sortBy(9)" class="tooltip" title="主力净流入占总成交比">📊净占比</th>';
      h += '<th onclick="sortBy(10)">评分</th>';
      h += '<th>入选理由</th></tr>';

      stocks.forEach(function(s) {
        var chg = Number(s.change_pct) || 0;
        var chgClass = chg >= 0 ? 'up' : 'down';
        var chgSign = chg >= 0 ? '+' : '';
        var fullCode = fullCodeOf(s.code);
        var consec = Number(s.consec_days) || 0;
        var consecClass = consec >= 3 ? 'col-consec' : '';
        var ratioClass = 'col-ratio';
        var turnover = Number(s.turnover) || 0;
        var mainRatio = Number(s.main_ratio) || 0;
        var score = Number(s.score) || 0;
        h += '<tr>';
        h += '<td>' + (s.code || '') + '</td>';
        h += '<td><a href="https://quote.eastmoney.com/' + fullCode + '.html" target="_blank">' + (s.name || '') + '</a></td>';
        h += '<td>' + (s.price != null ? s.price : '-') + '</td>';
        h += '<td class="' + chgClass + '">' + chgSign + chg.toFixed(2) + '%</td>';
        h += '<td class="col-turnover">' + (turnover ? turnover.toFixed(2) + '%' : '-') + '</td>';
        h += '<td class="' + consecClass + '">' + consec + '日</td>';
        h += '<td class="' + ratioClass + '">' + (mainRatio ? mainRatio.toFixed(1) + '%' : '-') + '</td>';
        h += '<td class="stars">' + '★'.repeat(Math.max(1, Math.round(score / 20))) + ' ' + score + '</td>';
        h += '<td style="font-size:0.8em;color:#aaa;">' + (s.reason || '') + '</td>';
        h += '</tr>';
      });
    } else {
      // 强势股雷达原有列
      h += '<tr>';
      h += '<th>代码</th>';
      h += '<th onclick="sortBy(1)">名称</th>';
      h += '<th onclick="sortBy(2)">现价</th>';
      h += '<th onclick="sortBy(3)">涨跌幅</th>';
      h += '<th onclick="sortBy(4)">换手率</th>';
      h += '<th onclick="sortBy(5)">5日涨幅</th>';
      h += '<th onclick="sortBy(6)">成交额</th>';
      h += '<th onclick="sortBy(7)">信号</th>';
      h += '<th onclick="sortBy(8)">评分</th>';
      h += '<th>入选理由</th></tr>';

      stocks.forEach(function(s) {
        var chg = Number(s.change_pct) || 0;
        var chgClass = chg >= 0 ? 'up' : 'down';
        var chgSign = chg >= 0 ? '+' : '';
        var fullCode = fullCodeOf(s.code);
        var vol = Number(s.volume) || 0;
        var chg5 = Number(s.change_5d) || 0;
        h += '<tr>';
        h += '<td>' + (s.code || '') + '</td>';
        h += '<td><a href="https://quote.eastmoney.com/' + fullCode + '.html" target="_blank">' + (s.name || '') + '</a></td>';
        h += '<td>' + (s.price != null ? s.price : '-') + '</td>';
        h += '<td class="' + chgClass + '">' + chgSign + chg.toFixed(2) + '%</td>';
        h += '<td class="col-turnover">' + (s.turnover ? Number(s.turnover).toFixed(1) + '%' : '-') + '</td>';
        h += '<td class="' + (chg5 >= 0 ? 'up' : 'down') + '">' + (chg5 >= 0 ? '+' : '') + chg5.toFixed(1) + '%</td>';
        h += '<td>' + (vol >= 1 ? vol.toFixed(1) + '亿' : (vol * 10000).toFixed(0) + '万') + '</td>';
        var allTags = s.tag ? '<span class="tag ' + (tagClass[s.tag]||'') + '">' + (tagLabel[s.tag]||s.tag) + '</span>' : '';
        h += '<td>' + allTags + '</td>';
        h += '<td class="stars">' + '★'.repeat(Number(s.score) || 1) + '</td>';
        h += '<td style="font-size:0.8em;color:#888;">' + (s.reason || '') + '</td>';
        h += '</tr>';
      });
    }
    h += '</table>';
    document.getElementById('content').innerHTML = h;
  }

  function sortBy(col) {
    if (_sortCol === col) { _sortDir = _sortDir === 'asc' ? 'desc' : 'asc'; }
    else { _sortCol = col; _sortDir = 'desc'; }
    var activeIdx = Array.from(document.querySelectorAll('.tab')).indexOf(document.querySelector('.tab.active'));
    renderTable(activeIdx >= 0 ? activeIdx : 0);
  }

  init();
  </script>
</body>
</html>
