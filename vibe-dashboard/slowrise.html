    function loadTrendHistory() {

      try {

        const data = localStorage.getItem(SLOWRISE_KEY);

        return data ? JSON.parse(data) : {};

      } catch { return {}; }

    }

    function saveTrendHistory(history) {

      try {

        localStorage.setItem(SLOWRISE_KEY, JSON.stringify(history));

      } catch (e) { console.warn('localStorage save failed:', e); }

    }

    function computeSlowRise(sectors, tradingDate) {
      // Step 1: update history with today's data
      var history = loadTrendHistory();
      if (sectors && sectors.length > 0 && tradingDate) {
        var todayMap = {};
        sectors.forEach(function(s, i) { if (s.name) todayMap[s.name] = i + 1; });
        history[tradingDate] = todayMap;
      }
      // Step 2: last 5 trading dates
      var sortedDates = Object.keys(history).sort();
      var recent5 = sortedDates.slice(-5);
      if (recent5.length === 0) return [];
      // Step 3: name -> [rankD1..D5] (null=not in top10 that day)
      var nameRanks = {};
      for (var di = 0; di < recent5.length; di++) {
        var dayData = history[recent5[di]];
        if (!dayData || typeof dayData !== 'object') continue;
        // Support BOTH old format {name: rank_number} and new format {sectors: [{name, rank}]}
        if (dayData.sectors && Array.isArray(dayData.sectors)) {
          dayData.sectors.forEach(function(s, i) {
            if (!nameRanks[s.name]) nameRanks[s.name] = [null, null, null, null, null];
            nameRanks[s.name][di] = s.rank || 999;
          });
        } else {
          var keys = Object.keys(dayData);
          for (var ki = 0; ki < keys.length; ki++) {
            var n = keys[ki];
            if (!nameRanks[n]) nameRanks[n] = [null, null, null, null, null];
            nameRanks[n][di] = dayData[n];
          }
        }
      }
      // Step 4: streak = consecutive days in top10 (most recent first)
      var slowRise = [];
      for (var name in nameRanks) {
        var ranks = nameRanks[name];
        var streak = 0;
        var inTop10 = false;
        for (var i = ranks.length - 1; i >= 0; i--) {
          if (ranks[i] !== null && ranks[i] <= 10) {
            if (inTop10) streak++;
            else { inTop10 = true; streak = 1; }
          } else break;
        }
        if (streak < 2) continue;
        var boxes = [];
        for (var bi = 0; bi < 5; bi++) {
          boxes.push(bi < recent5.length && ranks[bi] !== null && ranks[bi] <= 10);
        }
        slowRise.push({
          name: name,
          streak: streak,
          boxes: boxes,
          today_rank: ranks[ranks.length - 1] || 0,
          change_pct: null
        });
      }
      // Step 5: fill change_pct from today's sectors (supports both formats)
      if (sectors && sectors.length > 0) {
        var cpMap = {};
        sectors.forEach(function(s) { if (s.name) cpMap[s.name] = s.change_pct; });
        slowRise.forEach(function(item) {
          if (cpMap[item.name] !== undefined) item.change_pct = cpMap[item.name];
        });
      }
      // Step 6: sort by streak desc, then today_rank asc
      slowRise.sort(function(a, b) {
        if (b.streak !== a.streak) return b.streak - a.streak;
        return (a.today_rank || 99) - (b.today_rank || 99);
      });
      // Step 7: trim history to last 5 days
      var trimmed = {};
      for (var di2 = 0; di2 < recent5.length; di2++) {
        var d2 = recent5[di2];
        if (history[d2]) trimmed[d2] = history[d2];
      }
      saveTrendHistory(trimmed);
      return slowRise.slice(0, 10);
    }

        function updateSlowRise(data) {
      const grid = document.getElementById('sector-grid');
      if (!data || data.length === 0) {
        grid.innerHTML = '<div class="slowrise-empty">近5个交易日无板块递进≥3天</div>';
        return;

      let html = data.slice(0, 10).map(s => {
        // Color by streak
        let color, glow;
        if (s.streak >= 5) {
          color = '#00e5ff'; glow = 'text-shadow:0 0 8px #00e5ff,0 0 16px #00e5ff;';

          color = '#39ff14'; glow = 'text-shadow:0 0 6px #39ff14;';
        } else if (s.streak >= 3) {
          color = '#ff8c00'; glow = 'text-shadow:0 0 6px #ff8c00;';
        } else {
          color = '#ffcc00'; glow = 'text-shadow:0 0 4px #ffcc00;';
        }
        // 5 boxes: O=red dot (in Top10), .=empty
        const boxHTML = (s.boxes || [false,false,false,false,false]).map(function(inTop10) {
          if (inTop10) {
            return '<div title="进入Top10" style="width:18px;height:18px;background:#ff3b30;border-radius:3px;box-shadow:0 0 5px #ff3b30;border:2px solid #ffffff;"></div>';
          } else {
            return '<div style="width:18px;height:18px;background:#ffffff;border:2px solid #ffffff;border-radius:3px;"></div>';
          }
        }).join('');
        // Change pct
        const pctStr = s.change_pct != null
          ? (s.change_pct >= 0
              ? '<span style="color:#ff3b30;">+' + s.change_pct.toFixed(2) + '%</span>'
              : '<span style="color:#39ff14;">' + s.change_pct.toFixed(2) + '%</span>')
          : '';
        return '<div class="sector-item" style="background:rgba(0,0,0,0.3);padding:10px;margin-bottom:6px;border-radius:5px;">' +
          '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">' +
            '<span class="sector-name" style="color:' + color + ';' + glow + 'font-weight:600;">' + s.name + '</span>' +
            '<span style="display:flex;align-items:center;gap:3px;">' + boxHTML + '</span>' +
            pctStr +
            '<span style="color:' + color + ';' + glow + 'font-family:JetBrains Mono,monospace;font-size:0.85rem;">#' + (s.today_rank || '?') + '</span>' +
            '<span style="color:' + color + ';' + glow + 'font-family:JetBrains Mono,monospace;font-size:0.85rem;">' + s.streak + '天</span>' +
          '</div>' +
        '</div>';
      }).join('');
      grid.innerHTML = html;
    }
