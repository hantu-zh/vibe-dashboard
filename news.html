stock/c/2026-09-19/doc-iniskimw9783326.shtml","importance":"hot"},{"id":"xq4893521","time":1789820123000,"title":"【欧洲央行管委斯图纳拉斯：若通胀飙升不排除10月加息可能性 但不应仓促行事】欧洲央行管委斯图纳拉斯表示，必须注意通胀上行风险，但不应仓促行事。 这位希腊央行行长...","text":"【欧洲央行管委斯图纳拉斯：若通胀飙升不排除10月加息可能性 但不应仓促行事】欧洲央行管委斯图纳拉斯表示，必须注意通胀上行风险，但不应仓促行事。 这位希腊央行行长周六接受采访时表示，虽然目前为止工资等方面还没有出现第二轮影响，这算是“好消息”，但不能想当然地认为这种情况会持续下去。“我们正面临一系列持续的供给侧冲击，我们不能对此视而不见。与此同时，由于财政扩张和人工智能投资的蓬勃发展，需求也十分强劲。”他在都柏林出席欧洲财长和央行行长会议时表示，“我们必须保持警惕。”距离下次决策还有一个月的时间，斯图纳拉斯表示他还没有下定决心，欧洲央行准备的各种经济展望可能会起到指导作用。“如果9月份通胀飙升或能源成本上涨，使我们陷入不利局面，那么10月份加息的可能性就不能排除，”他说道，“但如果存在一些不确定性，我们不会采取任何行动，而是等待下一轮预测。没有必要仓促行事。”斯图纳拉斯警告说，当前形势依然动荡不安。“如果经济数据显示经济韧性无法持续或经济活动增长放缓，我认为这将是不宜加息，而应暂停加息的理由，”他说道。此外，“如果中东达成协议，能源价格可能会再次迅速下降。”","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409903638","importance":"hot"},{"id":"1635700714102","time":1789819710000,"title":"前次易主告吹，奥联电子控制权再谋变更，股票下周一起停牌","text":"前次易主告吹，奥联电子控制权再谋变更，股票下周一起停牌","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L77DDCSK0511U82T.html","importance":"hot"},{"id":"1638979694138","time":1789819667000,"title":"珀莱雅的半年报：利润涨了46%，主品牌还在往下走","text":"珀莱雅的半年报：利润涨了46%，主品牌还在往下走","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L77DDCPA0511U82T.html","importance":""},{"id":"1632931910903","time":1789819665000,"title":"不想为电池厂打工！车企加速调整电池供给结构，宁德时代4个月市值蒸发超7000亿","text":"不想为电池厂打工！车企加速调整电池供给结构，宁德时代4个月市值蒸发超7000亿","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L77DDCOH0511U82T.html","importance":""},{"id":"1631080858386","time":1789819311000,"title":"3000亿公募，迎新任总经理","text":"3000亿公募，迎新任总经理","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L77D2K1C0519JFL1.html","importance":""},{"id":"sinacomos:niskimw9757991","time":1789818016000,"title":"环球时报快评：当美联社说“美国应当感谢中国”","text":"#美媒承认搭了北京便车##美联社称美国应感谢中国# 【#环球时报快评#：当美联社说“美国应当感谢中国”】“世界之所以能避免油价失控，应归功于中国的能源战略。","source":"新浪财经","category":"fast","stock":"","url":"https://fi
