"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3166741","time":1789635511000,"title":"商务部副部长兼国际贸易谈判副代表凌激出席上海合作组织成员国第二十五次经贸部长会议","text":"9月17日，上海合作组织成员国第二十五次经贸部长会议在塔吉克斯坦杜尚别举行。商务部副部长兼国际贸易谈判副代表凌激出席。会议聚焦落实上合组织比什凯克峰会重要共识，谋划下一阶段区域经济合作安排，为年内举行的上合组织成员国政府首脑（总理）理事会会议做好经贸方面准备工作。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4892827","time":1789635498000,"title":"【商务部副部长凌激出席上海合作组织成员国第二十五次经贸部长会议】上海合作组织成员国第二十五次经贸部长会议9月17日在塔吉克斯坦杜尚别举行。商务部副部长兼国际贸易...","text":"【商务部副部长凌激出席上海合作组织成员国第二十五次经贸部长会议】上海合作组织成员国第二十五次经贸部长会议9月17日在塔吉克斯坦杜尚别举行。商务部副部长兼国际贸易谈判副代表凌激出席。会议聚焦落实上合组织比什凯克峰会重要共识，谋划下一阶段区域经济合作安排，为年内举行的上合组织成员国政府首脑（总理）理事会会议做好经贸方面准备工作。凌激表示，上合组织成立25年来，各方秉持“上海精神”，共同推动区域经济合作取得显著成效，助力各国发展，惠及民众福祉。中方愿与各方一道，以高质量共建“一带一路”为引领，优化拓展成员国间贸易，不断深化产供链合作，持续完善基础设施“硬联通”和规则标准“软联通”，进一步提升贸易投资自由化、便利化水平，为构建上合组织命运共同体不断作出新贡献。各方一致认为，应继续加强沟通，凝聚共识，支持开放包容的多边贸易体制，推动区域内贸易和产业合作提质升级，深化数字经济、绿色发展、科技创新等领域合作，提升互联互通水平，持续推动区域经济合作走深走实。会议期间，各方通过《上合组织成员国经贸部长联合声明》，批准《上合组织成员国发展创意经济特别工作组条例》，并签署会议纪要。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409663782","importance":"hot"},{"id":"1636806555592","time":1789635496000,"title":"AI“重做”录音笔，影石“联姻”腾讯加入争夺战","text":"AI“重做”录音笔，影石“联姻”腾讯加入争夺战","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L71TOFHA0519DTSV.html","importance":""},{"id":"sinacomos:niscqxz3573820","time":1789635453000,"title":"利比亚两处油田短暂停产之后恢复原油生产","text":"利比亚两处小型油田已恢复生产。本周早些时候，一支安保部队人员因要求加薪关闭阀门，现已重新开启。 利比亚国家石油公司主席马苏德·苏莱曼周三向彭博社表示...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-17/doc-iniscqxz3573820.shtml","importance":""},{"id":"1638656535932","time":1789635447000,"title":"原华融湘江银行行长蒋俊文，将在衡阳受审","text":"原华融湘江银行行长蒋俊文，将在衡阳受审","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L71T2G400552FWS9.html","importance":""},{"id":"sinacomos:niscqxx4014750","t
