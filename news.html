","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4887218","time":1789207825000,"title":"【自然资源部：临时用地管理文件修订面向社会公开征求意见】据自然资源部消息，近日，自然资源部起草了《自然资源部关于规范临时用地管理的通知（征求意见稿)》，按照规范...","text":"【自然资源部：临时用地管理文件修订面向社会公开征求意见】据自然资源部消息，近日，自然资源部起草了《自然资源部关于规范临时用地管理的通知（征求意见稿)》，按照规范性文件制定程序有关规定，现公开征求社会意见。相比2号文，《征求意见稿》主要在4个方面作了完善。一是新增临时用地类型清单，“适用”与“禁止”一目了然，方便基层、企业把握要点，便捷基层审批。二是充分释放临时用地继续、接续使用政策效应，对不满最高使用年限的临时用地项目，均可申请继续使用，累计不超过最高法定使用年限；对能源、交通、水利等长周期建设项目，作出针对性的用地规定，不同项目之间可接续使用同一临时用地，纳入国家和省级重大项目清单的，同一项目的不同施工标段也可申请接续使用，累计不超过项目立项批准的工期， 最大程度节约企业重新选址的时间和土地复垦的成本，提升经济效益与土地利用效率。三是推行联动审批制度，对涉及耕地、林地、草地混合的，统一由自然资源主管部门受理，让企业只跑一个部门，提升建设项目临时用地审批效率和审批服务温度，保障建设项目及时落地。四是积极回应企业诉求，将土地复垦保证金调整为土地复垦费用，确保专款专用，按复垦进度提取费用，并支持使用银行保函的方式代替预存土地复垦费用，大幅度减少企业资金压力。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409057629","importance":"hot"},{"id":"1633514786757","time":1789207766000,"title":"四部门：到2030年基本建成多层次农业保险体系","text":"四部门：到2030年基本建成多层次农业保险体系","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6L5ROV60519814N.html","importance":""},{"id":"wscn3164326","time":1789207730000,"title":"自然资源部：临时用地管理文件修订面向社会公开征求意见","text":"近日，自然资源部起草了《自然资源部关于规范临时用地管理的通知（征求意见稿)》，按照规范性文件制定程序有关规定，现公开征求社会意见。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"163600933720","time":1789207635000,"title":"太太口服液创始人朱保国退休，两家上市公司各自新董事长接棒，但朱仍是实控人","text":"太太口服液创始人朱保国退休，两家上市公司各自新董事长接棒，但朱仍是实控人","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6L5NRJ70511U82T.html","importance":""},{"id":"wscn3164325","time":1789207415000,"title":"小米高管称部分门店高峰时段客流量暴涨400%","text":"小米集团高级副总裁、中国区总裁王晓雁发文表示，这两天小米之家的强度拉满了，部分门店高峰时段客流量直接暴涨400%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4887214","time":1789207316000,"title":"【乘联分会崔东树：本轮乘用车市场下行属于阶段性结构性波动】乘联分会秘书长崔东树发文称，2026年8月车市零售环比回升5.5%，是油价高位压制、宏观景气偏弱、政策...","text":"【乘联分会崔东树：本轮乘用车市场下行属于阶段性结构性波动】乘联分会秘书长崔东树发文称，2026年8月车市零售环比回升5.5%，是油价高位压制、宏观景气偏弱、政策预期升温、成都车展带动等多重因素交织共振的结果。地缘冲突持续困扰霍尔木兹海峡的通航，推动国际油价维持高位震荡，2026年国内汽油价格累计上调已超1720元/吨，尤其7月底以来上涨了180元，大幅抬高了燃油车用车成本，国内燃油乘用车消费需求持续剧烈萎缩。8月制造业PMI环比回升0.6%至49.8%，仍处于荣枯线之下，终端内需边际虽回暖但力度有限。8月上中旬高温假抑制终端到店客流、下旬成都车展带动市场热度回升、月末冲量拉动日均零售修复，终端订单与客流呈现前低后高走势。此外，新能源安全新国标落地后合规产品集中迭代上市，技术门槛抬升推动行业从“价格内卷”转向“价值竞争”。叠加7月政治局会议明确财政加力、加码扩内需促消费政策持续落地，为车市提供底部支撑，因此本轮市场下行属于阶段性结构性波动，行业趋势性恶化判断为时尚早。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409057307","importance":"hot"},{"id":"wscn3164324","time":1789207309000,"title":"第十八届中国国际种业博览会合肥举行，聚焦智能育种","text":"第十八届中国国际种业博览会暨第二十三届全国种子信息交流与产品交易会12日在安徽合肥举行。多位院士专家在会上表示，智能育种技术通过整合基因组学、人工智能(AI)和大数据分析等前沿科技提高育种效率和精准度。（中国新闻网）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164323","time":1789207161000,"title":"特朗普：你们可能很快就会看到与加拿大达成协议。\n加拿大必须更好地对待美国的农民。\n（谈伊朗）我们有很多好牌。\n加拿大希望达成协议。\n","text":"特朗普：你们可能很快就会看到与加拿大达成协议。\n加拿大必须更好地对待美国的农民。\n（谈伊朗）我们有很多好牌。\n加拿大希望达成协议。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164322","time":1789207102000,"title":"伊朗：与阿曼的霍尔木兹海峡航运协议很快就会宣布","text":"伊朗议员兼议会国家安全和外交政策委员会秘书Behnam Saeedi在官方电视台表示，伊朗和阿曼将很快宣布有关霍尔木兹海峡航线的谅解书。Saeedi称将“当着地区各国的面”公布，但未提供具体细节。该协议指定了一条“临时路线”，但“并不等于海峡重新开放”。海峡的重新开放将“取决于多种因素，包括美国结束对伊朗的海上封锁”。“指定这条航线是前进了一步，但只有当美国履行其承诺时，海峡才会开放”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirqmqv1266601","time":1789207053000,"title":"滴滴企业版已累计服务超100万家企业，发布跨企业AI工具","text":" 新浪科技讯 9月12日下午消息，滴滴企业版在2026商旅服务大会上，发布商旅全程保障“超级省”、AI跨企业协同方案及《2026企业商旅趋势报告》，重新定义商旅服务的价值。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/china/gncj/2026-09-12/doc-inirqmqv1266601.shtml","importance":""},{"id":"wscn3164320","time":1789206986000,"title":"乘联分会崔东树：本轮乘用车市场下行属于阶段性结构性波动","text":"乘联分会秘书长崔 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
