商环境规划》，《规划...","text":"【北京市“十五五”时期优化营商环境规划：推动平台经济创新和健康发展 整治和防范“内卷式”竞争】北京市人民政府印发《北京市“十五五”时期优化营商环境规划》，《规划》提出了2030年目标及2035年目标，其中2030年目标包括“营商环境整体水平位居全球前列”。在具体实践方面，《规划》围绕六大环境，提出了29个方面改革举措。其中包括：强化公平竞争审查刚性约束,完善各类经营主体公平参与市场竞争相关制度。推动平台经济创新和健康发展,整治和防范“内卷式”竞争。加大支持中小企业公平参与招标投标力度,积极稳妥推进人工智能技术在招标投标交易全过程和管理重点环节应用,推广远程异地评标和“双盲”评审改革,促进招标投标更加公平公正。推行合作创新采购模式,优化政府采购电子平台功能,全面推广异常低价审查,推动政府采购行政裁决试点建设,持续规范政府采购市场秩序。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409929888","importance":""},{"id":"sinacomos:nismvpe9355542","time":1789874288000,"title":"视频丨董建华设灵 商界人士到场致意","text":"视频丨董建华设灵 商界人士到场致意","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/companyt/2026-09-20/doc-inismvpe9355542.shtml","importance":""},{"id":"sinacomos:nismvpc2557504","time":1789874214000,"title":"东风汽车推多项计划，人形机器人年底将小批量试制","text":"汽车央企的新发展。 日前，东风汽车第十届科技创新周开幕，“天净零碳”计划、具身智能汽车全域守护计划、“天际扬帆”计划等集中发布。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/roll/2026-09-20/doc-inismvpc2557504.shtml","importance":""},{"id":"sinacomos:nismvnz1674569","time":1789874167000,"title":"视频丨董建华公祭大殓在港举行，香港行政长官李家超到场，霍震霆、何超琼等政商界人士陆续抵达","text":"来源：珠江之声FM1057","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/2026-09-20/doc-inismvnz1674569.shtml","importance":""},{"id":"1635835004693","time":1789874003000,"title":"2026京津冀蓝皮书：建议发行城市群级算力券 ，投向中小企业、科研机构","text":"2026京津冀蓝皮书：建议发行城市群级算力券 ，投向中小企业、科研机构","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L7917LCN0519APGA.html","importance":""},{"id":"xq4893576","time":1789873982000,"title":"【市场监管总局：依法从严处理带头开展恶意低价竞争、扰乱生产经营秩序的企业】国务院新闻办公室今天上午举行开局起步“十五五”系列主题新闻发布会，据介绍，“十五五”期...","text":"【市场监管总局：依法从严处理带头开展恶意低价竞争、扰乱生产经营秩序的企业】国务院新闻办公室今天上午举行开局起步“十五五”系列主题新闻发布会，据介绍，“十五五”期间，市场监管总局针对劣质低价问题将综合施策，加快引导市场竞争从“拼价格”转向“拼质量”的良性轨道。首先是强化价格执法，将指导相关行业协会制定成本测算标准，推动形成“1+1+N”的低价倾销规制法律体系。对带头开展恶意低价竞争、扰乱生产经营秩序的企业，进行成本调查和价格检查，依法从严处理。推动实施《互联网平台价格行为规则》，持续规范平台经济领域价格竞争行为。同时加强质量风
