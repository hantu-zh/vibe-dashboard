织密财务造假预防、发现和惩处网络，推动重大案件严查快办。与相关部委、地方政府齐抓共治，共同营造“不敢造假、不能造假、不想造假”的市场生态。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163124","time":1789026989000,"title":"证监会李超：大力引导上市公司增强投资者回报的持续性","text":"9月10日，在国新办新闻发布会上，证监会副主席李超表示，证监会将持续发挥资本市场的并购重组主渠道作用，着力构建活而有序的并购市场生态。大力督促引导上市公司强化投资者回报意识，增强投资者回报的持续性、及时性和可预期性，更好维护广大中小投资者合法权益。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1635687578789","time":1789026942000,"title":"中国去年新设7万家外资企业，佛得角也来了：外资都在投什么？","text":"中国去年新设7万家外资企业，佛得角也来了：外资都在投什么？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6FPCVQG0519APGA.html","importance":""},{"id":"1631255971018","time":1789026906000,"title":"洗衣机19小时跑400多兆流量？美的回应","text":"洗衣机19小时跑400多兆流量？美的回应","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6FP69RU0519848A.html","importance":""},{"id":"wscn3163121","time":1789026888000,"title":"证监会李超：进一步严格规范控股股东、实控人减持行为","text":"9月10日，在国新办新闻发布会上，证监会副主席李超表示，近年来，证监会开展多轮上市公司治理专项行动，修订上市公司治理准则，推动独立董事制度改革，着力提升上市公司规范运作水平。下一步，证监会将深入实施新一轮上市公司治理专项行动，进一步严格规范控股股东、实控人减持等行为，加强董事高管任职履职离职全流程监管，引导更多上市公司加快健全中国特色现代企业制度。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163119","time":1789026840000,"title":"消息人士称也门胡塞武装已控制红海沿岸城市穆哈","text":"路透社10日援引3名也门政府消息人士的话报道称，也门胡塞武装已控制也门红海沿岸城市穆哈。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163117","time":1789026818000,"title":"证监会李超：超2000家公司连续五年分红","text":"9月10日，在国新办新闻发布会上，证监会副主席李超表示，2024年“并购六条”出台以来，上市公司累计披露重大资产重组370单，一批优质企业通过并购重组加快转型升级，实现价值成长。新“国九条”以来，上市公司累计分红、回购超7万亿元，超2000家公司连续五年分红，超1000家公司开展中期分红，分红频次和金额持续提升。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1638708659182","time":178902674 t","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163105","time":1789026485000,"title":"【央行陆磊：央行将完善存款准备金制度，更加灵活精准开展公开市场操作】9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，“十五五”时期，人民银行将持续","text":"【央行陆磊：央行将完善存款准备金制度，更加灵活精准开展公开市场操作】9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，“十五五”时期，人民银行将持续健全基础货币投放机制，完善存款准备金制度，更加灵活精准开展公开市场操作，不断健全市场化利率形成、调控和传导机制，增强政策利率引导作用，引导短端货币市场利率围绕政策利率更加平稳运行。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:niritau7649009","time":1789026458000,"title":"证监会：优化发行上市制度","text":"证监会副主席李超9月10日在国新办新闻发布会上表示，对于“十五五”资本市场工作，总的考虑是：紧紧围绕“打造安全、规范、透明、开放、有活力...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/china/2026-09-10/doc-iniritau7649009.shtml","importance":"hot"},{"id":"wscn3163104","time":1789026454000,"title":"央行陆磊：央行将坚定保持货币币值稳定 同时逐步淡化数量型中介目标","text":"9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，“十五五”时期，人民银行将进一步完善优化中国特色现代货币政策框架体系。人民银行将坚定保持货币币值稳定，并以此促进经济增长，有效支持实体经济高质量发展。同时，逐步淡化数量型中介目标，更加注重发挥利率型调控工具的作用。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163103","time":1789026432000,"title":"【央行陆磊：中国没有必要也无意通过汇率贬值来获取贸易竞争优势】9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，中国实施有管理的浮动汇率制度，坚持市","text":"【央行陆磊：中国没有必要也无意通过汇率贬值来获取贸易竞争优势】9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，中国实施有管理的浮动汇率制度，坚持市场在汇率形成中的决定作用，防范市场羊群效应和非理性预期的自我强化，中国没有必要也无意通过汇率贬值来获取贸易竞争优势。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163101","time":1789026353000,"title":"证监会李超：完善符合我国国情的投资者保护体系","text":"9月10日，在国新办新闻发布会上，证监会副主席李超表示，证监会将抓紧推动证券投资基金法、上市公司监管条例等重要法律法规的制定修改。同时，进一步完善符合我国国情的投资者保护体系，积极营造公平公开公正的市场环境。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163099","time":1789026284000,"title":"湖北：围绕光通信、高端芯片、北斗高精度定位等开展集中攻关 推进人工智能、具身智能、量子科技、脑机接口、6G等前沿方向原始创新","text":"湖北省人民政府印发《数字湖北建设“十五五”规划》。规划指出， </script>

<script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
