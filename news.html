urce":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-15/doc-inirvqsk9125518.shtml","importance":""},{"id":"xq4890346","time":1789409951000,"title":"美国众议院议长约翰逊称，特朗普将于本周或下周召集AI企业高管开会。","text":"美国众议院议长约翰逊称，特朗普将于本周或下周召集AI企业高管开会。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409251705","importance":"hot"},{"id":"wscn3164995","time":1789409360000,"title":"塞尔维亚总统武契奇表示，他将于9月27日辞职。\n","text":"塞尔维亚总统武契奇表示，他将于9月27日辞职。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirvqss4284491","time":1789409278000,"title":"花旗、高盛和摩根大通等上调年末美债收益率预测","text":" 上周五美国公布的消费者价格指数推动市场隐含的美联储加息概率升至约90%后，花旗、高盛和摩根大通利率策略师均转而预计，美联储本周可能加息。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-15/doc-inirvqss4284491.shtml","importance":"hot"},{"id":"wscn3164994","time":1789409270000,"title":"花旗、高盛和摩根大通等上调年末美债收益率预测","text":"上周五美国公布的消费者价格指数（CPI）推动市场隐含的美联储加息概率升至约90%后，花旗、高盛和摩根大通利率策略师均转而预计，美联储本周可能加息。\n上述机构以及道明证券加入华尔街其他多家交易商的行列，预计美联储将在9月16日宣布加息。与此同时，多家机构还上调了对年末美国国债收益率的预测。\n高盛策略师将10年期美债收益率年底预测从4.40%上调至4.75%，道明证券则从4.25%上调至4.75%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4890341","time":1789409261000,"title":"【花旗、高盛和摩根大通等上调年末美债收益率预测】上周五美国公布的消费者价格指数推动市场隐含的美联储加息概率升至约90%后，花旗、高盛和摩根大通利率策略师均转而预...","text":"【花旗、高盛和摩根大通等上调年末美债收益率预测】上周五美国公布的消费者价格指数推动市场隐含的美联储加息概率升至约90%后，花旗、高盛和摩根大通利率策略师均转而预计，美联储本周可能加息。上述机构以及道明证券加入华尔街其他多家交易商的行列，预计美联储将在9月16日宣布加息。与此同时，多家机构还上调了对年末美国国债收益率的预测。高盛策略师将10年期美债收益率年底预测从4.40%上调至4.75%，道明证券则从4.25%上调至4.75%。道明证券Gennadiy Goldberg等策略师在9月11日的报告中表示，鉴于市场已经大幅计入美联储加息预期，预计收益率不会因为升幅而明显失控上行，但除非经济出现恶化迹象，否则收益率在2027年总体上应会维持在较高水平。蒙特利尔银行策略师也表示，他们已下调对10年期美债的看涨预期，预计年底收益率为4.6%，年底前下探4.0%的可能性已经不存在。该行仍维持对美国国债这一资产类别的中期乐观看法，但近期目标已不如之前激进。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409251501","importance":"important"},{"id":"wscn3 3年3月9日盘中最高位3.382%、2008年二季度最高位4.782%；30年期德债收益率跌4.0个基点，报3.858%，微幅高开之后整体震荡下行。\n2/10年期德债收益率利差跌5.653个基点，报+25.129个基点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1634609728722","time":1789403861000,"title":"广汽筹划重大资产重组，一汽拟成第二大股东","text":"广汽筹划重大资产重组，一汽拟成第二大股东","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6R0S7KQ051989TN.html","importance":""},{"id":"1639365051419","time":1789403826000,"title":"原董事长谢文辉被查！渝农商行又陷高管落马风波","text":"原董事长谢文辉被查！渝农商行又陷高管落马风波","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6R0R2CJ0519MPBR.html","importance":""},{"id":"wscn3164966","time":1789403755000,"title":"报道：沙特阿拉伯寻求进一步增加经霍尔木兹海峡的原油出口","text":"据一位知情人士透露，在一条替代霍尔木兹海峡的关键输油管道遭袭停运后，沙特阿拉伯正寻求进一步增加经海峡运输的石油供应。\n9月初，沙特阿美已将原油总出口提高至接近每日400万桶，其中约100万桶经霍尔木兹海峡出口，其余则通过红海沿岸的延布港运输。\n根据Vortexa和Kpler的油轮追踪数据汇总显示，沙特8月原油总出口已降至每日约300万桶，为至少九年来最低水平。\n沙特上周关闭了东西输油管道，在市场急需更多供应之际，该管道停运使每日数百万桶原油运输面临风险。（彭博，美联社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1636556019408","time":1789403750000,"title":"魏桥系大腾挪，宏桥控股20亿买了两家“亏损公司”","text":"魏桥系大腾挪，宏桥控股20亿买了两家“亏损公司”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6R0OMIF0519MPBR.html","importance":""},{"id":"wscn3164965","time":1789403684000,"title":"特朗普：通胀源于拜登，除油价外物价正显著下行，伊冲突结束后油价将暴跌","text":"特朗普称，他希望所有人认识到，全美物价上涨是由拜登及其政府造成的，责任不在“特朗普”。他表示，拜登执政时期的油价高于当前水平，且他曾阻止伊朗获得核武器。除油价暂时例外，物价正大幅回落；一旦与伊朗的军事冲突结束，油价将会暴跌，而这一天不会太远。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"ths679896665","time":1789403580000,"title":"年内超百家A股公司完成定增","text":"今年以来，定增市场活跃。数据显示，以发行日期统计，今年1月1日至9月14日，已有135家A股上市公司完成定增，较去年同期的97家增长39.18%。南开大学金融学教授田利辉对记者表示：“上市公司定增方案持续落地，与政策支持、产业需求与市场情绪的共...","source":"同花顺","category":"fast","stock":"","url":"http://stock.10jqka.com.cn/20260915/c679896665.shtml",
