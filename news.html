"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-14/doc-inirvkks3962367.shtml","importance":"important"},{"id":"wscn3164971","time":1789404604000,"title":"道指转涨，标普跌幅收窄至0.1%、此前一度跌0.8%。\n","text":"道指转涨，标普跌幅收窄至0.1%、此前一度跌0.8%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirvqsn7101791","time":1789404581000,"title":"泽连斯基：乌克兰愿意停止攻击能源设施 前提是俄罗斯也停手","text":" 乌克兰总统泽连斯基表示，如果合作伙伴能够确保俄罗斯停止袭击乌克兰能源及其他基础设施，乌克兰准备停止对俄罗斯关键基础设施发动袭击。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-15/doc-inirvqsn7101791.shtml","importance":""},{"id":"sinacomos:nirvqsn7099483","time":1789404290000,"title":"特朗普：那些没有施以援手的国家应在伊朗战争后补偿美国","text":" 美国总统特朗普在Truth Social发帖谈及伊朗战争时表示：“那些没有给我们提供任何帮助的国家应该、而且也将对美利坚合众国给予补偿。”","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-15/doc-inirvqsn7099483.shtml","importance":""},{"id":"sinacomos:nirvqsk9097971","time":1789404033000,"title":"惠誉：美国私募信贷违约率升至6.3% 创下纪录新高","text":"惠誉评级称，美国一组私募信贷借款人的违约率8月升至纪录高位。 周一发布的报告显示，8月底，1，300家借款人过去12个月私募信贷违约率升至6.3%，超过7月创下的此前高点6...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-15/doc-inirvqsk9097971.shtml","importance":""},{"id":"wscn3164968","time":1789403985000,"title":"泽连斯基称可对等停袭俄能源设施","text":"对于美国总统特朗普称俄乌同意不再互袭能源目标，乌克兰总统泽连斯基当地时间9月14日晚在社交媒体平台发帖称，如果合作伙伴能确保俄方不再袭击乌克兰的能源设施、基础设施和粮食供应通道，乌克兰已准备好停止对俄打击。 泽连斯基发文称：“必须结束这场战争。而在关键基础设施问题上采取降级措施，可能是迈向和平的第一步。我们期待合作伙伴给出具体方案。”（CCTV国际时讯）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164967","time":1789403871000,"title":"两年期德债收益率涨约7个基点，长端收益率走低","text":"周一（9月14日）欧市尾盘，德国10年期国债收益率涨1.3个基点，报3.518%，日内交投于3.509%-3.555%区间，全天处于M形上涨状态，北京时间22:24逼近2009年二季度最高位3.749%、2008年四季度最高位4.148%、以及2002年三季度顶部5.024%。\n两年期德债收益率涨6.8个基点，报3.263%，日内交投于3.207%-3.328%区间，重新逼近2023年3月9日盘中最高位3.382%、2008年二季度最高位4.782%；30年期德债收益率跌4.0个基点，报3.858%，微幅高开之后整体震荡下行。\n2/10年期德债收益率利差跌5.653个基点，报+25.129个基点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1637352557253","time":1789403861000,"title":"广汽筹划重大资产重组，一汽拟成第二大股东","text":"广汽筹划重大资产重组，一汽拟成第二大股东","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6R0S7KQ051989TN.html","importance":""},{"id":"163779204653","time":1789403826000,"title":"原董事长谢文辉被查！渝农商行又陷高管落马风波","text":"原董事长谢文辉被查！渝农商行又陷高管落马风波","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6R0R2CJ0519MPBR.html","importance":""},{"id":"1632049129854","time":1789403750000,"title":"魏桥系大腾挪，宏桥控股20亿买了两家“亏损公司”","text":"魏桥系大腾挪，宏桥控股20亿买了两家“亏损公司”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6R0OMIF0519MPBR.html","importance":""},{"id":"wscn3164965","time":1789403684000,"title":"特朗普：通胀源于拜登，除油价外物价正显著下行，伊冲突结束后油价将暴跌","text":"特朗普称，他希望所有人认识到，全美物价上涨是由拜登及其政府造成的，责任不在“特朗普”。他表示，拜登执政时期的油价高于当前水平，且他曾阻止伊朗获得核武器。除油价暂时例外，物价正大幅回落；一旦与伊朗的军事冲突结束，油价将会暴跌，而这一天不会太远。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164964","time":1789403277000,"title":"特朗普发文：霍尔木兹海峡石油正常流通","text":"美国总统特朗普称，石油正经由霍尔木兹海峡输送。他表示，世界上那些未曾向美国提供任何帮助的国家，在这场冲突闹剧结束后应当且必将向美国作出补偿。美国长期以来为他国付出的远多于为本国所做的，这种情况已经持续了数代人。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirvqsq3862407","time":1789403160000,"title":"Anthropic上市计划不会因AI安全舆论风波推迟","text":"据 Axios 多方消息，即便 AI 安全问题已成为全民热议话题，Anthropic 仍大概率在 2026 年完成 IPO。 整体大势 过去一周，AI 行业风波不断，但上市日程并未受到影响。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirvqsq3862407.shtml","importance":"hot"},{"id":"wscn3164963","time":1789403037000,"title":"特朗普：美国高端武器产量创历史新高，重点生产爱国者、萨德、战斧导弹","text":"特朗普称，他刚刚收到一份报告，美国当前生产的精良高端武器数量创下本国历史新高，相关装备每日交付给部署在中东及其他地区的美军部队。美国国防企业工厂实行全天候运转，每家工厂平均还在新建4至5座大型全新厂房。本轮生产重点包括爱国者导弹、萨德反导系统、战斧导弹以及其他标准导弹系统，美方目前已持有大量该类装备库存。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164962","time":1789402867000,"title":"欧洲央行官员Pedro Machado：希望在合成证券化产品（synthetic SRTs）中提高透明度。\n","text":"欧洲央行官员Pedro Machado：希望在合成证券化产品（synthetic SRTs）中提高透明度。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirvkks3990020","time":1789402815000,"title":"马斯克：我早已为人工智能风险多次敲响警钟","text":"人们早就见惯埃隆・马斯克放出论断，而这一次，他意在表明：自己一直都是对的。 这位太空探索技术公司（SpaceX）与特斯拉的首席执行官...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirvkks3990020.shtml","importance":""},{"id":"wscn3164961","time":1789402803000,"title":"英国两年期国债收益率涨超7个基点，英国央行加息前景带动10年期收益率创2007年以来新高","text":"周一（9月14日）欧市尾盘，英国10年期国债收益率涨2.4个基点，报5.367%，全天处于上涨状态，整体呈现出M形走势，北京时间22:32达到5.434%——逼近2007年三季度最高位5.564%、1998年一季度顶部6.307%。\n两年期英债收益率涨7.6个基点，报4.889%，逼近2029年10月19日顶部5.068%、当年7月6日盘中最高位5.561%。\n30年期英债收益率跌1.7个基点，50年期英债收益率跌3.1个基点。\n2/10年期英债收益率利差跌5.263个基点，报+47.640个基点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164959","time":1789402511000,"title":"美银策略师Subramanian将标普500指数目标上调至7400点，但仍保持谨慎","text":"美国银行策略师Savita Subramanian将其对标普500指数的年底预测从7100点上调至7400点。\nSubramanian预计标普500指数将在未来12个月内达到7800点，但她对通胀风险和美联储加息仍保持谨慎。\n她认为，在人工智能（AI）资本支出、制造业和生产力的支撑下，2026年每股收益将增长33%，2027年将增长12%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirvkkn9220572","time":1789402397000,"title":"特朗普驳斥放缓人工智能发展的呼声，称存在针对AI与数据中心的“阴谋”","text":"作者：丹尼尔・豪利 特朗普总统周一拒绝了为 AI 模型增设管控护栏的呼吁。他在真相社交（Truth Social）发帖表示，政府对这些企业已经手握 “极强的刑事与监管权力！","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirvkkn9220572.shtml","importance":""},{"id":"wscn3164958","time":1789402281000,"title":"欧盟拟议的儿童法案草案将社交媒体、线上游戏、机器人聊天工具列为监管目标，要求对相关公司实施高达全球收入6%的罚款。\n","text":"欧盟拟议的儿童法案草案将社交媒体、线上游戏、机器人聊天工具列为监管目标，要求对相关公司实施高达全球收入6%的罚款。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164957","time":1789402201000,"title":"伊拉克北部库区遭5枚火箭弹袭击","text":"伊拉克北部库尔德自治区（库区）安全部门14日发表声明说，库区苏莱曼尼亚省当天凌晨遭5枚火箭弹袭击，未造成人员伤亡。一名库区安全人士告诉记者，此次火箭弹袭击的目标是伊朗库尔德反政府武装的营地。目前有关部门已对袭击事件展开调查。伊拉克库区山区分布着多个伊朗库尔德反对派武装据点，此前曾多次遭到伊朗安全部队的导弹和无人机跨境打击。(新华社)\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164956","time":1789402132000,"title":"Puig同意，按12亿欧元从Esteve收购Isdin。\n","text":"Puig同意，按12亿欧元从Esteve收购Isdin。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirvkkn9219292","time":1789402089000,"title":"微软发布AI模型开发宣言 核心原则是“人比AI更重要”","text":"微软公司的人工智能研究人员发布了一套新的指导原则，对该公司开发尖端AI模型设定限制。 这份长达1.5万字的宣言可以浓缩成五个词：People matter more than AI...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-15/doc-inirvkkn9219292.shtml","importance":""},{"id":"1634763132177","time":1789401993000,"title":"美联储加息，A股会大跌吗？应该如何应对？必看！","text":"美联储加息，A股会大跌吗？应该如何应对？必看！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QV2VKG0519B7K0.html","importance":"important"},{"id":"wscn3164955","time":1789401900000,"title":"丹麦首相：希望与美国通过合作解决格陵兰岛问题","text":"丹麦首相弗雷泽里克森14日在芬兰北部城市罗瓦涅米表示，希望丹麦与美国在北极和格陵兰岛问题上通过合作找到解决方案。\n弗雷泽里克森当天在欧洲北极峰会结束后的新闻发布会上说，丹麦与美国有关格陵兰岛问题的高级别工作组仍在开展工作，虽然尚不能作出结论，但她对找到解决方案持乐观态度。\n谈及北极安全合作，弗雷泽里克森说，目前多个盟国在格陵兰岛开展联合演习，欧洲及跨大西洋伙伴正共同承担更多责任，以保障格陵兰岛和北极地区的安全。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164954","time":1789401809000,"title":"Anthropic针对金融顾问推出Claude模型。\n这款Claude模型将对接
