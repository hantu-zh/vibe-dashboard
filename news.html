166556","time":1789602468000,"title":"特朗普预计将于下周会见海湾阿拉伯国家合作委员会（GCC）领导人，预计将讨论伊朗问题。（AXIOS）\n","text":"特朗普预计将于下周会见海湾阿拉伯国家合作委员会（GCC）领导人，预计将讨论伊朗问题。（AXIOS）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166555","time":1789602401000,"title":"碳酸锂期价大幅回调","text":"进入9月，本该迎来传统“金九银十”旺季的碳酸锂市场却走出一轮单边下行走势，带动锂矿板块上市公司股价同步走弱。9月16日，国内碳酸锂期货主力合约价格盘中一度跌至124020元/吨，9月以来累计下跌逾两成。回溯至今年5月份，国内碳酸锂期货主力合约价格最高一度在21万元/吨左右，短短4个月跌去超四成，基本抹平年内涨幅。本轮碳酸锂价格下跌受到头部电池厂下修排产传闻、库存统计口径切换等市场消息影响，或是对前期过度乐观预期的调整。也有观点认为，美联储加息预期、市场对远期需求的预期偏悲观也是影响因素。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3166554","time":1789602307000,"title":"上游原料价格持续上涨 染料企业跟进涨价","text":"近期，染料行业涨价受到关注。9月初，浙江龙盛、闰土股份等染料龙头集中提价。申万宏源报告指出，传统纺服旺季备库周期将至，在上游中间体高景气支撑下，染料价格有望持续上扬。此轮染料涨价并非简单的季节性波动，而是上游中间体H酸供给端长期约束的集中爆发。H酸是酸性染料、直接染料及活性染料的生产中间体。数据显示，2026年初，H酸价格约4万元/吨，到9月初，部分厂家报价触及15万元/吨，价格刷新历史高位。染料的另一大原材料还原物的供给形势同样严峻。据生意社数据，还原物市场均价由2025年末的2.5万元/吨涨至目前的10万元/吨至12万元/吨，年内涨幅接近380%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"cls2485647","time":1789601923000,"title":"“双节”机票酒店预订进入高峰期 超长假期或对旅游板块形成正向支撑","text":"①去哪儿数据显示，9月16日，国庆节前一日（9月30日）火车票正式开售，带动机票酒店预订进入高峰期。\n②中金公司预计超长假期或对2026年三季度长线游及核心景区客流形成正向支撑。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2485647","importance":""},{"id":"cls2485632","time":1789601899000,"title":"机构称电网供应缺口自2028年扩大 电力建设有望持续景气","text":"根据TrendForce集邦咨询最新AI Server产业研究，至2030年，预估全球数据中心电力需求容量将达490.7GW，在其他用电需求满足的前提下，电网可供数据中心使用的容量为222.6GW，供需缺口达268GW。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2485632","importance":""},{"id":"cls2485635","time":1789601896000,"title":"国产药在海外密集获批 医药行业盈利修复趋势进一步确认","text":"①据媒体报道，近期，多家国内药企如华海药业、普洛药业、双成药业、科兴制药等在海外获得了药品上市许可。\n②国信证券表示，2026年上半年医药行业收入保持稳健增长，利润端实现双位数增长，26Q2盈利增速进一步提升，创新药及产业链维持较高景气。","source":"财联社","category":"fast","stock
