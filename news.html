egory":"fast","stock":"","url":"https://www.163.com/dy/article/L6ET0F8L0552FWS9.html","importance":""},{"id":"wscn3162854","time":1788997491000,"title":"尼泊尔泥石流灾害遇难人数升至1374人","text":"根据尼泊尔警方公布的最新数据，截至当地时间9月9日20时，尼泊尔泥石流灾害造成的遇难人数升至1374人。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1638266487010","time":1788997196000,"title":"王老吉继续“降温”","text":"王老吉继续“降温”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6ESEB8C0519C95F.html","importance":""},{"id":"wscn3162868","time":1788997175000,"title":"高盛Communacopia大会要点总结","text":"1、CoreWeave的CEO Mike Intrator：人工智能（AI）行业在解释数据中心对社区的好处方面做得不够好，公众的恐惧本质上是对“变化太快”的焦虑。\n2、Visa的CEO Ryan McInerney：消费者对AI代理代付“不信任”，代理式商务发展“比我们想象的要慢一些”。\n3、Anthropic前研究员Jacob Coxon：辞职后公开警告，AI超级智能“可能在本十年末杀死我们所有人”，指责Anthropic和OpenAI“拿我们的生命赌博”。\n4、CrowdStrike的CEO George Kurtz：回应Coxon警告时称AI“可以被用于好的目的，也可以被用于坏的目的”，应以安全方式驾驭。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162853","time":1788996686000,"title":"17只基金连续3年获基金公司员工增持","text":"2026年基金半年报披露了基金公司员工持有份额的最新数据，这份数据是目前市场覆盖面最广的基金公司内部知情人持仓记录，能够直观观察基金“内部人”的真金白银投向。基金定期报告披露的员工持有份额主要由三部分构成：一是基金经理个人自购；二是发起式基金在发行阶段，管理人、高管、基金经理作为发起人的跟投份额；三是基金公司高管及普通员工自主申购的份额。数据显示，截至6月末，有基金公司员工持仓的主动权益基金共计4580余只，合计持有份额超54亿份，相较2025年末，产品数量增长4.95%，持有总份额增长1.67%。其中，南方成安优选、汇添富自主核心科技一年持有A等17只基金连续3年获基金公司员工增持。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162851","time":1788996518000,"title":"强现实托起铜价 机构认为宏观因素将决定上涨高度","text":"近期，国内外铜价持续走强，伦敦金属交易所（LME）期铜盘中刷新历史纪录，一度触及14779美元/吨；沪铜期货主力合约价格也突破110000元/吨关口。业内人士表示，本轮铜价上涨的核心支撑包括全球铜精矿供应收紧、库存持续下降以及现货市场紧张，而美国精铜关税预期引发的库存转移效应，进一步加剧了非美地区供应紧张。短期来看，铜价或在高位区间维持震荡。不过，随着产业端利多因素逐渐被市场定价，后续铜价上涨空间仍取决于美联储货币政策走向、美国精铜关税政策情况等宏观因素变化。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162850","time":1788995708000,"title":"华尔街见闻早餐 | 2026年9月10日","text":"油价破百叠加通胀数据前夕，美股三连跌，Meta逆势大涨6%，美债全线走低。\n震撼大手笔落空，美财政部长债回购三倍扩容，60亿仅达预期低端，10年期美债收益率升破4.84%、创2023年11月以来新高。\n特朗普称美国中选后伊朗战事会“立即”结束。伊朗宣布设立新的海上”制裁区域”并袭击美军基地，美军打击伊朗油轮，中东局势升级推动布伦特原油一个多月来首次站上100美元、收报101.21美元。\n中国商务部：美方AI蒸馏指控是推行科技霸权、搞算力垄断，中方坚决反对。\n中国8月CPI同比涨幅扩大至0.8%、PPI同比涨3.8%，双双环比转正，国际油价与食品季节性上涨带动物价回升。\n苹果发布首款折叠屏iPhone Duo，内屏7.6英寸、起售1999美元，国行售价15999元起。\nDeepSeek科创板IPO加速，中信或为辅导机构。\n“国产GPU四小龙”燧原科技9月11日登陆科创板，前三季度营收同比预增326%至455%。\n抖音7月单用户月均使用时长首次登顶全国第一。\n提醒：欧洲央行周四将公布利率决议，料加息25个基点。中国方面，重要发布会今天下午3时举行，央行、证监会等官员将出席。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1634432772194","time":1788995369000,"title":"银行新高！新一轮周期，刚开始！","text":"银行新高！新一轮周期，刚开始！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6ER9TF40519DKT1.html","importance":""},{"id":"wscn3162845","time":1788995259000,"title":"第七批国家组织医用耗材集采今天开标 共纳入23个品种","text":"第七批国家组织医用耗材集中带量采购将于今天（10日）在天津开标。本轮集采聚焦消化介入类医用耗材，共纳入23个品种，覆盖胃肠息肉切除、胆胰介入治疗相关耗材，采购周期约为3年。本轮集采坚持“稳临床、保质量、反内卷、防围标”的原则，优化采购规则，兼顾保障临床多元需求与行业高质量发展。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162844","time":1788995076000,"title":"特朗普顾问告诉他，伊朗战争可能会持续到他任期结束。就伊朗战争持续时间向特朗普发出警告的包括万斯、卢比奥。（华尔街日报）\n","text":"特朗普顾问告诉他，伊朗战争可能会持续到他任期结束。就伊朗战争持续时间向特朗普发出警告的包括万斯、卢比奥。（华尔街日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162843","time":1788994860000,"title":"英国8月三个月RICS房价指数 -28，预期 -30，前值 -30。\n","text":"英国8月三个月RICS房价指数 -28，预期 -30，前值 -30。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162842","time":1788994657000,"title":"坚持逆向布局，新基金相对低位快速建仓","text":"在市场出现调整之际，公募基金公司坚持逆向布局，新发基金节奏不变。下半年以来，新基金发行数量每月都保持在100只以上。同时，新成立的基金积极把握市场调整阶段的相对低位机会，快速建仓，一些7月以来新成立的基金回报率已经超过10%。公募机构普遍认为，展望后市，结构性机会较多，在市场快速轮动背景下，可以维持均衡配置。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162841","time":1788994602000,"title":"A股前期冷门板块成香饽饽，资金博弈寻找新共识","text":"在近期反复震荡的市场行情中，受天气等事件催化以及资金“高切低”等需求影响，以粮食、畜牧为首的前期冷门板块正在迅速吸引市场关注的目光。7月以来，粮食、农牧、农业、养殖等主题ETF集体大涨，最高涨超20%。同时，公募行业加紧布局投资工具，农业相关主题产品今年大举扩容，承接了部分高位板块流出资金。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162860","time":1788994515000,"title":"Robinhood CEO：上市公司无法控制其股票被代币化的方式，随着与AMC的冲突升级","text":"网红券商Robinhood的CEO Vlad Tenev为其公司进军代币化股票业务进行辩护。此前AMC最近猛烈抨击该公司的代币化努力，Tenev表示，上市公司一旦上市，就无法控制围绕其股份构建的金融产品。\nTenev将Robinhood的代币化努力描述为一种围绕公开交易股票的技术中立的金融包装。他表示，一旦公司的股份公开交易，股东就拥有了可转让的财产，其他金融机构应该能够创建引用这些股份的产品——而无需征得发行方的许可。\n“发行方应该并且确实对他们发行的股票的权利和义务拥有控制权，但这并不意味着他们控制关于它的一切，”他说。“特别是，他们无法控制其他公司发行引用这些股份的自己的证券。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162840","time":1788994042000,"title":"尿素价格急涨，化肥行业“金九”行情受关注","text":"9月份以来，国内尿素市场走出年内少见的急涨行情。生意社监测数据显示，9月9日尿素基准价报1822.50元/吨，较9月初的1715元/吨上涨107.5元/吨，涨幅6.27%。特别是在9月7日，主流地区中小颗粒尿素出厂报价单日上调幅度为50元/吨至150元/吨，山东临沂小颗粒尿素送到价一度升至1830元/吨。现货市场的异动同步传导至二级市场。9月8日，A股化肥板块多只个股涨停。价格急涨之下，这轮行情的成色与持续性，备受市场关注。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162839","time":1788993425000,"title":"定向可转债市场化改革提速，在房地产行业应用场景有望进一步丰富","text":"中国证监会8月底发布《关于资本市场支持构建房地产发展新模式的意见》，支持上市房企通过向特定对象发行方式再融资，并支持上市房企综合运用股份、定向可转债、现金等工具收购涉房资产。从已发行案例看，定向可转债在并购重组中主要扮演兼具债底保护与股性弹性的创新支付工具角色。业内人士认为，在房地产领域，定向可转债此前主要承担项目融资功能，未来随着行业并购需求上升，其在房地产行业中的应用场景有望进一步丰富。业内人士表示，今年已披露预案的定向可转债已达12只，远高于去年同期，具备发行扩容的基础。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162838","time":1788993188000,"title":"券商秋季策略会展望：A股“金秋行情”有望延续，扩散和均衡主导配置","text":"金秋九月，2026年券商秋季策略会密集召开。截至9月9日，华福证券、西部证券、财通证券、天风证券等多家券商已召开秋季策略会。梳理发现，在外围市场不确定性延续的背景下，券商普遍对国内资本市场后市表现持积极态度。同时，券商投研重心已由上半年的科技“一枝独秀”明显转向“多元均衡”配置，大消费、地产链等板块的关注度显著回升。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162835","time":1788993030000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 时间待定 日本央行审议委员Kazuyuki Masu（增一行）讲话；\n② 时间待定 DeepSeek可能会正式发布V4.1 Flash模型，亚太经合组织(APEC)第16届能源部长会议举行（至9月11日）；\n③ 13:30 台积电公布8月份营业额报告；\n④ 14:00 德国8月CPI终值；\n⑤ 15:00 国新办就金融领域贯彻落实“十五五”规划、推动金融强国建设有关情况举行新闻发布会；\n⑥ 19:00 土耳其央行公布利率决议；\n⑦ 时间待定 石油输出国组织（OPEC，欧佩克）公布月度原油市场报告；\n⑧ 20:15 欧洲央行公布利率决议（含主要再融资利率、存款便利利率、边际贷款利率）；\n⑨ 20:30 美国8月PPI，9月5日当周首次申请失业救济人数；\n⑩ 20:45 欧洲央行行长拉加德举行新闻发布会；\n⑪ 22:00 美国8月成屋销售总数年化；\n⑫ 22:30 美国能源信息署（EIA）发布天然气库存周报；\n⑬ 次日00:00 美国能源信息署（EIA）发布政府版原油库存周报；\n微信小程序搜索“见闻历”，了解更多。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162837","time":1788992836000,"title":"沙特主导联军称也门胡塞武装再次袭击沙特多地","text":"沙特阿拉伯主导的多国联军发言人图尔基·马利基9日说，也门胡塞武装当天使用弹道导弹和无人机对沙特多地发动袭击。\n马利基在社交媒体上发表声明说，此次遭袭城市包括海米斯穆谢特、艾卜哈、贾赞等地。声明谴责也门胡塞武装持续针对沙特国家资产和基础设施发动“恶劣袭击”，表示多国联军将作出回应。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162836","time":1788992787000,"title":"第二十七届中国国际光电博览会在深圳开幕，AI和国产化双轮驱动，光通信全产业链持续高景气","text":"从光纤到光模块，从光芯片到电芯片，每一个相关上市公司的展台都被围得水泄不通。9月9日，第二十七届中国国际光电博览会（CIOE中国光博会）在深圳国际会展中心开幕。多位业内人士表示：在全球AI（人工智能）算力基础设施持续扩张的背景下，光通信产业有望以更高的增速成长；共封装光学（CPO）、近封装光学（NPO）、全光交换机（OCS）等技术正在以超预期速度迭代，并带动上游光纤光缆、PCB（印制电路板）、片式陶瓷电容器（MLCC）等持续高景气。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162834","time":1788992452000,"title":"半月内三度召开专题会议，国家发改委研究加强“六张网”建设要素保障工作","text":"近日，国家发展改革委党组成员、副主任岳修虎主持召开“六张网”重大项目协调推进会，研究加强要素保障工作。这已是近期围绕“六张网”召开的第三次高规格专题会议。会议提出，要充分发挥各级要素保障机制作用，主动加强与项目单位的对接，精准高效做好用地、用海、环评等要素保障，共同推动“六张网”重大项目加快落地实施。专家表示，下半年要着力推动“六张网”建设从规划布局阶段更快转向形成实物工作量的阶段，将实现对产业链上下游更大的拉动作用。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162833","time":1788992341000,"title":"上证报头版文章：中国资产“确定性”筑牢资本市场内在稳定性","text":"近期，市场对“流动性”的讨论有所升温。从全球市场看，以美债为代表的多国国债收益率飙升，引发市场对流动性挤压的普遍担忧；从A股市场看，近两天成交额有所缩减，有声音解读为市场流动性趋紧的信号。多位市场专家接受采访认为，当前A股流动性仍处于健康区间，从长期看，中国经济及政策稳定性、科技创新加快引领产业格局变迁以及全球市场对中国资产安全性的认可，都将推动A股独立定价能力进一步夯实。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162832","time":1788992225000,"title":"报道：加拿大总理向投资者推介数据中心、矿山和LNG项目","text":"加拿大计划向全球一些最大的投资者展示一份项目推介手册，其中列出了价值数百亿美元的项目，涵盖数据中心、先进制造业、液化天然气（LNG）、港口以及数十个矿山。\n一份文件显示，其中包含167个项目，计划分享给全球一些最大的机构投资者。这些投资者将于下周齐聚多伦多四季酒店，参加总理马克·卡尼举办的加拿大投资峰会。\n约三分之一的宣传册内容是矿产和采矿项目。另一大部分是致力于碳捕集和氢能等技术的清洁能源企业。电力和公用事业（包括核能）构成了另一个章节。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162831","time":1788991917000,"title":"巴西总统卢拉在大选之前下调燃油税。\n","text":"巴西总统卢拉在大选之前下调燃油税。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1638538691817","time":1788991823000,"title":"DeepSeek筹备科创板IPO，“杭州六小龙”身价几何？","text":"DeepSeek筹备科创板IPO，“杭州六小龙”身价几何？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6ENTD4M051983MB.html","importance":""},{"id":"1633385968786","time":1788983619000,"title":"安洁科技董事长替人代持拟上市公司股份且未配合中介尽调遭追责，事涉高凯技术二闯科创板IPO！","text":"安洁科技董事长替人代持拟上市公司股份且未配合中介尽调遭追责，事涉高凯技术二闯科创板IPO！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6EE9P650519WTTG.html","importance":""},{"id":"1635388775741","time":1788982885000,"title":"折叠屏iphone，顶配26499元！一文看完苹果发布会","text":"折叠屏iphone，顶配26499元！一文看完苹果发布会","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6EFCU750552K0CA.html","importance":"hot"},{"id":"ths679756847","time":1788978180000,"title":"iPhone 18 Pro系列国行起售价9999元 折叠屏起售价15999   var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
