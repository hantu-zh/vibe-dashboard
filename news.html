om/5124430882/409566093","importance":""},{"id":"wscn3166540","time":1789599653000,"title":"IMF敦促澳洲联储保持鹰派立场，警告通胀上行风险","text":"国际货币基金组织（IMF）表示，鉴于通胀风险仍偏向上行，澳洲联储应准备好在必要时加息，并补充称澳大利亚政府可以通过紧缩财政立场来支持去通胀进程。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"xq4892611","time":1789599641000,"title":"【人脑类器官在小鼠体内形成功能性神经网络】发表于16日《自然》的研究表明，移植到小鼠体内的人脑类器官能够重现大脑发育的某些重要特征，包括形成功能性神经网络，从而...","text":"【人脑类器官在小鼠体内形成功能性神经网络】发表于16日《自然》的研究表明，移植到小鼠体内的人脑类器官能够重现大脑发育的某些重要特征，包括形成功能性神经网络，从而支持脑活动。这一成果得益于一种培育脑容量缩小小鼠的方法，使得人脑类器官能够与小鼠大脑整合。该模型能够以更深入的方式研究人脑发育。研究团队表示，这一实验是在严格伦理指导下进行的。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409566083","importance":""},{"id":"1637540782604","time":1789599612000,"title":"宝子，干杯！当心黄酒上头","text":"宝子，干杯！当心黄酒上头","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6V6PI9R0539LXZQ.html","importance":""},{"id":"wscn3166539","time":1789599531000,"title":"两只熊猫债指数昨日发布","text":"据中债金融估值中心网站消息，9月16日，为多角度反映人民币债券市场的走势，给投资者提供多元化的业绩比较基准和投资标的，中债金融估值中心有限公司发布中债-熊猫债综合指数与中债-投资优选熊猫债指数。今年以来，熊猫债市场持续火热。Wind数据显示，截至9月16日，年内熊猫债发行规模达到2430.45亿元，持续刷新历史纪录，同比增长率也高达81.44%。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166537","time":1789599410000,"title":"从数量扩张到质量筛选，并购重组市场新动向受关注","text":"近期，包括焦作万方、金橙子、普路通在内的多家上市公司对外发布终止重大资产重组相关公告，引发市场关注。以普路通为代表的部分公司发布终止公告后，股价出现明显回调。从终止重大资产重组的原因看，外部市场环境发生变化、交易双方关键核心条款未达成一致是近期重组终止的两大主因，其中不乏披露筹划重组意向后不久便宣布终止交易的案例。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166536","time":1789599343000,"title":"Salesforce发布长期销售指引，预计2030财年收入将达到630亿美元，彭博汇编的分析师预期均值为614亿美元。\n","text":"Salesforce发布长期销售指引，预计2030财年收入将达到630亿美元，彭博汇编的分析师预期均值为614亿美元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nisapnm4378382","time":1789
