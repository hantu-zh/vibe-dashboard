e": "华尔街见闻", "category": "fast", "stock": "", "url": "https://wallstreetcn.com/live/global", "importance": "important"}, {"id": "em202608053831681647", "time_str": "2026-08-05 07:52:00", "time": 1785887520000, "title": "大模型迈入物理世界！端侧AI元年 手机、汽车抢占智能体入口", "text": "【大模型迈入物理世界！端侧AI元年 手机、汽车抢占智能体入口】从豆包到千问，从手机到汽车，大模型正在走出云端聊天框，迈入物理世界。多名业内人士表示，当前端侧AI正从L2级助手协同向L3级任务代理演进。行业正从传统终端单品的AI化，演进为整个终端生态的AI化，智能体发展的新周期已经到来。不过，续航瓶颈、隐私安全与生态协同等挑战仍未真正跨越，成为制约规模化落地的关键变量。", "source": "东方财富", "category": "fast", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831681647.html", "importance": ""}, {"id": "cls2445828", "time_str": "", "time": 1785887480000, "title": "自动驾驶强制性国家标准正式发布 智能驾驶硬件市场有望爆发", "text": "①《智能网联汽车 自动驾驶系统安全要求》强制性国家标准正式发布，拟于2027年7月1日起正式实施。\n②信达证券傅晓烺表示，L3量产车型陆续上路且表现亮眼，技术端的成熟度和市场侧的接纳度有望实现共振。", "source": "财联社", "category": "fast", "stock": "", "url": "https://www.cls.cn/detail/2445828", "importance": "hot"}, {"id": "cls2445811", "time_str": "", "time": 1785887474000, "title": "脑机接口技术借AI实现脑活动转文字 脑机接口产业化前景广阔", "text": "①美国Meta人工智能团队、法国巴黎文理研究大学和阿道夫·罗斯柴尔德基金会医院的研究人员开发出一种结合人工智能（AI）技术的非侵入式“大脑活动到文本”转换方法。\n②据中国信通院测算，2030年中国脑机接口产业规模预计达100亿元至140亿元。", "source": "财联社", "category": "fast", "stock": "", "url": "https://www.cls.cn/detail/2445811", "importance": ""}, {"id": "cls2445808", "time_str": "", "time": 1785887465000, "title": "高质量数据集重要性不断提升 传统出版业有望迎来价值重估", "text": "①武汉出台《武汉市行业高质量数据集建设行动方案（2026—2028年）》，要求到2028年，全市累计建成行业高质量数据集200个以上，形成一批满足大模型训练需求的标准化语料资源。\n②兴业证券表示，AI正在推动传媒内容产业从消费品转向数据+IP资产双重定价。", "source": "财联社", "category": "fast", "stock": "", "url": "https://www.cls.cn/detail/2445808", "importance": ""}, {"id": "1633251601185", "time_str": "2026-08-05 07:50:13", "time": 1785887413000, "title": "突发！A股敏感时刻，摩根士丹利一锤定音：抄底买入！", "text": "突发！A股敏感时刻，摩根士丹利一锤定音：抄底买入！", "source": "网易财经", "category": "fast", "stock": "", "url": "https://www.163.com/dy/article/L3I7ADE20519B7K0.html", "importance": ""}, {"id": "em202608053831720482", "time_str": "2026-08-05 07:46:21", "time": 1785887181000, "title": "今日有1只新股申购 为北交所的恒兴股份", "text": "【今日有1只新股申购 为北交所的恒兴股份】8月5日，今日有1只新股申购，为北交所的恒兴股份；1只新股上市，为北交所的森合高科。", "source": "东方财富", "category": "ann", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831720482.html", "importance": ""}, {"id": "wscn3145012", "time_str": "", "time": 1785887179000, "title": "中信建投：全球半导体设备进入“量价齐升”通道，国产设备出海进程加速", "text": "中信建投研报指出，全球半导体设备景气度持续上修，海外设备、零部件已出现“量价齐升”情况，海外交期大幅延长，国产设备、零部件经历“十四五”期间的修炼，能力大幅提升，具备充足的出海潜力。另外一方面，除了外部制裁因素以外，全球缺货使得国内下游客户获取海外设备、零部件的难度进一步提升，我们看好国内市场的国产替代速度大幅加速。\n", "source": "华尔街见闻", "category": "fast", "stock": "", "url": "https://wallstreetcn.com/live/global", "importance": "important"}, {"id": "em202608053831712527", "time_str": "2026-08-05 07:45:22", "time": 1785887122000, "title": "微芯科技与美光联合展示高性能PCIe Gen 6存储架构", "text": "【微芯科技与美光联合展示高性能PCIe Gen 6存储架构】当地时间8月4日，微芯科技（MicrochipTechnology）宣布与美光科技合作，在2026年全球闪存峰会上展示了端到端的PCIeGen6存储架构。该方案结合了微芯的SwitchtecPCIeGen6交换芯片与美光的9650NVMe固态硬盘（SSD），旨在为人工智能、高性能计算和云数据中心提供更高的吞吐量、更低的时延以及可扩展的连接能力。", "source": "东方财富", "category": "ann", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831712527.html", "importance": ""}, {"id": "em202608053831563014", "time_str": "2026-08-05 07:45:00", "time": 1785887100000, "title": "多家外资机构发声 看好A股市场后市", "text": "【多家外资机构发声 看好A股市场后市】近期，多家外资机构看多后市，认为市场调整基本结束，8月份即将进入修复期。受访专家认为，外资机构看多的理由主要基于三个方面：首先，政策托底，7月份中共中央政治局会议定调“加大逆周期调节力度”；其次，市场风险已充分释放，科技板块交易拥挤度明显回落，恐慌情绪和抛售压力得到释放；最后，上市公司基本面未证伪，AI产业趋势未逆转。", "source": "东方财富", "category": "fast", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831563014.html", "importance": "important"}, {"id": "em202608053831689546", "time_str": "2026-08-05 07:41:22", "time": 1785886882000, "title": "英伟达发布Alpamayo 2 Super自动驾驶模型 开放商业授权助推Robotaxi规模化部署", "text": "【英伟达发布Alpamayo 2 Super自动驾驶模型 开放商业授权助推Robotaxi规模化部署】当地时间8月4日，英伟达宣布推出面向Robotaxi和自动驾驶汽车的前沿开源模型Alpamayo2Super，现已开放商业使用。该模型基于英伟达Cosmos3SuperReasoner构建，并通过强化学习优化，旨在提升自动驾驶系统对复杂场景的理解、推理和决策能力。", "source": "东方财富", "category": "ann", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831689546.html", "importance": ""}, {"id": "em202608053831563314", "time_str": "2026-08-05 07:40:00", "time": 1785886800000, "title": "长城资产获准增持建设银行", "text": "【长城资产获准增持建设银行】近日，国家金融监督管理总局发布关于中国长城资产管理股份有限公司增持建设银行股票的批复，同意长城资产增持建设银行股票。记者注意到，这是今年以来首次出现全国性AMC（金融资产管理公司）增持上市银行股权获监管部门批准。", "source": "东方财富", "category": "fast", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831563314.html", "importance": ""}, {"id": "16364794694", "time_str": "2026-08-05 07:39:35", "time": 1785886775000, "title": "统一监管标尺！金融机构治理顶层设计落地：告别“治乱”，锚定“长治”", "text": "统一监管标尺！金融机构治理顶层设计落地：告别“治乱”，锚定“长治”", "source": "网易财经", "category": "fast", "stock": "", "url": "https://www.163.com/dy/article/L3I6N1420519JFL1.html", "importance": ""}, {"id": "1631325770463", "time_str": "2026-08-05 07:39:30", "time": 1785886770000, "title": "中欧基金上报首只ETF！非货规模前20公募全员入局ETF赛道", "text": "中欧基金上报首只ETF！非货规模前20公募全员入局ETF赛道", "source": "网易财经", "category": "fast", "stock": "", "url": "https://www.163.com/dy/article/L3I6MVF70519JFL1.html", "importance": ""}, {"id": "em202608053831668232", "time_str": "2026-08-05 07:38:09", "time": 1785886689000, "title": "马斯克：Grok 4.6下周发布 SpaceX全量数据将用于模型训练", "text": "【马斯克：Grok 4.6下周发布 SpaceX全量数据将用于模型训练】当地时间8月4日，SpaceXCEO马斯克在公司首次财报电话会上表示，SpaceX在人工智能领域取得了显著进展，并预计于下周推出Grok4.6模型，随后在几周内推出Grok4.7。就在上个月，SpaceXAI刚发布了主打代码能力、同时能处理财务和法律任务的Grok4.5模型。", "source": "东方财富", "category": "ann", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831668232.html", "importance": ""}, {"id": "wscn3145010", "time_str": "", "time": 1785886685000, "title": "多地用电负荷迭创新高 电力上市公司直面机遇与转型考验", "text": "近日，持续性高温叠加工业经济稳步复苏、新型用电业态扩容，全国电力需求持续攀升，多地电网用电负荷接连刷新历史纪录。8月3日，山东、天津等地电网负荷再度创下新高，电力保供压力持续增大。面对迎峰度夏形势，电力产业链上市公司全面发力保供、稳生产。从密集披露的电力上市公司半年报或半年报业绩预告来看，行业结构性分化格局显现，水电、电力设备、储能赛道迎来业绩红利，传统火电承压转型，新型电力系统建设持续提速。（中证报）\n", "source": "华尔街见闻", "category": "fast", "stock": "", "url": "https://wallstreetcn.com/live/global", "importance": ""}, {"id": "em202608053831662234", "time_str": "2026-08-05 07:36: 6.html", "importance": "important"}, {"id": "1637678756735", "time_str": "2026-08-05 07:24:26", "time": 1785885866000, "title": "“购买的卫生巾疑现虫卵”事件最新进展：已启动处置工作，对涉事企业开展现场核查", "text": "“购买的卫生巾疑现虫卵”事件最新进展：已启动处置工作，对涉事企业开展现场核查", "source": "网易财经", "category": "fast", "stock": "", "url": "https://www.163.com/dy/article/L3I5RRC2053469LG.html", "importance": ""}, {"id": "em202608053831598422", "time_str": "2026-08-05 07:21:12", "time": 1785885672000, "title": "人民日报钟声：中美经贸需要“合作清单” 而非“覆盖清单”", "text": "【人民日报钟声：中美经贸需要“合作清单” 而非“覆盖清单”】近日，美国联邦通信委员会（FCC）将外国生产的电力逆变器和先进机器人设备列入所谓“覆盖清单”，相关新型号产品将无法获得认证授权，不得进入美国市场销售。美方措施打着“非歧视”或“国家安全”旗号，实质上是对中国企业和产品的歧视性对待与打压，是典型的单边霸凌行径，是对市场经济规则和公平竞争原则的公然扭曲。", "source": "东方财富", "category": "fast", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831598422.html", "importance": "hot"}, {"id": "em202608053831620112", "time_str": "2026-08-05 07:21:03", "time": 1785885663000, "title": "SpaceX携手英伟达开发卫星计算载荷 将数据中心级算力送入太空", "text": "【SpaceX携手英伟达开发卫星计算载荷 将数据中心级算力送入太空】北京时间8月5日，交出上市后首份财报之际，SpaceX在社交媒体上宣布，公司正与英伟达合作，共同开发设计Starmind AI1卫星计算载荷，每颗Starmind卫星都将搭载英伟达Rubin GPU和Vera CPU，实现数据中心级太空计算能力。英伟达也在社交媒体上确认了这项合作并表示：“AI基础设施的下一个篇章，正迈向AI计算从未涉足的疆域。”", "source": "东方财富", "category": "ann", "stock": "", "url": "https://finance.eastmoney.com/a/202608053831620112.html", "importance": "important"}];</script>

<script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '东方', sub: '东方财富'},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = item.text || item.title || '(无内容)';
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();
