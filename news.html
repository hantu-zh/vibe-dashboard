2696","time":1786058259000,"title":"美联储穆萨莱姆：央行本应在上次会议上加息","text":"圣路易斯联邦储备银行行长阿尔贝托·穆萨莱姆周四加入了一众央行官员的行列，他们认为美联储本应在上周上调利率目标。 “联邦基金利率是我们实施货币政策的主要工具...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-08-07/doc-inimmtwv0172696.shtml","importance":"important"},{"id":"sinacomos:nimmtwx3281103","time":1786058150000,"title":"大华银行第二季度净利润因财富管理业务强劲增长而上升","text":"大华银行第二季度净利润上升，受财富管理和贸易业务强劲增长的提振。 这家新加坡银行周五表示，在截至6月的三个月里，其净利润较上年同期增长10%，至14...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-08-07/doc-inimmtwx3281103.shtml","importance":""},{"id":"sinacomos:nimmtwt3398918","time":1786058037000,"title":"股海导航_2026年8月7日_沪深股市公告与交易提示","text":"【停牌】 无 【复牌】 300125 聆达股份 【品大事】 科翔股份：陶瓷混压PCB产品尚处于研发状态 科翔股份公告称，公司股票于2026年8月5日...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-08-07/doc-inimmtwt3398918.shtml","importance":""},{"id":"sinacomos:nimmtwt3398846","time":1786058024000,"title":"OpenAI首款面向消费者的设备外形类似甜甜圈 售价或超300美元","text":"  知情人士称，OpenAI备受期待的新设备将采用独特外形，并配备可动部件，这赋予其更鲜明的人格特征，售价可能超过300美元。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-08-07/doc-inimmtwt3398846.shtml","importance":""},{"id":"wscn3146309","time":1786057970000,"title":"迄今最全质量最高的人类基因组序列构建完成","text":"国际科学家团队近日成功构建出真正意义上的人类完整基因组，同时包含来自父母双方的全套染色体序列。这是迄今为止最完整、最高质量的人类基因组序列，填补了单个基因组最后的空白。该成果被称为人类基因组学里程碑，标志着个性化基因组学将迈入新阶段，有望大幅提升遗传病诊断效率，并推动精准医疗成为临床常态。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146310","time":1786057857000,"title":"华尔街见闻早餐 | 2026年8月7日","text":"布油盘中涨超5%；道指止步五连涨，标普500、纳指两连跌，存储芯片股闪迪和西部数据财报后分别跌近7%和逾10%，SpaceX解禁日不跌反涨超6%。\\n伊朗与阿曼协议拟禁止美以等敌对方船只霍尔木兹通行，伊媒称伊方在海峡附近打击敌方目标；美官员称拒绝航线有任何阻碍。\\n报道：若未来几周通胀数据强劲，美联储主席沃什将准备9月加息。\\n报道称特朗普多次致电沃什询问看法，美联储独立性再受关注。\\n特朗普宣布对多晶硅及其衍生产品加征关税并规定最低进口价。特朗普签署行政令限制使用出生公民权、将严厉打击“生育旅游”。\\n韩国杠杆ETF监管风暴：金融委员长、总统府政策室长相继遭刑事举报。\\n宇树科技IPO定价150.8元，DeepSeek、腾讯等获战略配售。\\n报道：字节讨论训超5万亿参数模型，争取领先位置。\\nDeepSeek官宣API涨价且“幅度较大”。\\nAlphabet启动250亿美元发债，获超四倍认购，热度超越亚马逊和SpaceX。\\n报道：OpenAI智能音箱定价逾300美元，iPhone设计之父操刀设计“甜甜圈”外形。\\n提醒：周五将公布中国7月进出口和外汇储备数据。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1636786673078","time":1786057718000,"title":"39万亿美元，风险越来越高了！","text":"39万亿美元，风险越来越高了！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L3N9O13S0519DKT1.html","importance":""},{"id":"xq4817442","time":1786057211000,"title":"【芯片新架构大幅降低空间望远镜计算功耗】据美国密歇根大学官网4日消息，该校研究人员设计出一种基于静态随机存取存储器（SRAM）的定制芯片架构，可将未来空间望远镜...","text":"【芯片新架构大幅降低空间望远镜计算功耗】据美国密歇根大学官网4日消息，该校研究人员设计出一种基于静态随机存取存储器（SRAM）的定制芯片架构，可将未来空间望远镜计算功耗降至原来的约1/59，有望降低航天器发射任务成本。该研究成果将于本月召开的IEEE空间计算会议上发表。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/404047152","importance":""},{"id":"wscn3146306","time":1786057045000,"title":"市场风格剧烈切换，基金换仓迎“大考”","text":"7月以来，A股市场迎来剧烈风格切换，此前持续领涨的AI、半导体等科技成长板块出现大幅调整，而前期表现低迷的传统价值板块普遍迎来反弹。在此背景下，多只重仓AI、半导体方向的基金出现较大幅度的回撤。值得关注的是，这批遭遇重挫的基金中，部分产品在二季度刚刚完成大规模换仓，从消费、资源等传统板块切换至科技赛道。其中，既有基金经理交接导致风格变化的情形，也有基金经理在分化行情下主动选择了“追逐趋势”。（中证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146305","time":1786056966000,"title":"扎堆进入股东榜，公募机构紧盯业绩兑现度","text":"截至8月6日，全市场已有超百家A股上市公司披露2026年半年报。数据显示，泽璟制药、仕佳光子、鼎通科技、科大智能等上市公司的前十大股东中，公募基金产品占据半数及以上席位。有基金人士分析，大幅买入直至成为上市公司前十大股东，往往是基金经理特别看好这一投资机会的表现。是什么因素使得各家公募机构旗下产品不约而同地进场？结合半年报业绩来看，这些公司普遍呈现出净利润高增长或进入盈利拐点的特点。这恰恰与近年来公募行业看重的成长投资风格审美不谋而合。（中证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146304","time":1786056525000,"title":"机构研判中报窗口开启业绩驱动新周期","text":"日前多方调研获悉，多家一线机构已形成明确共识：A股本轮调整本质是交易拥挤度的释放与估值阶段性收缩，AI产业长期成长逻辑并未发生实质性逆转，政策底信号显现之下，市场底仍需筹码、情绪与增量资金多重条件共振确认，而这一过程往往需事后回望方能定论。机构人士认为，随着中报业绩进入集中披露窗口，行情正逐步由预期驱动转向业绩兑现驱动，科技与涨价方向景气占优，但板块内部分化将加剧——具备真实业绩与技术壁垒的龙头有望在估值修复中率先受益，而单纯依赖概念与涨价弹性的标的将面临定价重估。（中证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146303","time":1786056477000,"title":"房贷利率下探至2.8%以下，银行设置客户资质与合作渠道门槛","text":"记者8月6日以购房者身份走访或致电北京、广州、杭州等地多家银行，发现多数银行房贷利率仍不低于3%。部分外资银行能够提供利率低于2.8%的住房贷款，不过这类低息贷款设置了客户资质与合作渠道等门槛。有银行表示，虽然无法下调贷款利率，但可通过合作楼盘给予购房者一定的房价优惠。（中证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146302","time":1786056439000,"title":"中证报头版文章：统筹平衡多重目标，精准施策用好货币政策工具，降准、降息仍在政策工具箱内","text":"日前召开的中共中央政治局会议对货币政策作出新的部署，人民银行2026年下半年工作会议进一步细化落实要求，释放清晰政策信号。专家表示，在推动经济持续向新向优向好发展过程中，货币政策需要统筹平衡多重目标。当前，降准、降息仍在政策工具箱内，操作上将更加注重相机抉择，并把握好实施时点与力度；结构性工具将持续加码，聚焦科技创新、新质生产力、中小微企业等重点领域补短板。与此同时，财政金融协同促内需政策将持续优化，为经济持续回升向好营造适宜货币金融环境。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146301","time":1786056319000,"title":"银行保险资管行业三季度信心调查显示：权益投资信心环比回升，受访机构配置意愿增强","text":"近期，中国银行保险资产管理业协会对198家机构（32家银行理财公司、39家保险资管公司，以及127家保险集团、保险公司）进行调查，形成2026年三季度银行保险资产管理行业投资信心指数。调查结果显示，三季度银行保险资产管理行业权益投资信心指数较二季度有所回升，权益层面风险偏好与配置意愿同步回升，结构性机会共识增强。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146300","time":1786056223000,"title":"电解液添加剂VC价格一年涨了4倍，供不应求状况短期不变","text":"近期，锂电池电解液添加剂碳酸亚乙烯酯（VC）价格持续上涨。据百川盈孚数据，截至8月6日，国内电解液添加剂VC均价为23万元/吨，6月以来涨幅超过60%，同比上涨400%。多位业内人士表示，VC供不应求的情况短期不会改变。目前国内VC行业名义总产能超过19万吨/年，但业内可稳定供货的有效产能仅约11万吨/年。去年行业企业开工率整体偏低，叠加头部企业集中开展设备检修，行业库存快速下行。对于价格走势，业内人士认为，年内VC价格会持续高位。（上证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146299","time":1786056032000,"title":"巴西石油公司PetroBras二季度调整后EBITDA为938.4亿巴西雷亚尔，分析师预期913.7亿雷亚尔。\\n二季度剔除一次性事件的调整后EBITDA为100","text":"巴西石油公司PetroBras二季度调整后EBITDA为938.4亿巴西雷亚尔，分析师预期913.7亿雷亚尔。\\n二季度剔除一次性事件的调整后EBITDA为1006.4亿雷亚尔，剔除一次性事件的净利润557.6亿雷亚尔。\\n二季度净利润524.5亿雷亚尔，分析师预期451.4亿雷亚尔。\\n二季度销售1695.3亿雷亚尔，分析师预期1616.2亿雷亚尔。\\n二季度净债务603.9亿雷亚尔。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146298","time":1786055853000,"title":"企业融资迎来新选项，十余省份落地DR基准利率贷款","text":"近期，以DR（存款类金融机构债券回购利率）为基准利率的贷款“多点开花”，打破了贷款定价单一锚定LPR（贷款市场报价利率）的旧模式。据统计，约15个省份已有这类贷款落地，国有大行、股份行、地方法人银行均已布局，央企、国企、民企、外资企业等多类经营主体已“尝鲜”。DR作为贷款利率新“锚点”投入应用，不仅奏响了利率市场化改革新章，也为企业融资提供了全新的定价选项。业内人士认为，DR基准利率贷款将为企业融资带来多重利好。（上证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146296","time":1786055726000,"title":"A股存量博弈特征凸显，机构：科创制造主线的结构性行情将阶段性延续","text":"对于A股市场走势与后续布局方向，机构普遍看好科技成长超跌修复行情，认为市场结构性机会将持续凸显。招商证券认为，当前适合以“超跌反弹布局为主，再平衡配置为辅”的思路参与行情。总体来看，A股仍处于上行周期，经历7月大幅回调后，市场单边上涨或单边下跌的极端行情难以再现，板块、风格再平衡需求提升，成长赛道的修复行情值得重点布局。银河证券表示，科创制造主线的结构性行情将阶段性延续。从8月初市场模型预测来看，市场行情将重回波动率、动量风格主导，指数表现靠前的标的基本集中在半导体、商业航天等科技成长领域。（上证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146295","time":1786055699000,"title":"澳大利亚LNG工会就壳牌Prelude谈判申请调解","text":"由于壳牌在为其Prelude液化天然气工厂谈判企业协议方面缺乏进展，近海联盟（Offshore Alliance）的律师向公平工作委员会提交了调解申请。\\n该工会组织在Facebook帖子中表示，已提交了第240条申请。\\n帖子称，壳牌要么谈判达成企业协议（EBA），要么”几乎不可避免地走向受保护的产业行动”。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146291","time":1786055410000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 时间待定 中国7月进出口与贸易帐；\\n② 14:00 德国6月工业产出；\\n③ 20:30 美国7月非农就业报告（含就业人口、失业率、平均每小时工资），加拿大7月就业报告；\\n④ 22:00 美国里士满联储主席Barkin（2027年FOMC票委）参加一场炉边闲聊，预计将谈及经济等问题；\\n⑤ 次日03:00 美国6月消费信贷；\\n⑥ 周日00:45 美联储理事、负责金融监管事务的副主席鲍曼在“2026年CEO与高级管理峰会与年会”的间隙参加一场线上炉边闲聊；\\n⑦ 周日 CIES 2026第十六届中国国际储能大会开幕（8月9-11日）；\\n⑧ 周日09:30 中国7月CPI、PPI；\\n⑨ 周日可能发布 中国1-7月社会融资规模增量、新增人民币贷款、M2等货币供应；\\n微信小程序搜索“见闻历”，了解更多。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146294","time":1786055270000,"title":"智利与委内瑞拉正式恢复领事关系","text":"8月6日，委内瑞拉外交部和智利外交部分别发表声明称，双方已交换外交照会，正式恢复两国领事关系，并决定在两国首都互设总领事馆。双方还就下一阶段工作达成一致，将循序渐进推进双边关系全面正常化。委内瑞拉2024年7月28日举行总统选举，马杜罗获得连任。由于智利、阿根廷、秘鲁等7个拉美国家政府不承认委总统选举结果，委外交部同年7月29日宣布从上述国家召回外交人员，同时要求这些国家的外交人员从委内瑞拉撤出。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146293","time":1786055090000,"title":"特朗普承认部分弹药供应“相对紧张”","text":"美国总统特朗普6日在白宫承认，尽管美国目前总体弹药库存充足，但“某些类型弹药”供应“相对紧张”。（新华社）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146292","time":1786055079000,"title":"杠杆ETF风暴一个月，韩国股市距离风险出清还有“最后一公里”","text":"6月19日指数见顶后，KOSPI指数经历了一轮近40%的深度回撤。这场由个股杠杆产品引发的波动风暴，迫使韩国监管层在一个月内先后出台多轮措施。机构分析认为，短期来看，急跌中最危险的杠杆结构或已基本出清，短期降温效果初步达成，外资也开始阶段性回流。不过，散户单日爆仓率仍处于高位、波动率指数居高不下，尾部风险还未彻底出清，市场真正企稳尚需时日。（上证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146290","time":1786054941000,"title":"私募7月调研“钟情”科技：国产算力链成新共识","text":"科技板块的阶段性调整，并未降低机构的调研热情。电子、通信、计算机等科技板块依旧是私募机构重点关注方向。采访发现，私募对调整后的科技板块布局热情仍在，正在产业链内部“摸排”新的投资机会。其中，国产算力链凭借产业趋势、自主可控及长期成长空间等逻辑，有望成为下一阶段私募的重点关注方向。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146289","time":1786054869000,"title":"可转债一级市场正在升温，今年以来累计发行51只同比增长104%","text":"截至8月6日，今年以来累计发行51只可转债，规模合计607亿元，较上年同期分别增长104%和51%。与发行端回暖同时发生的，是存量可转债在加速退出。数据显示，年内已有123只可转债离场，市场存续规模较年初减少560亿元。业内人士认为，再融资政策优化打开了可转债发行通道，科技企业资本开支增加、机构配置需求旺盛，则为新券供需两端提供了支撑。可转债市场由此进入发行提速、结构调整的新阶段。（上证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146288","time":1786054438000,"title":"德国高温致死1.19万人　为2016年来最高纪录","text":"德国罗伯特·科赫研究所6日发布报告说，截至7月26日，德国今年已有约1.19万人死于高温 相关原因，这一数字超过2016年以来任一年份的全年高温 相关死亡人数。保守估计约9600人因6月下旬的极端热浪致死，实际死亡人数可能还会增加。75岁以上人群受高温影响最大。截至7月26日，今年高温 相关死亡案例中，75岁至84岁人群约2910人，85岁及以上人群约6060人。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146287","time":1786054241000,"title":"美国圣路易斯联储主席穆萨勒姆（Musalem）：当前的金融条件非常宽松。\\n","text":"美国圣路易斯联储主席穆萨勒姆（Musalem）：当前的金融条件非常宽松。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146286","time":1786054076000,"title":"促投资稳工业扩外贸，地方经济“下半场”划重点","text":"近期，各地密集部署下半年经济工作，聚焦推进“六张网”规划建设、实现工业经济稳定增长、全力稳住外贸基本盘等领域，相关举措也将陆续落地。梳理发现，下半年重大投资项目呈现传统基建提质升级、新型基建加速布局、产业项目占比提升、民生短板持续补齐的鲜明特征。其中，“六张网”建设成为核心抓手，多地明确将其纳入下半年重点攻坚任务。（上证报）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146285","time":1786054049000,"title":"土耳其、沙特、巴基斯坦将签署防务协议。（路透）\\n","text":"土耳其、沙特、巴基斯坦将签署防务协议。（路透）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146283","time":1786053720000,"title":"特朗普宣布对多晶硅及其衍生产品加征关税","text":"8月6日，美国总统特朗普签署行政令，依据《1962年贸易扩展法》第232条，对进口多晶硅及其衍生产品采取最低进口价格和额外关税措施，以支持美国国内多晶硅、半导体和太阳能供应链。\\n公告规定，最低进口价格分别为：多晶硅每公斤21美元；多晶硅锭和晶圆每公斤100美元；太阳能电池每瓦0.22美元；太阳能组件每瓦0.38美元。同时，美国将对公告附件所列多晶硅锭及相关衍生产品加征15%的从价关税。相关措施将自2026年12月4日美国东部时间凌晨12时01分起生效。\\n公告还授权商务部建立“回流美国”激励计划。企业如承诺在美国建设、翻新或扩建多晶硅、硅锭、晶圆或太阳能电池生产设施，并在2029年1月20日前开工，可申请部分进口设备和相关产品免缴第232条关税。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146282","time":1786053656000,"title":"WTI原油期货高开1.2%，伊朗在霍尔木兹海峡打击多个目标。\\n","text":"WTI原油期货高开1.2%，伊朗在霍尔木兹海峡打击多个目标。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146281","time":1786053227000,"title":"美国投资公司协会（ICI）：8月5日当周，美国货币市场资产达到7.91万亿美元，前值7.85万亿美元。\\n","text":"美国投资公司协会（ICI）：8月5日当周，美国货币市场资产达到7.91万亿美元，前值7.85万亿美元。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"http   {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '东方', sub: '东方财富'},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = item.text || item.title || '(无内容)';
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
