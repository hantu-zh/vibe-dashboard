士透露，Anthropic预计2028年收入将达到1900亿至2000亿美元。","text":"消息人士透露，Anthropic预计2028年收入将达到1900亿至2000亿美元。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/405147345","importance":"hot"},{"id":"sinacomos:niniyyv2394765","time":1786753192000,"title":"金价、银价、油价，都涨了","text":"来源：央视财经 14日美国三大股指集体下跌 美国商务部14日发布的数据显示，7月零售数据在各个层面都令人失望，美国国内消费正显现出疲软迹象。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/wm/2026-08-15/doc-ininiyyv2394765.shtml","importance":""},{"id":"em202608143842065144","time":1786753149000,"title":"二级市场举牌降温 险资换道布局硬科技","text":"【二级市场举牌降温 险资换道布局硬科技】2026年以来，险资在二级市场的举牌态势明显降温。截至8月13日，今年仅有3家险企合计完成6次举牌，而2025年全年达35次。举牌减少并不意味着险资的权益配置收缩，恰恰相反，如今险资正在从“二级市场举牌”转向“一级半/IPO锁价拿份额”，从传统基建、不动产等重资产领域加速向半导体、人工智能、人形机器人等新质生产力赛道迁徙。","source":"东方财富","category":"fast","stock":"","url":"https://finance.eastmoney.com/a/202608143842065144.html","importance":""},{"id":"wscn3149909","time":1786753076000,"title":"二季度险资持股每日盘点","text":"Wind数据统计显示，8月15日，险资现身19只个股前十大流通股东，合计持股118.67亿股，合计持股市值达1261.78亿元。从险资持股市值来看，平安银行、贵州茅台、科达利排名居前，持股市值分别为1145.96亿元、66.20亿元、13.15亿元。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3149908","time":1786753044000,"title":"二季度社保基金持股每日盘点","text":"上市公司半年报持续披露，Wind数据统计显示，8月15日，社保基金现身20只个股前十大流通股东，合计持股3.05亿股，合计持股市值达70.68亿元。大华股份、良信股份、梅花生物持股数量居前，分别为0.60亿股、0.41亿股、0.38亿股。从社保基金持股市值来看，生益科技、大华股份、星网锐捷排名居前，持股市值分别为16.55亿元、9.84亿元、6.28亿元。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3149907","time":1786753005000,"title":"美国密歇根州发生枪击事件，已致包含嫌犯在内6人死亡","text":"当地时间8月14日，央视记者获悉，美国密歇根州米索基县发生一起枪击事件，造成5人死亡、1人受伤。此外，39岁的嫌疑人查德·希克曼也确认死亡。\\n密歇根州警方表示，警员接到一处住宅发生枪击的报告后赶往现场，发现3人死亡、1人受伤，伤者被送往医院。嫌疑人在警方抵达前逃离现场。随后，警方在另一处住宅发现第4名死者，并在一片林区发现嫌疑人及另一人的遗体。目前警方尚未公布死者的具体死因，该事件仍在调查中。（央视新闻）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"em202608153842161394","time":1786752971000,"title":"美国经济数据降温 金价反弹后何去何从","text":"【美国经济数据降温 金价反弹后何去何从】8月以来，经历数月调整的国际金价重新站上高位。COMEX（纽约商品交易所）黄金期货价格8月3日-7日累计上涨7.17%，创今年1月以来最大单周涨幅。此后，金价延续升势，于8月13日一度升至4509.1美元/盎司，创近两个月来新高，但在之后出现获利回吐。市场人士认为，本轮黄金反弹的主要原因是美国就业数据明显走弱、通胀压力进一步缓和，令市场对美联储加息的预期有所降温。","source":"东方财富","category":"fast","stock":"","url":"https://finance.eastmoney.com/a/202608153842161394.html","importance":"important"},{"id":"sinacomos:niniyyv2382012","time":1786752948000,"title":"上半年各地财政运行情况如何？31个省区市“晒账本”","text":"来源：人民日报海外版 原标题：31个省区市“晒账本”—— 上半年地方财政运行平稳（锐财经） 近年来，安徽省安庆市岳西县持续织密农村公路网络，完善山区交通基础设施...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-15/doc-ininiyyv2382012.shtml","importance":""},{"id":"wscn3149906","time":1786752776000,"title":"中国驻登巴萨总领馆提醒领区中国公民注意防范地震与海啸","text":"根据印尼气象、气候和地球物理局（BMKG）报告，2026年8月15日5点58分，印度尼西亚东努沙登加拉省纳格克县东北方向30公里处海域发生7.7级地震，震源深度15km，可能引发海啸。驻登巴萨总领馆提醒领区中国公民，特别是在东努省拉布安巴焦一带的游客，保持高度警惕，密切关注当地地震预警信息以及防灾预警，谨防余震和海啸风险，远离海边。如有需要，请及时报警或联系总领馆求助。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3149905","time":1786752743000,"title":"胡塞武装称袭击沙特油企设施和也门政府军控制地区","text":"也门胡塞武装14日说，该组织当天使用无人机袭击沙特南部一处石油设施，并向也门政府军控制的摩卡港相关目标发射导弹，造成人员伤亡。据胡塞武装控制的萨巴通讯社报道，该组织袭击沙特奈季兰地区的阿美石油公司设施，“成功击中目标”。胡塞武装军事官员称，此次袭击是对沙特战机“侵入也门萨达省上空的回应”。萨达省与沙特接壤，是胡塞武装控制区和主要据点。沙特方面尚未对胡塞武装的说法作出回应。（新华社）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niniyyx8841052","time":1786752574000,"title":"社保基金、QFII调仓动向曝光！QFII大幅加仓的绩优股出炉","text":" 机构持股变动，历来是投资者密切关注的市场风向。随着上市公司半年报集中披露，社保基金、QFII等机构的持仓脉络陆续显现。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/zqgd/2026-08-15/doc-ininiyyx8841052.shtml","importance":"hot"},{"id":"em202608153842341998","time":1786752562000,"title":"特朗普证实部署中东的“林肯”号航母将被替换","text":"【特朗普证实部署中东的“林肯”号航母将被替换】美国总统特朗普14日证实，因在中东地区长期部署而导致舰上生活条件、船员心理健康等遭质疑的“林肯”号航空母舰将被替换。特朗普在马里兰州安德 约150亿美元。尽管遭遇重创，Jane Street 今年以来累计净交易收入仍超 400亿美元，甚至超过其2025年全年的总收益。\\n美国AI概念股7月遭遇大幅回调，此前持续上涨的强劲行情急转直下，旗下投资标的AI对冲基金Situational Awareness同期爆仓，拖累损失进一步扩大。\\n为应对冲击，Jane Street 已与 Pimco 等私人投资者达成协议，将约 110亿美元公开债务转移至私人市场。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3149891","time":1786743216000,"title":"Anthropic二季度营收超115亿美元 较去年同期增长至少14倍","text":"据报道，Anthropic第二季度初步营收超过115亿美元，较上年同期的7.87亿美元增长了至少14倍，也高于今年第一季度的47.3亿美元，公司当季已实现调整后营业利润为正。Anthropic曾一度在AI竞赛中处于追赶位置，但得益于越来越多专业人士使用其软件来简化编程等工作流程，公司业务增长明显提速。今年5月，Anthropic的年化营收已突破470亿美元。作为对比，OpenAI此前披露的年化营收超过400亿美元，但两者的计算口径可能不完全一致。人工智能赛道竞争升温，今年迄今IPO融资已达2564亿美元，创2021年来新高（不含SPAC等金融工具）。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3149890","time":1786742813000,"title":"周五（8月7日）纽约尾盘，美国10年期基准国债收益率上行5.14个基点，报4.690%，北京时间20:30发布美国7月零售销售数据时从日低点4.628%快速拉升","text":"周五（8月7日）纽约尾盘，美国10年期基准国债收益率上行5.14个基点，报4.690%，北京时间20:30发布美国7月零售销售数据时从日低点4.628%快速拉升上行。\\n两年期美债收益率升2.88个基点，报4.169%，本周累跌2.40个基点。\\n20年期美债收益率上行5.22个基点，本周累涨5.10个基点，报5.257%；30年期美债收益率累涨5.96个基点，报5.259%。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4832078","time":1786742691000,"title":"量化巨头简街（Jane Street）据悉在7月份大约亏损了150亿美元。","text":"量化巨头简街（Jane Street）据悉在7月份大约亏损了150亿美元。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/405142560","importance":"hot"},{"id":"wscn3149889","time":1786742616000,"title":"据美国证券交易委员会文件显示： THIRD POINT LLC已出售其持有的全部英伟达股份。同时将其持有的亚马逊公司股份减持9.8%，减持后持股数为180万股。","text":"据美国证券交易委员会文件显示： THIRD POINT LLC已出售其持有的全部英伟达股份。同时将其持有的亚马逊公司股份减持9.8%，减持后持股数为180万股。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niniusu3740746","time":1786742574000,"title":"美国股市：标普500指数从纪录高位回落 美国消费出现降温迹象","text":"标普500指数从纪录高位回落，美国经济的主要引擎显现降温迹象，盖过市场预计美联储9月将按兵不动的乐观情绪。 消费者信心和零   {label: '东方', sub: '东方财富'},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = item.text || item.title || '(无内容)';
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
