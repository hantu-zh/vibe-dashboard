<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻汇总 | 方瑟的openclaw</title>
  <meta http-equiv="refresh" content="600">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a1a; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px 24px; width: 100%; }
    a { color: #00e5ff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .back-link { display: inline-block; margin-bottom: 16px; color: #00e5ff; text-decoration: none; font-size: 0.9em; }
    .back-link:hover { text-decoration: underline; }

    .header { text-align: center; padding: 16px 0; }
    .header h1 { color: #4fc3f7; font-size: 1.6em; margin-bottom: 6px; }
    .header p { color: #888; font-size: 0.85em; }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 10px 16px;
      margin-bottom: 12px;
      background: rgba(79,195,247,0.06);
      border: 1px solid rgba(79,195,247,0.15);
      border-radius: 8px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
    .stats-bar span { color: #4fc3f7; font-weight: 600; }

    /* Category tabs */
    /* ===== Tabs ===== */
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
    .tab {
      padding: 7px 18px;
      border: none;
      border-radius: 20px;
      background: #1a1a3e;
      color: #888;
      cursor: pointer;
      font-size: 0.85em;
      transition: all .2s;
    }
    .tab:hover { background: #2a2a5e; color: #ccc; }
    .tab.active { background: #4fc3f7; color: #0a0a1a; font-weight: bold; }
    .tab .count { margin-left: 4px; opacity: 0.7; font-size: 0.9em; }
    .tab-src { font-size: 0.78em; padding: 5px 12px; }
    .tab-src.active { background: #7c4dff; color: #fff; font-weight: bold; }
    .tabs-row2 { margin-top: -12px; }

    /* Source badges */
    .badge-eastmoney { background: rgba(231,76,60,0.18); color: #e74c3c; }
    .badge-sina { background: rgba(52,152,219,0.18); color: #5dade2; }
    .badge-xueqiu { background: rgba(46,204,113,0.18); color: #58d68d; }
    .badge-163 { background: rgba(155,89,182,0.18); color: #af7ac5; }
    .badge-cls { background: rgba(0,188,212,0.18); color: #00bcd4; }
    .badge-wscn { background: rgba(255,167,38,0.18); color: #ffa726; }

    /* Importance badges */
    .imp-hot { color: #ff5722; font-weight: bold; margin-right: 4px; font-size: 11px; }
    .imp-important { color: #ffd700; font-weight: bold; margin-right: 4px; font-size: 11px; }

    /* News list */
    .news-list { width: 100%; }
    .news-item {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background .15s;
    }
    .news-item:hover { background: rgba(79,195,247,0.04); }
    .news-item:last-child { border-bottom: none; }

    .news-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .news-time { font-size: 11px; color: rgba(255,255,255,0.35); min-width: 65px; }
    .news-cat {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .cat-fast { background: rgba(79,195,247,0.15); color: #4fc3f7; }
    .cat-ann { background: rgba(255,183,77,0.15); color: #ffb74d; }
    .cat-macro { background: rgba(129,199,132,0.15); color: #81c784; }
    .cat-industry { background: rgba(206,147,216,0.15); color: #ce93d8; }
    .news-source { font-size: 10px; color: rgba(255,255,255,0.3); margin-left: auto; }
    .news-title {
      font-size: 13.5px;
      line-height: 1.55;
      color: #c8d6e5;
    }
    .news-item:hover .news-title { color: #e8f4fd; }
    .news-title-link {
      font-size: 13.5px;
      line-height: 1.55;
      color: #c8d6e5;
      text-decoration: none;
    }
    .news-title-link:hover { color: #4fc3f7; text-decoration: underline; }
    .external-icon { font-size: 10px; opacity: 0.5; }
    .news-stock {
      font-size: 11px;
      color: rgba(255,183,77,0.75);
      margin-top: 3px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,0.3);
    }
    .empty-state .emo { font-size: 40px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }

    .meta { text-align: center; color: #666; font-size: 0.8em; margin-bottom: 10px; }

    @media (max-width: 768px) {
      .container { padding: 10px; }
      .news-item { padding: 9px 10px; }
      .news-title { font-size: 12.5px; }
    }
  </style>
</head>
<body>
<div class="container">

<a href="index.html" class="back-link">← 返回首页</a>

<div class="header">
  <h1>📰 市场快讯汇总</h1>
  <p id="last-update">加载中...</p>
</div>

<div class="stats-bar" id="stats-bar">
  <div>总条数: <span id="stat-total">-</span></div>
  <div>东方财富<span id="stat-em">-</span></div>

  <div title="多源同时报道的热点事件">🔥<span id="stat-hot">-</span></div>
  <div title="含央行/降息/涨停等关键词的重要新闻">⭐<span id="stat-imp">-</span></div>
</div>
<div style="font-size:12px;color:#888;margin:-8px 0 12px 0;padding:0 20px;text-align:center;">💡 🔥 = 多源同时报道的热点事件 · ⭐ = 含央行/降息/涨停等关键词的重要新闻</div>

<div class="tabs" id="source-tabs"></div>
<div class="tabs tabs-row2" id="tabs"></div>

<div class="news-list" id="news-list"></div>

</div><!-- end .container -->

<script>
// ============ 数据（从 news_data.json 动态加载）============
(function() {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'news_data.json?t=' + Date.now(), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          window._rawData = data.items || [];
          console.log('[NEWS] Loaded ' + window._rawData.length + ' items from news_data.json');
          renderAll();
        } catch(e) {
          console.error('[NEWS] JSON parse error:', e);
          document.getElementById('news-list').innerHTML =
            '<div class="empty-state"><div class="emo">!</div><p>数据加载失败</p></div>';
        }
      } else {
        console.error('[NEWS] Fetch failed, status:', xhr.status);
      }
    }
  };
  xhr.send();
})();
</script>

<script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '东方', sub: '东方财富'},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = item.text || item.title || '(无内容)';
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>

</body>
</html>
