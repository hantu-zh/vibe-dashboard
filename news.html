nce":""},{"id":"xq4899186","time":1791603299000,"title":"【泰国证交所修订卖空和高频交易规则】泰国证券交易所将从11月16日起实施修订后的规则，包括对卖空和高频交易的调整，以寻求改善市场稳定性、流动性和投资者信心。交易...","text":"【泰国证交所修订卖空和高频交易规则】泰国证券交易所将从11月16日起实施修订后的规则，包括对卖空和高频交易的调整，以寻求改善市场稳定性、流动性和投资者信心。交易所将允许价格在5-50泰铢之间的股票以更小的价格变动单位交易，此举旨在收窄买卖价差并降低交易成本。交易所还将把卖空限制在流动性更高的证券上，包括SET100指数成分股、个股期货标的证券、存托凭证和ETF。根据新规，投资者将被允许以等于或高于最新成交价的价格卖空证券。泰国证券交易所还将对提交大量订单但实际成交相对较少的账户收取额外费用。为降低交易门槛，该交易所将取消针对个别证券的动态价格波动限制；放宽对高频交易者买卖标的的限制；取消最低挂单时间要求，以提高订单管理效率。交易所还将从11月16日起延长与外国证券挂钩的衍生权证和ETF的上午交易时段。交易将于上午8点开始，比目前早两个小时，收盘时间保持不变。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/411774767","importance":""},{"id":"1636330607108","time":1791603161000,"title":"财政部17年、还当过咸阳市副市长，西北最大城商行行长正式上任","text":"财政部17年、还当过咸阳市副市长，西北最大城商行行长正式上任","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L8SHSQP10552FWS9.html","importance":""},{"id":"1639830898766","time":1791602596000,"title":"涉嫌信披违法违规，祥源文旅、交建股份实控人俞发祥同日被证监会立案","text":"涉嫌信披违法违规，祥源文旅、交建股份实控人俞发祥同日被证监会立案","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L8SH51TB0530IU8N.html","importance":"important"},{"id":"sinacomos:niutcvq0634966","time":1791602460000,"title":"碧桂园服务于10月9日斥资156.33万港元回购30万股","text":"碧桂园服务（06098）发布公告，于2026年10月9日斥资156.33万港元回购30万股。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hkstock/ggscyd/2026-10-10/doc-iniutcvq0634966.shtml","importance":"important"},{"id":"sinacomos:niutcvr7407465","time":1791602458000,"title":"中国波顿于10月9日斥资137.64万港元回购45.4万股","text":" 中国波顿（03318）发布公告，该公司于2026年10月9日斥资137.64万港元回购45.4万股股份，每股回购价格为2.95-3.225港元。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hkstock/ggscyd/2026-10-10/doc-iniutcvr7407465.shtml","importance":"important"},{"id":"1634219019038","time":1791601909000,"title":"5年限制！分众传媒收购新潮传媒拿到“通行证”","text":"5年限制！分众传媒收购新潮传媒拿到“通行证”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L8S
