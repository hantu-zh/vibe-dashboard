"text":"【商务部部长王文涛与欧洲汽车工业协会主席康林松举行视频通话】9月21日下午，商务部部长王文涛与欧洲汽车工业协会主席、奔驰集团董事长康林松举行视频通话，就中欧经贸关系及汽车产业合作等问题交换意见。王文涛表示，中国和欧盟是世界两大主要经济体，应坚持合作，保持市场相互开放。中方愿同欧方在贸易投资磋商机制框架下，通过对话妥处分歧，确保中欧经贸关系稳定，为世界经济发展注入确定性。希望欧洲汽车工业协会发挥积极作用，推动欧方同中方相向而行，早日达成符合世贸组织规则和各自国内法律、照顾双方业界利益的解决方案。王文涛指出，中国是全球最大汽车市场，汽车产业是中德、中欧经贸合作的重点领域之一。中国政府坚定不移推进高水平对外开放，欢迎包括奔驰在内的欧洲车企扩大对华投资，同中方伙伴深化创新合作，共同推动全球汽车产业绿色化、智能化、融合化发展。\n\n康林松表示，欧洲汽车工业协会坚定支持自由贸易与市场开放，欢迎中国汽车及零部件企业赴欧投资。协会愿进一步发挥积极作用，发出业界声音，支持欧中双方开展对话磋商，妥善解决经贸分歧。奔驰集团坚信只有深耕中国市场，才能立足全球，愿进一步扩大对华投资，与中方伙伴开展更深层次合作。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/410227464","importance":""},{"id":"sinacomos:nissyqz8905461","time":1790071598000,"title":"清华教育基金会港股IPO投资：爱芯元智解禁时浮亏超五成 整体收益靠智谱拉动——慈善投资规则尺度待厘清","text":"出品：新浪财经上市公司研究院/港市多维镜 作者：喜乐 2026 年，清华大学教育基金会通过三家不同载体参与多笔港股 IPO，分别采用基石认购与锚定配售两种模式。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/observe/2026-09-22/doc-inissyqz8905461.shtml","importance":""},{"id":"sinacomos:nissyqx6858999","time":1790071566000,"title":"高德推出全空间无人体系与开放平台，构建空间智能产业生态","text":" 新浪科技讯 9月22日下午消息，在2026云栖大会上，阿里巴巴旗下高德围绕空间智能在真实场景的应用，集中发布了全空间无人体系与高德千舆等多个空间智能产品及解决方案。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/tech/it/2026-09-22/doc-inissyqx6858999.shtml","importance":""},{"id":"sinacomos:nissyrf2022157","time":1790071557000,"title":"上半年基金员工持仓盘点：睿远成长价值成权益“增持王”，景顺长城绩优成长A减持超78%，9家增持超千万份","text":" 近年来，监管层持续推动公募基金行业强化与基金份额持有人利益绑定，基金公司内部员工的持仓变动一直是市场关注的焦点。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/money/fund/original/2026-09-22/doc-inissyrf2022157.shtml","importance":""},{"id":"1635610079895","time":1790071503000,"title":"8万亿，梁文锋也开始卷“超大”","text":"8万亿，梁文锋也开始卷“超大”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L7ERLSK805399DAP.html","importance":""},{"id":"sinacomos:nissyrf2019916","time":1790071364000,"title":"尾盘地产板块再度拉升，科技股全天高开低走｜华宝基金3A日报（2026.9.22）","text":"尾盘地产板块再度拉升，科技股全天高开低走｜华宝基金3A日报（20
