id":"wscn3164379","time":1789254045000,"title":"美国总统称美方与胡塞武装进行通话，胡塞武装暂未回应","text":"美国总统特朗普12日称，美方与也门胡塞武装进行了通话。特朗普称，胡塞武装致电美方并表示不愿与美方战斗，也不希望美方卷入冲突。也门胡塞武装方面暂未对此作出回应。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164385","time":1789254016000,"title":"以军向手无寸铁的巴勒斯坦人开火","text":"当地时间12日，一段目击者用手机拍摄的视频显示，当天，在约旦河西岸，以军向一群手无寸铁的巴勒斯坦人开火，造成一名男子受伤。\n画面中，几名并未携带武器的巴勒斯坦男子正与以军相对而站。以军士兵开枪示警后向这几名男子开火，其中一名男子被以军击中腿部倒地。其他几名巴勒斯坦人试图将受伤男子抬到他们的车辆附近。在这一过程中，以军仍在对他们开火。以军总共向他们开了超过14枪。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"cls2481566","time":1789254000000,"title":"【早报】我国词元消耗量今年将达到10亿亿；英伟达拟斥资100亿美元参投Anthropic IPO","text":"①中国将于2027年接任金砖主席国②我国词元消耗量今年将达到10亿亿③英伟达拟斥资100亿美元参投Anthropic IPO④8月近2000只私募量化多头平均涨近10%⑤雀巢宣布涨价。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2481566","importance":""},{"id":"wscn3164378","time":1789253661000,"title":"也门胡塞武装与沙特互相袭击","text":"也门胡塞武装12日表示，也门多个省份遭到沙特阿拉伯的空袭。也门胡塞武装发言人叶海亚·萨雷亚表示，在过去48小时内，沙特方面的战机对也门塔伊兹省、马里卜省、荷台达省、焦夫省、萨达省等发动129次空袭。叶海亚·萨雷亚称，这些空袭不会得不到回应和惩罚。\n沙特民防部门12日表示，也门胡塞武装对吉赞地区发动袭击，造成两人受伤，多处建筑物和车辆遭到破坏。另有消息称，也门政府军12日表示，对港口城市穆哈的胡塞武装的车辆、武器及人员发动了打击。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164374","time":1789252517000,"title":"金砖国家领导人第十八次会晤新德里宣言（摘要）：重申坚持多边主义，呼吁《联合国气候变化框架公约》和《巴黎协定》所有缔约方继续履行现有承诺，维持和加大应对气候变化的","text":"金砖国家领导人第十八次会晤新德里宣言（摘要）：重申坚持多边主义，呼吁《联合国气候变化框架公约》和《巴黎协定》所有缔约方继续履行现有承诺，维持和加大应对气候变化的努力。进一步重申为实现《联合国气候变化框架公约》目标，通过加强全面和有效落实《巴黎协定》以应对气候变化，体现公平和共同但有区别的责任以及各自能力原则。\n反对不符合国际法的单边、惩罚性、歧视性和保护主义措施，包括碳边境调节机制，并且对这些措施可能削弱各国、特别是发展中国家为应对气候变化带来的负面影响、提高适应能力和韧性的努力表示关切。\n全力支持中国担任2027年金砖主席国并在中国主办金砖国家领导人第十九次会晤。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164373","time":1789252492000,"title":"金砖国家领导人第十八次会晤新德里宣言（摘要）：肯定金砖国家工业渠道7个专门工作组的工作，肯定智能制造和机器人工作组在智能工厂发展、解决方案共享、标准合作和人才培","text":"金砖国家领导人第十八次会晤新德里宣言（摘要）：肯定金砖国家工业渠道7个专门工作组的工作，肯定智能制造和机器人工作组在智能工厂发展、解决方案共享、标准合作和人才培养等方面所做努力。\n认识到人工智能为促进经济增长和实现可持续发展提供了巨大机遇。指出利用人工智能促进经济增长和社会福祉，对于推动各国特别是全球南方国家实现公正、公平、平等和繁荣的未来至关重要。肯定上海世界人工智能大会暨人工智能全球治理高级别会议，认可其在加强人工智能国际合作、智能向善方面的贡献。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164372","time":1789252459000,"title":"金砖国家领导人第十八次会晤新德里宣言（摘要）：国际经济治理体系改革始终是金砖国家关注的优先领域。\n重申迫切需要对布雷顿森林机构进行改革，使之更加敏捷、有效、可信","text":"金砖国家领导人第十八次会晤新德里宣言（摘要）：国际经济治理体系改革始终是金砖国家关注的优先领域。\n重申迫切需要对布雷顿森林机构进行改革，使之更加敏捷、有效、可信、包容、符合目标、公正、负责、具有代表性，提升其合法性。\n新兴市场和发展中经济体在布雷顿森林体系中的话语权与代表性，必须与其在全球经济中的相对地位相匹配。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164380","time":1789251928000,"title":"美军中央司令部：过去60天已引导100艘船只改变航线","text":"当地时间12日，美军中央司令部表示，自美国恢复对伊朗实施封锁以来的过去60天内，美军已引导100艘商业船只改变航线。在未经美军允许的情况下，没有任何船只通过封锁线，美军人员目前仍高度专注于执行这一任务。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirrhuq4879609","time":1789251656000,"title":"Altman表示OpenAI今年不会IPO 需要推进安全相关工作","text":"OpenAI不会在2026年上市，Sam Altman在接受采访时表示，原因是需要开展与安全相关的工作。 在周六刊发的采访中，Altman表示，由于围绕人工智能的安全担忧...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/7x24/2026-09-13/doc-inirrhuq4879609.shtml","importance":""},{"id":"wscn3164369","time":1789251614000,"title":"SpaceX在纳斯达克100指数的权重预计将提高超过一倍，料带来大量基金买盘","text":"根据纳斯达克Global Index Watch周五晚些时候发布的模拟数据，SpaceX的权重预计将从约1.28%升至约2.82%。最终权重将在本月晚些时候确定。华尔街预计，这一变化将促使追踪该基准的指数基金和交易所交易基金新增数十亿美元的买盘。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164382","time":1789251492000,"title":"伊拉克外长同伊朗外长通话，讨论边境口岸关闭及沙特遭袭事件","text":"9月12日，伊拉克副总理兼外交部长福阿德·侯赛因同伊朗外交部长阿拉格齐通电话。\n据伊拉克外交部消息，双方讨论了伊拉克近期临时关闭部分与伊朗接壤边境口岸的原因及后续安排，并就沙特遭袭及相关调查进展交换意见。双方还讨论了计划在阿曼举行的地区会议。海合会成员国、伊拉克和伊朗将参会，重点讨论霍尔木兹海峡相关问题。侯赛因表示伊拉克支持举行此次会议，并将派代表团参会。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164381","time":1789251450000,"title":"胡塞武装称使用大量弹道导弹和无人机打击沙特军事设施","text":"当地时间13日凌晨，也门胡塞武装军方发言人叶海亚表示，针对沙特方面持续对也门发动军事行动，也门胡塞武装实施军事行动，打击了沙特谢拉拉地区一处军事基地内的武器库以及负责指挥和协调对也门及也门民众军事行动的指挥控制中心。叶海亚说，此次行动使用大量弹道导弹和无人机，目标“遭到精准直接打击”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164368","time":1789251263000,"title":"法国央行就债务问题发表声明，驳斥“虚假信息”","text":"法国央行发表声明，否认其在市场上出售了债务持仓，此前该央行遭到让-吕克·梅朗雄及其极左翼政党的批评。\n该声明是对埃里克·科克雷尔言论的回应，后者称法国央行持有的证券投资组合出现了“令人担忧”的缩减。\n法国央行表示，“自收购以来，这些证券均未在市场上出售”，并愿意向国民议会财政委员会解释其货币政策操作。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirrpan4774070","time":1789251213000,"title":"特斯拉预告将于10月1日举办活动 展示下一代Roadster跑车","text":" 特斯拉公司预告将于10月1日举办活动，展示下一代Roadster车型。这是一款小众产品，该公司首席执行官马斯克最早于2017年11月份发布了这款车。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/7x24/2026-09-13/doc-inirrpan4774070.shtml","importance":"hot"},{"id":"wscn3164367","time":1789251072000,"title":"欧洲央行行长拉加德：价格冲击将持续更长时间，AI领域估值非常高","text":"欧洲央行行长拉加德表示，欧元区通胀将在一段时间内维持高位。“当前的冲击会持续时间更长。”她说，中东冲突“仍在持续。我们预计，能源价格的波动和压力将继续存在，尽管价格上涨也带来了经济增长放缓的风险。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirrhus6058490","time":1789250963000,"title":"胡塞武装称沙特对也门发动129次空袭","text":"也门胡塞武装发言人叶海亚当地时间12日称，过去48小时内，沙特空军出动战机对也门塔伊兹省、马里卜省、荷台达省、焦夫省等多地发动129次空袭。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-13/doc-inirrhus6058490.shtml","importance":"hot"},{"id":"sinacomos:nirranq8180779","time":1789250957000,"title":"伊朗和阿曼将通报霍尔木兹海峡通航磋商结果","text":" 据卡塔尔半岛电视台12日报道，伊朗外交部发言人巴加埃表示，伊朗和阿曼预计将在14日举行的相关地区会议上，向海湾国家通报两国有关霍尔木兹海峡通航问题的磋商结果。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-13/doc-inirranq8180779.shtml","importance":"hot"},{"id":"sinacomos:nirranp1001671","time":1789250947000,"title":"乌官员：乌克兰准备10月举行新一轮乌美俄三方谈判","text":"乌克兰总统办公室主任布达诺夫当地时间12日表示，乌克兰正准备在10月举行新一轮谈判，谈判将采取乌克兰、俄罗斯和美国三方参与的形式。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-13/doc-inirranp1001671.shtml","importance":"hot"},{"id":"sinacomos:nirrans4966414","time":1789250940000,"title":"伊朗南部格什姆岛方向传出爆炸声","text":"据伊朗方面12日消息，伊朗南部格什姆岛方向两度传出爆炸巨响。 消息称，爆炸声来自海面。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-13/doc-inirrans4966414.shtml","importance":"hot"},{"id":"sinacomos:nirrhuq4889330","time":1789250934000,"title":"沙特称也门胡塞武装袭击造成2人受伤","text":" 沙特民防机构12日晚发表声明说，沙特贾赞省图沃勒县当天遭到也门胡塞武装的袭击，造成2人受伤、多栋建筑和一些车辆受损。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-13/doc-inirrhuq4889330.shtml","importance":"hot"},{"id":"sinacomos:nirrpan4777922","time":1789250928000,"title":"胡塞武装称使用大量弹道导弹和无人机打击沙特军事设施","text":"当地时间13日凌晨，也门胡塞武装军方发言人叶海亚表示，针对沙特方面持续对也门发动军事行动，也门胡塞武装实施军事行动，打击了沙特谢拉拉地区一处军事基地内的武器库以及...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-13/doc-inirrpan4777922.shtml","importance":""},{"id":"wscn3164365","time":1789250244000,"title":"特斯拉预告将于10月1日举办活动，展示下一代Roadster跑车","text":"特斯拉公司预告将于10月1日举办活动，展示下一代Roadster车型。这是一款小众产品，该公司首席执行官马斯克最早于2017年11月份发布了这款车。这场定于秋季举行的活动一直备受特斯拉车迷期待，并可能进一步引发有关特斯拉与SpaceX合并的猜测。“准备发射”是在呼应SpaceX的火箭发射，而与此同时特斯拉一直利用现场活动来调动客户和投资者的热情。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164364","time":1789250192000,"title":"OpenAI CEO：今年不会上市，不能冒哪怕10%杀死所有人的风险","text":"OpenAI首席执行官Sam Altman表示，公司专注于解决围绕AI技术的安全担忧，今年不会上市。Altman表示，今年进行首次公开募股“时机不合适”，公司要到明年才会上市。\n“我认为，哪怕冒着10%的在本十年结束前杀死所有人的风险，都是不可接受的，”Altman说，“我认为，我们正在进入一个新时代，就像过去迈入其他时代时一样，我们需要采取不同的行动，确保我们所做的事情能够让这一 谴责实施违背国际法的单边强制措施。重申这些措施尤其是单边经济制裁和次级制裁，对受害国普通民众的发展权、健康权、粮食安全等人权产生深远负面影响，对贫困和弱势群体的影响尤甚，并加深数字鸿沟、加剧环境挑战。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirranq8184677","time":1789237337000,"title":"Anthropic呼吁放慢先进AI模型开发 马斯克等业界大佬表示赞同","text":" Anthropic首席执行官Dario Amodei表示，人工智能行业需要放慢新模型的开发速度，并提到人们越来越担忧人工智能会给人类带来“严重”风险。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-13/doc-inirranq8184677.shtml","importance":"hot"},{"id":"wscn3164383","time":1789237322000,"title":"乌官员：乌克兰准备10月举行新一轮乌美俄三方谈判","text":"乌克兰总统办公室主任布达诺夫当地时间12日表示，乌克兰正准备在10月举行新一轮谈判，谈判将采取乌克兰、俄罗斯和美国三方参与的形式。布达诺夫没有透露未来谈判是否将在中东等地举行等具体信息。\n此前一天，俄罗斯总统新闻秘书佩斯科夫在接受采访时表示，克里姆林宫预计，在近期俄罗斯、美国和乌克兰能够举行三方会晤并继续对话。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164361","time":1789230878000,"title":"OpenAI的CEO Altman：我同意Dario（Anthropic的CEO Amodei）有关需要控制前沿模型发展步伐的观点。\n","text":"OpenAI的CEO Altman：我同意Dario（Anthropic的CEO Amodei）有关需要控制前沿模型发展步伐的观点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirqwes8266343","time":1789230282000,"title":"拉里·埃里森撤销甲骨文股票出售计划","text":"一份声明显示，拉里·埃里森已撤销其10b5-1规则下的甲骨文股票出售计划。 该计划下未售出任何甲骨文股票，且他暂无其他出售甲骨文股票的计划。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/7x24/2026-09-13/doc-inirqwes8266343.shtml","importance":"hot"},{"id":"wscn3164360","time":1789230203000,"title":"埃里森取消出售高达75亿美元甲骨文股票的计划","text":"甲骨文公司董事长埃里森（Larry Ellison）取消了该公司最多5000万股股票的出售计划（10b5-1计划），该持仓价值约75亿美元。该公司表示，在该计划下未出售任何甲骨文股票，且埃里森没有其他出售甲骨文股票的计划。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1633276979945","time":1789228203000,"title":"白鹿带火女鞋之后，李宁的增长变贵了？","text":"白鹿带火女鞋之后，李宁的增长变贵了？","source":"网易财经","category":"fast","stock":"","url":"https://www.1 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
   {label: '东财', sub: '东方财富'},
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();



function renderEmTicker() {
    var list = document.getElementById('em-ticker-list');
    var bar = document.getElementById('em-ticker');
    var dateEl = document.getElementById('em-ticker-date');
    if (!list || !bar) { return; }
    var all = (typeof _rawData !== 'undefined' && Array.isArray(_rawData)) ? _rawData : [];
    var em = all.filter(function (x) { return x.source === '东方财富'; });
    var useEm = em.length > 0;
    var items = useEm ? em : all.slice(0, 30);
    if (items.length === 0) { bar.style.display = 'none'; return; }
    if (dateEl) {
      var now = new Date();
      dateEl.textContent = now.getFullYear() + '/' +
        ('0' + (now.getMonth() + 1)).slice(-2) + '/' +
        ('0' + now.getDate()).slice(-2);
    }
    function fmt(t) {
      if (!t) { return ''; }
      var d = new Date(t);
      var h = ('0' + d.getHours()).slice(-2);
      var m = ('0' + d.getMinutes()).slice(-2);
      return h + ':' + m;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    var html = '';
    items.slice(0, 40).forEach(function (x) {
      var t = fmt(x.time);
      var st = x.stock ? ('<span class="t-stock">[' + esc(x.stock) + ']</span>') : '';
      var ti = esc(x.title || x.text || '');
      var url = x.url ? x.url : 'https://kuaixun.eastmoney.com/';
      html += '<div class="em-ticker-item"><div class="em-item-bar">' +
        '<span class="t-time">' + t + '</span>' + st +
        '<a class="t-title" href="' + esc(url) + '" target="_blank" rel="noopener">' + ti + '</a>' +
        '</div></div>';
    });
    list.innerHTML = html || '<div class="em-ticker-empty">暂无快讯</div>';
  }
  renderEmTicker();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
