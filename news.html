ance":""},{"id":"xq4900634","time":1792030740000,"title":"【杭州明确推行现房销售定金制 定金金额不超过商品住房总价款的5%】杭州市住保房管局、市规划资源局、市建委、浙江金融监管局联合发布《关于贯彻落实〈关于完善商品住房...","text":"【杭州明确推行现房销售定金制 定金金额不超过商品住房总价款的5%】杭州市住保房管局、市规划资源局、市建委、浙江金融监管局联合发布《关于贯彻落实〈关于完善商品住房销售制度的通知〉的实施意见（试行）》，《实施意见》明确推行现房销售定金制。实行现房销售的商品住房项目，在取得建筑工程施工许可证后，房地产开发企业制定定金销售方案并报房产行政主管部门备案后，方可与购房人签订购房定金合同，定金金额不超过商品住房总价款的5%。购房人支付的定金，应全部存入资金监管账户。房屋具备交付条件后，解除定金监管。推行使用商品住房购房定金合同统一示范文本，加强定金合同管理。有关定金合同管理和定金监管细则另行制定。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/412376219","importance":""},{"id":"sinacomos:nivhieu4558837","time":1792030691000,"title":"视频|百亿私募图灵资产及其总经理王晓妍收警示函，头顶“唯一投中GPU四小龙”光环","text":" 近期百亿私募图灵资产及其总经理王晓妍被证监局出具警示函，查出7项违规，包括不配合监管检查、推介材料虚假记载、不公平对待投资者、信息披露不实等。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/money/fund/original/2026-10-15/doc-inivhieu4558837.shtml","importance":""},{"id":"xq4900633","time":1792030682000,"title":"【杭州出台商品住房销售制度改革地方实施意见】杭州市住保房管局、市规划资源局、市建委、浙江金融监管局联合发布《关于贯彻落实〈关于完善商品住房销售制度的通知〉的实施...","text":"【杭州出台商品住房销售制度改革地方实施意见】杭州市住保房管局、市规划资源局、市建委、浙江金融监管局联合发布《关于贯彻落实〈关于完善商品住房销售制度的通知〉的实施意见（试行）》，从加强商品住房预售管理、有序推进商品住房现房销售、推行主办银行制度、加大融资支持力度、优化土地供应管理、支持项目分期开发、实施分阶段竣工备案等方面完善商品住房销售制度。《实施意见》要求加强商品住房预售资金监管。市、区两级房产行政主管部门履行商品住房预售资金监管职责，承担辖区内的商品住房预售资金监管具体工作。2026年8月28日后发布国有建设用地使用权出让公告的商品住房项目，实行预售的，购房人支付的定金、首付款、个人住房贷款、分期或一次性购房款等购房资金，应全部存入房产行政主管部门下属机构开设的资金监管账户。商品住房项目竣工验收、水电气等配套设施具备交付条件后，解除资金监管。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/412375835","importance":""},{"id":"xq4900632","time":1792030402000,"title":"【中金所：提高服务中长期资金入市的适配性】中金所党委书记、董事长何庆文10月15日在“2026上海衍生品市场论坛”上表示，近年来，中金所已经实施了两轮的提升机构...","text":"【中金所：提高服务中长期资金入市的适配性】中金所党委书记、董事长何庆文10月15日在“2026上海衍生品市场论坛”上表示，近年来，中金所已经实施了两轮的提升机构参与质量行动方案，连续四年实施中长期资金风险管理计划，积极推动修订入市政策，培育中长期资金战略客户，加强相关机构培训，促进更多增量资金进入资本市场。今年上半年中长期资金日均持仓增长11.6%。未来，中金所将继续坚持期现一体、期现协同的理念，持续加大中长期资金入市工作力度，让中长期资金能用、想用、善用金融期货，更好适配其投资发展的需求。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/41237
