reetcn.com/live/global","importance":"important"},{"id":"ths679847191","time":1789173480000,"title":"上海航交所：运输需求保持平稳 远洋航线走势分化","text":"本周，中国出口集装箱运输需求保持平稳，远洋航线走势分化，综合指数小幅上涨。据海关总署最新发布的数据显示，以美元计价，我国8月份出口同比增长25％，外贸延续快速增长态势，这对我国集运市场平稳发展起到长期的支撑作用。9月11日，上海航运...","source":"同花顺","category":"fast","stock":"","url":"http://stock.10jqka.com.cn/20260912/c679847191.shtml","importance":""},{"id":"wscn3164214","time":1789173474000,"title":"普京称欧洲军队入乌等于同俄开战","text":"俄罗斯总统普京当地时间9月11日在印度接受采访时表示，俄罗斯没有威胁欧洲国家，也不打算威胁欧洲国家，俄方没有任何理由同欧洲发生冲突。普京强调，有些欧洲国家正在考虑向乌克兰境内部署军队，这意味着同俄罗斯开战。他指出，整体而言，目前欧洲所发生的一切是西方在政治、安全和经济领域所犯系统性错误的后果。（CCTV国际时讯）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164213","time":1789173448000,"title":"政策与市场共振，电力板块投资机遇凸显","text":"9月11日，电力板块盘中逆势拉升，在大盘整体走弱的背景下表现突出。截至收盘，杭州热电、闽东电力、拓日新能、江苏新能涨停，其中闽东电力录得3连板，浙江新能涨逾5%，宁波能源、湖南发展、南网能源等跟涨。券商分析师普遍认为，近期电力板块的整体强势，在于相关政策进入密集落地期，同时电力行业自身基本面也呈现高景气态势。从政策端看，多部重磅文件相继落地，为电力板块的估值重塑提供了制度基础。从基本面看，2026年半年报显示电力子板块业绩分化明显，水电板块成为唯一实现稳健增收增利的赛道，火电板块虽承受成本压力，但电价修复预期正在形成。对于电力板块后市走向，多位券商分析师表示看好。（中国证券报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"ths679847188","time":1789173420000,"title":"近一个月逾千家上市公司获机构调研","text":"近期，机构调研活动保持较高热度。科技成长、高端制造、医疗器械等板块成为机构重点关注方向。数据显示，8月12日至9月11日，共有1055家A股公司接受机构调研。其中，中微公司最受机构青睐，其间参与调研的机构数量为389家；炬光科技、联影医疗等...","source":"同花顺","category":"fast","stock":"688012","url":"http://stock.10jqka.com.cn/20260912/c679847188.shtml","importance":"hot"},{"id":"wscn3164212","time":1789173405000,"title":"厄尔尼诺扰动供给，农产品期货价格升温","text":"受厄尔尼诺影响，全球部分产区极端天气风险上升，部分农产品供给预期因此受到扰动。近期，从种植、种业到化肥、农药，A股农业产业链热度持续攀升，多种农产品期货价格走强。世界气象组织日前预计，本轮厄尔尼诺将在未来数月进一步增强。机构人士认为，天气扰动可能影响部分农产品供给，并向农资需求、替代品消费等环节传导。不过，各产区、各品种所受影响存在差异，行情能否延续，仍需观察减产预期与实际供需的变化。（中国证券报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164211","time":1789173378000,"title":"新一轮以色列与黎巴嫩谈判推迟至10月举行","text":"当地时间9月11日，一名美国高级官员称，原定于下周在罗马举行的新一轮以色列与黎巴嫩谈判已被推迟。作为替代，以色列和黎巴嫩驻美大使将在华盛顿美国国务院举行会晤，讨论近期事态发展以及两国框架协议的持续落实。该美国高级官员表示，下一轮正式谈判将于10月在罗马举行。一名知情人士称，由于犹太节日期间的日程安排、下周将在巴黎举行的加强黎巴嫩军队能力会议，以及联合国大会相关筹备工作，参与谈判的各方无法按原计划于下周在罗马举行会谈。（央视新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164210","time":1789173335000,"title":"加部长：加美尚无谈判安排，任何协议须尊重加主权","text":"据加拿大方面9月11日消息，加拿大政府负责加美贸易的部长多米尼克·勒布朗当天在出席政府内阁会议时表示，加拿大与美国目前没有正式的贸易谈判安排，但他仍与美国贸易代表格里尔、美国商务部长霍华德·卢特尼克保持联系。勒布朗说，加拿大与美国持续升级的贸易争端仍然是政府面临的一个关键问题。加拿大政府必须为潜在的贸易协议做好准备，而任何协议都必须尊重加拿大主权并符合国家利益。（央视新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164209","time":1789173302000,"title":"折叠屏手机密集“上新”，供应链企业迎机遇","text":"近日，海内外手机厂商密集发布折叠屏新品。北京时间9月10日，苹果旗下首款书本式折叠屏手机iPhone Duo亮相。而就在苹果发布新品之前不到72小时，9月7日下午，华为发布了新一代三折叠手机Mate XT 2；9月7日晚间，小米则推出首款中折叠手机小米18 Fold。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164208","time":1789173246000,"title":"南向资金7月以来净买入近千亿港元，科技与红利资产获显著加仓","text":"2026年下半年以来，恒生科技指数领跑全球股市，与此同时，南向资金持续加码港股市场。数据显示，截至9月11日，南向资金7月以来合计净买入近千亿港元，其中，科技龙头与红利资产成为资金追捧的焦点。多家机构认为，从估值水平来看，港股性价比依然突出，在当前较为震荡的市场环境中，科技和红利两类资产具有显著的配置价值。（上海证券报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164207","time":1789173202000,"title":"多只宽基ETF成交放量，市场调整中资金借道积极入市","text":"9月11日，多只宽基ETF成交显著放量。过去一周（9月4日至9月10日），股票型ETF资金净流入超过百亿元，其中，宽基ETF成为“吸金”主力。站在当前时点，多位绩优基金经理表示，看好权益资产长期表现。展望后市，机构普遍持乐观态度。融通基金基金经理李进表示，在近期调整之后，现阶段市场整体估值相对较低，对后市持审慎乐观态度。其中，制造业红利叠加品牌力，成本比海外对手低，加上产品迭代速度、研发周期有极强优势，让一批出海标的公司显现出了足够韧性，海外市场份额不断提升。（上海证券报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164206","time":1789173141000,"title":"DeepSeek灰度测试语音对话","text":"DeepSeek灰度测试语音对话，测试到的用户在App右上角会有一个小喇叭按钮。此外，DeepSeek的设置页面会出现一个“朗读 function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>

</body>
