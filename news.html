为","text":"9月15日，市场监管总局会同文化和旅游部召开在线酒店预订平台服务行业行政指导会，指导业内平台企业严格落实合规主体责任，防范化解行业竞争风险，维护健康有序的旅游市场环境。随后，飞猪发文表态：坚决拥护市场监管总局、文化和旅游部对在线酒店预订平台服务企业的行政指导，严格遵守《中华人民共和国反垄断法》《中华人民共和国反不正当竞争法》等法律规定。我们将与行业各方一道，坚决抵制“排他性独家合作”、“全网最低价”等不正当竞争行为，捍卫商家的经营自主权，尊重商家的自主定价权，促进行业高质量发展。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165537","time":1789474344000,"title":"为帮子女养娃 美国婴儿潮一代牺牲退休储蓄","text":"美国今年养育一个孩子的成本首次超过30万美元，而且还不包括大学学费。面对日益高昂的育儿开支，不少年轻父母开始更多依靠自己的父母，“爸妈银行”因此继续为第三代负担费用。蒙特利尔银行(BMO)的Real Financial Progress Index调查显示，近五分之二有年幼子女的父母预计未来一年会得到或寻求父母或祖父母的经济支持。其中47%表示，他们会从亲戚处直接得到现金，用于支付日常基本开支；四分之一预计亲戚会向孩子的529教育储蓄账户或其他储蓄账户存钱。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165536","time":1789474190000,"title":"美团：坚决落实在线酒店预订平台服务行业合规要求","text":"9月15日，国家市场监督管理总局会同文化和旅游部召开在线酒店预订平台服务行业行政指导会，要求美团、抖音、京东、携程、同程、飞猪等平台企业，严格落实合规主体责任，防范化解行业竞争风险，维护健康有序的旅游市场环境。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165535","time":1789474159000,"title":"白宫国家经济委员会主任：（谈AI监管）特朗普的观点是美国已有现成工具。\nAI公司相互警告不构成反垄断问题。\n（回应有关利率和美联储的问题）特朗普和我尊重沃什明天","text":"白宫国家经济委员会主任：（谈AI监管）特朗普的观点是美国已有现成工具。\nAI公司相互警告不构成反垄断问题。\n（回应有关利率和美联储的问题）特朗普和我尊重沃什明天的任何举动。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1637514247134","time":1789474158000,"title":"鸿蒙智行与问界回应合作模式调整，赛力斯主导的问界新表现将成关注重点","text":"鸿蒙智行与问界回应合作模式调整，赛力斯主导的问界新表现将成关注重点","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6T3TDUV0511U82T.html","importance":""},{"id":"1632784597290","time":1789474153000,"title":"“鸽王”于泽被公诉，人保系5年5名高管已“落马”！","text":"“鸽王”于泽被公诉，人保系5年5名高管已“落马”！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6T338CR0519II4K.html","importance":"hot"},{"id":"wscn3165533","time":1789474110000,"title":"白宫 研究局局长王信：人工智能发展带来的水资源消耗值得高度关注","text":"中国人民银行研究局局长王信指出，近年来，全球算力中心直接耗水规模迅速攀升。具体到我国，目前我国算力中心用水量占全国用水总量的比重还不高，但结构性问题已经逐渐凸显。针对人工智能和算力发展中的水资源问题，可以从算力发展本身以及绿色金融、可持续金融等方面采取相应措施：一是强化水资源计量监测、数据核验和信息披露；二是推广节水技术，完善绿色数据中心资源效率评价机制；三是更好发挥水价的资源配置作用；四是发挥绿色金融作用，支持人工智能与水资源协同发展。（金融时报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165505","time":1789470538000,"title":"克里姆林宫称特朗普提出的俄乌能源休战是个好主意","text":"据国际文传电讯社(IFX)报道，克里姆林宫发言人Dmitry Peskov表示，俄罗斯当局看到了唐纳德·特朗普有关能源休战的帖子，并认为这是一个“好主意”。“我们肯定认为这是一个非常好的主意，总体而言是一项很好的倡议。我们与美国方面保持着联系，并始终支持和平解决方案，”Peskov说。\nPeskov表示，对全球市场而言，问题不在于生产，而在于“确保这些成品油不受阻碍地进入全球市场”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1635019598441","time":1789470485000,"title":"单月再融超40亿断层领跑，三星入股帕西尼：具身感知赛道格局加速收敛","text":"单月再融超40亿断层领跑，三星入股帕西尼：具身感知赛道格局加速收敛","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SVKCKM05318W1H.html","importance":""},{"id":"wscn3165502","time":1789470109000,"title":"凯撒旅业：孙公司遭合同诈骗2695万元 公安机关已立案侦查","text":"凯撒旅业公告称，公司全资孙公司凯撒文产与合同相对方签署演艺服务合同，按约支付2695万元款项后无法与对方取得有效联系，涉嫌合同诈骗，已向公安机关报案并获立案侦查。该事项尚处侦查阶段，或对本期及期后利润造成不利影响，公司已开展内部专项核查并配合调查，全力挽回损失。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165501","time":1789470048000,"title":"张国清出席第五届北斗规模应用国际峰会开幕式并致辞","text":"第五届北斗规模应用国际峰会15日在湖南株洲开幕。中共中央政治局委员、国务院副总理张国清出席开幕式并致辞。\n张国清表示，中国愿同各方一道，积极落实四大全球倡议，始终坚持开放融合、协调合作、兼容互补、成果共享，进一步提高北斗技术创新水平，加强北斗与人工智能、卫星互联网等技术融合，持续推进系统迭代升级，推动北斗产业健康有序发展，加速北斗应用提质扩面，完善卫星导航全球治理，让北斗系统更好服务全球、造福人类。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxaty3751941","time":1789469842000,"title":"“巨懂车”收紧获客线索标准，戳破汽车直播虚假繁荣","text":"9月，汽车主播的抱怨集中涌上社交平台。 有主播表示，过去获得一个线索（用户留下的电话号码等联系方式）平均投流费用约70元，最近一些场次却涨到500元；还有主播称进入9月...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-15/doc-inirxaty3751941.shtml","importance":""},{"id":"wscn3165494","time":1789469802000,"title":"快手电商：未授权任何机构或个人以“快手电商货源市场”名义举办选品会、招商会","text":"快手电商渠道业务中心发布声明称，近期经部分商家反馈及平台核实，市场上存在部分主体冒用“快手电商货源市场”名义，擅自举办所谓“快手电商货源选品会”，并以此向商家进行收费招募，据部分商家反馈收取2万至4万元不等的费用。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165493","time":1789469573000,"title":"本月底起《金融产品网络营销管理办法》正式实施，部分平台已开始排查","text":"本月底起，《金融产品网络营销管理办法》正式实施。目前部分平台已开始排查整治。近期腾讯开展金融广告全域排查，已下架违规金融广告53条、整改合规后重新上架6条；封禁无金融资质账户3个。抖音明确金融营销需具备合法资质并完成平台认证，严禁超范围经营。（每经网）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxhzq8471270","time":1789469447000,"title":"IPO撤单两年后，存储芯企华澜微“嫁给”园林股份？","text":"来源 | 野马财经 华澜微换道进入A股。 作者 | 于婞编辑 | 高岩 在资本市场兜兜转转十年，国产存储控制器芯片“老兵”华澜微这次敲开的不是交易所大门...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxhzq8471270.shtml","importance":"hot"},{"id":"wscn3165491","time":1789469400000,"title":"携程集团：坚决落实在线酒店预订行业合规要求","text":"携程集团发文表示，2026年9月15日，国家市场监督管理总局会同文化和旅游部召开在线酒店预订平台服务行业行政指导会，为企业准确理解监管要求、完善合规机制提供了重要指引。借此机会，公司作出以下表态：\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165488","time":1789469146000,"title":"华为与赛力斯合作模式调整后资源聚焦其余四大品牌","text":"今日，鸿蒙智行发布官方公告，华为与赛力斯合作模式调整，此次调整是在鸿蒙智行合作框架下探索新合作模式。对此，有知情人士透露，本次调整是源于华为长期坚持不造车，核心定位是赋能各合作伙伴。调整之后，问界的产品定义、产品设计、品牌营销、渠道零售、服务体系将由赛力斯主导，华为终端参与赋能。鸿蒙智行聚焦资源到其他四界，将加速其他四界的品牌成功，对鸿蒙智行五界均是利好。（蓝鲸新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1634759425729","time":1789468961000,"title":"澜起科技，全球第一！","text":"澜起科技，全球第一！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SUURRF0539IMJ0.html","importance":""},{"id":"wscn3165487","time":1789468857000,
