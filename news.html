,"url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4890435","time":1789419672000,"title":"韩国8月进口物价指数同比增长15.6%，前值18.70%；出口物价指数同比增长42.4%，前值49.10%。","text":"韩国8月进口物价指数同比增长15.6%，前值18.70%；出口物价指数同比增长42.4%，前值49.10%。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409254632","importance":""},{"id":"sinacomos:nirvuyk7078071","time":1789419442000,"title":"伊朗南部两艘渔船遭无人机袭击 多名渔民失踪","text":"伊朗媒体称， 两艘渔船周一晚间在伊朗南部霍尔木兹甘省附近遭敌方无人机袭击，事发地点靠近霍尔木兹海峡。 船上多名渔民失踪，搜救行动已经展开。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirvuyk7078071.shtml","importance":""},{"id":"sinacomos:nirvuyh9031854","time":1789419389000,"title":"原油：布伦特期货上涨 沙特输油管道停运带来供应风险","text":" 油价上涨，沙特关闭一条重要原油管道引发市场供应趋紧担忧，而另一方面，有迹象显示，美国可能仍在寻求通过外交途径解决伊朗问题。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirvuyh9031854.shtml","importance":""},{"id":"xq4890430","time":1789419134000,"title":"据报道，特朗普周一致电黄仁勋，想与黄仁勋讨论人工智能。","text":"据报道，特朗普周一致电黄仁勋，想与黄仁勋讨论人工智能。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409254578","importance":"hot"},{"id":"wscn3165056","time":1789419079000,"title":"报道：特朗普想与黄仁勋讨论AI","text":"在洛杉矶“All-In Summit”峰会的舞台上，英伟达CEO黄仁勋现场接听了美国总统特朗普的电话。通话期间，特朗普将人工智能（AI）带来的危险称为“骗局”。\n特朗普批评了试图放缓AI发展步伐的呼声，称这“恰恰让许多不想看到AI发展的人得逞”，并认为这种呼声可能是由政客或中国推动的。\n黄仁勋赞同特朗普的观点，但也赞扬了一位因担忧AI风险而辞职的Anthropic PBC研究员，并表示组织内部应严肃对待吹哨人的声音。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirvuyk7075293","time":1789419063000,"title":"纽约汇市：美元指数涨幅收窄 日元走弱","text":"美元周一上涨，兑G10货币普遍走强，此前一度创下6月17日以来最大涨幅。 美元即期指数上涨0.3%，至1193.91。 早些时候，美元走高，并有望创下6月17日美联储新主席沃什会议首...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirvuyk7075293.shtml","importance":"important"},{"id":"wscn3165055","time":1789419058000,"title":"特朗普称愿与伊朗谈判，提出美方要收“护航补偿”","text":"美国总统特朗普14日在社交媒体发布多条帖文为其对伊朗政策辩护。特朗普称对与伊朗谈判持“开放”态度，并称美方在霍尔木兹海峡帮助石油运输，各国应对美进行“护航补偿”。特朗普称，伊朗“迫切”希望达成协议，“我们对这一设想持开放态度”。此前，特朗普称，美伊战事将在11月美国国会中期选举完成后“立即结束”，同伊朗恢复谈判“并非我们目前考虑的事情”。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165054","time":1789418949000,"title":"Shield AI洽谈按至少200亿美元估值融资。（The Information）\n","text":"Shield AI洽谈按至少200亿美元估值融资。（The Information）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirvuyq4193134","time":1789418920000,"title":"9月15日美股成交额前20：英伟达跌超3% 多家美国顶尖AI企业CEO呼吁放缓技术发展","text":"周一美股成交额第2名英伟达收跌3.36%，成交276.41亿美元。 英伟达、Palantir、Booz Allen Hamilton 已开始限制内部使用 Anthropic 的 AI 模型。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirvuyq4193134.shtml","importance":""},{"id":"wscn3165052","time":1789418710000,"title":"明晟公司MSCI新兴市场股票指数跌1.4%，发展中国家外汇指数跌0.2%。\n","text":"明晟公司MSCI新兴市场股票指数跌1.4%，发展中国家外汇指数跌0.2%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165051","time":1789418286000,"title":"加拿大总理卡尼敦促欧盟敲定贸易协定。\n","text":"加拿大总理卡尼敦促欧盟敲定贸易协定。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165050","time":1789418068000,"title":"也门胡塞武装称拦截两批沙特战机编队","text":"当地时间14日，也门胡塞武装发言人叶海亚·萨雷亚称，当天，胡塞武装防空部队在也门萨达省上空拦截两批沙特战机编队。叶海亚称，两批战机分别为“台风”战机和F-15战机，从沙特海米斯穆谢特和塔伊夫的空军基地起飞。叶海亚称，胡塞武装使用数枚自制防空导弹对上述战机实施拦截，并“迫使其撤退返航”。沙特方面对此暂无回应。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165049","time":1789418049000,"title":"周一（9月14日），美股存储芯片与硬件供应链指数跌6.21%，报190.76点。\n成分股泰瑞达收跌13.30%，拉姆研究、SK海力士ADR至少跌7.6%，Ram","text":"周一（9月14日），美股存储芯片与硬件供应链指数跌6.21%，报190.76点。\n成分股泰瑞达收跌13.30%，拉姆研究、SK海力士ADR至少跌7.6%，Rambus、应用材料、美光科技至少跌5.25%，闪迪跌4.98
