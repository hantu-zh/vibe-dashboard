function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var mo = (d.getMonth() + 1).toString().padStart(2, '0');
  var da = d.getDate().toString().padStart(2, '0');
  var h = d.getHours().toString().padStart(2, '0');
  var m = d.getMinutes().toString().padStart(2, '0');
  return mo + '-' + da + ' ' + h + ':' + m;
}

function catLabel(cat) {
  return {fast: '快讯', ann: '公告', macro: '宏观', industry: '行业'}[cat] || '快讯';
}

function catClass(cat) {
  return {fast: 'cat-fast', ann: 'cat-ann', macro: 'cat-macro', industry: 'cat-industry'}[cat] || 'cat-fast';
}

function srcBadge(src) {
  return {
    '东方财富': 'badge-eastmoney',
    '新浪财经': 'badge-sina',
    '雪球': 'badge-xueqiu',
    '网易财经': 'badge-163',
    '财联社': 'badge-cls',
    '华尔街见闻': 'badge-wscn'
  }[src] || '';
}

function sourceLabel(src) {
  return src || '未知';
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  var counts = {};
  _rawData.forEach(function(x) { counts[x.source] = (counts[x.source] || 0) + 1; });
  var sources = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; });
  var h = '<button class="tab tab-src active" data-source="all">全部</button>';
  sources.forEach(function(s) {
    var badge = srcBadge(s);
    h += '<button class="tab tab-src ' + badge + '" data-source="' + s + '">' + s + ' <span class="count">' + counts[s] + '</span></button>';
  });
  el.innerHTML = h;
  el.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      el.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderList();
    });
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  var cats = ['fast', 'ann', 'macro', 'industry'];
  var h = '';
  cats.forEach(function(c) {
    var count = _rawData.filter(function(x) { return x.category === c; }).length;
    h += '<button class="tab" data-cat="' + c + '">' + catLabel(c) + ' <span class="count">' + count + '</span></button>';
  });
  el.innerHTML = h;
  el.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      el.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderList();
    });
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var srcBtn = document.querySelector('#source-tabs .tab.active');
  var catBtn = document.querySelector('#tabs .tab.active');
  var srcFilter = srcBtn ? srcBtn.dataset.source : 'all';
  var catFilter = catBtn ? catBtn.dataset.cat : null;

  var filtered = _rawData.filter(function(x) {
    var srcOk = srcFilter === 'all' || x.source === srcFilter;
    var catOk = !catFilter || x.category === catFilter;
    return srcOk && catOk;
  });

  if (!filtered.length) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  filtered.forEach(function(item) {
    var ts = formatTs(item.time);
    var title = item.title || '';
    var source = item.source || '';
    var cat = item.category || 'fast';
    var stock = item.stock || '';
    var itemUrl = item.url || '';
    var imp = item.importance || '';
    var srcClass = srcBadge(source);

    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

// 始终从 news_data.json 加载（远程 / 本地服务器通用）
console.log('[NEWS] fetch news_data.json ...');
fetch('news_data.json')
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(data){
    _rawData = data.items || [];
    renderAll();
    console.log('[NEWS] Loaded ' + _rawData.length + ' items from news_data.json');
  })
  .catch(function(err){
    console.error('[NEWS] Failed to load news_data.json:', err);
    document.getElementById('news-list').innerHTML = '<div class="empty-state"><p>新闻加载失败（' + err.message + '）。<br>若是本地 file:// 打开，请用本地服务器或访问线上地址。</p></div>';
  });

// 自动刷新（每 10 分钟）
setInterval(function(){
  console.log('[NEWS] Auto-refreshing...');
  fetch('news_data.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(data){ _rawData = data.items || []; renderAll(); })
    .catch(function(e){ console.warn('[NEWS] refresh failed', e); });
}, 600000);
</script>
