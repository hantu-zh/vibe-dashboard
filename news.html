"id":"wscn3164185","time":1789165686000,"title":"OpenAI证实其正在测试的AI智能体在今年5月对RubyGems发起了网络攻击","text":"OpenAI证实，其正在测试的AI智能体（Agent）在今年5月对知名编程服务平台RubyGems发起了网络攻击。\n据悉，这批AI智能体在执行训练任务时，为绕过受限的网络环境，将RubyGems作为临时浏览器以获取公开信息。它们高频创建账号并上传了数百个包含网页抓取内容的垃圾文件，甚至尝试利用一个未知的“零日漏洞”进行攻击。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164182","time":1789165440000,"title":"特朗普连续3天许诺5000美元分红","text":"美国总统特朗普当地时间9月11日在社交媒体平台发帖，连续第3天承诺：如果共和党在11月的中期选举中保住国会控制权，将向每位美国成年人发放5000美元。特朗普在帖文中写道：“由于我国正吸纳数万亿美元的经济发展、投资和纯粹的成功，我们将向美国所有成年人发放5000美元‘特朗普红利’。对此，‘笨蛋民主党人’大加批评，他们巴不得这事儿黄了——但它一定会实现。投票给共和党——让美国再次伟大！”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164181","time":1789165327000,"title":"印尼爪哇岛附近海域发生6.5级地震，震源深度370千米","text":"中国地震台网正式测定：9月12日05时23分在印尼爪哇岛附近海域（南纬5.20度，东经106.85度）发生6.5级地震，震源深度370千米。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164180","time":1789164671000,"title":"研究报告预计：中国入境游未来10年或迎3万亿元市场增量","text":"9月10日，中国商务部研究院国际服务贸易研究所在服贸会上发布《入境游促进消费的内在机理及增长潜力研究》，该报告在携程集团支持下完成，报告尤其关注中国入境游发展现状与特点。报告称，中国入境游已形成较好基础，有望迈入高质量发展新阶段，预计未来10年中国入境旅游收入占GDP比重有望提升至国际平均水平，这意味着约1万亿至3万亿元人民币的潜在市场增量。（环球时报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164179","time":1789164611000,"title":"美股七巨头收盘播报｜周五（9月11日），美国科技股七巨头（Magnificent 7）指数涨1.03%，报228.01点，本周累计下跌0.26%。\n“超大”市值","text":"美股七巨头收盘播报｜周五（9月11日），美国科技股七巨头（Magnificent 7）指数涨1.03%，报228.01点，本周累计下跌0.26%。\n“超大”市值科技股指数涨1.07%，报454.47点，本周累涨0.95%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164178","time":1789164471000,"title":"派拉蒙天舞将于10月下旬举行诉讼和解谈判","text":"根据周五下午发布的一份简短法院命令，派拉蒙天空之舞公司（Paramount Skydance Corp.）与一组对其收购华纳兄弟探索公司（WBD）1100亿美元交易提出挑战的州总检察长，被命令在10月下旬确定会面日期，就州诉讼的可能和解方案进行谈判。美国编剧工会西部（WGA West）也将参与谈判，会议由美国旧金山地方法官托马斯·希克森（Thomas Hixson）主持。\n加州总检察长罗布·邦塔（Rob Bonta）的发言人表示，法院命令的和解会议仅意味着法官要求双方会面，并不表明和解正在进行中。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164177","time":1789164279000,"title":"Stellantis与Roshel签署备忘录，拟出售闲置工厂","text":"Stellantis NV（欧洲车企斯泰兰蒂斯集团）已与加拿大装甲车制造商Roshel Inc.签署谅解备忘录（MoU），概述了出售多伦多附近一家闲置汽车工厂的相关步骤。\nRoshel正争取一份加拿大军方合同以建造轻型多用途车辆，并已向政府表示，若获得该合同，可迅速重启该设施。\n该备忘录被描述为一个“非常复杂”流程的第一步，Roshel首席执行官称公司已制定明确计划，文件概述了整个流程。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirpcvn8694189","time":1789164056000,"title":"桑坦德银行：日本GPIF有减持美国国债的空间 规模或多达620亿美元","text":" 桑坦德银行分析师表示，日本政府养老投资基金（GPIF）无需正式调整资产配置政策，就可以出售多达620亿美元的美国国债。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-12/doc-inirpcvn8694189.shtml","importance":"important"},{"id":"wscn3164176","time":1789163525000,"title":"伊拉克总理办公室：调查证实，针对沙特阿拉伯的无人机袭击来自伊拉克境内，一名伊拉克军事指挥官因此被免职。\n","text":"伊拉克总理办公室：调查证实，针对沙特阿拉伯的无人机袭击来自伊拉克境内，一名伊拉克军事指挥官因此被免职。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164175","time":1789163510000,"title":"Kalshi拟进军美股与商品市场","text":"Kalshi Inc.正在申请监管批准，计划在美国推出首批个股永续期货，拟上市挂钩特斯拉、苹果、英伟达等股票的合约。\n公司将请求商品期货交易委员会（CFTC）和证券交易委员会（SEC）联合监管这类永不到期的期货，将其作为证券期货产品，杠杆水平与其他受监管合约保持一致。\nKalshi还计划将商品合约扩展至农产品领域，并拟逐步增加ETF等产品，推出新产品前将重点与社区及相关利益方沟通。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4886861","time":1789163429000,"title":"巴西央行将于9月15日进行最高10亿美元的即期美元拍卖。","text":"巴西央行将于9月15日进行最高10亿美元的即期美元拍卖。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409027596","importance":"important"},{"id":"ths679844378","time":1789163340000,"title":"沙特称该国输油管道遭袭致人员受伤和设施受损","text":"沙特外交部当地时间11日发表声明，强烈谴责来自伊拉克的多架无人机袭击沙特利雅得和麦地那地区的东西输油管道 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
