":"美国总统特朗普在返回美国前对记者发表讲话：在爱尔兰期间做了很多生意。\n我在美国的支持率很高。\n其他总统允许出现巨额赤字，我绝不会允许。\n（谈及美国民主党众议员亚历山德里娅·奥卡西奥-科尔特斯与纽约市市长马姆达尼在9·11纪念现场被拍到大笑一事）太糟糕了。\n5000美元支票肯定会发放 因为我们获得数万亿美元的收入，正获得大量收入 包括关税。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164446","time":1789330661000,"title":"微软CEO纳德拉：支持AI审慎发展与嵌入式评估机制","text":"微软CEO纳德拉在社交媒体发文表示，任何对超级智能的探索都必须基于一项核心原则，如果开发的人工智能不能造福人类且不受人类控制，就不值得去研发。微软还需要加快并普及人工智能带来的益处，使其广泛惠及各国、各社群和企业。这需要一个前沿生态，让闭源和开源模型都能蓬勃发展。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164445","time":1789330581000,"title":"阿曼宣布推迟原定14日举行的地区会议","text":"阿曼外交大臣巴德尔13日在社交媒体发文称，为寻求共识，原定14日在阿曼南部城市塞拉莱举行的地区会议已推迟。巴德尔说，阿曼将继续致力促进对话，为地区稳定与持久合作提供支持。\n据卡塔尔半岛电视台12日报道，伊朗外交部发言人巴加埃表示，伊朗和阿曼预计将在14日举行的相关地区会议上，向海湾国家通报两国有关霍尔木兹海峡通航问题的磋商结果。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164444","time":1789330443000,"title":"报道：Anthropic、OpenAI和谷歌讨论合作成立AI行业标准机构","text":"据知情人士透露，Anthropic、OpenAI和谷歌已经在讨论合作成立一个人工智能（AI）行业标准机构。\n在Anthropic首席执行官Dario Amodei上周六呼吁人工智能公司在技术测试和审核方面进行协调之前，相关磋商就已经开始。\nOpenAI首席执行官Sam Altman在一次员工大会上表示，他支持成立一个面向人工智能行业的测试和审核机构。但他也认为，在没有美国政府支持的情况下，主要人工智能实验室必须自行成立一个标准机构。\nAnthropic、OpenAI和谷歌围绕这一由行业主导的标准机构举行的工作组会议仍在继续。（The Information）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirtmtk9956295","time":1789328692000,"title":"Anthropic、OpenAI和谷歌讨论合作成立AI行业标准机构","text":"Anthropic、OpenAI和谷歌已经在讨论合作成立一个人工智能行业标准机构。 在Anthropic首席执行官Dario Amodei周六呼吁人工智能公司在技术测试和审核方面进行协调之前...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirtmtk9956295.shtml","importance":"hot"},{"id":"sinacomos:nirsuvt0254428","time":1789323067000,"title":"“未给英伟达供货！”“5天3板”PCB牛股紧急澄清，还有一只4倍牛股也公告否认","text":"记者|黄胜张益铭 编辑|程鹏黄胜张益铭杜恒峰校对|张锦河 9月13日晚，金安国纪（ }

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();



function renderEmTicker() {
    var list = document.getElementById('em-ticker-list');
    var bar = document.getElementById('em-ticker');
    var dateEl = document.getElementById('em-ticker-date');
    if (!list || !bar) { return; }
    var all = (typeof _rawData !== 'undefined' && Array.isArray(_rawData)) ? _rawData : [];
    var em = all.filter(function (x) { return x.source === '东方财富'; });
    var useEm = em.length > 0;
    var items = useEm ? em : all.slice(0, 30);
    if (items.length === 0) { bar.style.display = 'none'; return; }
    if (dateEl) {
      var now = new Date();
      dateEl.textContent = now.getFullYear() + '/' +
        ('0' + (now.getMonth() + 1)).slice(-2) + '/' +
        ('0' + now.getDate()).slice(-2);
    }
    function fmt(t) {
      if (!t) { return ''; }
      var d = new Date(t);
      var h = ('0' + d.getHours()).slice(-2);
      var m = ('0' + d.getMinutes()).slice(-2);
      return h + ':' + m;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    var html = '';
    items.slice(0, 40).forEach(function (x) {
      var t = fmt(x.time);
      var st = x.stock ? ('<span class="t-stock">[' + esc(x.stock) + ']</span>') : '';
      var ti = esc(x.title || x.text || '');
      var url = x.url ? x.url : 'https://kuaixun.eastmoney.com/';
      html += '<div class="em-ticker-item"><div class="em-item-bar">' +
        '<span class="t-time">' + t + '</span>' + st +
        '<a class="t-title" href="' + esc(url) + '" target="_blank" rel="noopener">' + ti + '</a>' +
        '</div></div>';
    });
    list.innerHTML = html || '<div class="em-ticker-empty">暂无快讯</div>';
  }
  renderEmTicker();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
