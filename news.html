酸锂期货主力合约价格最高一度在21万元/吨左右，短短4个月跌去超四成，基本抹平年内涨幅。本轮碳酸锂价格下跌受到头部电池厂下修排产传闻、库存统计口径切换等市场消息影响，或是对前期过度乐观预期的调整。也有观点认为，美联储加息预期、市场对远期需求的预期偏悲观也是影响因素。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3166554","time":1789602307000,"title":"上游原料价格持续上涨 染料企业跟进涨价","text":"近期，染料行业涨价受到关注。9月初，浙江龙盛、闰土股份等染料龙头集中提价。申万宏源报告指出，传统纺服旺季备库周期将至，在上游中间体高景气支撑下，染料价格有望持续上扬。此轮染料涨价并非简单的季节性波动，而是上游中间体H酸供给端长期约束的集中爆发。H酸是酸性染料、直接染料及活性染料的生产中间体。数据显示，2026年初，H酸价格约4万元/吨，到9月初，部分厂家报价触及15万元/吨，价格刷新历史高位。染料的另一大原材料还原物的供给形势同样严峻。据生意社数据，还原物市场均价由2025年末的2.5万元/吨涨至目前的10万元/吨至12万元/吨，年内涨幅接近380%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166552","time":1789602153000,"title":"美股期货反弹，标普500指数期货上涨0.3%，纳斯达克100指数期货上涨0.5%。\n","text":"美股期货反弹，标普500指数期货上涨0.3%，纳斯达克100指数期货上涨0.5%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166553","time":1789601503000,"title":"乌克兰首都基辅遭导弹袭击。\n","text":"乌克兰首都基辅遭导弹袭击。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166551","time":1789601405000,"title":"华尔街见闻早餐 | 2026年9月17日","text":"美国股债齐跌，AI板块相对抗跌，美元拉升，黄金日内跳水。\n美联储三年来首次加息，点阵图及沃什的发言释放进一步紧缩信号。\n报道称沙特寻求几天内恢复输油管道一半运力。\n美国8月零售销售环比增长1.2%，创近五个月最大涨幅。\n外国持有的美国国债7月降至去年10月以来最低水平，法国和加拿大减持额居首。\n“脱美入欧”？欧加关系升温，冯德莱恩罕见邀请加拿大成为欧盟首个”准成员”。特朗普称如果加拿大成为欧盟准成员国，将对欧洲征收关税。\n香港特区政府发布首份五年规划（2026-2030年），人工智能被列为战略产业，并强化全球最大离岸人民币枢纽功能。\n华为发布《智能世界2035》报告，预测到2035年全球年度Token消耗量将增长10万倍，其中智能体流量占比超过90%，并首次提出通往智能世界的十大关键命题。\nSK海力士“泼冷水”，称赴美与英特尔合作“尚无定论”。\n报道：苹果拟重返企业服务器市场，正研发自研芯片服务器并拟引入英伟达技术。\n提醒：英国央行周四将公布利率决议，料按兵不动。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1637242992450","time":1789601404000,"title":"信邦智能28.56亿元并购英迪芯微二更草案曝光：大股东隐身、LP质疑、员工出走，谁在操盘这场资本局？","text":"信邦智能28.56亿元并购英迪芯微二更草案曝光：大股东隐身、LP质疑、员工出走，谁在操盘这场资本局？","source
