,"text":"【国家统计局：8月份经济运行呈现“三稳两快”的特点】国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖在国新办新闻发布会上表示，从8月份的主要指标来看，主要呈现“三稳两快”的特点。“三稳”里面，首先是生产稳，8月当月，工业增加值和工业生产指数保持了平稳增长。其次是就业稳，主体就业人群（30岁到59岁）就业情况和上月、去年同期持平。再者是物价稳，8月居民消费价格同比上涨0.8%，工业生产者出厂价格上涨3.8%，从国际范围看，物价保持平稳。“两快”是指新兴产业增长快和进出口增长快。一方面8月份高技术制造业和数字产品制造业增加值同比分别增长16.7%和15.7%。据测算，新动能对规模以上工业当月的贡献超过六成，并还在持续提升。信息传输、软件和信息技术服务业的生产指数增长9.6%，对服务业生产指数的贡献也超过20%。另一方面，8月份，货物进出口总额同比增长19.8%。从出口看，新能源汽车、锂电池等绿色产品的出口增长比较快，有力地促进了全球能源绿色转型发展。从进口看，我国从东盟、非洲、拉丁美洲等发展中国家的进口大幅增长，为发展中国家的产业发展提供了新机遇。付凌晖表示，综合来看，尽管不稳定不确定因素比较多，但我国经济克服困难，保持平稳运行，新动能在积累壮大，显示出强大的韧性和活力，成为全球发展重要的增长极和稳定锚。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409295417","importance":"hot"},{"id":"wscn3165206","time":1789440796000,"title":"Kpler周二公布的初步数据显示，周一经霍尔木兹海峡通行的散货船总数为4艘，较前一日的10艘下滑。\n","text":"Kpler周二公布的初步数据显示，周一经霍尔木兹海峡通行的散货船总数为4艘，较前一日的10艘下滑。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165205","time":1789440758000,"title":"国家统计局：三方面因素推动今年进口较快增长","text":"国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖在国新办新闻发布会上表示，三方面因素推动进口较快增长。一是全球产业技术创新的推动。我国作为全球重要的制造业大国，在全球的产业链和供应链中占据重要位置，在全球化生产的过程当中，我国对于上游原材料中间品的需求在扩大，必然带动进口的增加。二是国内市场需求扩大的带动。今年以来，我国经济运行总体平稳，工业生产市场需求还在扩大，工业生产也是保持了较快增长。三是主动扩大进口的影响。我国有序扩大自主开放和单边开放，举办进博会、消博会、链博会等国际展会，为全球优质商品进入中国创造了有利条件。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165204","time":1789440730000,"title":"国家统计局：前八个月房地产交易总量趋于稳定","text":"国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖在国新办新闻发布会上表示，1—8月份全国新建商品房销售面积同比下降12.1%，但二手房网签面积同比增长10.6%，房地产市场交易的总量趋于稳定。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4890906","time":1789440638000,"title":"【国家统计局：前八个月房地产交易总量趋于稳定】国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖在国新办新闻发布会上表示，1—8月份全国新建商品房销售...","text":"【国家统计局：前八个月房地产交易总量趋于稳定】国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖在国新办新闻发布会上表示，1—8月份全国新建商品房销售面积同比下降12.1%，但二手房网签面积同比增长10.6%，房地产市场交易的总量趋于稳定。","source":"雪
