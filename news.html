案，”Peskov说。\nPeskov表示，对全球市场而言，问题不在于生产，而在于“确保这些成品油不受阻碍地进入全球市场”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1635602354771","time":1789470485000,"title":"单月再融超40亿断层领跑，三星入股帕西尼：具身感知赛道格局加速收敛","text":"单月再融超40亿断层领跑，三星入股帕西尼：具身感知赛道格局加速收敛","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SVKCKM05318W1H.html","importance":""},{"id":"wscn3165502","time":1789470109000,"title":"凯撒旅业：孙公司遭合同诈骗2695万元 公安机关已立案侦查","text":"凯撒旅业公告称，公司全资孙公司凯撒文产与合同相对方签署演艺服务合同，按约支付2695万元款项后无法与对方取得有效联系，涉嫌合同诈骗，已向公安机关报案并获立案侦查。该事项尚处侦查阶段，或对本期及期后利润造成不利影响，公司已开展内部专项核查并配合调查，全力挽回损失。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165501","time":1789470048000,"title":"张国清出席第五届北斗规模应用国际峰会开幕式并致辞","text":"第五届北斗规模应用国际峰会15日在湖南株洲开幕。中共中央政治局委员、国务院副总理张国清出席开幕式并致辞。\n张国清表示，中国愿同各方一道，积极落实四大全球倡议，始终坚持开放融合、协调合作、兼容互补、成果共享，进一步提高北斗技术创新水平，加强北斗与人工智能、卫星互联网等技术融合，持续推进系统迭代升级，推动北斗产业健康有序发展，加速北斗应用提质扩面，完善卫星导航全球治理，让北斗系统更好服务全球、造福人类。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxhzq8471270","time":1789469447000,"title":"IPO撤单两年后，存储芯企华澜微“嫁给”园林股份？","text":"来源 | 野马财经 华澜微换道进入A股。 作者 | 于婞编辑 | 高岩 在资本市场兜兜转转十年，国产存储控制器芯片“老兵”华澜微这次敲开的不是交易所大门...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxhzq8471270.shtml","importance":"hot"},{"id":"1636074200363","time":1789468961000,"title":"澜起科技，全球第一！","text":"澜起科技，全球第一！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SUURRF0539IMJ0.html","importance":""},{"id":"sinacomos:nirxats8595521","time":1789468823000,"title":"碧桂园仍在“无人区”","text":"來源：地产K线 文丨乐居财经 曾树佳 几天前，碧桂园召开月度管理会议，在828新政发布的背景下，董事会主席杨惠妍特地召回了全国各区域总裁，进行了两天的闭门研讨。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxats8595521.shtml","im
