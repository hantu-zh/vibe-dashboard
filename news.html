ance":"important"},{"id":"wscn3163166","time":1789030070000,"title":"香港证监会：因涉嫌操纵首次公开招股行为而暂停拨康视云股份交易","text":"香港证监会已根据《证券及期货（在证券市场上市）规则》第8(1)条指示香港联交所，自2026年9月10日上午9时正起，暂停拨康视云制药有限公司的股份交易。香港证监会对拨康视云的首次公开招股可能曾被人为操纵，以营造对拨康视云股份需求的假象表示严重关注。因此，香港证监会认为，在继续进行调查期间，暂停有关股份的交易，对为拨康视云股份维持一个有秩序和公平的市场及维护投资大众的利益是有需要或合宜的。由于调查仍在进行中，香港证监会不会作进一步评论。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:niritau7676932","time":1789029863000,"title":"美债收益率持稳，投资者静待核心批发通胀数据","text":"周四美债收益率大体持稳，交易员等待日内晚些时候即将公布的美国批发通胀数据。 作为房贷、汽车贷款与信用卡债务核心基准的10年期美债收益率持平于4.8407%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-10/doc-iniritau7676932.shtml","importance":""},{"id":"wscn3163165","time":1789029784000,"title":"英国2年期国债收益率上升2个基点至4.72%，创2023年11月以来最高水平。\n","text":"英国2年期国债收益率上升2个基点至4.72%，创2023年11月以来最高水平。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163163","time":1789029712000,"title":"第二十三届中国住博会将于10月15日至17日在京举办","text":"第二十三届中国国际住宅产业暨建筑工业化产品与设备博览会将于今年10月15日至10月17日在北京首钢国际会展中心举办，主题为“科技创新好房子 绿色低碳好生活”。据悉，第二十三届中国住博会参展单位覆盖开发、设计、施工、运维，以及材料和设备设施等多个领域的头部企业，将展示住房城乡建设领域科技创新顶级成果，以及国内外最新技术和产品。展会将秉持行业科技前沿引导、产业创新全面带动、技术产品精品荟萃的办展理念，持续打造住建领域科技与产业发展最高水平的交流展示平台。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1638095460503","time":1789029620000,"title":"局部风光对冲不了系统性遇冷，如何挽救萎靡的经济？","text":"局部风光对冲不了系统性遇冷，如何挽救萎靡的经济？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6FRV5SB0519MB19.html","importance":""},{"id":"1631565265653","time":1789029596000,"title":"于建忠大幅缩表后，天津银行发生了哪些变化？","text":"于建忠大幅缩表后，天津银行发生了哪些变化？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6FROVBR0519B5UO.html","importance":""},{"id":"sinacomos:niritau2835971","time":1789029480000,"title":"中央气象台：全球天气公报（2 ,"title":"国家认监委发布通知书 责令中汽认证中心有限公司停业整顿","text":"国家认监委发布停业整顿通知书，经查，中汽认证中心有限公司在开展强制性产品认证活动时，未准确识别产品种类，对不属于强制性产品认证目录内的产品进行强制性产品认证，并颁发强制性产品认证证书。根据《强制性产品认证管理规定》第四十三条规定，现责令中汽认证中心有限公司自2026年9月9日至10月8日停业整顿1个月，停业整顿期间不得从事指定范围内的强制性产品认证活动。（央视新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163156","time":1789028886000,"title":"中国汽车流通协会：8月汽车经销商库存系数为1.58，同比上升20.6%","text":"中国汽车流通协会发布2026年8月“汽车经销商库存”调查结果：8月汽车经销商综合库存系数为1.58，环比上升6.8%，同比上升20.6%。8月车市虽呈现一定修复，但终端需求根基尚不稳固，经销商库存压力走高，行业整体仍处于筑底调整阶段。据中国汽车流通协会乘联分会数据显示，8月全国乘用车市场零售154.1万辆，以此测算，8月末汽车经销商库存总量约244万辆，渠道整体库存规模与7月末相比小幅上升。（界面新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:niritau7663502","time":1789028817000,"title":"上市、稳市、投资者保护，证监会副主席李超说了这些重点","text":" “十五五”规划《纲要》提出，健全投资和融资相协调的资本市场功能，优化发行上市、信息披露、并购重组、退市等基础制度，提高上市公司质量，建立增强内在稳定性长效机制。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-10/doc-iniritau7663502.shtml","importance":"important"},{"id":"wscn3163153","time":1789028601000,"title":"央行陆磊：央行将常态化发行国债和中央银行票据，丰富高等级人民币资产池","text":"9月10日，在国新办新闻发布会上，中国人民银行副行长陆磊表示，“十五五”时期，人民银行将继续支持离岸人民币市场健康发展，优化人民币清算行布局，健全多层次跨期限的流动性供给机制，保持离岸市场人民币流动性充足稳定，常态化发行国债和中央银行票据，丰富高等级人民币资产池。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:niritau7662766","time":1789028487000,"title":"尾盘突袭！000532，3分钟垂直涨停！“牛市旗手”，集体异动！","text":"又有个股尾盘异动。 今日，A股继续小幅震荡整理，上证指数、深证成指、创业板指等均小幅收跌。超4500只个股下跌，市场观望气氛浓郁，成交进一步萎缩至1.66万亿元。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/zqgd/2026-09-10/doc-iniritau7662766.shtml","importance":"important"},{"id":"1634809984250","time":1789028420000,"title":"国家外汇局副局长李斌：将坚定推动外汇领域高质量发展和高水平开放","text":"国家外汇局副局长李斌：将坚定推动外汇领域高质量发展和高水平开放","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6FQQMA2051 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
