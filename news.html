被强制投票。\n沙特阿美取消部分对欧原油发货、红海延布港暂停装船，利比亚三座油田又因管线阀门被关停产，全球原油供应的缓冲空间进一步收窄。\n特朗普与英伟达首席执行官黄仁勋接连为AI加速派站台，黄仁勋称AI安全无需专项立法、市场机制已足够，并批驳AI末日论是不讲科学的哗众取宠。\nMeta自研AI芯片明年上半年部署，旨在降低成本，减少对英伟达依赖。\n华为发布全球首个3D数据中心架构，通过供冷、供电与IT设备分层解耦和立体堆叠，支撑十万卡以上昇腾超节点集群。\n字节AI办公大重组：豆包、飞书、火山引擎合三为一，AI办公大战正式打响。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1632277199701","time":1789513805000,"title":"日元，这次玩了把大的。","text":"日元，这次玩了把大的。","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6U9NB3G0519DKT1.html","importance":""},{"id":"1636678602471","time":1789513200000,"title":"OpenAl考虑在IPO之前一轮融资获得1.2万亿美元估值","text":"OpenAl考虑在IPO之前一轮融资获得1.2万亿美元估值","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6U959BG05198NMR.html","importance":""},{"id":"cls2484266","time":1789513200000,"title":"【早报】标普500创8月份以来收盘新低；国际油价大涨；商业银行科技贷款统计口径面临收紧","text":"①伊朗外长阿拉格齐今日将访华②商业银行科技贷款统计口径面临收紧，新框架望年底落地③美股收跌，标普500创8月份以来收盘新低④富国银行下调标普500指数2026年底目标点位⑤高端MLCC是买的海外产品回来贴牌？风华高科回应。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2484266","importance":"important"},{"id":"wscn3165798","time":1789512977000,"title":"银行个人贵金属代理业务密集“退场”","text":"近日，浦发银行发布公告称，该行拟对代理上海黄金交易所个人贵金属业务进行调整，将自9月25日后择时停办该项业务，并关闭手机银行、网上银行、网点柜面等渠道的交易权限。这并非个例，今年以来已有多家银行宣布调整个人贵金属代理业务。有银行人士透露，对于代理上金所个人贵金属业务，银行更多是收取手续费，若市场发生剧烈波动，银行可能面临客户穿仓带来的垫资信用风险。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165797","time":1789512648000,"title":"我国火箭单次海上发射载荷重量创新高","text":"9月16日，引力一号遥三运载火箭在我国东海海域点火升空，成功将搭载的8颗千帆星座组网卫星与1颗超高速无线通信技术试验卫星顺利送入预定轨道，发射任务取得圆满成功。\n记者从火箭研制方东方空间（山东）科技有限公司获悉，此次任务创下我国单次海上发射载荷重量和轨道高度新高，净载荷重量超3吨，入轨高度约800公里，验证了海上发射模式对中大型卫星载荷任务的适应能力。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165809","time":1789512594000,"title":"AWS：伊朗袭击半年后，巴林与阿联酋部分设施仍无法恢复服务","text":"亚马逊云服
