因素。《中华人民共和国增值税法》及其实施条例自今年1月1日正式施行，一些税收政策也相应进行了调整，同时，国家还对一些不符合高质量发展、不符合当前形势的税收优惠进行了规范，带来税收收入增加，但政策调整不会直接带来GDP增长。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409930390","importance":"important"},{"id":"xq4893577","time":1789874311000,"title":"【北京市“十五五”时期优化营商环境规划：推动平台经济创新和健康发展 整治和防范“内卷式”竞争】北京市人民政府印发《北京市“十五五”时期优化营商环境规划》，《规划...","text":"【北京市“十五五”时期优化营商环境规划：推动平台经济创新和健康发展 整治和防范“内卷式”竞争】北京市人民政府印发《北京市“十五五”时期优化营商环境规划》，《规划》提出了2030年目标及2035年目标，其中2030年目标包括“营商环境整体水平位居全球前列”。在具体实践方面，《规划》围绕六大环境，提出了29个方面改革举措。其中包括：强化公平竞争审查刚性约束,完善各类经营主体公平参与市场竞争相关制度。推动平台经济创新和健康发展,整治和防范“内卷式”竞争。加大支持中小企业公平参与招标投标力度,积极稳妥推进人工智能技术在招标投标交易全过程和管理重点环节应用,推广远程异地评标和“双盲”评审改革,促进招标投标更加公平公正。推行合作创新采购模式,优化政府采购电子平台功能,全面推广异常低价审查,推动政府采购行政裁决试点建设,持续规范政府采购市场秩序。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409929888","importance":""},{"id":"sinacomos:nismvpe9355542","time":1789874288000,"title":"视频丨董建华设灵 商界人士到场致意","text":"视频丨董建华设灵 商界人士到场致意","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/companyt/2026-09-20/doc-inismvpe9355542.shtml","importance":""},{"id":"sinacomos:nismvpc2557504","time":1789874214000,"title":"东风汽车推多项计划，人形机器人年底将小批量试制","text":"汽车央企的新发展。 日前，东风汽车第十届科技创新周开幕，“天净零碳”计划、具身智能汽车全域守护计划、“天际扬帆”计划等集中发布。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/roll/2026-09-20/doc-inismvpc2557504.shtml","importance":""},{"id":"sinacomos:nismvnz1674569","time":1789874167000,"title":"视频丨董建华公祭大殓在港举行，香港行政长官李家超到场，霍震霆、何超琼等政商界人士陆续抵达","text":"来源：珠江之声FM1057","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/2026-09-20/doc-inismvnz1674569.shtml","importance":""},{"id":"163800386594","time":1789874003000,"title":"2026京津冀蓝皮书：建议发行城市群级算力券 ，投向中小企业、科研机构","text":"2026京津冀蓝皮书：建议发行城市群级算力券 ，投向中小企业、科研机构","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L7917LCN0519APGA.html","importance":""},{"id":"xq4893576","time":1789873982000,"title":"【市场监管总局：依法从严处理带头开展恶意低价竞争、扰乱生产经营秩序的企业】国务院新闻办公室今天上午举行开局起步“十五五”系列主题新闻发布会，据介绍，“十五五”期...","text":"【市场监管总局：依法从严处理带头开展恶意低价竞争、扰乱生产经营秩序的企业】国务院新闻办公室今天上午举行开局起步“十五五”系列主题新闻发布会，据介绍，“十五五”期间，市场监管总局针对劣质低价问题将综合施策，加快引导市场竞争从“拼价格”转向“拼质量”的良性轨道。首先是强化价格执法，将指导相关行业协会制定成本测算标准，推动形成“1+1+N”的低价倾销规制法律体系。对带头开展恶意低价竞争、扰乱生产经营秩序的企业，进行成本调查和价格检查，依法从严处理。推动实施《互联网平台价格行为规则》，持续规范平台经济领域价格竞争行为。同时加强质量风险监测和监督抽查，对价格畸低、安全风险大、以往不合格率高的产品加大抽查力度，提高电商平台、批发市场等重点领域抽查比重。提高线上线下监管一致性，加快构建全国统一的产品质量安全追溯体系，压实平台企业商品信息审核、配合召回等主体责任。深入开展网售工业产品质量安全专项治理，严厉打击网络商品销售违法违规行为。另外，常态化部署开展反不正当竞争专项执法行动，聚焦虚假宣传、互黑互踩、商业诋毁、商业贿赂等重点问题，依法查处一批标志性案件。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409929502","importance":"important"},{"id":"sinacomos:nismvpc2578805","time":1789873938000,"title":"上银基金总经理落定：上海银行老将姚秦接棒 能否破解固收“独大”格局？","text":"时隔三个多月，上银基金总经理一职迎来正式人选。 近日，上银基金发布高级管理人员变更的公告，新任姚秦为总经理，任职日期2026-09-19。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/observe/2026-09-20/doc-inismvpc2578805.shtml","importance":""},{"id":"sinacomos:nismvpe9351094","time":1789873920000,"title":"视频丨欣旺达、中创新航在消费者端信任度偏低：欣旺达52% 中创新航44%","text":"视频丨欣旺达、中创新航在消费者端信任度偏低：欣旺达52% 中创新航44%","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/companyt/2026-09-20/doc-inismvpe9351094.shtml","importance":""},{"id":"xq4893575","time":1789873893000,"title":"【市场监管总局：研究制定网络交易平台合规评价指南 加快国家网监平台建设应用】市场监管总局网络交易监督管理司司长朱剑桥在国新办发布会上表示，将支持引导平台经济规范...","text":"【市场监管总局：研究制定网络交易平台合规评价指南 加快国家网监平台建设应用】市场监管总局网络交易监督管理司司长朱剑桥在国新办发布会上表示，将支持引导平台经济规范健康发展。研究制定网络交易平台合规评价指南，引导平台企业提升合规管理水平，扛牢守门人责任。加快国家网监平台的建设应用，推动监管数据资源跨层级跨部门互联互通，深化政务数据的核验服务，来支持平台更好的落实资质核验的主体责任，不断提高协同共治的效能。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409929389","importance":""},{"id":"xq4893574","time":1789873870000,"title":"【国家药监局：支持仿制药提质升级 推动仿制药向高附加值、高技术含量转型】国家药监局副局长杨胜在国新办发布会上表示，支持仿制药提质升级，鼓励采取国际先进技术工艺，...","text":"【国家药监局：支持仿制药提质升级 推动仿制药向高附加值、高技术含量转型】国家药监局副局长杨胜在国新办发布会上表示，支持仿制药提质升级，鼓励采取国际先进技术工艺，推动仿制药向高附加值、高技术含量转型，提升整体药品供给
