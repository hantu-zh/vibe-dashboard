egory":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166206","time":1789555851000,"title":"前8个月中哈（连云港）物流合作基地开行中欧（亚）班列666列","text":"据南京海关统计，今年前8个月，中哈（连云港）物流合作基地累计开行中欧（亚）班列666列，发运集装箱5.46万标箱，同比增长9.18%。作为共建“一带一路”倡议首个实体落地项目，基地自正式运营以来，已累计开行中欧（亚）班列超8200列，发运集装箱超70万标箱。目前已成功构建中亚五国、中吉乌、中俄、跨里海等6条国际班列线路，覆盖阿拉山口、霍尔果斯等5个出境口岸，辐射亚欧两大洲多个国际站点，运输货物种类包含汽车及零配件、化工产品、家用电器、纺织服装、电子设备等。（央视新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1638144012490","time":1789555695000,"title":"国产光刻胶激战，谁立潮头？","text":"国产光刻胶激战，谁立潮头？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6VHLCC60539IMJ0.html","importance":""},{"id":"wscn3166201","time":1789555532000,"title":"抖音：取消6888名“理财师”认证，推进跨境违规营销、非法荐股炒汇等治理","text":"抖音发布关于持续深化财经生态治理的公告指出，为保障用户合法权益，构建健康有序的财经信息生态，抖音持续深化财经行业治理，财经违规行为具有隐蔽性强、变体多、演变快等特点，违规现象在资质问题、违规营销、境外展业等领域尤为集中。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166200","time":1789555518000,"title":"康惠股份：全资子公司签署17.20亿元算力服务合同","text":"康惠股份公告，全资子公司北京康惠智创科技有限公司与A公司签署《算力服务合同》，合同总金额约17.20亿元（含税），合同期限5年，按月结算。为保障上述算力服务合同的顺利落地，与G公司签署算力服务器《购销合同》，合同总金额约11.41亿元（含税）。算力交付自2026年三季度末起至2027年一季度末分批实施，预计2026年度新增收入约3000万元。\n","source":"华尔街见闻","category":"fast","stock":"康惠制药","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirzmyz3764832","time":1789555324000,"title":"又一A股公司董事长离婚","text":" 9月16日，杭州电魂网络科技股份有限公司（股票简称：电魂网络）公告，收到实际控制人胡建平、陈芳通知，两人已办理了解除婚姻关系手续。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-16/doc-inirzmyz3764832.shtml","importance":""},{"id":"wscn3166199","time":1789555310000,"title":"贸易商四处找货 在波斯湾外装运的中东原油价格创3月以来新高","text":"随着市场日益担心石油供应短缺程度可能回到中东冲突爆发初期的严峻水平，在波斯湾外装运的中东原油价格升至3月以来的高位。继上周的袭击导致沙特一条关键输油管道暂时关闭之后，贸易商争相寻找替代供应，阿曼原油期货随之升至每桶132.09美元，较国际基准布伦特原油的溢价跃升至近24美元，同创3月以来最高水平。因为阿曼位于霍尔木兹海峡外侧，所以该国的原油获得追捧。阿布扎比的Murban原油是通过管道输送至波斯湾外的另一种重要基准原油，目前交易价格接近每桶124美元，回到美伊冲突初期的高位。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166197","time":1789555193000,"title":"吉尔吉斯斯坦副总理：对华合作是吉外交政策优先事项","text":"吉尔吉斯斯坦副总理阿昆别科夫15日说，中国是吉尔吉斯斯坦的好邻居、亲密朋友和主要贸易投资伙伴，发展对华合作是吉外交政策的重要优先事项。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3166196","time":1789555089000,"title":"芝加哥商品交易所：电子邮件系统中断是由于Salesforce服务中断所致。\n","text":"芝加哥商品交易所：电子邮件系统中断是由于Salesforce服务中断所致。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166195","time":1789555061000,"title":"伦敦金属交易所（LME）：电子期权将于2027年3月30日起推出，市场测试环境将于2026年10月19日起开放。\n","text":"伦敦金属交易所（LME）：电子期权将于2027年3月30日起推出，市场测试环境将于2026年10月19日起开放。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1639558398500","time":1789555048000,"title":"罗永浩嫌贵又难吃，餐饮圈却都在抄野人先生作业","text":"罗永浩嫌贵又难吃，餐饮圈却都在抄野人先生作业","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6VGFTDA053990SN.html","importance":""},{"id":"wscn3166193","time":1789554839000,"title":"三一重工：9月16日回购1662.06万股，累计回购1836.85万股","text":"三一重工公告，2026年9月16日以集中竞价方式回购1662.06万股，占总股本0.1808%，价格17.64元/股~18.96元/股，支付2.99亿元。截至当日累计回购1836.85万股，占总股本0.1998%，价格17.64元/股~20.07元/股，累计支付3.33亿元。\n","source":"华尔街见闻","category":"fast","stock":"三一重工","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirzmzc0528736","time":1789554791000,"title":"布鲁克菲尔德同意以29亿美元收购澳大利亚Reliance环球公司","text":"Reliance 董事会一致向股东推荐该收购要约布鲁克菲尔德资产管理公司达成全现金收购 Reliance 环球公司的交易。 内容摘要 布鲁克菲尔德资产管理公司达成全现金收购...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-16/doc-inirzmzc0528736.shtml","importance":""},{"id":"wscn3166192","time":1789554790000,"title":"亚运会中国代表团自带检测设备、食材水源信息不实","text":"中 品供货给英伟达","text":"超声电子公告，公司关注到近期市场对PCB（印制电路板）及算力硬件相关概念关注度较高，市场存在关于公司涉及算力、英伟达供货等概念的讨论。现公司就相关业务情况说明如下：（1）有关 “超声电子高频板通过英伟达认证” 的说法不属实，目前公司无产品供货给英伟达；公司800G、1.6T光模块配套PCB处于研发跟进阶段。上述研发项目后续推进进度、客户认证、量产落地均存在不确定性，暂未实现规模化供货，截至目前，上述产品没有产生相应营收。（2）近期市场对消费电子产业链上游PCB、覆铜板需求预期有所提升，公司基本面未发生重大变化，请投资者理性研判公司基本面。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166179","time":1789553425000,"title":"英特尔盘前涨幅收窄，SK海力士回应“有关其与英特尔合作的报道” ：目前没有任何定论","text":"英特尔美股盘前涨幅收窄至不足3%，此前一度涨近6%；SK海力士盘前涨幅亦收窄至不足3%，此前一度涨近4%。针对路透社报道称SK海力士正与英特尔磋商在美国生产半导体的协议，该存储芯片制造商回应道，其尚未做出任何决定。 SK海力士称我们想澄清，有关与报道中提及的任何特定公司开展合作，或在美国生产存储芯片的事，目前没有任何定论。SK海力士正在探索多种方案以增强自己的全球竞争力，但还未敲定任何具体计划或安排。关于报道提到的两种情景，尚未做出任何决定。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1638500990962","time":1789553415000,"title":"从服贸会看“中国服务”新样本：硬件+订阅，重资产IT如何变成轻资产服务？","text":"从服贸会看“中国服务”新样本：硬件+订阅，重资产IT如何变成轻资产服务？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6VDKHT80519D9A7.html","importance":""},{"id":"1634651132664","time":1789553404000,"title":"死猫跳 | 谈股论金","text":"死猫跳 | 谈股论金","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6VFFR5T051994HF.html","importance":""},{"id":"sinacomos:nirzmyw2825994","time":1789553303000,"title":"大模型第一股，业绩利好！","text":" 9月16日，“全球大模型第一股”智谱举办面向分析师和投资人的电话交流会，这是智谱自9月11日完成总额50亿美元再融资后的首次系统性基本面汇报。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/wm/2026-09-16/doc-inirzmyw2825994.shtml","importance":"important"},{"id":"wscn3166178","time":1789553139000,"title":"报道：比亚迪为可能的欧洲新生产厂选址 在考虑意大利南部一家工厂","text":"据MF-Milano Finanza报道，比亚迪高管李柯访问意大利南部一家工厂，该公司在为可能的欧洲新生产厂考虑选址。李柯近日参观了位于阿韦利诺附近弗卢梅里的Menarini巴士工厂。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirzmzc0504725","time":1789553100000,"title":"为何Anthropic的数据政策风波反倒利好OpenA
