/live/global","importance":"important"},{"id":"wscn3166541","time":1789599663000,"title":"美国众议院推进首项针对数据中心热潮经济影响的法案","text":"美国众议院周三通过了一项旨在保护家庭免受数据中心扩建所致电费上涨影响的法案，这是该院首次推进直接针对该行业增长所引发经济问题的立法。《用户权益保护法案》将要求各州公用事业监管机构考虑，包括数据中心在内的大型用电企业是否应承担为服务其而建设的电力基础设施所产生的增量成本。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166540","time":1789599653000,"title":"IMF敦促澳洲联储保持鹰派立场，警告通胀上行风险","text":"国际货币基金组织（IMF）表示，鉴于通胀风险仍偏向上行，澳洲联储应准备好在必要时加息，并补充称澳大利亚政府可以通过紧缩财政立场来支持去通胀进程。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1634405311899","time":1789599612000,"title":"宝子，干杯！当心黄酒上头","text":"宝子，干杯！当心黄酒上头","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6V6PI9R0539LXZQ.html","importance":""},{"id":"wscn3166539","time":1789599531000,"title":"两只熊猫债指数昨日发布","text":"据中债金融估值中心网站消息，9月16日，为多角度反映人民币债券市场的走势，给投资者提供多元化的业绩比较基准和投资标的，中债金融估值中心有限公司发布中债-熊猫债综合指数与中债-投资优选熊猫债指数。今年以来，熊猫债市场持续火热。Wind数据显示，截至9月16日，年内熊猫债发行规模达到2430.45亿元，持续刷新历史纪录，同比增长率也高达81.44%。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1637122592499","time":1789599429000,"title":"十九缺一，沃什主席又没给美联储点阵图“交功课”","text":"十九缺一，沃什主席又没给美联储点阵图“交功课”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L70RCP7E05198NMR.html","importance":""},{"id":"wscn3166537","time":1789599410000,"title":"从数量扩张到质量筛选，并购重组市场新动向受关注","text":"近期，包括焦作万方、金橙子、普路通在内的多家上市公司对外发布终止重大资产重组相关公告，引发市场关注。以普路通为代表的部分公司发布终止公告后，股价出现明显回调。从终止重大资产重组的原因看，外部市场环境发生变化、交易双方关键核心条款未达成一致是近期重组终止的两大主因，其中不乏披露筹划重组意向后不久便宣布终止交易的案例。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166536","time":1789599343000,"title":"Salesforce发布长期销售指引，预计2030财年收入将达到630亿美元，彭博汇编的分析师预期均值为614亿美元。\n","text":"Salesforce发布长期销售指引，预计2030财年收入将达到630亿美元，彭博汇编的分析师预期均值为614亿美元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166535","time":1789599137000,"title":"农商银行增资扩股提速，资本补充夯实发展根基","text":"近日，四川、山西、湖南多地农商银行获批增加注册资本。金融监管总局数据显示，截至二季度末，农商银行整体资本充足率12.91%，低于15.26%的银行业整体水平，部分地区农商银行资本充足率显著承压。通过增资扩股等方式补充核心一级资本，已成为不少农商银行优化股权结构、增强风险抵御能力的重要手段。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166534","time":1789599077000,"title":"将“星辰大海”写入保单，商业航天保险加速落子","text":"在近日举办的2026服贸会上，保险公司、卫星在轨数据监测公司、航天风险评估机构和保险经纪公司四方签署战略合作协议，正式启动全国首创的“太空数据底座AOE+在轨风险评估”商业航天卫星保险生态圈。业内人士表示，这一“共建”模式填补了国内商业卫星在轨运行环节的保障短板。今年的政府工作报告首次提出打造航空航天等新兴支柱产业，同时首次单独提及加快发展卫星互联网。产业奔赴“星辰大海”的蓝图已经绘就，风险保障这张安全网织得够不够快、够不够密，成为提升产业可持续竞争力的重要命题。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166533","time":1789598701000,"title":"新西兰二季度GDP季环比 0.2%，预期 0.1%，前值 0.8%。\n","text":"新西兰二季度GDP季环比 0.2%，预期 0.1%，前值 0.8%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3166532","time":1789598701000,"title":"新西兰二季度GDP同比 2.6%，预期 2.2%，前值 1.5%。\n","text":"新西兰二季度GDP同比 2.6%，预期 2.2%，前值 1.5%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1639298264556","time":1789598621000,"title":"8月CPI、PPI双回升 杨宜勇：价格“回暖”中见经济韧性","text":"8月CPI、PPI双回升 杨宜勇：价格“回暖”中见经济韧性","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L70QK4QB05199NHJ.html","importance":"important"},{"id":"wscn3166531","time":1789598573000,"title":"私募五大策略业绩分化，量化多头领跑","text":"8月A股市场震荡反弹，带动私募产品净值普遍修复。第三方机构私募排排网数据显示，截至8月31日，在该平台有业绩记录的12597只私募产品8月平均收益率达4.53%，今年以来的平均收益率提升至4.99%，超六成产品实现正收益。五大策略表现显著分化：8月股票策略以5.44%的平均收益率领跑，多资产策略、组合基金策略、期货及衍生品策略的平均收益率分别为3.84%、3.47%和3.14%，债券策略当月的平均收益率为0.44%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166530","time":1789598428000,"title":"恒大汽车集中披露多份财报，截至6月底负债总额约327.22亿元","text":"恒大汽车港交所公告，截至2025年12月31日，本集团资产总额约为人民币2.05亿元，负债总额约为人民币329.18亿元，其中借款约为人民币168.38亿元，贸易及其他应付款项约为人民币160.80亿元。\n截至2026年6月30日，本集团资产总额约为人民币1.82亿元，负债总额约为人民币327.22亿元，其中借款约为人民币162.83亿元，贸易及其他应付款项约为人民币164.39亿元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166528","time":1789598111000,"title":"产品端稳步创新，年内新发基金规模突破8000亿元","text":"今年以来，新发基金规模突破8000亿元。从产品类型来看，权益类基金占比过半，“固收+”和FOF产品持续“吸金”。从最新发展动向看，近期创新产品密集推出，首批创业板算力基础设施ETF、首批创业板金融科技ETF、首批中证新能源金属50 ETF等纷纷上报。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3166527","time":1789598028000,"title":"沃什践行自身主张：美联储记者会创纪录最短","text":"9月16日，美联储主席凯文·沃什主持了美联储主席在常规政策会议后有史以来最短的新闻发布会，时长约30分钟。主席将重点放在本周会议及美联储官员对当前经济的看法上，坚守其不为美联储未来行动做前瞻暗示的承诺。记者会的未来仍存不确定性，沃什设立的专项工作组之一将对沟通机制展开审查，包括美联储如何在不确定性中传达政策审议与决策。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3166526","time":1789597990000,"title":"特朗普称如果加拿大成为欧盟准成员国 将对欧洲征收关税","text":"美国总统特朗普表示，如果欧盟接纳加拿大为准成员国，他将考虑征收“严厉的关税”，或停止与欧洲的贸易。特朗普在北卡罗来纳州讲话，称接纳加拿大加入欧盟将是“敌对行为”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3166525","time":1789597910000,"title":"美国总统特朗普：希望我们更接近伊朗战争的尾声。\n","text":"美国总统特朗普：希望我们更接近伊朗战争的尾声。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166524","time":1789597840000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 06:45 新西兰二季度GDP；\n② 时间待定 半导体与电子制造专业盛会Semicon India；\n③ 14:45 欧洲央行管委兼法国央行行长Moulin讲话；\n④ 15:00 欧洲央行首席经济学家Lane讲话；\n⑤ 17:00 欧元区8月CPI终值；\n⑥ 18:00 欧洲央行管委Rehn讲话；\n⑦ 19:00 英国央行公布利率决议；\n⑧ 20:30 美国8月新屋开工、营建许可，9月12日当周首次申请失业救济人数，\n⑨ 22:00 美国8月成屋签约销售指数；\n微信小程序搜索“见闻历”，了解更多。\n","source":"华尔街见闻","category":"fast",
