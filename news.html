865000,"title":"英国航班处理系统发生故障，超千次航班被取消","text":"英国全国空中交通管理局航班处理系统8日下午发生严重故障，导致全英多个机场大量航班被取消或延误。当日，包括伦敦希思罗机场、爱丁堡机场、曼彻斯特机场在内的多个主要机场航班受到影响。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3162214","time":1788908782000,"title":"券商中期业绩说明会密集召开，分红等话题备受关注","text":"在完成2026年半年报披露后，A股上市券商紧锣密鼓地召开中期业绩说明会，积极回应投资者关切。Wind数据显示，截至9月8日发稿时，已有16家上市券商举办了2026年半年度业绩说明会，本周还将有中国银河、国金证券、东吴证券等券商举办2026年半年度业绩说明会。从券商披露的交流互动内容看，是否有中期分红计划仍是投资者关注的重点。此外，券商业绩增长的可持续性、如何进一步推进业务转型和特色业务发展，也是业绩说明会上的高频话题，受到投资者关注。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirense5742434","time":1788908744000,"title":"【沥燃日报】沥青强势验证突破5200，期货追现货基差走强","text":"来源：能源研发中心 燃料油：9月8日国内白天收盘，FU11录得3988元/吨，环比上涨4.97%；LU10录得5219元/吨，环比上涨5.05%。地缘层面摩擦依旧。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/money/future/fmnews/2026-09-09/doc-inirense5742434.shtml","importance":"important"},{"id":"ths679717155","time":1788908700000,"title":"采购周期缩短50%以上 人工智能应用在供应链领域加速落地","text":"中国物流与采购联合会今天发布《中国供应链发展报告（2025-2026）》。根据报告，2025年我国供应链领域的人工智能应用开始加速落地，以生成式大模型为引领，机器视觉、智能体、具身智能等多项技术协同演进，已在采购管理、需求预测、库存优化、智...","source":"同花顺","category":"fast","stock":"","url":"http://stock.10jqka.com.cn/20260909/c679717155.shtml","importance":""},{"id":"1636078067572","time":1788908403000,"title":"GT赛车起火事故，狠狠地扇了主办方一耳光","text":"GT赛车起火事故，狠狠地扇了主办方一耳光","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6C8BR8J0519DLR9.html","importance":""},{"id":"wscn3162213","time":1788908352000,"title":"多瑙河布达佩斯段水位再创新低：一厘米","text":"据匈牙利水务部门监测数据，当地时间8日，多瑙河布达佩斯段水位急剧下降，降至新的历史低点——1厘米。低水位严重影响多瑙河航运，河床中的物品也对水上交通构成直接威胁，匈牙利唯一核电站，保克什核电站也因低水位一度面临停运风险。水务专家将低水位归因于多瑙河流域极端干旱天气。（央视新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162212","time":1788908301000,"title":"伊朗革命卫队打击约旦美军基地","text":"伊朗伊斯兰革命 ,"importance":"important"},{"id":"sinacomos:nirensa8960172","time":1788907751000,"title":"美国财长贝森特暗示正推动新法案以削减财政赤字","text":" 美国财政部长斯科特·贝森特表示，他正与白宫管理和预算办公室主任Russell Vought制定一项财政整顿计划，以进一步降低赤字。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-09/doc-inirensa8960172.shtml","importance":""},{"id":"1633081151045","time":1788907592000,"title":"煤价飙升、超强厄尔尼诺逼近：尿素日涨百元，农化板块爆发","text":"煤价飙升、超强厄尔尼诺逼近：尿素日涨百元，农化板块爆发","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6C7JJ4M0514R9P4.html","importance":""},{"id":"wscn3162207","time":1788907487000,"title":"伊朗发射导弹，打击约旦Al-Azraq空军基地。（FARS）\n","text":"伊朗发射导弹，打击约旦Al-Azraq空军基地。（FARS）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162206","time":1788907453000,"title":"分红险“半年卖了1万亿”背后：人身险负债端重构加速演绎","text":"随着存款收益吸引力持续走低，在银行销售渠道，不少理财经理在客户存款到期时，不再主动推荐续存定期，而是引导客户进行多元化再配置，一大热门方向便是分红险。行业数据显示，今年上半年，分红险原保险保费收入超过1万亿元，同比增长94.4%。从上市险企近期发布的半年报数据和业绩说明会情况来看，分红险快速占领市场的迹象亦十分明显，头部险企人身险产品线几乎一致向分红险加速切换，分红险新单期缴占比超过50%成为普遍现象。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3162205","time":1788907333000,"title":"A股新基金发行热度不减，业绩分化明显","text":"进入9月，公募基金发行市场延续活跃态势。上周全市场82只新产品进入发行期，创下单周新发数量新高，本周则有48只产品启动发行。被动指数型基金持续占据发行主力位置，公募机构在细分赛道的布局更趋精细化。与此同时，今年以来成立的新基金业绩表现显著分化，首尾差距超过100个百分点，科技主题内部冷热不均，新能源主题基金承压。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3162204","time":1788906978000,"title":"中国地震台网自动测定：09月09日06时32分在台湾宜兰县海域附近（北纬24.42度，东经122.49度）发生4.2级左右地震，最终结果以正式速报为准。\n","text":"中国地震台网自动测定：09月09日06时32分在台湾宜兰县海域附近（北纬24.42度，东经122.49度）发生4.2级左右地震，最终结果以正式速报为准。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162203","time":1788906911000,"title":"“打折买票”难保稳赚，公募定增投资策略生变","text":"今年以来A股市场交投活 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();
