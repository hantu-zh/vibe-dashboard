:""},{"id":"wscn3163494","time":1789074529000,"title":"英国首相伯纳姆谈及柴油出口管制：所有方案均在考量范围内。\n燃料出口管制过去曾推高价格。\n","text":"英国首相伯纳姆谈及柴油出口管制：所有方案均在考量范围内。\n燃料出口管制过去曾推高价格。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163493","time":1789074502000,"title":"周四（9月10日）纽约尾盘（周五北京时间04:59），离岸人民币（CNH）兑美元报6.7144元，较周三纽约尾盘跌80点，日内整体交投于6.7042-6.715","text":"周四（9月10日）纽约尾盘（周五北京时间04:59），离岸人民币（CNH）兑美元报6.7144元，较周三纽约尾盘跌80点，日内整体交投于6.7042-6.7150元区间，亚太时段呈现出微弱的M形走势、20:00前后显著走低。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163492","time":1789074255000,"title":"国际金价跌1.9%，白银跌5.4%，纽约铜跌超5.2%","text":"周四（9月10日）纽约尾盘，现货黄金跌1.91%，报4314.82美元/盎司，亚太时段保持微幅上涨状态、北京时间14:00刷新日高至4434.67美元，随后震荡下行，欧洲央行宣布加息之后出现一波V形行情——20:39跌至4324.23美元。\n现货白银跌5.43%，报63.60美元/盎司。\nCOMEX铜期货跌5.24%，报6.5275美元/磅，关于特朗普关税的媒体消息出炉后，18:00出现一波短线跳在美股时段交易的费城金银指数收跌3.56%，报397.07点。\n在全球市场全天交易的纽约证交所ARCA金矿开采商指数跌2.87%，报2775.85点。\n在美股时段交易的原材料指数收跌2.11%，金属与矿业指数收跌3.47%——跳空低开之后持续低位窄幅震荡。\nState Street金属与矿业ETF收跌3.71%，报114.77美元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163491","time":1789074178000,"title":"OpenAI因“严重关切”而被美国参议员质询Astra模型","text":"美国民主党参议员克里斯·范霍伦致信OpenAI首席执行官萨姆·奥尔特曼，对该公司最新模型GPT-6 Astra表达“严重关切”。\n范霍伦敦促奥尔特曼“立即”向联邦研究人员提供“透明的技术信息访问权限，以便他们能够评估Astra发布后我们关键数字基础设施的安全性和风险”。\n范霍伦还就安全参数、Astra的训练方式以及是否“存在其他模型利用漏洞逃离安全环境的事件”向奥尔特曼提问。\n该参议员引用了Hugging Face事件。\n该参议员要求在9月17日之前得到答复。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163490","time":1789074113000,"title":"特朗普否认美战机在约旦遭伊朗袭击受损","text":"美国总统特朗普10日否认关于美军驻约旦基地战机在伊朗袭击中受损的报道。特朗普当天在接受美国新闻国度电视频道电话采访时说，有关美国战机在伊朗最近一次袭击中受损的报道“完全不属实”，美军“没有损失，什么事都没有”。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4884435","time":1789074104000,"title":"微软计划将数据中心容量扩充至原来的三倍，达到38吉瓦。","text":"微软计划将数据中心容量扩充至原来的三倍，达到38吉瓦。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/408859243","importance":""},{"id":"wscn3163488","time":1789074054000,"title":"微软计划大力扩建数据中心，考虑将规模扩大逾两倍至超过38 GW","text":"微软公司计划将其数据中心容量增加两倍以上，此举有望帮助该公司克服算力短缺问题，此前这一短缺已迫使其不得不放弃部分AI和云业务。\n据知情人士透露，到2032年，该公司的数据中心容量将从目前的约12吉瓦（GW）提升至超过38吉瓦。这一规模将超过纽约州在用电高峰期的总耗电量。\n算力短缺一直是该公司面临的最大阻碍，导致部分客户将新业务转移至别处。微软正通过开发新数据中心来缓解这一短缺，例如正在美国亚特兰大地区建设中的“美国东部3号”集群。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163487","time":1789073896000,"title":"博索纳罗民调支持率飙升追平卢拉，最高法院危机令选情趋紧","text":"巴西最高法院内部的一场危机正在给该国左翼领导人、现任总统路易斯·伊纳西奥·卢拉·达席尔瓦竞选连任造成不利影响，一项最新民调显示，弗拉维奥·博索纳罗的支持率大幅攀升，与卢拉打成平手，抹去了此前4.5个百分点的差距。\n周四公布的AtlasIntel为彭博新闻社进行的民调结果显示，如果10月份总统选举进入第二轮投票，博索纳罗和卢拉将各自获得约46%的选票。在8月底公布的上一次调查中，卢拉以47.1%对42.6%领先。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163486","time":1789073869000,"title":"Robinson要求美国最高法院审查体育预测市场裁决","text":"美国最高法院被要求就体育预测市场提供的是赌博还是某种形式的衍生品交易这一法律争议做出裁决。\n网红券商罗宾汉市场公司（Robinhood Markets Inc.）的衍生品子公司已请愿最高法院审查美国第九巡回上诉法院上月做出的有利于州监管机构的裁决。\n争议的核心在于体育事件合约应作为赌博受州监管，还是作为被称为”互换”的对冲工具受美国商品期货交易委员会（CFTC）管辖。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirkuqh7270765","time":1789073668000,"title":"9月11日热门中概股多数下跌，阿里巴巴跌0.77%，百度跌1.56%","text":" 上涨个股（按市值从高到低）：京东涨0.07%，中华电信涨0.25%，中通涨0.63%，腾讯音乐涨0.13%，boss直聘涨2.12%，唯品会涨0.56%，欢聚涨1.52%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-11/doc-inirkuqh7270765.shtml","importance":""},{"id":"wscn3163485","time":1789073355000,"title":"也门胡塞武装占领红海战略要地哈尼什群岛","text":"也门政府官员10日说，在政府海军部队撤出红海战略要地哈尼什群岛后，也门胡塞武装已在岛上部署兵力。当晚，也门政府军将该国西海岸一片区域划定为“作战区”。\n这名匿名政府官员告诉新华社记者，也门政府海军部队10日下午撤出哈尼什群岛后，胡塞武装随即进入，并在岛上建立军事阵地。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4884429","time":1789073344000,"title":"高盛集团测试与Meta关联的数据中心债券需求。","text":"高盛集团测试与Meta关联的数据中心债券需求。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/408857791","importance":"hot"},{"id":"wscn3163484","time":1789073257000,"title":"辛鲍姆喊话美国：别在中期选举中利用墨西哥","text":"针对美方批评墨西哥打击贩毒行动的言论，墨西哥总统辛鲍姆10日表示，美国不应把墨西哥作为其选举政治的工具。\n辛鲍姆在总统府例行记者会上说，美国将于11月举行国会中期选举，“不要在选举活动中利用墨西哥”。墨西哥不介入美国选举进程，“他们也不应该介入墨西哥”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163483","time":1789073201000,"title":"高盛集团测试与Meta关联的数据中心债券需求。\n","text":"高盛集团测试与Meta关联的数据中心债券需求。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163482","time":1789073170000,"title":"WTI原油日内涨幅达8.0%，报103.84美元/桶。\n","text":"WTI原油日内涨幅达8.0%，报103.84美元/桶。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163481","time":1789072641000,"title":"WTI原油日内涨幅达7.5%，报103.33美元/桶；布伦特原油日内涨幅达7.5%，报108.85美元/桶。\n","text":"WTI原油日内涨幅达7.5%，报103.33美元/桶；布伦特原油日内涨幅达7.5%，报108.85美元/桶。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163480","time":1789072235000,"title":"新兴市场外汇指数创7月份以来最大单日跌幅，投资者关注美联储加息风险","text":"明晟公司MSCI新兴市场股票指数跌0.6%，发展中国家外汇指数跌0.2%。\n国际油价集体大涨，WTI原油期货在电子交易盘涨7.27%报103.03美元/桶，布伦特原油期货涨7.04%报108.34美元/桶。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"xq4884422","time":1789072102000,"title":"美国全国平均柴油价格首次突破每加仑6美元。","text":"美国全国平均柴油价格首次突破每加仑6美元。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/408856396","importance":"important"},{"id":"sinacomos:nirkuqm5480799","time":1789072010000,"title":"阿联酋计划在德国投资460亿美元 涵盖AI和能源等领域","text":" 阿拉伯联合酋长国计划在德国投资400亿 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
