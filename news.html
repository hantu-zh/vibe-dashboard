中断的威胁。SK海力士周三在声明中称，工会约57%的成员批准了经修订的薪资及集体谈判协议。根据最新协议，利润分成奖金的50%将以现金形式发放，另外50%将以公司股票形式发放，取代此前提议的40%现金、60%股票方案。该协议化解了这家公司的劳资纠纷，这是在工会成员8月份否决了原来的初步协议后，双方重新谈判约两周的成果。劳资双方还同意，如果SK海力士出现亏损，员工将暂时递延3%的薪资，待公司业务好转后再恢复全额发放。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:niryzky3441336","time":1789543292000,"title":"5%美债收益率风暴来袭！再融资炸弹倒计时开启，谁会是第一个牺牲品？","text":" 智通财经注意到，10 年期美国国债收益率周二升至 2007 年以来最高水平，将借贷成本推入可能暴露金融体系部分最薄弱环节的区间。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hkstock/ggscyd/2026-09-16/doc-iniryzky3441336.shtml","importance":""},{"id":"sinacomos:nirzfsy2882042","time":1789543275000,"title":"飞书aily与豆包工作融合后将大幅降价","text":"界面新闻记者 | 肖芳界面新闻编辑 | 文姝琪 界面新闻从多位知情人士处获悉，目前，豆包工作与飞书aily实现深度融合，未来将完全按实际token消耗额度计费。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-16/doc-inirzfsy2882042.shtml","importance":"hot"},{"id":"wscn3166070","time":1789543238000,"title":"飞书aily与豆包工作融合后将大幅降价","text":"据界面新闻，从多位知情人士处获悉，目前，豆包工作与飞书aily实现深度融合，未来将完全按实际token消耗额度计费。新产品预计将会大幅降低售卖价格。目前，豆包工作支持接入的模型均为字节跳动自研的豆包系列模型。豆包还在研发尺寸更小、性能更好的模型来帮助企业客户降本。同时，豆包工作后续将开放企业客户接入其自行采购的大模型API，企业可直接和模型厂商结算。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3166069","time":1789543170000,"title":"百度搭子生态平台开放入驻，承诺永不抽佣","text":"9月16日消息，在2026智能经济论坛上，百度智能云宣布把百度搭子打造为完全开放的生态平台，百度搭子生态平台同步开放入驻、启动伙伴招募，面向能力提供者开放连接器、技能、套件、硬件四大能力入驻，并承诺永远不向伙伴抽佣。（界面新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirzfsy2882386","time":1789543134000,"title":"国家开发银行福建省分行被罚84万元：违反金融统计相关规定","text":" 9月16日金融一线消息，中国人民银行福建省分行行政处罚决定信息公示表显示，国家开发银行福建省分行因违反金融统计相关规定，受到警告，并被罚款84万元。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jryx/fd/2026-09-16/doc-inirzfsy2882386.shtml","importance":""},{"id":"sinacomos:nirzfsz4827098
