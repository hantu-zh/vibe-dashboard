dy/article/L6I8HS340552HNAY.html","importance":""},{"id":"sinacomos:nirmvzz2102599","time":1789109691000,"title":"日经225指数周五收跌1.9% 受美联储加息预期与地缘风险双重打击","text":" 周五，日本东京股市遭遇重挫，日经225指数收盘下跌1.9%，报64011.34点。受到隔夜美股走弱及通胀忧虑加剧的影响，市场情绪全线承压，盘中日经指数一度暴跌逾3%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-11/doc-inirmvzz2102599.shtml","importance":"important"},{"id":"wscn3163718","time":1789109628000,"title":"工信部：将实施汽车标准提升专项行动，引导企业摆脱低价路径依赖","text":"9月11日，工业和信息化部举行新闻发布会，介绍我国智能网联新能源汽车产业发展有关情况。工业和信息化部装备工业一司司长郭守刚在会上表示，下一步，我们将进一步加强部门协同，以钉钉子精神持续推进规范汽车产业竞争秩序工作，为产业高质量发展保驾护航。一是持续规范产业竞争秩序。深入整治行业网络乱象，引导规范新车发布和产品测评活动。对变相延长账期的车企加强督促整改，提升账款支付规范化、制度化水平。加大对涉嫌违规违法行为的监管执法力度，坚决维护健康有序、风清气正的市场环境。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1634637177776","time":1789109603000,"title":"遭香港证监会停牌调查！拨康视云IPO疑被人为操纵，上市以来股价跌超88%","text":"遭香港证监会停牌调查！拨康视云IPO疑被人为操纵，上市以来股价跌超88%","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6I881KV0519APGA.html","importance":"important"},{"id":"wscn3163717","time":1789109542000,"title":"英国经济7月意外增长 为伯纳姆政府带来好消息","text":"尽管家庭能源账单大幅上涨，但英国经济在7月再次实现强劲增长，表现远超预期，各领域经济活动保持稳健。英国国家统计局周五公布，继6月增长0.3%之后，7月国内生产总值(GDP)增长了0.4%。这一结果远超分析师预期的持平。数据表明，经济增长已连续第三个月好于经济学家预期，暗示英国可能打破市场对其在2026年下半年大幅放缓的预期。当月服务业活动增长0.4%，工业生产增长0.2%，建筑业产出增长0.1%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirmvzx5327790","time":1789109534000,"title":"韩国KOSPI指数收跌1.8% 芯片股回落","text":"周五，韩国综合股价指数（KOSPI）走势震荡。KOSPI指数开盘微跌0.2%，报7038.85点。受芯片股大幅回落拖累，盘中跌幅一度迅速扩大，一度挫逾3%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-11/doc-inirmvzx5327790.shtml","importance":""},{"id":"sinacomos:nirmvzz2099696","time":1789109497000,"title":"加息担忧蔓延至全球债券市场","text":"中东冲突升级支撑油价，市场预期美联储或将加息以抑制通胀，长期美债遭到抛售，相关冲击于周五蔓延至全球市场。 美国30年期国债收益率上行1个基点至5.38%...","   {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
