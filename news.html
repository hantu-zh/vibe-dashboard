题为《深刻认识中国金融结构变迁提升金融服务实体经济适配性》。其中指出，当前科技创新活动复杂多元，与多元化的融资结构更加适配。科技型企业一般会经历种子期、初创期、成长期、成熟期等不同阶段，各阶段的风险特征和金融需求有很大差异，需要适配丰富多样的金融市场和金融生态。科技型企业在成长的早期，主要从事前期研发，商业前景不明朗，私募股权和创业投资是非常重要的资金提供者。到了中后期，商业模式逐渐成熟，可以通过银行贷款、债券、股权等多渠道融资。金融市场在为技术前沿、高风险高回报的创新产业提供融资上具有优势，带来对贷款的良性替代和分流。这一变化也将成为常态，不能简单以信贷增速衡量金融支持实体经济的力度。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:niryqve3353289","time":1789522324000,"title":"潘功胜：深刻认识中国金融结构变迁 提升金融服务实体经济适配性","text":"来源：求是 作者：中国人民银行党委书记、行长 深刻认识中国金融结构变迁 提升金融服务实体经济适配性 潘功胜 金融是国民经济的血脉。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/stockptd/2026-09-16/doc-iniryqve3353289.shtml","importance":""},{"id":"sinacomos:niryqvh3104636","time":1789522323000,"title":"央行今日开展1100亿元7天期逆回购操作","text":"9月16日金融一线消息，央行今日发布公告，2026年9月16日中国人民银行以固定利率、数量招标方式开展了1100亿元7天期逆回购操作，全额满足了一级交易商需求。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jryx/bank/2026-09-16/doc-iniryqvh3104636.shtml","importance":"important"},{"id":"wscn3165851","time":1789522312000,"title":"风电板块延续涨势，吉鑫科技、锡华科技均2连板，天顺风能、大金重工、振宏股份、泰胜风能涨幅靠前。\n","text":"风电板块延续涨势，吉鑫科技、锡华科技均2连板，天顺风能、大金重工、振宏股份、泰胜风能涨幅靠前。\n","source":"华尔街见闻","category":"fast","stock":"吉鑫科技,N锡华,天顺风能","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niryqva6580474","time":1789522283000,"title":"华宝基金红利风向标：两市弱势盘整，煤炭股韧性较好","text":"华宝基金红利风向标：两市弱势盘整，煤炭股韧性较好","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/money/fund/etf/2026-09-16/doc-iniryqva6580474.shtml","importance":""},{"id":"sinacomos:niryqvh3100718","time":1789522260000,"title":"快讯：恒指高开0.5% 科指涨0.47% 科网股、存储概念股活跃","text":" 美股周二继续向下，美国长债息率持续上升，不利市场气氛，三大指数均录得跌幅收市。美元走势向上，美国十年期债息企稳5厘水平，金价表现受压，油价则持续向好。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hkstock/marketalerts/2026-09-16/doc-iniryqvh3100718.shtml","importance":""},{"id":"sinacomos:niryqve3351792","
