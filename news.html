2027年度拟申请预算创新高","text":"据日本方面8月7日援引多名相关人士的消息称，日本防卫省计划向财务省申请迄今最高的约8.9万亿日元，作为2027年度的防卫预算。由于包含大量未明确具体金额的申请项目，预计政府年底敲定的预算案中列入的防卫费可能进一步增加。据悉，防卫省申请的预算金额是根据2022年通过的《防卫力整备计划》计算得出的。该文件将2023至2027年度的防卫总开支目标定为43万亿日元。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146947","time":1786150118000,"title":"黎巴嫩：黎以谈判在边界问题等方面取得进展","text":"黎巴嫩总统府8月7日发表声明说，黎巴嫩和以色列日前在意大利首都罗马举行的谈判在边界问题和被扣押人员获释方面取得进展。声明援引黎总统奥恩在内阁会议上的讲话称，本轮谈判围绕停火、边界问题、被扣押人员获释以及“试点区域”撤军相关问题等议题展开。双方在边界问题和被扣押人员获释方面的讨论取得“积极进展”，相关措施有望近期出台。相关方将着手解决停火、“试点区域”问题等剩余议题。 (央视新闻)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nimqccz6652387","time":1786149551000,"title":"从“福利枪”利益链到深层枪支崇拜，泰国为何反复上演枪击悲剧？","text":" 当地时间8月7日上午，泰国暖武里府一所中学发生枪击事件，成为该国今年发生的第二起校园枪击案，折射出该国的枪支管制问题以及深层次的拥枪文化。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimqccz6652387.shtml","importance":""},{"id":"sinacomos:nimqccz6656353","time":1786149515000,"title":"李开复：AI时代，人的优势在“右脑”，做出数据不能预测的事情","text":"当AI逐渐变得远比人类聪明，人类还能做什么？8月7日，在北京大学国家发展研究院举行的李开复《AI未来已来》新书交流会上，零一万物首席执行官李开复就上述问题回答澎湃新闻...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimqccz6656353.shtml","importance":""},{"id":"wscn3146946","time":1786149106000,"title":"浙江海事局启动沿海Ⅰ级防台应急响应","text":"今年第13号台风“白海豚”（强台风级）于8月8日06时在北纬26.9°、东经126.4°，即距温州偏东方向580公里的海面上，中心最大风力14级，中心气压为950百帕，移动方向西偏北，移动速度每小时10—15公里。根据台风态势及走向，浙江海事局决定于8月8日上午8时启动浙江沿海Ⅰ级防台应急响应，提醒相关单位要按照防台预案做好防御台风相关工作，提醒沿海船舶抓紧时间再次对船上关键设施设备开展检查，做好最后的防台准备。 (央视新闻)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nimpwvz4469219","time":1786149074000,"title":"今日视点：理性看待“地王”再现","text":"■王丽新 7月份以来，多个城市核心地块的土拍市场热度不减。 7月28日，上海杨浦八埭头地块经历219轮竞价后，最终以总价161.2亿元、综合楼面价10.2万元/平方米成交...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimpwvz4469219.shtml","importance":""},{"id":"wscn3146945","time":1786148831000,"title":"贷款利率定价基准“换锚” 利率市场化再进一步","text":"近期，多家商业银行落地以DR（存款类金融机构间债券回购利率）为定价基准的企业贷款，标志着我国贷款利率定价基准多元化的探索提速。专家表示，持续丰富贷款定价参考基准，构建多元化基准利率体系，既是稳步推进利率市场化改革的重要举措，也有助于提升货币政策传导效能，更好地服务实体经济各类经营主体。 (中证报)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146943","time":1786148703000,"title":"部分中小银行逆势上调存款利率","text":"在年内多数中小银行延续存款利率下调趋势的背景下，近日，广东、湖北等地部分农商行、村镇银行逆势上调存款利率，涉及一年期至五年期等多个期限的存款品种，调整幅度最高达33个基点。目前中小银行存款利率调整呈现两极分化态势。受访专家认为，在净息差压力之下，中小银行调降存款利率依旧是主流，部分中小银行阶段性调升存款利率，以缓解存款到期流失，但并不普遍。 (证券日报)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nimqccz6660668","time":1786147957000,"title":"深夜重磅！北京五环内购房门槛降低，楼市再迎政策暖风","text":"优化限购、加大公积金支持力度．．．．．．北京深夜祭出重磅楼市新政。 8月7日晚间，北京多部门联合印发通知，明确自8月8日起，非京籍家庭购买五环内商品住房的社保或个税...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimqccz6660668.shtml","importance":"important"},{"id":"1634100373927","time":1786147252000,"title":"BBA降价也卖不动？价格跳水为啥没用了？","text":"BBA降价也卖不动？价格跳水为啥没用了？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L3LHHICJ0519A56K.html","importance":""},{"id":"1638962674470","time":1786147206000,"title":"腾讯、字节、阿里，抢着给打工人配「AI助理」","text":"腾讯、字节、阿里，抢着给打工人配「AI助理」","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L3OSIH7G0539M9HP.html","importance":""},{"id":"1632720887306","time":1786146731000,"title":"你和稳定盈利之间，只差一次认知的跨越","text":"你和稳定盈利之间，只差一次认知的跨越","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L3PUK6HD0519B7K0.html","importance":""},{"id":"1636449384147","time":1786146285000,"title":"深圳前首富林立再出手！华林证券2.02亿元拟控股海航期货","text":"深圳前首富林立再出手！华林证券2.02亿元拟控股海航期货","source":"网易财经","category":"fast","stock":"","url":"https://www.163. 降19%。法国是欧洲主要的玉米生产和出口国。籽粒玉米指收获时以完全成熟、低水分的干燥籽粒为主要产品的玉米类型，主要用于粮食、饲料及工业加工。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146935","time":1786139876000,"title":"大摩对日元转向偏空，干预影响逐渐消退","text":"摩根士丹利外汇策略师对日元转向偏空，他们认为，随着事实证明美日当局支撑日元汇率的措施效果短暂，日元将逐步走弱。当局联手支撑日元仅短暂提振了日元需求，并未扭转其长期下行趋势。因此，策略师在维持中性立场的同时，转为偏空倾向。“除非再次联合干预汇市，否则我们预计美元/日元将逐步走高，”David Adams、Andrew Watrous和Molly Nickolin周五写道。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3146933","time":1786138833000,"title":"三菱日联：建议做多澳元/日元 ，美联储加息押注降温提振套息交易","text":"三菱日联分析师建议做多澳元兑日元，因干预带来的影响正在消退，而交易员削减对美联储加息的押注改善了套息交易的环境。\\n“我们预计澳元/日元将继续收复因干预造成的跌幅，因为基本面尚未出现足以支撑日元持续升值的实质性变化，”MUFG分析师Derek Halpenny、Lee Hardman和Abdul-Ahad Lockhart在报告中写道。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3146932","time":1786138631000,"title":"哥伦比亚新任总统德拉埃斯普列亚宣誓就职","text":"8月7日，哥伦比亚当选总统阿韦拉多·德拉埃斯普列亚在该国第三大城市卡利宣誓就职，任期四年。阿韦拉多·德拉埃斯普列亚现年47岁，是哥伦比亚律师、企业家和右翼政治人物，长期活跃于公共事务领域。他此前在竞选时主张以强硬手段打击犯罪，推行自由市场经济政策。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3146931","time":1786138293000,"title":"阿布扎比国家石油公司：已有15艘旗下船只遭袭，1死20伤","text":"阿布扎比国家石油公司当地时间7日发表声明称，自美以伊冲突爆发以来，该公司已有15艘船只在通过霍尔木兹海峡时遭到导弹和无人机袭击，其中包括本周遇袭的3艘。这些袭击共造成1名船员死亡，另有20人受伤。阿布扎比国家石油公司表示，正与有关部门密切合作，采取一切必要措施保护员工、资产和运营安全，同时持续保障客户供应。该公司强调，航行自由以及商船在国际水域中的安全与畅通通行，必须得到尊重和保护，不应受到任何威胁、骚扰或袭击。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nimpwwc6732646","time":1786137849000,"title":"美国制裁伊朗加密货币交易所 谈判仍在继续","text":" 美国对伊朗加大经济施压，对数字资产交易所以及与伊朗影子银行体系有关的网络实施更多制裁，在有关战争的谈判继续进行之际增加筹码。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwwc6732646.shtml","importance":"important"},{"id":"sinac 9），离岸人民币（CNH）兑美元报6.7429元，较周四纽约尾盘涨47点，日内整体交投于6.75-6.7401元区间，美国非农就业报告发布时显著拉升，本周累涨大约0.13%。\\n日线图上，离岸人民币逼近2023年2月2日最终报价6.7377元、当年2月1日最终报价6.7195元、当年1月16日顶部6.6975元、以及2022年6月3日顶部6.6170元。\\n按季度看，离岸人民币正在测试50季度线（该技术指标目前报6.7740元）。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146923","time":1786136335000,"title":"国际金价在非农日涨约2.4%，本周累涨约7.3%","text":"周五（8月7日）纽约尾盘，现货黄金涨2.37%，报4339.75美元/盎司，亚太盘初以来平滑地持续走高、北京时间20:30发布美国非农就业数据时加速上涨——从4320美元下方拉升至4360美元一线，本周累计上涨7.27%，8月3-4日持平于4050美元附近、5-7日持续上扬。\\n本周，COMEX黄金期货累涨7.16%，报4400.70美元/盎司。\\n现货白银涨3.11%，报63.4555美元/盎司，本周累涨10.29%，整体持续走高。\\nCOMEX白银期货累涨10.29%，报63.720美元/盎司。\\nCOMEX铜期货跌1.83%，报6.586美元/磅，本周累涨1.85%，8月6日欧市早盘曾达到6.8665美元。\\n现货铂金涨1.33%，报1749.38美元/盎司，本周累涨6.14%；现货钯金涨0.64%，报1382.91美元/盎司，本周累涨7.37%。\\n本周，在美股时段交易的费城金银指数累涨19.70%，报368.56点，整体持续走高。\\n在全球市场全天交易的纽约证交所ARCA金矿开采商指数累涨20.16%，报2570.44点，整体持续走高。\\n在美股时段交易的原材料指数累涨7.44%，报249.68点。\\n在美股时段交易的金属与矿业指数累涨7.98%，报295.29点。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146922","time":1786135177000,"title":"加密货币平台Crypto.com与特朗普传媒科技集团将整合合作伙伴关系调整为营销协议。\\n特朗普媒体与科技集团称，将调整协议方向，面向Truth Social用户","text":"加密货币平台Crypto.com与特朗普传媒科技集团将整合合作伙伴关系调整为营销协议。\\n特朗普媒体与科技集团称，将调整协议方向，面向Truth Social用户群体推广Crypto.com的预测市场业务。\\nYorkville American的业务及其现有和未来ETF产品的计划保持不变。\\n特朗普媒体与科技集团已终止与Crypto.com的业务合并协议，于2026年8月7日生效。\\nCrypto.com、特朗普媒体、Yorkville America已共同同意不再推进此前宣布的合作关系。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nimpwvz4427219","time":1786135041000,"title":"特朗普提名的Brett Matsumoto获参议院确认 将出任美国劳工统计局局长","text":" 美国参议院确认Brett Matsumoto出任美国劳工统计局局长。特朗普去年突然解雇前任局长后，这一关键职位如今终于得到填补。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwvz4427219.shtml","importance":""},{"id":"sinacomos:nimpwwc6711155","time":1786134960000,"title":"原油：油价持稳 交易员权衡霍尔木兹海峡谈判和伊朗紧 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '东方', sub: '东方财富'},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = item.text || item.title || '(无内容)';
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
