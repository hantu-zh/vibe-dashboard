技”）证券虚假陈述二审案件，将于下个月开庭审理。上海市信本律师事务所赵敬国律师（执业证号：13...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/gmwq/rightscase/2026-09-16/doc-inirzfsw3364310.shtml","importance":""},{"id":"wscn3166074","time":1789543399000,"title":"河南证监局原党委书记、局长牛雪峰接受纪律审查和监察调查","text":"据中央纪委国家监委驻中国证券监督管理委员会纪检监察组、河南省纪委监委消息：河南证监局原党委书记、局长牛雪峰涉嫌严重违纪违法，目前正接受中央纪委国家监委驻中国证券监督管理委员会纪检监察组纪律审查和河南省漯河市监委监察调查。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirzfsz4830126","time":1789543368000,"title":"山东临淄农村商业银行被罚13.2万元：违反信用信息提供相关管理规定","text":" 9月16日金融一线消息，中国人民银行淄博市分行行政处罚决定信息公示表显示，山东临淄农村商业银行股份有限公司因违反信用信息提供相关管理规定，被罚款13.2万元。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jryx/fd/2026-09-16/doc-inirzfsz4830126.shtml","importance":""},{"id":"wscn3166073","time":1789543337000,"title":"张一鸣成亚洲首富","text":"随着与人工智能相关的财富飙升，传统行业的亿万富翁被超越，字节跳动的张一鸣首次成为了亚洲首富，现年43岁的张一鸣如今净值已突破1050亿美元。根据彭博亿万富豪指数，他的身家已超过印度富豪高塔姆·阿达尼。与2019年3月彭博首次追踪时记录的130亿美元相比，张一鸣的财富增长了约七倍。（界面新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3166072","time":1789543333000,"title":"SK海力士与工会达成协议 将员工现金分红比例上调至50%","text":"SK海力士与工会达成协议，同意以现金形式支付一半的利润分红，解除了该全球第二大存储芯片制造商生产活动中断的威胁。SK海力士周三在声明中称，工会约57%的成员批准了经修订的薪资及集体谈判协议。根据最新协议，利润分成奖金的50%将以现金形式发放，另外50%将以公司股票形式发放，取代此前提议的40%现金、60%股票方案。该协议化解了这家公司的劳资纠纷，这是在工会成员8月份否决了原来的初步协议后，双方重新谈判约两周的成果。劳资双方还同意，如果SK海力士出现亏损，员工将暂时递延3%的薪资，待公司业务好转后再恢复全额发放。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirzfsy2882042","time":1789543275000,"title":"飞书aily与豆包工作融合后将大幅降价","text":"界面新闻记者 | 肖芳界面新闻编辑 | 文姝琪 界面新闻从多位知情人士处获悉，目前，豆包工作与飞书aily实现深度融合，未来将完全按实际token消耗额度计费。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-16/doc-inirzfsy2882042.shtml","importance":"hot"},{"id":"wscn3166070","time":1789543238000,"title":"飞书aily与豆包工作融合后将大幅降价","text":"据界面新闻，从多位知情人士处获悉，目前，豆包工作与飞书aily实现深度融合，未来将完全按实际token消耗额度计费。新产品预计将会大幅降低售卖价格。目前，豆包工作支持接入的模型均为字节跳动自研的豆包系列模型。豆包还在研发尺寸更小、性能更好的模型来帮助企业客户降本。同时，豆包工作后续将开放企业客户接入其自行采购的大模型API，企业可直接和模型厂商结算。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3166069","time":1789543170000,"title":"百度搭子生态平台开放入驻，承诺永不抽佣","text":"9月16日消息，在2026智能经济论坛上，百度智能云宣布把百度搭子打造为完全开放的生态平台，百度搭子生态平台同步开放入驻、启动伙伴招募，面向能力提供者开放连接器、技能、套件、硬件四大能力入驻，并承诺永远不向伙伴抽佣。（界面新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirzfsy2882386","time":1789543134000,"title":"国家开发银行福建省分行被罚84万元：违反金融统计相关规定","text":" 9月16日金融一线消息，中国人民银行福建省分行行政处罚决定信息公示表显示，国家开发银行福建省分行因违反金融统计相关规定，受到警告，并被罚款84万元。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jryx/fd/2026-09-16/doc-inirzfsy2882386.shtml","importance":""},{"id":"sinacomos:nirzfsz4827098","time":1789543033000,"title":"福建连江农村商业银行被罚574万元：违反账户管理规定等","text":" 9月16日金融一线消息，中国人民银行福建省分行行政处罚决定信息公示表显示，福建连江农村商业银行股份有限公司因以下违法行为类型，受到警告并被罚款574万元。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jryx/fd/2026-09-16/doc-inirzfsz4827098.shtml","importance":""},{"id":"wscn3166066","time":1789543014000,"title":"乌兹别克斯坦央行将基准利率维持在14%不变。\n","text":"乌兹别克斯坦央行将基准利率维持在14%不变。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1637146145384","time":1789542961000,"title":"收评：科创50指数震荡反弹涨超4% 全市场超4100只个股上涨","text":"收评：科创50指数震荡反弹涨超4% 全市场超4100只个股上涨","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/money/article/L6V5HGT000258105.html","importance":""},{"id":"1639923901880","time":1789542925000,"title":"AI的进步，如何成为企业的进步？","text":"AI的进步，如何成为企业的进步？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6V5EB4D0519A8F3.html","importance":""},{"id":"sinacomos:nir
