公布的调查显示，9月消费者信心指数初值从51.7降至47.8，低于调查中所有经济学家的预期。消费者预计未来一年物价将上涨4.6%，高于前月预期的4%。他们还预计，未来五到十年物价涨幅为3.4%，略高于8月的预期。随着汽油价格转而上涨，消费者信心继续下滑。在与伊朗的战争持续之际，美国汽油价格升至历年9月同期最高水平。油价上涨侵蚀了美国人的收入，并进一步加剧了他们对生活成本的担忧。周五早些时候公布的另一组数据显示，美国8月消费者价格指数较上年同期上涨3.4%。剔除食品和能源的核心消费者价格8月环比上涨0.3%。随着美联储采取行动遏制通胀，自2023年以来首次有过半消费者预计未来一年利率会上升。消费者对未来一年经济的看法9月也进一步恶化，降至2022年7月以来最低水平。现状指标从前月的51.9降至50.9，预期指数则从51.5大幅降至45.8。消费者对当前及未来财务状况的看法均有所恶化。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409011960","importance":"important"},{"id":"sinacomos:nirnnxt2129850","time":1789136902000,"title":"8.17亿元可转债造假：一家上市公司的十年“医疗梦”如何变成刑事案？","text":"来源：@华夏时报微博华夏时报（www.chinatimes.net.cn）记者 于娜 北京报道从10.87亿元高调跨界智慧医疗，到凭借注水财报完成8.17亿元可转债发行...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/wbstock/2026-09-11/doc-inirnnxt2129850.shtml","importance":""},{"id":"sinacomos:nirnnxw5671412","time":1789136863000,"title":"净利增940％，股价60日跌41％：嘉元科技的“剪刀差”从何而来？","text":"来源：@华夏时报微博华夏时报（www.chinatimes.net.cn）记者 黄海婷 胡梦然 深圳摄影报道9月11日，嘉元科技（688388.SH）收盘报26.95元，下跌2.36%，全天成交8.20亿元...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/wbstock/2026-09-11/doc-inirnnxw5671412.shtml","importance":""},{"id":"sinacomos:nirnnxt2126761","time":1789136544000,"title":"深夜，全线大涨！美联储加息，大消息！","text":"美股大涨。重磅数据发布，美联储加息概率大增。 9月11日，美股开盘大涨。截至发稿，道指、纳斯达克指数、标普500指数均涨超1%。板块方面，科技股普涨，苹果、META涨超2%...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/wm/2026-09-11/doc-inirnnxt2126761.shtml","importance":"important"},{"id":"wscn3164019","time":1789136533000,"title":"哈马斯下属卡桑旅证实其高级成员被以军打死","text":"巴勒斯坦伊斯兰抵抗运动（哈马斯）下属武装派别卡桑旅11日发表声明说，卡桑旅总军事委员会成员兼汗尤尼斯旅高级指挥官穆罕默德·亚祖里10日在以色列“暗杀行动”中身亡。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4886574","time":1789136485000,"title":"甲骨文股价转跌，抹去此前8.5%的涨幅。","text":"甲骨文股价转跌，抹去此前8.5%的涨幅。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/51244 stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164006","time":1789135277000,"title":"美联储、FDIC围绕第三方风险管理征求意见。\n","text":"美联储、FDIC围绕第三方风险管理征求意见。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164005","time":1789135236000,"title":"与投资者唱反调 经济学家预计美联储将按兵不动","text":"调查显示，多数经济学家预计，美联储将在本月会议上维持利率不变，并一直按兵不动至2027年底，尽管市场对加息的押注已经升温。经济学家认为，通胀有所降温，加上美国中期选举临近，这些因素可能促使决策者在9月15日至16日会议上维持利率不变，并在10月再次按兵不动。接受调查的48名经济学家中，仅13人预计本月会加息。该调查于9月4日至9日进行，早于周五最新通胀数据的公布。这与投资者的看法形成鲜明反差。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164004","time":1789135200000,"title":"美国9月密歇根大学消费者信心指数初值 47.8，预期 51，前值 51.7。\n","text":"美国9月密歇根大学消费者信心指数初值 47.8，预期 51，前值 51.7。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164003","time":1789135200000,"title":"美国9月密歇根大学消费者预期指数初值 45.8，预期 51，前值 51.5。\n","text":"美国9月密歇根大学消费者预期指数初值 45.8，预期 51，前值 51.5。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164002","time":1789135200000,"title":"美国9月密歇根大学5年通胀预期初值 3.4，预期 3.3，前值 3.3。\n","text":"美国9月密歇根大学5年通胀预期初值 3.4，预期 3.3，前值 3.3。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164001","time":1789135200000,"title":"美国9月密歇根大学1年通胀预期初值 4.6，预期 4.2，前值 4。\n","text":"美国9月密歇根大学1年通胀预期初值 4.6，预期 4.2，前值 4。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164000","time":1789135200000,"title":"美国9月密歇根大学消费者现况指数初值 50.9，预期 51.6，前值 51.9。\n","text":"美国9月密歇根大学消费者现况指数初值 50.9，预期 51.6，前值 51.9。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"ths679843347","time":1789135200000,"ti 牛座）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163996","time":1789134984000,"title":"成都“词元券”新政公开征求意见 最高补贴50%、年度发放总额1亿元","text":"成都市经信局市新经济委牵头起草了《成都市词元券实施方案（试行）（征求意见稿）》，现挂网公开征求社会公众意见，期限为30日。《方案》包含支持对象及标准、词元券服务机构、申领流程、兑现方式等内容，其中单个主体词元券支持额度不超过实际购买金额30%（小微企业不超过50%）、最高200万元，全市每年发放词元券总额不超过1亿元。（成都市经济和信息化局官微）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163995","time":1789134826000,"title":"俄罗斯启动5G网络商用服务","text":"俄罗斯数字发展、通信与大众传媒部9月11日宣布，俄罗斯启动第五代移动通信技术（5G）服务。俄数字发展、通信与大众传媒部说，在第一阶段，5G网络已在莫斯科、圣彼得堡和叶卡捷琳堡等16个城市开通，惠及约1000万人，由俄移动通信系统公司、梅加丰电信公司等俄罗斯四大运营商提供服务。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163994","time":1789134673000,"title":"提醒：北京时间22:00，将公布美国9月密歇根大学消费者信心指数初值、美国9月密歇根大学1年通胀预期初值、美国9月密歇根大学5年通胀预期初值。\n","text":"提醒：北京时间22:00，将公布美国9月密歇根大学消费者信心指数初值、美国9月密歇根大学1年通胀预期初值、美国9月密歇根大学5年通胀预期初值。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163993","time":1789134520000,"title":"哈塞特：如果美联储加息，我确信特朗普会有看法","text":"白宫经济顾问哈塞特：尊重美联储的独立性，高度评价沃什。\n过去三个月通胀明显在减速。\n如果美联储加息，我确信特朗普会有看法。\n预算协调是发放5000美元特朗普补贴的途径之一。\n能够以财政上负责任的方式派发5,000美元。\n特朗普对5000美元的提议非常认真。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1638738632368","time":1789134511000,"title":"核心CPI超预期、美联储三年来首次加息\"只差官宣\"","text":"核心CPI超预期、美联储三年来首次加息\"只差官宣\"","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6J0062P05198UNI.html","importance":"important"},{"id":"wscn3163992","time":1789134436000,"title":"伊朗：将在阿曼与伊拉克和海湾国家举行会晤。\n","text":"伊朗：将在阿曼与伊拉克和海湾国家举行会晤。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163991","time":1789134419000,"title":"费   var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
