能应用软件开发等。企查查股权穿透显示，该公司由通鼎互联间接全资持股。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165418","time":1789462359000,"title":"国家超算互联网：累计上线智能体500余个","text":"9月15日，在2026算力网发展大会上，曙光智算总裁何牧君表示，目前，超算互联网平台已建成材料计算、工业仿真等6大智能体矩阵，覆盖170余个核心计算场景，累计上线智能体500余个、技能1万余项。他表示，在国家超算互联网上用户无需精通编程，依托1.6万余个内容组件与对话式构建工具，即可像搭积木一样组建专属科学计算智能体。（界面新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxatw3685948","time":1789462332000,"title":"传OpenAI斥资3亿美元收购初创企业Glass Imaging","text":"这家初创公司主打智能手机高品质摄像头。 据报道，OpenAI 已完成对 Glass Imaging 的收购，交易对价 3 亿美元。 这家由苹果前员工创立的初创企业...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxatw3685948.shtml","importance":"hot"},{"id":"sinacomos:nirxatu6912367","time":1789462262000,"title":"美银调查：投资者仍看好宏观与AI资本开支","text":" 美国银行一项调查显示，投资者依旧相信宏观经济向好、人工智能资本开支将高速增长，但债券收益率无序飙升以及民主党中期选举大获全胜的风险，令市场心态趋于谨慎。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxatu6912367.shtml","importance":"important"},{"id":"wscn3165417","time":1789462244000,"title":"日本增长战略大臣城内实重申支持“高压经济”理念","text":"日本增长战略大臣城内实表示，他个人支持那些主张日本应推行“高压经济”的经济学家。在被问及如何看待当前财政状况和货币政策背景下的“高压经济”概念时，城内实表示，近来他较少使用这一表述，因为不同人士对其定义并不一致。城内实表示，日本央行在保持独立性的同时与政府保持沟通十分重要。政府将通过多项指标评估日本财政状况，包括债务占GDP比重、净利息支出以及国债发行规模。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxatw3683983","time":1789462209000,"title":"华尔街解读AI放缓浪潮下的赢家与输家","text":"猜猜谁会乐见 AI 研发节奏放缓？软件板块的投资者！企业软件公司，例如赛富时（Salesforce）、Shopify、ServiceNow、Figma，周一股价悉数走高。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxatw3683983.shtml","importance":""},{"id":"wscn3165413","time":1789462107000,"title":"乌外长：乌克兰愿意与俄罗斯达成能源停火协议","text":"当地时间15日，乌克兰外长瑟比加表示，乌方愿意与俄
