闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3149907","time":1786753005000,"title":"美国密歇根州发生枪击事件，已致包含嫌犯在内6人死亡","text":"当地时间8月14日，央视记者获悉，美国密歇根州米索基县发生一起枪击事件，造成5人死亡、1人受伤。此外，39岁的嫌疑人查德·希克曼也确认死亡。\\n密歇根州警方表示，警员接到一处住宅发生枪击的报告后赶往现场，发现3人死亡、1人受伤，伤者被送往医院。嫌疑人在警方抵达前逃离现场。随后，警方在另一处住宅发现第4名死者，并在一片林区发现嫌疑人及另一人的遗体。目前警方尚未公布死者的具体死因，该事件仍在调查中。（央视新闻）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:niniyyv2382012","time":1786752948000,"title":"上半年各地财政运行情况如何？31个省区市“晒账本”","text":"来源：人民日报海外版 原标题：31个省区市“晒账本”—— 上半年地方财政运行平稳（锐财经） 近年来，安徽省安庆市岳西县持续织密农村公路网络，完善山区交通基础设施...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-15/doc-ininiyyv2382012.shtml","importance":""},{"id":"wscn3149906","time":1786752776000,"title":"中国驻登巴萨总领馆提醒领区中国公民注意防范地震与海啸","text":"根据印尼气象、气候和地球物理局（BMKG）报告，2026年8月15日5点58分，印度尼西亚东努沙登加拉省纳格克县东北方向30公里处海域发生7.7级地震，震源深度15km，可能引发海啸。驻登巴萨总领馆提醒领区中国公民，特别是在东努省拉布安巴焦一带的游客，保持高度警惕，密切关注当地地震预警信息以及防灾预警，谨防余震和海啸风险，远离海边。如有需要，请及时报警或联系总领馆求助。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3149905","time":1786752743000,"title":"胡塞武装称袭击沙特油企设施和也门政府军控制地区","text":"也门胡塞武装14日说，该组织当天使用无人机袭击沙特南部一处石油设施，并向也门政府军控制的摩卡港相关目标发射导弹，造成人员伤亡。据胡塞武装控制的萨巴通讯社报道，该组织袭击沙特奈季兰地区的阿美石油公司设施，“成功击中目标”。胡塞武装军事官员称，此次袭击是对沙特战机“侵入也门萨达省上空的回应”。萨达省与沙特接壤，是胡塞武装控制区和主要据点。沙特方面尚未对胡塞武装的说法作出回应。（新华社）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niniyyx8841052","time":1786752574000,"title":"社保基金、QFII调仓动向曝光！QFII大幅加仓的绩优股出炉","text":" 机构持股变动，历来是投资者密切关注的市场风向。随着上市公司半年报集中披露，社保基金、QFII等机构的持仓脉络陆续显现。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/zqgd/2026-08-15/doc-ininiyyx8841052.shtml","importance":""},{"id":"sinacomos:niniyyv2384025","time":1786752370000,"title":"贵州茅台交出市场化改革成绩单，“i茅台”营收占 function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
