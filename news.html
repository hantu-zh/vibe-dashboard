经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6NP79LQ0519875F.html","importance":""},{"id":"wscn3164422","time":1789295210000,"title":"智谱宣布完成约50亿美元融资","text":"智谱于9月13日宣布完成约50亿美元融资，包括约20亿美元股份配售及约30亿美元可转债发行，募集资金将用于下一代模型研发、算力基础设施及业务拓展等。据港交所公告，智谱股份配售价为每股714港元，较公告前收盘价折让约9.96%，配售股份占扩大后已发行股本约4.50%。可转债采用零息结构，发行价为本金的100.5%，到期按本金赎回；初始转股价为每股892.50港元，较配售价溢价25%，较公告前收盘价溢价约12.55%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164421","time":1789294892000,"title":"伊朗称霍尔木兹海峡或将开新通道","text":"伊朗外长阿拉格齐今天（9月13日）在接受媒体采访时表示，9月14日在阿曼举行的会议将重点讨论霍尔木兹海峡内一条新的海上通道。伊朗届时将向与会国家介绍伊朗与阿曼达成的相关协议细节及新通道路线图。阿拉格齐强调，伊朗与阿曼达成协议并不意味着霍尔木兹海峡将重新开放。伊朗重开海峡的前提，是美国重新履行其在“伊斯兰堡谅解备忘录”中作出的承诺。伊朗认为，维护地区安全与稳定的责任应完全由地区国家承担。伊方希望此次对话能够为地区国家今后就共同关心的问题展开磋商创造条件。（CCTV国际时讯）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1635498054164","time":1789294301000,"title":"如果美联储加息，A股这些板块务必要注意！","text":"如果美联储加息，A股这些板块务必要注意！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6NOCCFJ0519B7K0.html","importance":"important"},{"id":"wscn3164420","time":1789294157000,"title":"中国工程院院士邬江兴：VLEO超低轨是地球空间最后战略新资源层","text":"9月13日，在浦江创新论坛-太空算力产业生态论坛上，中国工程院院士邬江兴指出，VLEO超低轨道是地球空间最后一片战略新资源层。邬江兴表示，2026-2030年是中国换道发展的关键窗口期，仅有五年，必须实现从技术试验到规模化应用的完整跨越。如若错失机遇，轨道、频谱资源与国际标准将被抢先占据，中国将陷入被动跟跑的不利格局。VLEO，即超低地球轨道，通常指航天器运行于距地面200-350公里的空间区间。（界面）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1638882238176","time":1789294104000,"title":"冲泡奶茶巨头试水现制茶饮，香飘飘布局9家线下门店，传统冲泡业务受冲击","text":"冲泡奶茶巨头试水现制茶饮，香飘飘布局9家线下门店，传统冲泡业务受冲击","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6NO6FEC0511U82T.html","importance":""},{"id":"1636867635206","time":1789293636000,"title":"智本社X财新，双会员5.9折","text":"智本社X财新，双会员5.9折","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();



function renderEmTicker() {
    var list = document.getElementById('em-ticker-list');
    var bar = document.getElementById('em-ticker');
    var dateEl = document.getElementById('em-ticker-date');
    if (!list || !bar) { return; }
    var all = (typeof _rawData !== 'undefined' && Array.isArray(_rawData)) ? _rawData : [];
    var em = all.filter(function (x) { return x.source === '东方财富'; });
    var useEm = em.length > 0;
    var items = useEm ? em : all.slice(0, 30);
    if (items.length === 0) { bar.style.display = 'none'; return; }
    if (dateEl) {
      var now = new Date();
      dateEl.textContent = now.getFullYear() + '/' +
        ('0' + (now.getMonth() + 1)).slice(-2) + '/' +
        ('0' + now.getDate()).slice(-2);
    }
    function fmt(t) {
      if (!t) { return ''; }
      var d = new Date(t);
      var h = ('0' + d.getHours()).slice(-2);
      var m = ('0' + d.getMinutes()).slice(-2);
      return h + ':' + m;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    var html = '';
    items.slice(0, 40).forEach(function (x) {
      var t = fmt(x.time);
      var st = x.stock ? ('<span class="t-stock">[' + esc(x.stock) + ']</span>') : '';
      var ti = esc(x.title || x.text || '');
      var url = x.url ? x.url : 'https://kuaixun.eastmoney.com/';
      html += '<div class="em-ticker-item"><div class="em-item-bar">' +
        '<span class="t-time">' + t + '</span>' + st +
        '<a class="t-title" href="' + esc(url) + '" target="_blank" rel="noopener">' + ti + '</a>' +
        '</div></div>';
    });
    list.innerHTML = html || '<div class="em-ticker-empty">暂无快讯</div>';
  }
  renderEmTicker();

// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
