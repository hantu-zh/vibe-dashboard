更紧密合作，并将北极列为“旗舰联合项目”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3166131","time":1789547910000,"title":"报道：澳大利亚拟收紧家庭签证以遏制移民增长","text":"澳大利亚政府定于周四公布削减移民规模的计划，其中包括加大力度打击签证逾期滞留者，并收紧家庭团聚类签证规定。澳大利亚内政部长Tony Burke将在全国新闻俱乐部发表一场一再推迟的演讲，阐述相关改革。演讲题为《移民项目的管理工作：谁来、谁留、谁走》。新计划将重点针对通过不断转换签证类别来延长在澳居留时间的人士，以及留学生、临时工人和他们的家属。澳大利亚政府的目标是将本财年净移民人数控制在约24.5万人，这一目标是在今年5月公布的预算案中设定的。近年来，澳大利亚实际移民人数持续超过政府自身设定的目标，也因此招致政治右翼的批评。（澳大利亚金融评论报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1634560622322","time":1789547762000,"title":"河南证监局原局长牛雪峰，卸任15个月后被查","text":"河南证监局原局长牛雪峰，卸任15个月后被查","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6VA3Q940519APGA.html","importance":""},{"id":"wscn3166128","time":1789547752000,"title":"近一月约450亿元资金流入硬科技板块","text":"9月16日，A股市场迎来大反攻，通信、半导体概念股集体爆发。在A股近期的震荡调整行情中，资金借道ETF逆势大幅流入硬科技板块。Wind数据显示，近一个月（8月17日~9月15日），科创50、通信、芯片半导体、人工智能相关主题ETF合计吸金约450亿元。（每经）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166127","time":1789547737000,"title":"通鼎互联：股票交易异常波动 无应披露未披露重大事项","text":"通鼎互联公告称，公司股票于2026年9月14日、9月15日、9月16日连续三个交易日收盘价格跌幅偏离值累计超过20%，属于股票交易异常波动情形。经自查并向控股股东、实际控制人核实，公司目前日常经营情况正常，未发生重大变化，除已披露事项外，不存在应披露未披露的重大信息。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166125","time":1789547414000,"title":"在岸人民币兑美元北京时间16:30官方收报6.7064，较上一交易日官方收盘价涨70点，较上日夜盘收盘涨48点。\n","text":"在岸人民币兑美元北京时间16:30官方收报6.7064，较上一交易日官方收盘价涨70点，较上日夜盘收盘涨48点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166124","time":1789547411000,"title":"英国7月DCLG房价指数同比 1.4%，前值 2%。\n","text":"英国7月DCLG房价指数同比 1.4%，前值 2%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id
