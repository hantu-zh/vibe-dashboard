有那么简单。\n据了解，本轮涨价主要由短期供需错配、原材料波动、海外集中采购和产能建设周期共同造成，并不代表储能行业长期成本曲线发生逆转。而业内人士普遍的观点是，随着技术创新、产业链成熟以及锂电、钠电相互制衡，未来储能系统成本仍将趋势性下降。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3162649","time":1788962851000,"title":"法国监管机构：法国或将继续增加可再生能源来抑制电价","text":"据法国能源监管机构称，法国可能会继续增加可再生能源装机容量，以遏制消费者的用电成本，同时确保政府政策能够支持电力需求。\n法国能源监管委员会（CRE）表示，政府向太阳能和风能项目支付的额外补贴成本，短期内不会超过消费者从较低市场电价中获得的收益。\nCRE表示，自2020年以来推广的太阳能和风力发电场，使法国用户去年的电费开支节省了约80亿欧元，而同期政府对可再生能源生产商的补贴总额为62亿欧元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1636350672519","time":1788962750000,"title":"英国再面临通胀上行压力","text":"英国再面临通胀上行压力","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6DS263Q0519DTSV.html","importance":""},{"id":"wscn3162648","time":1788962709000,"title":"欧盟批准超1亿欧元援助以加强西班牙休达边境管控","text":"当地时间9月9日，欧盟委员会批准向西班牙提供1.147亿欧元紧急援助，用于加强北非飞地休达的边境管控，并加快相关人员遣返进程。这笔资金将用于强化边境安全设施以及相关人员的接收、甄别和遣返工作。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirfytq3526528","time":1788962688000,"title":"智库警示：英国AI数据中心创造岗位远低于科技行业预期","text":"核心要点经济智库 Verdant 研究发现，AI 数据中心新增岗位可能仅为行业预测规模的四分之一。Verdant 测算，到 2035 年英国数据中心仅会创造约 1 万个永久性工作岗位。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-09/doc-inirfytq3526528.shtml","importance":""},{"id":"1637170140065","time":1788962573000,"title":"字节阿里腾讯等大厂“忙筹钱”","text":"字节阿里腾讯等大厂“忙筹钱”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6DRSO6L0519A3EN.html","importance":""},{"id":"1637565261681","time":1788962411000,"title":"美国发公告指责中国AI企业对美开展“工业规模”蒸馏，获取美前沿模型能力，商务部回应：典型的双重标准，美企报告披露大量蒸馏中国模型","text":"美国发公告指责中国AI企业对美开展“工业规模”蒸馏，获取美前沿模型能力，商务部回应：典型的双重标准，美企报告披露大量蒸馏中国模型","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/money/article/L6DRSHP900258105.htm <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;

var _activeSource = null;
var _activeSourceIdx = 0;

  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}

  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},

  {label: '华尔街', sub: '华尔街见闻'}

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });

    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();
