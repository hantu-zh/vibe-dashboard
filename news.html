","category":"fast","stock":"","url":"https://www.163.com/dy/article/L7024DO00519A56K.html","importance":""},{"id":"wscn3166364","time":1789572919000,"title":"特朗普提名的美国卫生局局长人选：疫苗不会导致自闭症","text":"美国总统特朗普提名的卫生局局长人选妮可·萨菲尔（Nicole Saphier）在参议院卫生委员会确认听证会上表示，她不认为儿童疫苗接种会导致自闭症。萨菲尔支持“普遍”接种乙肝疫苗，并表示现有证据表明出生剂量是安全有效的，但她并未明确主张推荐出生剂量。根据其道德协议，萨菲尔申报了包括麦当劳公司在内的投资，若获确认，她将剥离这些持股。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166363","time":1789572870000,"title":"美国合众银行：AI竞赛放缓为贷款机构提供更多“喘息空间”","text":"美国合众银行（U.S. Bancorp）首席执行官凯迪娅（Gunjan Kedia）表示，呼吁放缓人工智能（AI）竞赛的声音正在使那些实际部署这些工具的公司受益。\n“我们的应用场景并不需要最复杂的前沿模型，”凯迪娅在巴克莱银行（Barclays Plc）举办的会议上表示。“因此，我们认为模型升级的放缓不会影响我们的项目。事实上，它反而对我们有帮助。当你不需要大部分算力时，要跟上所有这些模型升级的节奏会有些困难，所以这或许只是给了我们一点‘喘息空间’，让我们能够充分利用已经拥有的技术。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirzwqt4639952","time":1789572801000,"title":"Reddit联合创始人称科技行业在解读AI问题上 “反应迟钝”：“虚假信息四处传播”","text":"核心要点Reddit 联合创始人亚历克西斯・奥哈尼安接受采访表示，科技行业在阐释人工智能风险这件事上 “相当迟钝、脱离大众认知”。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-16/doc-inirzwqt4639952.shtml","importance":""},{"id":"xq4892496","time":1789572764000,"title":"美国财政部拍卖四个月期国库券，中标利率为4.030%，投标倍数为2.72倍。","text":"美国财政部拍卖四个月期国库券，中标利率为4.030%，投标倍数为2.72倍。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409553700","importance":"hot"},{"id":"wscn3166362","time":1789572762000,"title":"擎天租：未来三年目标营收100亿元，连接20余家机器人本体厂商","text":"9月16日，机器人租赁平台擎天租在上海举行首届生态伙伴大会。擎天租CEO李一言表示，目前平台可调度机器人已超过4000台，预计今年年底增至6000台至1万台；过去近一年累计GMV接近35亿元，已连接257家生态合作伙伴。\n李一言披露，擎天租未来三年的目标是实现平台累计营收100亿元，并连接超过20家机器人本体厂商、100家二次开发合作伙伴，建设超过300家城市运营中心和3000家城市授权中心，同时培养超过2000名FDE工程师，拓展超过100家行业标杆客户。（界面）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166361","time":1789572736000,"title":"美国财政部拍卖四个月期国债，
