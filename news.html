":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:niryqve3362701","time":1789522611000,"title":"印尼计划明年启动大宗商品交易所 首先交易金属锡","text":" 印尼金融服务管理局负责该交易所监管的主管Sarjito周二在议会听证会上表示，预计将于明年1月1日颁发矿产和战略性大宗商品交易所（简称Icomex）的营业执照。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-16/doc-iniryqve3362701.shtml","importance":"hot"},{"id":"wscn3165852","time":1789522527000,"title":"潘功胜：不能简单以信贷增速衡量金融支持实体经济的力度","text":"《求是》刊发央行行长潘功胜的署名文章，题为《深刻认识中国金融结构变迁提升金融服务实体经济适配性》。其中指出，当前科技创新活动复杂多元，与多元化的融资结构更加适配。科技型企业一般会经历种子期、初创期、成长期、成熟期等不同阶段，各阶段的风险特征和金融需求有很大差异，需要适配丰富多样的金融市场和金融生态。科技型企业在成长的早期，主要从事前期研发，商业前景不明朗，私募股权和创业投资是非常重要的资金提供者。到了中后期，商业模式逐渐成熟，可以通过银行贷款、债券、股权等多渠道融资。金融市场在为技术前沿、高风险高回报的创新产业提供融资上具有优势，带来对贷款的良性替代和分流。这一变化也将成为常态，不能简单以信贷增速衡量金融支持实体经济的力度。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165851","time":1789522312000,"title":"风电板块延续涨势，吉鑫科技、锡华科技均2连板，天顺风能、大金重工、振宏股份、泰胜风能涨幅靠前。\n","text":"风电板块延续涨势，吉鑫科技、锡华科技均2连板，天顺风能、大金重工、振宏股份、泰胜风能涨幅靠前。\n","source":"华尔街见闻","category":"fast","stock":"吉鑫科技,N锡华,天顺风能","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niryqvh3100718","time":1789522260000,"title":"快讯：恒指高开0.5% 科指涨0.47% 科网股、存储概念股活跃","text":" 美股周二继续向下，美国长债息率持续上升，不利市场气氛，三大指数均录得跌幅收市。美元走势向上，美国十年期债息企稳5厘水平，金价表现受压，油价则持续向好。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hkstock/marketalerts/2026-09-16/doc-iniryqvh3100718.shtml","importance":"hot"},{"id":"wscn3165849","time":1789522212000,"title":"中证转债指数开盘持平。龙星转债、永东转2、泰福转债、特纸转债、奥普转债涨幅居前，分别涨6.79%、3.00%、2.91%、0.90%、0.88%。康泰转2、澳弘","text":"中证转债指数开盘持平。龙星转债、永东转2、泰福转债、特纸转债、奥普转债涨幅居前，分别涨6.79%、3.00%、2.91%、0.90%、0.88%。康泰转2、澳弘转债、天准转债、百畅转债、山石转债跌幅居前，分别跌2.15%、1.12%、1.07%、0.88%、0.78%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1634399441463","time":1789522155000,"title":"
