会副会长李兴乾率团访问俄罗斯】9月9日至12日，中国贸促会副会长李兴乾率团访问俄罗斯，出席第七届中俄中小企业实业论坛。中俄中小企业实业论坛是中俄友好、...","text":"【中国贸促会副会长李兴乾率团访问俄罗斯】9月9日至12日，中国贸促会副会长李兴乾率团访问俄罗斯，出席第七届中俄中小企业实业论坛。中俄中小企业实业论坛是中俄友好、和平与发展委员会框架下重要机制性经贸活动。此次论坛由中俄友好、和平与发展委员会主办，委员会实业家理事会参与承办，中俄政商界约800人参会。作为实业家理事会中方主席单位，中国贸促会组织中国企业家代表团300余人出席论坛，与会代表围绕数字经济、地方合作、创意产业、旅游、电商、农业等领域合作探讨交流，共话合作。在俄期间，李兴乾还赴叶卡捷琳堡访问，拜会我驻叶卡捷琳堡代总领事王童，会见叶卡捷琳堡投资局及有关企业负责人，就加强中俄贸易投资产业合作、密切地方经贸往来等议题进行交流。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409085832","importance":""},{"id":"1632190458671","time":1789273869000,"title":"星宇股份解约107名应届生并非因为上市，实际原因更恶劣","text":"星宇股份解约107名应届生并非因为上市，实际原因更恶劣","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6N4STR90519S08H.html","importance":""},{"id":"1634974869904","time":1789273507000,"title":"打破外资垄断的国产一哥，却从上市第一天起就疯狂造假，上万股民被他骗得团团转","text":"打破外资垄断的国产一哥，却从上市第一天起就疯狂造假，上万股民被他骗得团团转","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6N321U305315IF2.html","importance":""},{"id":"wscn3164401","time":1789272844000,"title":"研究显示三维肿瘤模型有助加快抗癌药研发","text":"英国曼彻斯特大学研究人员近日在《英国癌症杂志》发表论文说，利用生物材料在实验室构建接近人体真实肿瘤环境的三维肿瘤模型，有助于加快抗癌药物研发。不过研究人员也表示，目前这种技术仍无法模拟人体全身的复杂环境，因此在可预见的未来，动物实验仍将在疾病研究以及评估药物疗效和安全性方面发挥重要作用。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4887551","time":1789272834000,"title":"【北京6G空天地一体实验室正式发布】据“北京亦庄”消息，近日，2026中国联通合作伙伴大会连接分论坛在上海举办。会上，在北京市相关部门的指导下，落地在北京经开区...","text":"【北京6G空天地一体实验室正式发布】据“北京亦庄”消息，近日，2026中国联通合作伙伴大会连接分论坛在上海举办。会上，在北京市相关部门的指导下，落地在北京经开区（北京亦庄）的中国联通研究院，联合银河航天、中兴数字星云、蓝箭鸿擎等区内企业，共同发布北京6G空天地一体实验室。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409085086","importance":""},{"id":"xq4887550","time":1789272782000,"title":"【研究显示三维肿瘤模型有助加快抗癌药研发】英国曼彻斯特大学研究人员近日在《英国癌症杂志》发表论文说，利用生物材料在实验室构建接近人体真实肿瘤环境的三维肿瘤模型，...","text":"【研究显示三维肿瘤模型有助加快抗癌药研发】英国曼彻斯特大学研究人员近日在《英国癌症杂志》发表论文说，利用生物材料在实验室构建接近人体真实肿瘤环境的三维肿瘤模型，有助于加快抗癌药物研发。据曼彻斯特大学发布的新闻公报介绍，研究人员分析了以水凝胶等先进生物材料为基础的癌症肿瘤模型。这类材料可起到供细胞附着生长的支架作用，在由其形成的三维结构中加入各种细胞，可构建微型“肿瘤生态系统”，用于模拟分析细胞间相互作用和耐药性等特征。研究人员指出，过去培养癌细胞时经常使用平面材料，难以模拟真实肿瘤内部的复杂环境和细胞相互作用，因此一些在测试中表现良好的候选药物进入后续环节后可能效果不佳。三维肿瘤模型可提供更接近人体实际情况的药物测试环境，帮助筛选更有潜力的候选药物。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409085062","importance":"hot"},{"id":"1636810640068","time":1789272279000,"title":"千亿国信证券董事会换血，56岁张纳沙留任薪酬228万","text":"千亿国信证券董事会换血，56岁张纳沙留任薪酬228万","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6N3CGRN0552C1DU.html","importance":""},{"id":"wscn3164400","time":1789272103000,"title":"SK集团会长崔泰源：蔚山AI数据中心容量已扩大至近900兆瓦","text":"9月13日，据报道，SK集团会长崔泰源表示，该集团正在蔚山建设的AI数据中心容量已扩大至近900兆瓦。其补充称，随着项目推进，该集团计划宣布与全球科技公司建立更多合作伙伴关系。蔚山AI数据中心由SK集团与亚马逊AWS联合开发，预计投资7万亿韩元（52亿美元），计划于2027年下半年投入运营。（界面）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4887546","time":1789272048000,"title":"【SK集团会长崔泰源：蔚山AI数据中心容量已扩大至近900兆瓦】据报道，SK集团会长崔泰源表示，该集团正在蔚山建设的AI数据中心容量已扩大至近900兆瓦。其补充...","text":"【SK集团会长崔泰源：蔚山AI数据中心容量已扩大至近900兆瓦】据报道，SK集团会长崔泰源表示，该集团正在蔚山建设的AI数据中心容量已扩大至近900兆瓦。其补充称，随着项目推进，该集团计划宣布与全球科技公司建立更多合作伙伴关系。蔚山AI数据中心由SK集团与亚马逊AWS联合开发，预计投资7万亿韩元（52亿美元），计划于2027年下半年投入运营。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409084541","importance":"hot"},{"id":"wscn3164399","time":1789271983000,"title":"水利部针对海南启动洪水防御Ⅳ级应急响应","text":"据预报，受南海热带低压影响，9月13日至15日，海南将有大到暴雨，暴雨区内部分中小河流可能发生超警以上洪水。水利部于9月13日10时针对海南启动洪水防御Ⅳ级应急响应，指导督促地方水利部门密切监视南海热带低压影响态势，突出抓好中小水库安全度汛、山洪灾害和中小河流洪水防御。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164398","time":1789270999000,"title":"现代汽车将于2029年推出自研驾驶辅助系统","text":"9月13日消息，现代汽车集团称其正在开发以Atria AI为核心的自研自动驾驶技术。Atria AI是一种端到端人工智能模型，旨在感知周围环境并做出驾驶决策。现代汽车表示，搭载Atria AI的Level 2++车辆量产目标定于2029年下半年。与此同时，该集团计划利用真实道路驾驶数据持续训练和改进其Atria AI，并逐步将该技术推广至量产车辆，长期目标是向Level 4自动驾驶迈进。\n","source":"华尔街见闻","category":"fast","stock" 办公室发布公告称，加拿大总理卡尼将于9月15-17日访问法国斯特拉斯堡和英国利物浦。公告称，加拿大政府正建立多样化的伙伴关系。\n在法国，卡尼将应欧洲议会议长梅措拉邀请在欧洲议会发表讲话、出席欧盟委员会主席冯德莱恩的欧盟“盟情咨文”演讲，并与欧洲议会议员会面，加强加拿大与欧盟在贸易、投资和安全领域的联系。在英国，卡尼将与英国首相伯纳姆首次举行会晤，共同探讨两国关系的优先事项，尤其是在国防、能源、人工智能和关键矿产等领域。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164384","time":1789255602000,"title":"伊朗革命卫队挫败暗杀图谋，击毙4名恐怖分子","text":"伊朗伊斯兰革命卫队“圣城旅”12日发表声明说，当天在伊朗东南部锡斯坦-俾路支斯坦省萨拉万地区打死4名企图实施暗杀行动的恐怖分子。声明说，革命卫队联合情报部门和执法部队当日清晨对该恐怖团伙发起打击，当场打死4名恐怖分子，并在其窝点缴获一批武器、弹药及爆炸物。3名革命卫队成员在行动中丧生。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164379","time":1789254045000,"title":"美国总统称美方与胡塞武装进行通话，胡塞武装暂未回应","text":"美国总统特朗普12日称，美方与也门胡塞武装进行了通话。特朗普称，胡塞武装致电美方并表示不愿与美方战斗，也不希望美方卷入冲突。也门胡塞武装方面暂未对此作出回应。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164385","time":1789254016000,"title":"以军向手无寸铁的巴勒斯坦人开火","text":"当地时间12日，一段目击者用手机拍摄的视频显示，当天，在约旦河西岸，以军向一群手无寸铁的巴勒斯坦人开火，造成一名男子受伤。\n画面中，几名并未携带武器的巴勒斯坦男子正与以军相对而站。以军士兵开枪示警后向这几名男子开火，其中一名男子被以军击中腿部倒地。其他几名巴勒斯坦人试图将受伤男子抬到他们的车辆附近。在这一过程中，以军仍在对他们开火。以军总共向他们开了超过14枪。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"cls2481566","time":1789254000000,"title":"【早报】我国词元消耗量今年将达到10亿亿；英伟达拟斥资100亿美元参投Anthropic IPO","text":"①中国将于2027年接任金砖主席国②我国词元消耗量今年将达到10亿亿③英伟达拟斥资100亿美元参投Anthropic IPO④8月近2000只私募量化多头平均涨近10%⑤雀巢宣布涨价。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2481566","importance":""},{"id":"wscn3164378","time":1789253661000,"title":"也门胡塞武装与沙特互相袭击","text":"也门胡塞武装12日表示，也门多个省份遭到沙特阿拉伯的空袭。也门胡塞武装发言人叶海亚·萨雷亚表示，在过去48小时内，沙特方面的战机对也门塔伊兹省、马里卜省、荷台达省、焦夫省、萨达省等发动129次空袭。叶海亚·萨雷亚称，这些空袭不会得不到回应和惩罚。\n沙特民防部门12日表示，也门胡塞武装对吉赞地区发动袭击，造成两人受伤，多处建筑物和车辆遭到破坏。另有消息称，也门政府军12日表示，对港口城市穆哈的胡塞武装的车辆、武器及人员发动了打击。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164374","time":1789252517000,"title":"金砖国家领导人第十八次会晤新德里宣言（摘要）：重申坚持多边主义，呼吁《联合国气候变化框架公约》和《巴黎协定》所有缔约方继续履行现有承诺，维持和加大应对气候变化的","text":"金砖国家领导人第十八次会晤新德里宣言（摘要）：重申坚持多边主义，呼吁《联合国气候变化框架公约》和《巴黎协定》所有缔约方继续履行现有承诺，维持和加大应对气候变化的努力。进一步重申为实现《联合国气候变化框架公约》目标，通过加强全面和有效落实《巴黎协定》以应对气候变化，体现公平和共同但有区别的责任以及各自能力原则。\n反对不符合国际法的单边、惩罚性、歧视性和保护主义措施，包括碳边境调节机制，并且对这些措施可能削弱各国、特别是发展中国家为应对气候变化带来的负面影响、提高适应能力和韧性的努力表示关切。\n全力支持中国担任2027年金砖主席国并在中国主办金砖国家领导人第十九次会晤。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164373","time":1789252492000,"title":"金砖国家领导人第十八次会晤新德里宣言（摘要）：肯定金砖国家工业渠道7个专门工作组的工作，肯定智能制造和机器人工作组在智能工厂发展、解决方案共享、标准合作和人才培","text":"金砖国家领导人第十八次会晤新德里宣言（摘要）：肯定金砖国家工业渠道7个专门工作组的工作，肯定智能制造和机器人工作组在智能工厂发展、解决方案共享、标准合作和人才培养等方面所做努力。\n认识到人工智能为促进经济增长和实现可持续发展提供了巨大机遇。指出利用人工智能促进经济增长和社会福祉，对于推动各国特别是全球南方国家实现公正、公平、平等和繁荣的未来至关重要。肯定上海世界人工智能大会暨人工智能全球治理高级别会议，认可其在加强人工智能国际合作、智能向善方面的贡献。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164372","time":1789252459000,"title":"金砖国家领导人第十八次会晤新德里宣言（摘要）：国际经济治理体系改革始终是金砖国家关注的优先领域。\n重申迫切需要对布雷顿森林机构进行改革，使之更加敏捷、有效、可信","text":"金砖国家领导人第十八次会晤新德里宣言（摘要）：国际经济治理体系改革始终是金砖国家关注的优先领域。\n重申迫切需要对布雷顿森林机构进行改革，使之更加敏捷、有效、可信、包容、符合目标、公正、负责、具有代表性，提升其合法性。\n新兴市场和发展中经济体在布雷顿森林体系中的话语权与代表性，必须与其在全球经济中的相对地位相匹配。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164380","time":1789251928000,"title":"美军中央司令部：过去60天已引导100艘船只改变航线","text":"当地时间12日，美军中央司令部表示，自美国恢复对伊朗实施封锁以来的过去60天内，美军已引导100艘商业船只改变航线。在未经美军允许的情况下，没有任何船只通过封锁线，美军人员目前仍高度专注于执行这一任务。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164369","time":1789251614000,"title":"SpaceX在纳斯达克100指数的权重预计将提高超过一倍，料带来大量基金买盘","text":"根据纳斯达克Global Index Watch周五晚些时候发布的模拟数据，SpaceX的权重预计将从约1.28%升至约2.82%。最终权重将在本月晚些时候确定。华尔街预计，这一变化将促使追踪该基准的指数基金和交易所交易基金新增数十亿美元的买盘。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164382","time":1789251492000,"title":"伊拉克外长同伊朗外长通话，讨论边境口岸关闭及沙特遭袭事件","text":"9月12日，伊拉克副总理兼外交部长福阿德·侯赛因同伊朗外交部长阿拉格齐通电话。\n据伊拉克外交部消息，双方讨论了伊拉克近期临时关闭部分与伊朗接壤边境口岸的原因及后续安排，并就沙特遭袭及相关调查进展交换意见。双方还讨论了计划在阿曼举行的地区会议。海合会成员国、伊拉克和伊朗将参会，重点讨论霍尔木兹海峡相关问题。侯赛因表示伊拉克支持举行此次会议，并将派代表团参会。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164381","time":1789251450000,"title":"胡塞武装称使用大量弹道导弹和无人机打击沙特军事设施","text":"当地时间13日凌晨，也门胡塞武装军方发言人叶海亚表示，针对沙特方面持续对也门发动军事行动，也门胡塞武装实施军事行动，打击了沙特谢拉拉地区一处军事基地内的武器库以及负责指挥和协调对也门及也门民众军事行动的指挥控制中心。叶海亚说，此次行动使用大量弹道导弹和无人机，目标“遭到精准直接打击”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164368","time":1789251263000,"title":"法国央行就债务问题发表声明，驳斥“虚假信息”","text":"法国央行发表声明，否认其在市场上出售了债务持仓，此前该央行遭到让-吕克·梅朗雄及其极左翼政党的批评。\n该声明是对埃里克·科克雷尔言论的回应，后者称法国央行持有的证券投资组合出现了“令人担忧”的缩减。\n法国央行表示，“自收购以来，这些证券均未在市场上出售”，并愿意向国民议会财政委员会解释其货币政策操作。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164367","time":1789251072000,"title":"欧洲央行行长拉加德：价格冲击将持续更长时间，AI领域估值非常高","text":"欧洲央行行长拉加德表示，欧元区通胀将在一段时间内维持高位。“当前的冲击会持续时间更长。”她说，中东冲突“仍在持续。我们预计，能源价格的波动和压力将继续存在，尽管价格上涨也带来了经济增长放缓的风险。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164365","time":1789250244000,"title":"特斯拉预告将于10月1日举办活动，展示下一代Roadster跑车","text":"特斯拉公司预告将于10月1日举办活动，展示下一代Roadster车型。这是一款小众产品，该公司首席执行官马斯克最早于2017年11月份发布了这款车。这场定于秋季举行的活动一直备受特斯拉车迷期待，并可能进一步引发有关特斯拉与SpaceX合并的猜测。“准备发射”是在呼应SpaceX的火箭发射，而与此同时特斯拉一直利用现场活动来调动客户和投资者的热情。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164364","time":1789250192000,"title":"OpenAI CEO：今年不会上市，不能冒哪怕10%杀死所有人的风险","text":"OpenAI首席执行官Sam Altman表示，公司专注于解决围绕AI技术的安全担忧，今年不会上市。Altman表示，今年进行首次公开募股“时机不合适”，公司要到明年才会上市。\n“我认为，哪怕冒着10%的在本十年结束前杀死所有人的风险，都是不可接受的，”Altman说，“我认为，我们正在进入一个新时代，就像过去迈入其他时代时一样，我们需要采取不同的行动，确保我们所做的事情能够让这一理念造福全人类，同时也要确保没有任何人承担哪怕接近这种程度的风险。”（财富）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164375","time":1789245838000,"title":"沙特称也门胡塞武装袭击造成2人受伤","text":"沙特阿拉伯民防总局12日晚发表声明说，沙特贾赞省图沃勒县当天遭到也门胡塞武装的袭击，造成2人受伤、多栋建筑和一些车辆受损。\n沙特民防总局强调，袭击民用目标公然违反国际人道法，有关方面已按照既定程序处理这一事件。\n也门胡塞武装同日说，在过去48小时内，沙特战机对也门7个省份进行了129次空袭。该武装警告称这些空袭“不会得不到回应和惩罚”。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164376","time":1789243509000,"title":"也门胡塞武装称沙特在过去两天发动129次空袭","text":"也门胡塞武装12日表示，在过去48小时内，沙特战机对也门7个省份进行了129次空袭。\n胡塞武装发言人叶海亚·萨雷亚当天在社交媒体平台发布声明称，沙特空军的F-15战斗机和“台风”战斗机空袭了也门西南部塔伊兹省、东北部马里卜省、红海沿海荷台达省以及北部焦夫省、萨达省、阿姆兰省和哈杰省。\n他警告说，这些空袭“不会得不到回应和惩罚”。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164377","time":1789239051000,"title":"伊朗南部格什姆岛方向传出爆炸声","text":"据伊朗伊斯兰共和国通讯社12日报道，伊朗南部格什姆岛方向两度传出爆炸巨响。\n报道说，爆炸声来自海面。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164371","time":1789237972000,"title":"金砖国家领导人第十八次会晤新德里宣言（摘要）","text":"宣言称，各类贸易限制措施激增，无论是滥施关税和非关税措施，还是以环保为幌子的贸易保护主义，都可能导致全球贸易进一步萎缩，破坏全球供应链，加剧国际经济贸易不确定性，对世界经济发展前景产生负面影响。对单边关税和非关税措施的上升表示严重关切，这些措施扭曲贸易并违反WTO规则。\n谴责实施违背国际法的单边强制措施。重申这些措施尤其是单边经济制裁和次级制裁，对受害国普通民众的发展权、健康权、粮食安全等人权产生深远负面影响，对贫困和弱势群体的影响尤甚，并加深数字鸿沟、加剧环境挑战。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164383","time":1789237322000,"title":"乌官员：乌克兰准备10月举行新一轮乌美俄三方谈判","text":"乌克兰总统办公室主任布达诺夫当地时间12日表示，乌克兰正准备在10月举行新一轮谈判，谈判将采取乌克兰、俄罗斯和美国三方参与的形式。布达诺夫没有透露未来谈判是否将在中东等地举行等具体信息。\n此前一天，俄罗斯总统新闻秘书佩斯科夫在接受采访时表示，克里姆林宫预计，在近期俄罗斯、美国和乌克兰能 <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

}

  return m[s] || '';
}

var _activeCat = null;

}

  if (src === null) return _rawData.length;

}

function getFilteredData() {
  var d = _rawData;

  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');

    };

    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();



function renderEmTicker() {
    var list = document.getElementById('em-ticker-list');
    var bar = document.getElementById('em-ticker');
    var dateEl = document.getElementById('em-ticker-date');
    if (!list || !bar) { return; }
    var all = (typeof _rawData !== 'undefined' && Array.isArray(_rawData)) ? _rawData : [];
    var em = all.filter(function (x) { return x.source === '东方财富'; });
    var useEm = em.length > 0;
    var items = useEm ? em : all.slice(0, 30);
    if (items.length === 0) { bar.style.display = 'none'; return; }
    if (dateEl) {
      var now = new Date();
      dateEl.textContent = now.getFullYear() + '/' +
        ('0' + (now.getMonth() + 1)).slice(-2) + '/' +
        ('0' + now.getDate()).slice(-2);
    }
    function fmt(t) {
      if (!t) { return ''; }
      var d = new Date(t);
      var h = ('0' + d.getHours()).slice(-2);
      var m = ('0' + d.getMinutes()).slice(-2);
      return h + ':' + m;
    }
    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    var html = '';
    items.slice(0, 40).forEach(function (x) {
      var t = fmt(x.time);
      var st = x.stock ? ('<span class="t-stock">[' + esc(x.stock) + ']</span>') : '';
      var ti = esc(x.title || x.text || '');
      var url = x.url ? x.url : 'https://kuaixun.eastmoney.com/';
      html += '<div class="em-ticker-item"><div class="em-item-bar">' +
        '<span class="t-time">' + t + '</span>' + st +
        '<a class="t-title" href="' + esc(url) + '" target="_blank" rel="noopener">' + ti + '</a>' +
        '</div></div>';
    });
    list.innerHTML = html || '<div class="em-ticker-empty">暂无快讯</div>';
  }
  renderEmTicker();
