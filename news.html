发展带来的水资源消耗值得高度关注】在以“数智赋能绿色金融创新”为主题的中央财经大学绿色金融国际研究院2026年会上，中国人民银行研究局局长王信表示，“人工智能在可持续金融标准运用、信息披露、风险监测评估和能力建设等方面得到日益广泛的应用，为提升金融支持绿色低碳发展的效率和精准度发挥了重要作用。与此同时，人工智能快速发展带来算力需求的持续增长，也伴随着显著的能源和水资源消耗，特别是算力中心大规模用水及其对局部地区水资源承载能力的潜在影响，值得高度关注。”\n\n王信建议，针对人工智能和算力发展中的水资源问题，可以从算力发展本身以及绿色金融、可持续金融等方面采取相应措施：一是强化水资源计量监测、数据核验和信息披露；二是推广节水技术，完善绿色数据中心资源效率评价机制；三是更好发挥水价的资源配置作用；四是发挥绿色金融作用，支持人工智能与水资源协同发展。在金融产品方面，可以探索绿色资产证券化、基础设施REITs等相关金融工具，更好支持绿色、高效的算力基础设施建设。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409372471","importance":"hot"},{"id":"sinacomos:nirxhzu3667840","time":1789470666000,"title":"顶层规划落地，电子板块逆市领涨！政策+业绩+产业共振，华宝基金电子ETF（515260）标的指数最高上探2.4%","text":"今日（9月15日）市场盘整，A股三大指数悉数收绿，电子板块逆市领涨，全天获主力资金净流入超133亿元，板块吸金额高居31个申万一级行业首位...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/money/fund/etf/2026-09-15/doc-inirxhzu3667840.shtml","importance":"important"},{"id":"sinacomos:nirxhzq8479614","time":1789470664000,"title":"调仓提示！华宝基金港股通创新药ETF（520880）成份股“5进3出”，复宏汉霖等多只新入通标的获纳入","text":"港股通创新药季度调仓来了！9月14日，100%布局创新药研发龙头的恒生港股通创新药精选指数季度调整正式生效，被动跟踪该指数的港股通创新药ETF华宝（520880）同步调仓换血。...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/money/fund/etf/2026-09-15/doc-inirxhzq8479614.shtml","importance":""},{"id":"wscn3165507","time":1789470660000,"title":"BNP Paribas给予牧原食品集团股份有限公司A股跑赢大盘的初始评级。\n","text":"BNP Paribas给予牧原食品集团股份有限公司A股跑赢大盘的初始评级。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165506","time":1789470617000,"title":"央行研究局局长王信：人工智能发展带来的水资源消耗值得高度关注","text":"中国人民银行研究局局长王信指出，近年来，全球算力中心直接耗水规模迅速攀升。具体到我国，目前我国算力中心用水量占全国用水总量的比重还不高，但结构性问题已经逐渐凸显。针对人工智能和算力发展中的水资源问题，可以从算力发展本身以及绿色金融、可持续金融等方面采取相应措施：一是强化水资源计量监测、数据核验和信息披露；二是推广节水技术，完善绿色数据中心资源效率评价机制；三是更好发挥水价的资源配置作用；四是发挥绿色金融作用，支持人工智能与水资源协同发展。（金融时报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165505","time":1789470538000 ,"time":1789466756000,"title":"着眼于为银行家“减负” 一家AI公司寻求融资1亿美元","text":"据知情人士透露，向投资银行和其他金融机构销售AI软件的初创公司Model ML，正在磋商按逾10亿美元的估值融资逾1亿美元的事宜。知情人士称，此轮融资尚未结束，细节可能会有所变化。其中一位表示，融资规模可能增至1.5亿美元，具体将视投资者的兴趣而定。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165468","time":1789466688000,"title":"德国投资者预期指数小幅上升 对经济复苏势头趋稳的乐观情绪增强","text":"德国9月投资者乐观情绪小幅上升，增强了围绕经济复苏终于开始趋于稳固的希望。ZEW预期指数从上月的34.2升至34.7，但低于预期中值40。经济现状指标改善程度超出预期。“专家们对经济复苏持谨慎乐观态度，”ZEW总裁Achim Wambach周二在声明中表示。“财政措施继续推动经济增长，出口势头也带来进一步推动。不过，风险依然巨大：伊朗冲突持续导致能源价格居高不下，袭击带来的额外不确定性也给经济造成压力。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165467","time":1789466614000,"title":"债市无序波动敲响警钟 美银称投资者过度乐观情绪降温","text":"美国银行的一项调查显示，随着投资者担忧债券收益率无序飙升以及美国中期选举结果，围绕风险资产的乐观情绪正在降温。调查显示，净49%的基金经理目前超配全球股票，低于上月的56%。受访者表示，他们如今认为，债券收益率无序上升是市场面临的最大尾部风险。美国银行策略师Michael Hartnett在一份报告中写道，现金持有比例升至投资组合的3.9%，但仍处于会对风险资产触发“卖出信号”的低位。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxaty3737581","time":1789466508000,"title":"千叶珠宝，死于黄金","text":"千叶珠宝押注黄金饰品，走的是低价路线。2024年，千叶珠宝的毛利率由上一年的22.55%锐减至15.47%。千叶珠宝在2024年年报中写到，其扩大线上销售...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxaty3737581.shtml","importance":"important"},{"id":"wscn3165466","time":1789466477000,"title":"俄罗斯外长拉夫罗夫称俄罗斯已做好在乌克兰问题上寻求合理让步的准备","text":"据国际文传电讯社(IFX)报道，俄罗斯外长拉夫罗夫表示，俄罗斯做好了在乌克兰问题上寻求合理让步的准备，但不会允许边境有北约存在。拉夫罗夫说，自冲突爆发以来，俄罗斯的立场未曾改变。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxats8580727","time":1789466451000,"title":"美联储加息来袭 金银短期承压但下跌并非定局","text":"2026年至今，黄金与白银投资者不得不应对剧烈的市场波动。以黄金为例，今年早些时候金价一度突破每盎司5500美元，但此后从这一历史高点大幅回落...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2
