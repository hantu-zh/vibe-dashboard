..","text":"【中信证券：用景气和供给出清来应对高利率 密切跟踪AI投资周期拐点】中信证券研报表示，油价回稳、非农数据低于预期、美联储加息预期下修，均未改变全球长债利率走高。背后的原因是持续强劲的私人部门投融资需求，在万亿美元投资带动下，北美率先走出了金融危机后低增长和低利率的“非常态”，全球高利率环境，在AI投资周期拐点前，是我们必须应对的常态。对海外高利率不敏感的需求只有北美AI以及与中国中央财政扩张相关的领域，而过去几年持股体验极佳的出海、资源板块都存在压力。在弱需求环境下，凸显出供给出清品种的稀缺性，反内卷进程明年依然值得重视。配置策略上，短期只能用景气品种和供给出清品种来应对高利率环境，建议密切跟踪AI投资周期拐点。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/411840119","importance":"hot"},{"id":"sinacomos:niuvxsh0571911","time":1791709661000,"title":"致歉声明写错了？ 双汇因“抗生素猪肉”罚没1.29亿，回应不涉及火腿肠，董事长曾称“食安大于天”","text":"文|《BUG》栏目 刘丽丽 “再也不敢吃双汇火腿肠了”“刚给小孩吃，就看到这个新闻，简直了”……多位消费者听到双汇因林可霉素残留超标等问题被处罚的新闻后，表示了气愤。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/marketresearch/2026-10-11/doc-iniuvxsh0571911.shtml","importance":"hot"},{"id":"sinacomos:niuvxsi7336291","time":1791709297000,"title":"中信证券：用景气和供给出清来应对高利率，密切跟踪AI投资周期拐点","text":"策略聚焦|应对高利率 来源：中信证券研究，文|裘翔 高玉森 陈峰 陈泽平 张铭楷 油价回稳、非农数据低于预期、美联储加息预期下修，均未改变全球长债利率走高。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/marketresearch/2026-10-11/doc-iniuvxsi7336291.shtml","importance":"hot"},{"id":"sinacomos:niuvxsc5696055","time":1791709027000,"title":"万亿巨头601138，回应337调查","text":"来源：中国基金报 【导读】工业富联回应337调查，涉及一项“垂直供电系统”专利权 中国基金报记者 闻言 10月11日晚间，工业富联发布公告称...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-10-11/doc-iniuvxsc5696055.shtml","importance":"important"},{"id":"1635570295440","time":1791708982000,"title":"烽火电子换将，49岁杨勇留任董事长，45岁肖强接棒总经理","text":"烽火电子换将，49岁杨勇留任董事长，45岁肖强接棒总经理","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L8VN6SHM0552C1DU.html","importance":""},{"id":"sinacomos:niuvxsc5680141","time":1791708809000,"title":"高端覆铜板尚未放量，安德利跨界收购先背5亿商誉，监管追问股价异动","text":"来源：证券之星 近期，安德利（605198.SH）披露了对上交所监管工作函的回复。这是公司自今年6月披露跨界收购计划以来，半年内第二次就交易所问询作出答复。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-10-11/doc-iniuvxsc
