ml","importance":""},{"id":"xq4884478","time":1789078744000,"title":"【莫桑比克中部一金矿坍塌致6人死亡】据莫桑比克通讯社10日报道，莫桑比克中部马尼卡省一处金矿当天凌晨发生坍塌，造成至少6人死亡，搜救工作仍在进行。报道说，事故发...","text":"【莫桑比克中部一金矿坍塌致6人死亡】据莫桑比克通讯社10日报道，莫桑比克中部马尼卡省一处金矿当天凌晨发生坍塌，造成至少6人死亡，搜救工作仍在进行。报道说，事故发生在马尼卡省万杜济区塞斯卡罗斯地区，一批手工采金者进入矿井开采黄金，随后矿井坍塌，多人被埋。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/408860594","importance":""},{"id":"wscn3163519","time":1789078649000,"title":"QDII额度扩容带动美元理财升温，专家提醒要算清汇率账","text":"新一批合格境内机构投资者（QDII）额度落地后，美元理财产品加速上新。记者获悉，近期12家理财公司合计新增9.4亿美元额度。此后不到10天，市场上已有28只美元理财产品密集发行。受访专家认为，本轮美元理财升温，最直接的推动因素是QDII额度扩容。受访专家提醒，美元理财业绩比较基准较高，但不构成收益承诺。除比较产品标示的收益率，投资者还需将汇率、净值、费用和流动性等因素纳入考量。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163518","time":1789078544000,"title":"多只QDII新额度告急","text":"多只QDII（合格境内机构投资者）产品的新增额度正在被资金“哄抢”。9月9日，万家纳斯达克100指数发起式（QDII）的限购金额从此前的10元大幅提升至5000元。当日收盘后，万家基金又火速公告称，自9月10日起，该基金的限购金额被调低至100元。类似的还有汇添富纳斯达克100 ETF发起式联接（QDII）。9月2日，该基金（人民币份额）的限购金额大幅升至1万元，9月3日该金额降为2000元，9月4日再降为10元。此外，创金合信全球芯片产业股票发起（QDII）等也在几日内经历了限购放宽又收紧的过程。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4884476","time":1789078408000,"title":"美国10年期国债期货下跌4个点，美国30年期国债期货下跌6个点。","text":"美国10年期国债期货下跌4个点，美国30年期国债期货下跌6个点。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/408860481","importance":""},{"id":"wscn3163517","time":1789078161000,"title":"荷兰通报三例西尼罗病毒感染死亡病例","text":"荷兰国家公共卫生与环境研究所10日通报，今年该国本土西尼罗病毒感染病例增至18人，其中三名感染人员死亡。\n通报说，感染病例中有一例是献血时从其血液内检测出西尼罗病毒，其余均在出现症状入院后确诊。感染者分布在乌得勒支省、北布拉班特省等六省。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1633682629892","time":1789077891000,"title":"排队筹钱补税？富豪最担心的事情，还是发生了","text":"排队筹钱补税？富豪最担心的事情，还是发生了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HA07QV0552K0CA.html","importance":""}, ，他承诺向美国人派发的5000美元不需要国会批准，但他也补充说，即使需要的话，他认为国会也会批准这项措施。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/408859964","importance":"hot"},{"id":"wscn3163506","time":1789076231000,"title":"周四（9月10日），美股降息赢家指数跌1.09%，报90.27点，在国际油价上涨之际、跳空低开之后低位持稳。\n“特朗普关税输家”指数跌1.57%，报106.89","text":"周四（9月10日），美股降息赢家指数跌1.09%，报90.27点，在国际油价上涨之际、跳空低开之后低位持稳。\n“特朗普关税输家”指数跌1.57%，报106.89点，整体低位持稳。\n“特朗普金融指数”跌0.62%，报175.66点。\n散户抱团概念股指数/迷因股（meme stock）指数跌1.89%，报12.06点，美股盘初低开高走，整体冲高回落。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163504","time":1789076040000,"title":"特朗普称派发5000美元无需国会批准","text":"美国总统特朗普在接受CBS采访时表示，他承诺向美国人派发的5000美元不需要国会批准，但他也补充说，即使需要的话，他认为国会也会批准这项措施。\n当被问及是否需要国会批准时，特朗普表示：“我们认为不需要。”\n他补充说：“如果我们需要，我认为他们会批准，但我们认为不需要。”\n特朗普重申，这笔钱必须在美国境内消费。\n特朗普称，这将是一次“巨大的资金注入”。\n特朗普没有提供关于如何执行这项限制的细节。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163503","time":1789075595000,"title":"周四（9月10日），美股存储芯片与硬件供应链指数跌4.28%，报205.62点，跳空低开之后低位窄幅震荡，成分股全线溃败，拉姆研究收跌5.65%，SK海力士AD","text":"周四（9月10日），美股存储芯片与硬件供应链指数跌4.28%，报205.62点，跳空低开之后低位窄幅震荡，成分股全线溃败，拉姆研究收跌5.65%，SK海力士ADR跌5.2%，美光、西部数据、闪迪至少跌4.06%，泰瑞达、应用材料至少跌3.17%，希捷科技、Rambus至少跌2.62%。\n信息科技指数跌2.42%，报414.93点，跳空低开之后低位震荡。\n人工智能（AI）赢家指数跌2.82%，报402.69点，跳空低开之后低位企稳。\nAI软件先驱指数跌0.91%，报125.67点，低开之后冲高回落。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163502","time":1789075567000,"title":"英国海事机构：不明飞行物击中阿曼以西海域两艘船只","text":"9月10日，英国海上贸易行动办公室发布通报称，该机构收到报告，报告显示两艘船只在阿曼海塞卜以西约4海里处遭不明飞行物击中。据该机构通报，四枚不明飞行物击中两艘国籍不明的船只，其中一艘船只起火，另一艘目前状况不明。英国海上贸易行动办公室表示，相关部门正在对此事展开调查，并提醒过往船只谨慎航行，如发现任何可疑活动及时报告。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163501","time":1789075471000,"title":"周四（9月10日），美国科技股七巨头（Magnificent 7）指数涨0.11%，报225.67点，整体低开高走。\n“超大”市值科技股指数跌0.75%， lstreetcn.com/live/global","importance":""},{"id":"wscn3163493","time":1789074502000,"title":"周四（9月10日）纽约尾盘（周五北京时间04:59），离岸人民币（CNH）兑美元报6.7144元，较周三纽约尾盘跌80点，日内整体交投于6.7042-6.715","text":"周四（9月10日）纽约尾盘（周五北京时间04:59），离岸人民币（CNH）兑美元报6.7144元，较周三纽约尾盘跌80点，日内整体交投于6.7042-6.7150元区间，亚太时段呈现出微弱的M形走势、20:00前后显著走低。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163492","time":1789074255000,"title":"国际金价跌1.9%，白银跌5.4%，纽约铜跌超5.2%","text":"周四（9月10日）纽约尾盘，现货黄金跌1.91%，报4314.82美元/盎司，亚太时段保持微幅上涨状态、北京时间14:00刷新日高至4434.67美元，随后震荡下行，欧洲央行宣布加息之后出现一波V形行情——20:39跌至4324.23美元。\n现货白银跌5.43%，报63.60美元/盎司。\nCOMEX铜期货跌5.24%，报6.5275美元/磅，关于特朗普关税的媒体消息出炉后，18:00出现一波短线跳在美股时段交易的费城金银指数收跌3.56%，报397.07点。\n在全球市场全天交易的纽约证交所ARCA金矿开采商指数跌2.87%，报2775.85点。\n在美股时段交易的原材料指数收跌2.11%，金属与矿业指数收跌3.47%——跳空低开之后持续低位窄幅震荡。\nState Street金属与矿业ETF收跌3.71%，报114.77美元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163491","time":1789074178000,"title":"OpenAI因“严重关切”而被美国参议员质询Astra模型","text":"美国民主党参议员克里斯·范霍伦致信OpenAI首席执行官萨姆·奥尔特曼，对该公司最新模型GPT-6 Astra表达“严重关切”。\n范霍伦敦促奥尔特曼“立即”向联邦研究人员提供“透明的技术信息访问权限，以便他们能够评估Astra发布后我们关键数字基础设施的安全性和风险”。\n范霍伦还就安全参数、Astra的训练方式以及是否“存在其他模型利用漏洞逃离安全环境的事件”向奥尔特曼提问。\n该参议员引用了Hugging Face事件。\n该参议员要求在9月17日之前得到答复。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163490","time":1789074113000,"title":"特朗普否认美战机在约旦遭伊朗袭击受损","text":"美国总统特朗普10日否认关于美军驻约旦基地战机在伊朗袭击中受损的报道。特朗普当天在接受美国新闻国度电视频道电话采访时说，有关美国战机在伊朗最近一次袭击中受损的报道“完全不属实”，美军“没有损失，什么事都没有”。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163488","time":1789074054000,"title":"微软计划大力扩建数据中心，考虑将规模扩大逾两倍至超过38 GW","text":"微软公司计划将其数据中心容量增加两倍以上，此举有望帮助该公司克服算力短缺问题，此前这一短缺已迫使其不得不放弃部分AI和云业务。\n据知情人士透露，到2032年，该公司的数据中心容量将从目前的约12吉瓦（GW）提升至超过38吉瓦。这一规模将超过纽约州在用电高峰期的总耗电量。\n算力短缺一直是该公司面临的最大阻碍，导致部分客户将新业务转移至别处。微软正通过开发新数据中心来缓解这一短缺，例如正在美国亚特兰大地区建设中的“美国东部3号”集群。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163487","time":1789073896000,"title":"博索纳罗民调支持率飙升追平卢拉，最高法院危机令选情趋紧","text":"巴西最高法院内部的一场危机正在给该国左翼领导人、现任总统路易斯·伊纳西奥·卢拉·达席尔瓦竞选连任造成不利影响，一项最新民调显示，弗拉维奥·博索纳罗的支持率大幅攀升，与卢拉打成平手，抹去了此前4.5个百分点的差距。\n周四公布的AtlasIntel为彭博新闻社进行的民调结果显示，如果10月份总统选举进入第二轮投票，博索纳罗和卢拉将各自获得约46%的选票。在8月底公布的上一次调查中，卢拉以47.1%对42.6%领先。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163486","time":1789073869000,"title":"Robinson要求美国最高法院审查体育预测市场裁决","text":"美国最高法院被要求就体育预测市场提供的是赌博还是某种形式的衍生品交易这一法律争议做出裁决。\n网红券商罗宾汉市场公司（Robinhood Markets Inc.）的衍生品子公司已请愿最高法院审查美国第九巡回上诉法院上月做出的有利于州监管机构的裁决。\n争议的核心在于体育事件合约应作为赌博受州监管，还是作为被称为”互换”的对冲工具受美国商品期货交易委员会（CFTC）管辖。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163485","time":1789073355000,"title":"也门胡塞武装占领红海战略要地哈尼什群岛","text":"也门政府官员10日说，在政府海军部队撤出红海战略要地哈尼什群岛后，也门胡塞武装已在岛上部署兵力。当晚，也门政府军将该国西海岸一片区域划定为“作战区”。\n这名匿名政府官员告诉新华社记者，也门政府海军部队10日下午撤出哈尼什群岛后，胡塞武装随即进入，并在岛上建立军事阵地。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163484","time":1789073257000,"title":"辛鲍姆喊话美国：别在中期选举中利用墨西哥","text":"针对美方批评墨西哥打击贩毒行动的言论，墨西哥总统辛鲍姆10日表示，美国不应把墨西哥作为其选举政治的工具。\n辛鲍姆在总统府例行记者会上说，美国将于11月举行国会中期选举，“不要在选举活动中利用墨西哥”。墨西哥不介入美国选举进程，“他们也不应该介入墨西哥”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163483","time":1789073201000,"title":"高盛集团测试与Meta关联的数据中心债券需求。\n","text":"高盛集团测试与Meta关联的数据中心债券需求。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163482","time":1789073170000,"title":"WTI原油日内涨幅达8.0%，报103.84美元/桶。\n","text":"WTI原油日内涨幅达8.0%，报103.84美元/桶。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https: <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}

}

  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

  {label: '公告', sub: 'ann'},

  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');

      _activeSource = t.sub;

      _activeCat = null;

    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
