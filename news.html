71600000,"title":"证监会：细化披露要求 引导上市公司及时支付中小企业款项","text":"9月14日，国务院新闻办公室举行政策例行吹风会介绍加强中小企业回款难问题治理有关工作情况，中国证监会上市公司监管司司长郭瑞明表示，截至今年4月底，沪深两市披露可持续发展报告的上市公司中，已经有超过100家上市公司，按要求披露了平等对待中小企业的有关情况，同时也关注到有相当数量的上市公司是中小企业，也面临回款问题。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164661","time":1789371439000,"title":"工信部：重点汽车企业的平均账期有所改善","text":"9月14日，国务院新闻办公室举行政策例行吹风会介绍加强中小企业回款难问题治理有关工作情况。工业和信息化部副部长柯吉欣表示，从行业机构调研情况来看，重点汽车企业的平均账期有所改善，但是也要看到，当前国内车企平均账期与广大中小企业的期盼仍有差距。比如说起算节点不同、验收条件不明确，这些问题都需要我们持之以恒，久久为功，以钉子的精神推进治理工作。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164660","time":1789371410000,"title":"外交部：中方对也门和红海局势升温深表关切","text":"外交部发言人郭嘉昆14日在例行记者会上答问时表示，近日来，也门和红海局势升温，造成无辜平民伤亡和能源等民用设施受损，中方对此深表关切。袭击关乎民生的民用设施，不可接受。地区局势动荡加剧，不符合各方利益，各国主权安全都应该得到尊重。通过政治外交途径化解争端是唯一出路。中方呼吁相关各方保持克制，通过沟通对话缓和矛盾，推动局势尽快降温。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164659","time":1789371388000,"title":"外交部：散播各种威胁叙事 只会干扰人工智能全球治理进程","text":"9月14日，外交部发言人郭嘉昆主持例行记者会。有记者就有美国AI企业称中国AI发展对美构成威胁相关内容提问。郭嘉昆表示，人工智能的发展关乎全人类共同福祉，各方应该共同推动人工智能开放、包容、普惠、向善，散播各种威胁叙事，搞对抗和恶意竞争，只会干扰人工智能全球治理进程，不符合任何一方利益。（央视新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirutpa4587134","time":1789371371000,"title":"市场监管总局：将对变相延长账期等行为依法依规进行严厉处罚","text":"人民财讯9月14日电，9月14日，国务院新闻办公室举行政策例行吹风会介绍加强中小企业回款难问题治理有关工作情况。市场监管总局信用监管司司长周卫军表示...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/china/2026-09-14/doc-inirutpa4587134.shtml","importance":"hot"},{"id":"1639148356621","time":1789371306000,"title":"成“山姆平替”后，迪卡侬把年轻人哄好了","text":"成“山姆平替”后，迪卡侬把年轻人哄好了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6Q0FONP053990SN.html","importance":""},{"id":"sinacomos:nirutnw7234757","time .com.cn/stock/usstock/c/2026-09-14/doc-inirutny3998661.shtml","importance":"important"},{"id":"sinacomos:nirutpa4581228","time":1789370523000,"title":"英国拟扩大不健康食品广告禁令 广告业警告或影响10亿英镑媒体支出","text":" 英国广告协会近日警告，政府计划扩大对不健康食品广告的限制范围，可能影响广播、出版及数字平台约10亿英镑的广告支出，并对英国媒体行业造成冲击。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirutpa4581228.shtml","importance":""},{"id":"wscn3164653","time":1789370513000,"title":"国务院国资委：中央企业带头及时支付账款","text":"国务院国资委财管运行局负责人裴仁佺14日在国新办举行的国务院政策例行吹风会上说，《关于加强中小企业回款难问题治理有关工作的通知》对央企发挥表率作用提出专门要求。接下来，中央企业将积极筹措资金，确保及时支付；今后更要把对中小企业现金支付作为一条“硬杠杠”坚持好，同时结合自身实际对大型企业保持合理现金支付比例，推动沿业务链条传导，并严格“票证”使用，严禁新开6个月以上“票证”；将督促央企带头遵守所在行业领域规定，率先在合同中明确四项关键要素，率先响应并践行行业及时支付倡议等。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1638676057440","time":1789370388000,"title":"收割得太狠了，太平人寿屡罚屡犯","text":"收割得太狠了，太平人寿屡罚屡犯","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6Q0PFJ40519B5UO.html","importance":""},{"id":"sinacomos:nirupfa4108259","time":1789370134000,"title":"收评|国内期货主力合约跌多涨少 SC原油涨超11%","text":"2026年9月14日，国内期货主力合约跌多涨少，涨幅方面，SC原油涨超11%，沥青、燃料油、集运欧线涨超2%。跌幅方面，玻璃跌近6%，纯碱跌超5%，烧碱、沪锡跌近4%...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/money/future/fmnews/2026-09-14/doc-inirupfa4108259.shtml","importance":""},{"id":"wscn3164650","time":1789370043000,"title":"商务部消费促进司负责人解读《促进智能家居消费行动方案》","text":"《行动方案》坚持目标导向、问题导向，针对智能家居消费的增长点及存在的堵点卡点，提出扩大优质智能家居供给、完善智能家居标准体系、优化社区便民服务等七条举措，重点突出以下四个方面：一是坚持供需协同发力。二是打造多元融合生态。三是精准服务不同群体。四是打通便民服务链条。下一步，商务部将会同相关部门落实落细各项工作举措，推动相关政策尽快落地见效，带动更多智能家居产品走入百姓家庭，更好满足人民美好生活需要。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164649","time":1789369965000,"title":"美股期货扩大跌幅，纳斯达克100指数期货下跌1.5%，标普500指数期货跌0.6%，道指期货跌0.1%。\n","text":"美股期货扩大跌幅，纳斯达克100指数期货下跌1.5%，标普500指数期货跌0.6%，道指期货跌0.1%。\n","sou       var parts = raw.split(',');
      var code = def.code, group = def.group, name = def.name;
      var price, change, changePct, high, low;
      try {
        if (group === 'us') {
          price = num(parts[1]); change = num(parts[4]); changePct = num(parts[2]); high = num(parts[6]); low = num(parts[7]);
        } else if (group === 'asia' && code === 'hkHSI') {
          name = parts[1] || name; price = num(parts[2]); change = num(parts[7]); changePct = num(parts[8]); high = num(parts[5]); low = num(parts[6]);
        } else if (group === 'cn' && code === 'hf_CHA50CFD') {
          price = num(parts[0]); high = num(parts[4]); low = num(parts[5]);
          var prevA50 = num(parts[7]);
          if (isFinite(prevA50) && prevA50) { change = price - prevA50; changePct = change / prevA50 * 100; }
        } else if (group === 'cn' || group === 'eu' || group === 'asia') {
          name = parts[0] || name; price = num(parts[1]); change = num(parts[2]); changePct = num(parts[3]);
          var cands = [];
          for (var ci = 4; ci <= 11 && ci < parts.length; ci++) {
            if (!/^-?\d+(\.\d+)?$/.test(String(parts[ci]).trim())) continue;
            var vn = num(parts[ci]);
            if (isFinite(vn) && vn > 0 && Math.abs(vn - price) / price < 0.5) cands.push(vn);
          }
          if (cands.length >= 2) { high = Math.max.apply(null, cands); low = Math.min.apply(null, cands); }
        } else if (group === 'dxy') {
          price = num(parts[1]); high = num(parts[6]); low = num(parts[5]); name = parts[9] || name;
          var prevDxy = num(parts[8]);
          if (isFinite(prevDxy) && prevDxy) { change = price - prevDxy; changePct = change / prevDxy * 100; }
        } else if (group === 'metal') {
          price = num(parts[0]); high = num(parts[4]); low = num(parts[5]);
          var prev = num(parts[7]);
          if (isFinite(prev) && prev) { change = price - prev; changePct = change / prev * 100; }
          name = parts[13] || name;
        } else if (group === 'fx') {
          price = num(parts[3]); change = num(parts[10]); changePct = num(parts[11]);
          high = num(parts[6]); low = num(parts[5]); name = parts[9] || name;
        }
      } catch (e) { return null; }
      if (!isFinite(price) || price === 0) return null;
      if (!isFinite(change)) change = isFinite(changePct) ? price * changePct / 100 : 0;
      if (!isFinite(changePct)) changePct = price ? change / price * 100 : 0;
      return { code: def.code, name: name, price: price, change: change, changePct: changePct, high: high, low: low, unit: def.unit || '', group: group };
    }

    function loadSinaFallback(defs, callback) {
      var codes = defs.map(function (d) { return d.ref || d.code; }).join(',');
      var url = 'https://hq.sinajs.cn/list=' + codes + '&_=' + Date.now();
      var script = document.createElement('script');
      script.referrerPolicy = 'no-referrer';
      script.setAttribute('referrerpolicy', 'no-referrer');
      script.src = url;
      script.charset = 'gb2312';
      script.onerror = function () { callback([]); };
      script.onload = function () {
        var out = [];
        defs.forEach(function (def) {
          var targetCode = def.ref || def.code;
          var raw = window['hq_str_' + targetCode];
          var item = parseSinaLine(def, raw);
          if (item) out.push(item);
        });
        callback(out);
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      var head = document.head || document.getElementsByTagName('head')[0];
      head.appendChild(script);
    }

    // 腾讯行情兜底（无 Referer 限制，可补黄金/白银/恒生等）
    function parseTencentLine(def, raw) {
      if (!raw) return null;
      var parts = raw.split(',');
      var price = num(parts[0]), changePct = num(parts[1]);
      var high = num(parts[4]), low = num(parts[5]);
      var prev = num(parts[7]);
      if (!isFinite(price) || price === 0) return null;
      var change = 0;
      if (isFinite(prev) && prev) change = price - prev;
      else if (isFinite(changePct) && changePct) change = price * changePct / 100;
      if (!isFinite(changePct)) changePct = prev ? change / prev * 100 : 0;
      return { code: def.code, name: def.name, price: price, change: change, changePct: changePct, high: high, low: low, unit: def.unit || '', group: def.group };
    }
    function loadTencentFallback(defs, callback) {
      var tencentDefs = defs.filter(function (d) { return d.tencent || d.ref; });
      if (!tencentDefs.length) { callback([]); return; }
      var codes = [];
      tencentDefs.forEach(function (d) {
        var code = d.tencent || EM_SECIDS[d.ref || d.code] && EM_SECIDS[d.ref || d.code][0].split('.')[1] || (d.ref || d.code);
        if (code) codes.push(code);
      });
      var url = 'https://qt.gtimg.cn/q=' + codes.join(',') + '&_=' + Date.now();
      var script = document.createElement('script');
      script.referrerPolicy = 'no-referrer';
      script.setAttribute('referrerpolicy', 'no-referrer');
      script.src = url;
      script.onerror = function () { callback([]); };
      script.onload = function () {
        var out = [];
        tencentDefs.forEach(function (def) {
          var code = def.tencent || EM_SECIDS[def.ref || def.code] && EM_SECIDS[def.ref || def.code][0].split('.')[1] || (def.ref || def.code);
          var raw = window['v_' + code];
          var item = parseTencentLine(def, raw);
          if (item) { item.code = def.code; out.push(item); }
        });
        callback(out);
        if (script.parentNode) script.parentNode.removeChild(script);
      };
      var head = document.head || document.getElementsByTagName('head')[0];
      head.appendChild(script);
    }

    // 汇率 API 兜底（无 Referer/CORS 限制，仅实时价，涨跌显示为 —）
    function loadExchangerateFallback(defs, callback) {
      var erDefs = defs.filter(function (d) { return d.erCode; });
      if (!erDefs.length) { callback([]); return; }
      if (typeof fetch !== 'function') { callback([]); return; }
      fetch('https://api.exchangerate-api.com/v4/latest/USD', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          var rates = j && j.rates || {};
          var out = [];
          erDefs.forEach(function (def) {
            var rate = rates[def.erCode];
            if (rate) {
              out.push({ code: def.code, name: def.name, price: rate, change: NaN, changePct: NaN, high: NaN, low: NaN, unit: def.unit || '', group: def.group });
            }
          });
          callback(out);
        })
        .catch(function () { callback([]); });
    }

    function renderMarketTable(items) {
      if (!items || !items.length) return '<div class="em-ticker-empty">暂无数据</div>';
      var html = '<table class="em-market-table"><thead><tr>' +
        '<th>名称</th><th>最新价</th><th>涨跌额</th><th>涨跌幅</th><th>最高</th><th>最低</th>' +
        '</tr></thead><tbody>';
      items.forEach(function (x) {
        var rowStart = '<tr onclick="openKline && openKline(\'' + esc(x.code) + '\', \'' + esc(x.name) + '\')">';
        if (x.empty) {
          html += rowStart + '<td class="em-name">' + esc(x.name) + '</td><td colspan="5" style="text-align:center;color:#999">—</td></tr>';
          return;
        }
        var digits = x.price > 1000 ? 2 : (x.price < 10 ? 4 : (x.price < 100 ? 3 : 2));
        if (x.group === 'metal') digits = 2;
        var unit = x.unit ? '<span class="em-unit">' + esc(x.unit) + '</span>' : '';
        var c = cls(x.change);
        html += rowStart +
          '<td class="em-name">' + esc(x.name) + unit + '</td>' +
          '<td>' + fmt(x.price, digits) + '</td>' +
          '<td class="' + c + '">' + (x.change > 0 ? '+' : '') + fmt(x.change, digits) + '</td>' +
          '<td class="' + c + '">' + pct(x.changePct) + '</td>' +
          '<td>' + fmt(x.high, digits) + '</td>' +
          '<td>' + fmt(x.low, digits) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    function loadMarketTab(defs, title) {
      var myTab = EM_TAB_INDEX;
      var status = '<div class="em-market-status"><span><span class="dot"></span>' + esc(title) + ' · 实时行情 · 30s刷新</span><span>加载中…</span></div>';
      setList(status + '<div class="em-ticker-empty">正在加载…</div>');

      function finishRender(items) {
        if (EM_TAB_INDEX !== myTab) return;
        var updated = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        var status2 = '<div class="em-market-status"><span><span class="dot"></span>' + esc(title) + ' · 实时行情 · 30s刷新</span><span>更新于 ' + esc(updated) + '</span></div>';
        setList(status2 + renderMarketTable(items));
      }

      function mergeFilled(items, filled) {
        var byCode = {};
        filled.forEach(function (f) { byCode[f.code] = f; });
        return items.map(function (orig, i) {
          var f = byCode[defs[i].code];
          // 子条目（工行黄金/建行白银）跟随主条目回填
          if (!f && defs[i].ref) f = byCode[defs[i].ref];
          if (!f) return orig;
          if (orig.empty) return f;
          // 已有数据但缺失涨跌/最高最低时，用更完整源覆盖
          var patched = {};
          ['price','change','changePct','high','low','name','unit','group'].forEach(function (k) {
            patched[k] = isFinite(f[k]) && f[k] !== '' ? f[k] : orig[k];
          });
          return patched;
        });
      }

      function getEmptyDefs(items) {
        var out = [];
        items.forEach(function (x, i) { if (x.empty) out.push(defs[i]); });
        return out;
      }

      loadEmQuotes(defs, function (err, items) {
        if (EM_TAB_INDEX !== myTab) return;
        // 东财全部失败时以空项继续走 fallback，而不是直接报错
        if (err) {
          items = defs.map(function (def) {
            return { code: def.code, name: def.name, price: NaN, change: NaN, changePct: NaN, high: NaN, low: NaN, unit: def.unit || '', empty: true };
          });
        }

        // 第 1 层兜底：新浪行情（国内浏览器通常有完整外汇/贵金属字段）
        loadSinaFallback(defs, function (filled1) {
          if (EM_TAB_INDEX !== myTab) return;
          items = mergeFilled(items, filled1);
          var emptyDefs = getEmptyDefs(items);
          if (!emptyDefs.length) { finishRender(items); return; }

          // 第 2 层兜底：腾讯行情（无 Referer 限制，补贵金属/恒生）
          loadTencentFallback(emptyDefs, function (filled2) {
            if (EM_TAB_INDEX !== myTab) return;
            items = mergeFilled(items, filled2);
            emptyDefs = getEmptyDefs(items);
            if (!emptyDefs.length) { finishRender(items); return; }

            // 第 3 层兜底：汇率 API（无 CORS/Referer 限制，仅实时价）
            loadExchangerateFallback(emptyDefs, function (filled3) {
              if (EM_TAB_INDEX !== myTab) return;
              items = mergeFilled(items, filled3);
              finishRender(items);
            });
          });
        });
      });
    }

    function startMarketRefresh(defs, title) {
      if (EM_REFRESH_TIMER) clearInterval(EM_REFRESH_TIMER);
      loadMarketTab(defs, title);
      EM_REFRESH_TIMER = setInterval(function () { loadMarketTab(defs, title); }, 30000);
    }

    function switchEmTab(i) {
      EM_TAB_INDEX = i;
      if (EM_REFRESH_TIMER) { clearInterval(EM_REFRESH_TIMER); EM_REFRESH_TIMER = null; }
      renderTags();
      updateDate();
      if (i === 0) {
        renderNewsFallback();
      } else if (i === 1) {
        startMarketRefresh(INDEX_DEFS, '全球指数');
      } else if (i === 2) {
        startMarketRefresh(FX_DEFS, '贵金属汇率');
      }
    }

    // ===== 初始化 =====
    renderTags();
    switchEmTab(0);
    initEastmoneyJsonp();
  })();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
