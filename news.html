化策略主管Savita Subramanian周一在报告中表示，该行将标普500指数年底目标位从7100点上调至7400点，称长期看涨逻辑依然成立。该行还将标普500指数未来12个月目标位设为7800点。Subramanian写道：“我们正进入季节性疲软期，我们认为市场早就应该回调了。”新的年底目标位较标普500指数上周五收盘点位低3.4%。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409242982","importance":""},{"id":"wscn3164920","time":1789397331000,"title":"美国矿企签约卢旺达钨矿项目","text":"一家美国矿企正与卢旺达政府合作，在当地采购并加工钨矿。根据具有约束力的协议，卢旺达方面将以提供一处勘探特许权和一张加工许可证的方式，入股Almonty Industries Inc.（阿尔蒙蒂工业）的当地子公司，获得25%的股份。美国政府协助促成了此次卢旺达合作并提供了政治支持，但并未直接提供资金。产出的钨矿将运往美国、欧洲、日本和韩国的客户。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"163501055641","time":1789397298000,"title":"越秀资本换届：58岁李锋连任董事长，51岁吴勇高升总经理","text":"越秀资本换届：58岁李锋连任董事长，51岁吴勇高升总经理","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QQJRDE0552C1DU.html","importance":""},{"id":"wscn3164919","time":1789397196000,"title":"欧盟拟限制15岁以下儿童使用社交媒体和AI聊天机器人","text":"欧盟将于周四公布一项名为“儿童法案”（Kids Act）的旗舰提案，计划限制15岁以下儿童访问社交媒体。\n一份政策文件显示，欧盟委员会将要求社交媒体公司、在线游戏服务和AI聊天机器人对其服务设置年龄门槛，以将年龄最小的青少年拒之门外。根据这份可能在发布前发生变动的草案文件，这些公司还需采用安全功能，以最大限度地减少滥用和成瘾行为。\n根据该提案，欧盟将设定15岁为开设“自主账户”（即无需家长监督的账户）的最低年龄。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1635653577326","time":1789397189000,"title":"汽车巨头整合再曝大动作，一汽股份要成广汽集团第二大股东！","text":"汽车巨头整合再曝大动作，一汽股份要成广汽集团第二大股东！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QQGE4E0519APGA.html","importance":""},{"id":"sinacomos:nirvkkq7172095","time":1789397015000,"title":"交易员完全计入到2027年底欧洲央行加息四次、英国央行五次的预期","text":"随着能源价格上涨加剧通胀担忧，货币市场加大了对央行加息的押注。 掉期市场显示，到明年底欧洲央行将累计加息四次、每次25个基点，届时存款利率将升至3.5%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-14/doc-inirvkkq7172095.shtml","importance":"important"},{"id":"wscn3164918","time":1789396978000,"title":"公开数据：霍尔木兹海峡单日通行量降至个位数","text":"据路透社14日报道，霍尔木兹海峡上周末两天内单日船舶通行量仅为个位数，低于10天内每日平均14艘船的通行量。\n报道说，根据14日的船舶追踪信息，上周末两天内，4艘船只驶出霍尔木兹海峡，其中包括运载能源的船只；10艘货船驶入霍尔木兹海峡。\n不过，上述数字不包括通过霍尔木兹海峡时关闭自动识别系统的船只。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164917","time":1789396911000,"title":"戴尔家族办公室与Sequence斥资77亿美元收购Baldwin","text":"迈克尔·戴尔的家族办公室与Sequence Holdings联手，以77亿美元的全现金交易收购Baldwin Insurance Group Inc.。\n根据周一的一份声明，DFO Management与一家专注于人工智能（AI）的控股公司Sequence将组建一家实体，持有这家保险分销和风险管理公司的多数股权，而部分Baldwin员工将保留少数股权。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4890127","time":1789396785000,"title":"美国10年期通胀保值国债（TIPS）收益率触及2.622%，为2008年以来最高。","text":"美国10年期通胀保值国债（TIPS）收益率触及2.622%，为2008年以来最高。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409242217","importance":"hot"},{"id":"sinacomos:nirvkku4360288","time":1789396780000,"title":"美国10年期国债收益率2023年以来首次升破5%","text":"美国10年期国债收益率涨破5%，为2023年10月以来首次。油价飙升加剧通胀之忧，美国基准国债收益率一度上涨4个基点至5.006%，2023年10年债收益率只在5%上方维持了一天。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirvkku4360288.shtml","importance":"hot"},{"id":"xq4890126","time":1789396748000,"title":"由于工作人员配置不足，前往洛杉矶国际机场的航班暂停起飞。","text":"由于工作人员配置不足，前往洛杉矶国际机场的航班暂停起飞。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409242172","importance":""},{"id":"wscn3164916","time":1789396699000,"title":"报告：全球核电装机容量到2060年可能增长两倍","text":"国际原子能机构14日发布《能源、电力与核电估算2060》展望报告显示，到2060年，全球核电装机容量可能增长两倍以上。这是该机构连续第六年上调其对核电扩张的预测。\n报告数据显示，截至2025年底，全球共有在运核反应堆413座，提供377.1吉瓦的核电装机容量。报告预计，到2060年，全球核电装机低估值预测将增至696吉瓦，约为2025年水平的两倍；高估值预测将增至1284吉瓦，约为2025年水平的3.4倍。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164915","time":1789396508000,"title":"广汽一汽重组前，广汽丰田总经理和副总齐齐被调走","text":"广汽集团发布公告称，公司筹划以发行股份的方式购买一汽股份持有的某整车合资公司的部分股权，并募集配套资金。在此次广汽集团宣布和一汽股份重组前，记者了解到，广汽丰田总经理、副总经理均被调走。目前，文大力不再担任广汽丰田汽车有限公司党委书记、委员、董事、执行副总经理职务，调回广汽集团总部工作。望军任广汽零部件有限公司党委委员、副书记、总经理，提名为广汽零部件有限公司董事，不再担任广汽丰田汽车有限公司党委委员、副总经理职务。（第一财经）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4890118","time":1789396475000,"title":"【农业农村部召开全国海洋渔船安全生产监管工作视频会议】农业农村部14日召开全国海洋渔船安全生产监管工作视频会议。会议强调，要聚焦“船、港、人、网”重点领域，扎实...","text":"【农业农村部召开全国海洋渔船安全生产监管工作视频会议】农业农村部14日召开全国海洋渔船安全生产监管工作视频会议。会议强调，要聚焦“船、港、人、网”重点领域，扎实有力推进海洋渔船安全生产专项整治。要着力推动老旧渔船更新改造和减船转产，严格渔船设计、建造等监管，严格执行渔船出港检查、大风天气召回等制度，全链条严把渔船安全关。要加快智慧渔港建设，建立健全船籍港地和靠泊港地安全协同监管制度，全面提升渔港监管水平。要压实船东主体责任，提高船长船东船员的安全意识和能力水平，切实加强海洋渔业执法监管，严厉打击违法违规行为。要强化网具和作业方式监管，严查网证不符问题，规范网具装载标准，从源头管住因网致险隐患。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409241810","importance":"hot"},{"id":"wscn3164913","time":1789396231000,"title":"中共中央办公厅、国务院办公厅、中央军委办公厅印发《退役军人服务和保障“十五五”规划》","text":"《规划》提出，“十五五”时期退役军人工作要坚持党的领导，引导退役军人坚定听党话跟党走；坚持以人为本，保障好、维护好退役军人的合法权益；坚持守正创新，深化重点领域和关键环节改革；坚持军地协同，加强政策制度衔接和工作举措协同；坚持分类施策，增强服务保障的精准性、便捷性、可持续性。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"163170944484","time":1789395979000,"title":"一车人都买错票！一大批高铁站，要改名了？","text":"一车人都买错票！一大批高铁站，要改名了？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QP0BCQ0519FM90.html","importance":""},{"id":"sinacomos:nirvkkq7162470","time":1789395958000,"title":"每年亏十几个亿！蓝箭航天烧钱不断，钱到底从哪来？这场资本豪赌，赌的是中国商业航天的未来吗？","text":"来源：太空科普君 不得不说，蓝箭航天这个国内民营航天企业，花起钱来那是比较顺手的！ 但是蓝箭航天的成绩也是不可否认的，首先按照规模来说排名第二...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hyyj/2026-09-14/doc-inirvkkq7162470.shtml","importance":""},{"id":"wscn3164912","time":1789395950000,"title":"苹果新机连续三年“上市即破发”","text":"记者发现，刚刚正式开启预售的iPhone 18 Pro系列已在电商平台上跌破发售价。拼多多平台百亿补贴页面显示，原价为9999元的苹果 iPhone18 Pro全网通5G 双卡双待手机 256G拼单价为9699元，同时平台发放600元店铺券，最终下单价可低至9099元，较官方发售价降价900元。记者尝试下单发现，平台补贴券相对充足可成功下单，页面信息显示，9月27日前将发货完毕 伊","text":" 美国总统特朗普周一反驳了越来越多要求对人工智能加强监管的呼声，并在Anthropic CEO达里奥·阿莫代伊紧急呼吁放缓AI发展后对其进行了抨击。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirvkku4353491.shtml","importance":""},{"id":"sinacomos:nirvkku4352941","time":1789395451000,"title":"微软为未来AI模型设定限制，美国行业放缓前沿开发","text":"微软已发布一项临时行为准则，将对其人工智能模型施加限制。这是在Anthropic和OpenAI领导人同意放缓开发速度数天后。 这家Windows和Office产品背后的公司希望被视为AI领域...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirvkku4352941.shtml","importance":""},{"id":"wscn3164909","time":1789395413000,"title":"农业农村部：全面加强海洋渔船安全生产监管","text":"农业农村部召开全国海洋渔船安全生产监管工作视频会议。会议强调，要聚焦“船、港、人、网”重点领域，扎实有力推进海洋渔船安全生产专项整治。要着力推动老旧渔船更新改造和减船转产，严格渔船设计、建造等监管，严格执行渔船出港检查、大风天气召回等制度，全链条严把渔船安全关。要加快智慧渔港建设，建立健全船籍港地和靠泊港地安全协同监管制度，全面提升渔港监管水平。要压实船东主体责任，提高船长船东船员的安全意识和能力水平，切实加强海洋渔业执法监管，严厉打击违法违规行为。要强化网具和作业方式监管，严查网证不符问题，规范网具装载标准，从源头管住因网致险隐患。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164908","time":1789395404000,"title":"加拿大总理卡尼：加拿大与欧盟在构建繁荣方面有巨大的机会。\n可能会看到欧盟合作伙伴巩固劳动力流动。\n","text":"加拿大总理卡尼：加拿大与欧盟在构建繁荣方面有巨大的机会。\n可能会看到欧盟合作伙伴巩固劳动力流动。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164907","time":1789395360000,"title":"王毅同拉脱维亚外长布拉泽通电话","text":"中共中央政治局委员、外交部长王毅14日应约同拉脱维亚外长布拉泽通电话。王毅表示，中拉虽相距遥远，但两国人民传统友谊深厚。中国是最早承认拉脱维亚独立的国家之一。建交以来，两国始终平等相待，相互尊重，保持关系平稳发展。中方对拉方实施单方面免签体现了对拉方的信任，两国人员交往更加频繁，务实合作不断拓展。中方愿同拉方一道，以建交35周年为契机，为中拉关系不断注入新的时代内涵。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirvkks3927377","time":1789395316000,"title":"筹划5个交易日即终止，金橙子重组“闪电”告吹","text":"每经记者|黄胜每经编辑|陈俊杰 金橙子（SH688291，股价44.4元，市值45.58亿元）9月14日晚间公告，公司决定终止筹划以发行股份及支付现金方式购买深圳市智博泰克科技股份有...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/roll/2026-09-14/doc-
