规划》提到，打造粤港澳大湾区创科生态产业链，促进科研成果转化，积极参与粤港澳大湾区科技创新和产业创新，包括鼓励香港科研机构参与粤港澳联合实验室的建设，以及加快优化创科生态圈整体布局，为科研机构及内地企业提供完善发展环境。香港会以河套深港科技创新合作区香港园区为重心，进一步强化与粤港澳大湾区其他城市的战略对接，尤其是深圳的战略性新兴产业集群，并促进创科要素跨境流动，推动科研成果在粤港澳大湾区其他城市转化，以及规模化、产业化应用。与深圳实现“合作研发、协同转化、共享发展”，以构建新兴与未来产业的产业链协同机制和模式，巩固提升“深圳—香港—广州”全球创新集群领先地位。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165970","time":1789533713000,"title":"香港首个五年规划：加大招商引资力度，大力引导产业发展","text":"香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》和《行政长官2026年施政报告》。《规划》提到，要加大招商引资力度，大力引导产业发展。采取促进产业和投资的优惠政策引导产业发展。加快引进行业龙头和不同企业在香港设立管理离岸贸易及供应链的区域或国际总部和财资中心。面向中东、东盟、欧美长线资金，进一步壮大香港的总部经济及推广香港家族办公室。聚焦人工智能、数字经济、生命健康、新型工业化、绿色发展等创科领域重点产业，制订目标企业清单与年度招商行动计划。完善跨部门协调与项目落地机制，为企业提供个案服务，强化重点招商项目在土地、规划、通关、人才、监管等方面的一站式协调服务。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1636647099525","time":1789533254000,"title":"信诺维科创板上市：研发与商业化双轮驱动，中国创新药出海路径渐明","text":"信诺维科创板上市：研发与商业化双轮驱动，中国创新药出海路径渐明","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6US8QI60519WTTG.html","importance":""},{"id":"sinacomos:niryvay6698911","time":1789533151000,"title":"宁德时代半日跌3.8%，易方达持有3958万股浮亏4.7亿元，华夏基金持2115万股浮亏2.5亿元（名单）","text":"9月16日，宁德时代股价继续下跌，截至午盘跌3.8%，报304.31元/股，成交162亿元，换手率1.25%，总市值14354亿元。 Wind数据显示，公募基金2026二季度3102只产品合计持3...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/observe/2026-09-16/doc-iniryvay6698911.shtml","importance":""},{"id":"sinacomos:niryvce3076242","time":1789533029000,"title":"逆势涨近8%站稳4000亿港元 联想集团CFO郑孝明：AI基建持续放量正成为新增长支撑","text":" 9月16日，港股科技板块整体表现偏弱，恒生指数走低。相比之下，截至11时48分，联想集团逆势上涨近8%，市值继续稳居4000亿港元上方。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/hy/hyjz/2026-09-16/doc-iniryvce3076242.shtml","importance":""},{"id":"wscn3165967","time":1789532896000,"title":"早间要闻汇总","text":"科创50指数半日涨4.5%，创业板指涨超2%，算力硬件、半导体板块集体走强。\n恒指半日涨0.12%，恒生科技指数涨0.87%，智谱大 000,"title":"港股午评：恒指涨0.12% 科指涨0.87% 芯片股活跃 光通信板块走强","text":"9月16日消息，港股三大指数涨跌不一。截至午间收盘，恒生指数涨0.12%，报24697.35，恒生科技指数涨0.87%，国企指数跌0.05%。盘面上，科网股跌多涨少，联想涨超7%...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hkstock/marketalerts/2026-09-16/doc-iniryvay6670480.shtml","importance":"hot"},{"id":"wscn3165958","time":1789531325000,"title":"香港首个五年规划：驱动更多国际和内地家族资本及长期资金落户香港","text":"香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》和《行政长官2026年施政报告》。《规划》提到，推动香港巩固全球领先跨境财富管理中心的地位，为全球主权基金、家族办公室在香港发展提供优质服务，强化香港管理内地与全球资产配置和财富管理的功能。完善监管和市场基础设施、壮大专业服务生态，积极推动家族办公室业务发展，优化基金、单一家族办公室和附带权益税制，驱动更多国际和内地家族资本及长期资金落户香港并扩大业务。扩大多元资产管理类别和产品选择，推动基金市场发展，例如另类资产基金和房地产投资信托基金等多元化资产管理工具，从而全面提升资产和财富管理的深度与广度。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1633343318598","time":1789531283000,"title":"2026全球资产管理中心评价指数报告发布：上海首次跻身全球前三","text":"2026全球资产管理中心评价指数报告发布：上海首次跻身全球前三","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6UQ7SC70519DTSV.html","importance":""},{"id":"wscn3165957","time":1789531267000,"title":"香港首个五年规划：金融是香港的根本和最大优势","text":"香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》和《行政长官2026年施政报告》。《规划》提到，金融是香港的根本和最大的优势。香港国际金融中心必须彰显国际定位，以开放的金融市场吸引全球资金、人才和财金企业汇聚香港。秉持“以稳促进，以进固稳”的方针，壮根基、稳结构、强功能、控风险，充分发挥金融赋能实体经济的核心作用，建设安全高效的金融基建，系统性构建多元化资本市场。通过深度融合内地与海外市场，积极巩固香港作为联通全球金融市场的枢纽功能，便利国际资本把握国家及亚洲发展机遇，同时助力内地企业和资本高水平走向世界，并在全球金融治理体系中发挥更大作用。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165955","time":1789531210000,"title":"香港首个五年规划：强化香港作为全球最大离岸人民币业务枢纽功能","text":"香港特区行政长官李家超公布《香港特别行政区经济和社会发展第一个五年规划（2026—2030年）》和《行政长官2026年施政报告》。《规划》提到，强化香港作为全球最大离岸人民币业务枢纽的功能。全面壮大离岸人民币业务规模，持续完善离岸人民币生态体系，增强流动性支持力度，建立香港人民币离岸市场流动性补充机制，加快推进离岸人民币产品创新和扩展产品类型，构建全覆盖、多层次的人民币跨境流通网络，提高离岸人民币融资稳定性。积极推动人民币作为政府的支付货币。进一步增强离岸人民币市场支持实体经济的能力，全面提升对贸易、投融资及跨境业务拓展等领域的支持和促进作用，并支持企业在跨境经贸业务上更广泛使用人民币，便利人民币与其他地区货币的兑换。\n","source":"华尔街见闻","category":"fa
