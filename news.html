":"央行：截至7月末，全市场账款凭证余额较高峰时期下降20%","text":"9月14日，中国人民银行金融市场司司长曹媛媛在国务院政策例行吹风会上表示，高峰时期全市场共有200多家电子凭证服务平台，应收账款电子凭证开立余额达到3万亿元，涉及众多核心企业和上下游供应商。经过一年多的规范，截至7月末，全市场账款凭证余额为2.4万亿元，较规范前下降了20%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164677","time":1789372550000,"title":"欧洲央行管委Simkus：任何一次政策会议都有可能采取利率行动","text":"欧洲央行管理委员会成员Gediminas Simkus表示，任何一次货币政策会议都可能采取进一步行动来控制通胀。12月是更详细评估经济形势的恰当时机，因为届时将有更多数据公布，更新后的预测也将随之发布。欧洲央行在下月会议召开前也必须密切关注能源价格。最早在10月，我们就能评估通胀前景，判断是恶化还是好转，我不能排除在任何一次会议上行动的可能性。我们将根据不断涌现的数据，逐次会议地做出决定。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3164676","time":1789372510000,"title":"外交部：中方愿同金砖国家加强技术合作 深化产业对接","text":"9月14日，外交部发言人郭嘉昆主持例行记者会。有记者提问：在金砖峰会上，印尼总统呼吁金砖成员国推动联合工业化，强调成员国已经成为全球供应链的重要组成，加强工业合作能够帮助成员国来创造更大的附加值。请问外交部有何回应？\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164675","time":1789372464000,"title":"汇丰不再认为美联储今年会按兵不动 改而预测将加息两次","text":"汇丰预计美联储将在9月和12月分别将利率提高0.25个百分点，改变了此前对利率将保持不变的判断。汇丰美国经济学家Ryan Wang在报告写道中，继双双超出汇丰预期的8月就业报告和消费者物价CPI公布后，该行目前预计美国联邦公开市场委员会(FOMC)将在9月15日至16日的会议上投票支持加息25个基点。这将使联邦基金目标利率区间升至3.75%-4%。“我们认为，FOMC的新点阵图可能显示，2026年底预测中值为4.125%，展现出（至少许多政策制定者）有倾向在10月27日-28日、12月8日-9日两次会议上连续采取加息25个基点的行动”。鉴于美国经济增长势头强劲，汇丰预计今年加息之后不会迅速转向降息。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1636356685240","time":1789372462000,"title":"3大风险信号，出现了！","text":"3大风险信号，出现了！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6Q2TO5L0519B7K0.html","importance":""},{"id":"wscn3164674","time":1789372411000,"title":"工信部：将设立国家中小企业发展基金二期","text":"9月14日，国务院新闻办公室举行政策例行吹风会介绍加强中小企业回款难问题治理有关工作情况。工业和信息化部副部长柯吉欣表示，对中小微企业，将多维度提升企业的融资效能，联合财政部、中国人民银行等为中小微企业提供贷款贴息政策，科技创新和技术改造再贷款政策，切实降低中小微中小企业的融资成本。同时将设立国家中小企业发展基金二期，为中小企业转型推进发展注入长期资本、耐心资本。\n
