查失业率为5.3%，比上月上升0.1个百分点。国家统计局新闻发言人付凌晖在国新办新闻发布会上表示，8月份失业率上升主要原因是新毕业学生集中进入劳动力市场带来的季节性影响。从就业主体人群，即30-59岁这部分劳动力主体人群的城镇调查失业率是3.9%，和上月和上年同期都是持平的，保持总体稳定。从行业来看，尽管受到结构调整因素影响，部分行业就业同比有所减少，但我国制造业就业人数总体稳定，信息传输软件和信息技术服务业就业人数明显增加。住宿和餐饮业在国内文旅休闲发展的带动下就业持续扩大，对就业稳定发挥重要作用。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirwscw8690990","time":1789446917000,"title":"受央行债券出售计划和全球抛售潮影响 印度债券价格下跌","text":" 印度央行表示将出售国债以收回银行体系流动性，在政府举债规模创纪录、市场本就承压的一年，债券供给进一步增加，印度债券价格随之下跌。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirwscw8690990.shtml","importance":"important"},{"id":"1638454955435","time":1789446710000,"title":"哦豁！华为和赛力斯，突然宣布“分手”？","text":"哦豁！华为和赛力斯，突然宣布“分手”？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6S9NMM40552K0CA.html","importance":""},{"id":"wscn3165240","time":1789446652000,"title":"越南财政部正考虑进行自2014年以来的首次美元主权债券发行。（路透）\n","text":"越南财政部正考虑进行自2014年以来的首次美元主权债券发行。（路透）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165239","time":1789446615000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 14:00 英国至7月三个月ILO就业人数和失业率；\n② 14:45 法国8月CPI终值；\n③ 16:00 欧洲央行副行长Vujcic讲话；\n④ 16:45 法国央行行长Emmanuel Moulin在金融稳定性委员会会议过后对财政部讲话；\n⑤ 17:00 欧元区9月ZEW经济景气指数，德国9月ZEW经济景气指数；\n⑥ 18:00 欧洲央行管委Escriva谈论数字欧元；\n⑦ 20:30 美国9月纽约联储制造业指数；\n⑧ 22:00 欧洲央行执委Cipollone讲话；\n微信小程序搜索“见闻历”，了解更多。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165238","time":1789446613000,"title":"早间要闻汇总","text":"科创50指数半日涨1.79%，风电、半导体板块集体走强。\n恒指半日跌0.2%，恒生科技指数涨0.8%，腾讯涨近3%，阿里巴巴涨逾2%。\n中国8月规模以上工业增加值同比增速加快至5.2%，高技术制造业增加值增长16.7%。\n中国8月社零同比增0.4%，通讯器材大涨27.3%，汽车下滑18.5%。\n中国1-8月份房地产开发投资同比下降19.9%，新建商品房销售额同比下降13%。\n中国8月70城房价：一线城市新房价格环比由持平转为上涨0.1%，二三线城市房价环比降幅总体收窄。\n","source":"华尔街见闻","category":"fast","stock":"","url":"h "https://www.163.com/dy/article/L6S6I3UE0519848A.html","importance":""},{"id":"wscn3165233","time":1789443823000,"title":"报道：广汽拟购一汽丰田部分股权，南北丰田暂不合并","text":"《财经》了解到，广汽集团公告提及的“某整车合资公司”即为一汽丰田汽车有限公司。本次交易大概率不涉及一汽丰田汽车销售有限公司，广汽集团不会全盘收购一汽股份所持一汽丰田股权，交易也不会直接促成广汽丰田与一汽丰田合并。交易落地后，一汽丰田主体继续存续，股东将变为一汽股份、广汽集团与丰田系，丰田汽车将成为一汽丰田第一大股东。此外，上述消息人士透露，一汽股份在交易后或将持有广汽集团约30%的股份。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165232","time":1789443486000,"title":"印度2031年到期的国债收益率上行13个基点。\n","text":"印度2031年到期的国债收益率上行13个基点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165231","time":1789443450000,"title":"交易员表示，印度央行在外汇市场卖出美元以支撑卢比。\n","text":"交易员表示，印度央行在外汇市场卖出美元以支撑卢比。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165230","time":1789443385000,"title":"日本拍卖20年期国债，认购倍数为4.01，过去12个月均值为3.73。\n","text":"日本拍卖20年期国债，认购倍数为4.01，过去12个月均值为3.73。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165229","time":1789443200000,"title":"伊朗称在霍尔木兹海峡以西击毁一架MQ-1无人机","text":"伊朗伊斯兰革命卫队9月15日发表声明说，伊朗伊斯兰革命卫队航空航天部队当天凌晨在霍尔木兹海峡以西空域拦截并击毁一架MQ-1无人机。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1638932278180","time":1789443182000,"title":"沪指半日跌0.1% 风电股集体走强","text":"沪指半日跌0.1% 风电股集体走强","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/money/article/L6S6CGCU00258105.html","importance":""},{"id":"1632531102911","time":1789443159000,"title":"首创证券换届三落定，蒋青峰张涛“将帅”搭档延续","text":"首创证券换届三落定，蒋青峰张涛“将帅”搭档延续","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6S6AO110552C1DU.html","importance":""},{"id":"wscn3165226","time":1789443117000,"title":"谷歌DeepMind研究员离职发文示警：AI可能“害死所有人”","text":"一位最近从谷歌DeepMind辞职的AI研究员警告说，人类能
