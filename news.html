受损情况。美国国防部监察长的报告称，这场战争已造成“战略库存短缺”，并暴露出弹药补充方面的军工产能瓶颈。专家此前估计，美军可能需要约三年时间，才能将先进导弹和防空拦截弹库存恢复至战前水平。（央视新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1631126724807","time":1789428399000,"title":"凌晨，直线大跳水！美国银行，突发利空","text":"凌晨，直线大跳水！美国银行，突发利空","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6RO8QGS0519JFL1.html","importance":"important"},{"id":"16312002720","time":1789428389000,"title":"以债促股、股债联动！三维度聚焦，国开证券全方位服务科技金融发展","text":"以债促股、股债联动！三维度聚焦，国开证券全方位服务科技金融发展","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6RO8GR20519JFL1.html","importance":""},{"id":"163996457226","time":1789428201000,"title":"美股齐跌，芯片股光通信重挫，金融板块跳水，10年期美债破5，恐慌指数VIX飙升8%","text":"美股齐跌，芯片股光通信重挫，金融板块跳水，10年期美债破5，恐慌指数VIX飙升8%","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6RO3AUA0519DDQ2.html","importance":""},{"id":"wscn3165098","time":1789428100000,"title":"美国加州在《清洁空气法》豁免权之争中取得第二次胜利","text":"近日，美国哥伦比亚特区联邦地区法院法官Beryl Howell裁定，环境保护署（EPA）必须撤销其将授予加州的两项《清洁空气法》豁免权重新归类为“规则”而非“命令”的决定。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165097","time":1789428059000,"title":"华尔街见闻早餐 | 2026年9月15日","text":"美股三大指数全线下跌，Anthropic等行业龙头呼吁放缓开发重创AI概念股，美银收跌超5%拖累华尔街大行；10年期美债收益率近三年来首次盘中升破5.0%；油价反弹、黄金下跌。\n特朗普抨击：AI发展不能踩刹车，美国有“高智商总统”就足够。特朗普致电黄仁勋，亲口支持数据中心、斥AI危险论为“骗局”。\n中国8月新增社融1.66万亿元，人民币贷款增加600亿，前八个月股债融资占比首次超过贷款。\n伊朗称一艘油轮试图穿越海峡时触雷爆炸，强调霍尔木兹仍被伊管控、处封锁状态。特朗普称愿与伊朗谈判，提出美国要收“护航补偿”；伊朗官员：在伊方条件满足前不会与美对话。\n胡塞武装上周日大规模袭击沙特空军基地；关键绕行管线关闭后，沙特被曝寻求加大霍尔木兹海峡原油出口。\n特朗普：俄乌同意停止攻击能源目标，泽连斯基：尚未达成协议，愿讨论能源领域停火。\n报道：铠侠考虑赴美发行ADR募资至少100亿美元，或于明年上市。\n华尔街大行全线重挫，美银盘中跌6%、CEO称三季度交易收入料同比增长停滞、投行收入指引逊于预期。\n提醒：周二将公布中国8月工业增加值、社会消费品零售等月度经济数据。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1639089645592","time":1789427708000,"title":"AI巨头罕见喊降速，A股投资风格会迎来大切换吗？","text":"AI巨头罕见喊降速，A股投资风格会迎来大切换吗？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6RFMHMF051983MB.html","importance":""},{"id":"wscn3165096","time":1789427700000,"title":"急于推动大规模重组，“针对中国”显复杂心态，美国安局被爆要设中国事务部","text":"美国《华盛顿邮报》13日发表“独家报道”称，美国国家安全局（NSA）将启动至少十年来最大规模内部重组，设立5个新机构，分别负责人工智能、中国事务、网络安全、作战支援（或作战行动）以及全球情报。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165113","time":1789427397000,"title":"Cohere首席执行官：AI模型正成为有史以来“最强大的网络武器”","text":"Cohere首席执行官戈麦斯（Aidan Gomez）表示，由于人工智能（AI）模型具备大规模发现和利用漏洞的能力，它们正成为有史以来“最强大的网络武器”。\n他的警告是在AI模型攻破外部系统的事件之后发出的，其中包括OpenAI模型未经授权访问Hugging Face。\n这些网络安全担忧正推动一场更广泛的AI安全辩论，包括Anthropic首席执行官达里奥·阿莫代伊（Dario Amodei）在内的行业领袖呼吁采取措施放缓前沿AI的发展。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"cls2482914","time":1789426800000,"title":"【早报】美股光通信、存储芯片板块大跌；事关国民经济运行，重要发布会今日举行；原油走强、黄金下挫","text":"①8月金融数据出炉，前八个月新增社融23.91万亿元②央行：今日将开展5000亿元买断式逆回购操作，期限为6个月③美股小幅收跌，费城半导体指数大跌5.86%④沙特关键输油管道被曝遇袭受损，主力运力将停运数周⑤广汽集团：筹划发行股份购买一汽股份持有的某整车合资公司部分股权。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2482914","importance":"important"},{"id":"wscn3165103","time":1789426756000,"title":"Opus 5.2上线","text":"北京时间今天清晨，Opus 5.2悄悄上线了。许多开发者发现，新一代神级模型Claude Opus 5.2，已经在 Claude Code 中开启灰度测试！而且，此前一份内部风险报告显示，Anthropic正在动用「核武器级别」的未发布模型Model 2。它接管了公司大部分代码编写，将替代85%研究团队。\n越来越多的Claude用户发现：在Claude Code中调用Opus 5时，它的表现和网页版Opus 5截然不同，仿佛降维打击。开发者们通过抓包和查看请求状态（/status）发现，虽然前端名字没变，但背后的模型slug已经赫然指向了Opus 5.2！（新智元）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165094","time":1789426641000,"title":"伊朗：在沙特要求下，涉霍尔木兹海峡商运航线会议推迟","text":"据路透社14日报道，伊朗与海湾阿拉伯国家原定当天举行的一场会议被推迟。同时，霍尔木兹海峡等中东重要能源运输通道附近接连发生袭击，全球能源供应面临的不确定性进一步上升。\n阿曼通讯社13日称，阿曼方面表示，为给建设性对话创造条件，原定在阿曼南部城市塞拉莱举行的会议将延期。阿曼外交大臣巴德尔在社交平台上表示，阿曼将继续推动对话，促进地区稳定与持久合作。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165093","time":1789426541000,"title":"也门境内沙特领导的联军称，也门胡塞武装周一袭击沙特海米斯穆谢特、艾卜哈与塔伊夫等城市，造成 13 名平民受伤。\n","text":"也门境内沙特领导的联军称，也门胡塞武装周一袭击沙特海米斯穆谢特、艾卜哈与塔伊夫等城市，造成 13 名平民受伤。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165091","time":1789426031000,"title":"年内超百家A股公司完成定增","text":"今年以来，定增市场活跃。Wind数据显示，以发行日期统计，今年1月1日至9月14日，已有135家A股上市公司完成定增，较去年同期的97家增长39.18%。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165090","time":1789425906000,"title":"上市中小银行集中回应市场关切","text":"近期，上市城商行、农商行等中小银行集中召开2026年半年度业绩说明会，上市银行管理层围绕净息差、资产质量、信贷投放、资本补充及分红安排等市场关切问题进行回应。这也成为透视中小银行下一阶段经营策略的重要窗口。在传统规模扩张模式面临约束的背景下，中小银行正在重新寻找增长与稳健之间的平衡。记者注意到，部分中小银行开始更加主动谈及资产负债结构调整、特色化经营等话题。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165089","time":1789425737000,"title":"美国加州州长纽森排除2028年对决哈里斯：她若参选总统我就放弃角逐","text":"美国加州州长加文·纽森表示，如果前副总统卡玛拉·哈里斯参加2028年总统大选，他将不会参选，从而排除了这两位加州最知名的民主党人可能在党内初选中正面交锋的情况。“我不知道她是否会参选，我们拭目以待，”纽森在周一发布的一段视频中接受采访时表示。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165088","time":1789425593000,"title":"甲骨文：美国法院关于空气质量的命令并不涵盖数据中心","text":"甲骨文表示，美国新墨西哥州最高法院暂停一项行政空气质量许可程序的决定，是针对相邻的一个微电网项目，并不涵盖其“木星计划”（Project Jupiter）数据中心园区。\n该公司表示，数据中心和微电网是位于相邻但不同地块上的独立设施。新墨西哥州最高法院的暂停令仅针对微电网的空气许可程序，并不涉及县级的建筑许可。甲骨文称，数据中心建筑本身不排放空气污染物，因此根据新墨西哥州法律，不具备被认定为“污染源”的资格。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165087","time":1789425556000,"title":"谷歌公司允许所有工程师使用Anthropic PBC的模型Claude。（Business Insider）\n","text":"谷歌公司允许所有工程师使用Anthropic PBC的模型Claude。（Business Insider）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165086","time":1789425476000,"title":"银行业以客群专属、区域限定产品革新存款经营，大额存单告别统一定价","text":"近期，多家银行密集推出客群专属大额存单，面向私人银行客户、新客、代发工资客户发售专项产品，利率较普通大额存单小幅上浮。部分银行还结合属地经营特点，发行区域限定类大额存单。不同于过去统一起存门槛、统一利率的标准化供给模式，“不同客群、不同利率、差异化门槛”正成为大额存单市场新特征，银行存款经营思路随之转变。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165085","time":1789425161000,"title":"资金大进大出成常态，倒逼ETF运作管理升级","text":"今年以来，A股市场结构性分化显著，热点板块快速轮动，ETF资金流向因此呈现高频波动状态。数据显示，今年以来ETF整体规模“先抑后扬”，资金“大进大出”常态化特征明显。这对基金公司的运作管理能力提出全新挑战。在业内人士看来，公募基金行业要进一步优化投资者结构，通过技术赋能精细化管理，以适配新的市场生态。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165084","time":1789425109000,"title":"基金销售机构百强出炉，首现非货保有规模2万亿级巨头","text":"中国证券投资基金业协会最新披露数据显示，蚂蚁基金非货基金保有规模达到2.21万亿元，这是单一基金销售机构非货基金保有规模首超2万亿元。从业内最新发展动向看，越来越多基金销售机构从销售单一产品向资产配置、买方投顾转型，行业发展逻辑正在重塑。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165083","time":1789424966000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 时间待定 SK海力士韩国工会将投票表决暂定薪资协议（9月15日和16日）；\n② 09:30 中国70城房价；\n③ 10:00 中国8月社会消费品零售总额、规模以上工业增加值、城镇固定资产投资、全国房地产开发投资，国新办就国民经济运行情况举行新闻发布会；\n④ 14:00 英国7月三个月ILO就业人数和失业率；\n⑤ 14:45 法国8月CPI终值；\n⑥ 16:00 欧洲央行副行长Vujcic讲话；\n⑦ 16:45 法国央行行长Emmanuel Moulin在金融稳定性委员会会议过后对财政部讲话；\n⑧ 17:00 欧元区9月ZEW经济景气指数，德国9月ZEW经济景气指数；\n⑨ 18:00 欧洲央行管委Escriva谈论数字欧元；\n⑩ 时间待定 美国财长贝森特预可能会出席众议院金融服务委员会进行作证；\n⑪ 可能举行 Anthropic PBC开发者大会；\n⑫ 20:30 美国9月纽约联储制造业指数；\n⑬ 22:00 欧洲央行执委Cipollone讲话；\n微信小程序搜索“见闻历”，了解更多。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165082","time":1789424935000,"title":"怡安通过债券发售筹集135亿美元，为收购USI提供资金","text":"怡安（Aon Plc.）通过一次高评级债券发售筹集了135亿美元，以资助其计划中的USI保险服务公司（USI Insurance Services）收购案，这标志着2026年市场上规模最大的并购融资交易之一。\n投资者对该债券发售的认购订单高达650亿美元，其中期限最长的债券吸引了最多的需求。\n作为其170亿美元全现金收购USI交易融资的一部分，怡安分七个部分出售了票据，期限从三年到三十年不等。\n据知情人士透露，投资者对该债券发售的认购订单高达650亿美元，其中期限最长的债券吸引了最多的需求。怡安分七个部分出售了票据，期限从三年到三十年不等。在初步讨论到最终定价期间，最长期限票据的收益率利差收窄了0.35个百分点，最终定价为较美国国债收益率高出1.15个百分点。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165081","time":1789424785000,"title":"业内人士：美联储加息箭在弦上，A股后市把握三类投资机遇","text":"多位业内人士认为，美联储或在9月开启预防型加息，短期内对市场扰动有限，且美联储当前也缺乏持续大幅加息的基础；对A股而言，产业层面的变化将成为下一阶段市场的运行主线，在宏观压制性因素落地后，市场有望逐渐重回上行区间。在行业配置上，建议重点关注AI算力链、资源品涨价等方向机遇。此外，看好银行、保险等红利板块，以及有望受益于高油价的油气开采、油服工程等板块。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165080","time":1789424249000,"title":"银行秋招风向生变，AI复合型人才受青睐","text":"眼下银行秋季校园招聘全面启动，AI、大模型相关人才需求热度走高。国有大行、股份行增设科技菁英、智能研发等岗位，更加看重懂金融业务的AI复合型人才。当前，数智化转型正在重塑银行的人才需求与业务模式。大模型从试点探索转向规模化应用，这既推动银行业务全流程提效，也对从业人员的综合能力提出新的要求。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165079","time":1789424131000,"title":"城堡证券：增长疲弱或将压制欧洲债券收益率上行空间","text":"城堡证券表示，能源冲击和央行收紧政策推动欧洲债券收益率走高，但这些因素最终可能通过削弱欧洲经济而限制收益率进一步上升。欧洲央行上周以通胀风险上升为由加息后，欧洲和英国债券成为全球债市抛售中受冲击最严重的品种。欧洲对进口能源的依赖促使交易员为央行进一步加息做准备。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165078","time":1789423921000,"title":"事关国民经济运行 重要发布会今天10时举行","text":"国务院新闻办公室将于2026年9月15日（星期二）上午10时举行新闻发布会，请国家统计局新闻发言人、总经济师、国民经济综合统计司司长付凌晖介绍2026年8月份国民经济运行情况，并答记者问。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165077","time":1789423263000,"title":"周二亚太盘初，WTI原油期货高开0.7%，伊朗说没有与美国对话，伊朗革命卫队称一艘油轮试图穿越海峡时触雷爆炸。\n","text":"周二亚太盘初，WTI原油期货高开0.7%，伊朗说没有与美国对话，伊朗革命卫队称一艘油轮试图穿越海峡时触雷爆炸。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"16352309573","time":1789417608000,"title":"关键绕行
