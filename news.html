家金融监督管理总局有关司局负责人就《资产管理信托管理办法》答记者问。《办法》在资产管理信托投资方面主要有哪些要求？\n\n答：一是严格运用方式管理。信托公司运用信托资金，应当法律关系清晰，按照《办法》规定的投资范围，投资于真实、合法、有效的基础资产。二是明确资产管理信托投资证券、非标准化债权类资产、其他资产管理产品、关联方资产等具体监管要求。三是严格组合投资管理。除少数符合特定条件的信托产品外，单个信托产品投资于同一资产/同一资管产品的资金，不得超过信托产品净资产的百分之二十五。四是加强投资合作机构管理。明确了投资合作机构的资质条件和管理要求。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/414814127","importance":""},{"id":"sinacomos:niwziir8107799","time":1793362353000,"title":"10月，“逆风起飞”的十大牛股","text":" 10月行情收官，全月整体呈现单边下行态势。截至今日收盘，上证指数单月下跌6.33%，深证成指跌15.94%，创业板指跌23.02%，科创综指跌21.70%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/wm/2026-10-30/doc-iniwziir8107799.shtml","importance":""},{"id":"sinacomos:niwziin5431896","time":1793362351000,"title":"工商银行回应未来分红走向：将持续把投资者利益放在重要位置，在决策中充分考量市场预期","text":"10月30日金融一线消息，工商银行今日召开2026年三季度业绩说明会。对于分红相关问题，财务会计部相关负责人表示，工行始终把回报投资者作为重中之重...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jryx/bank/2026-10-30/doc-iniwziin5431896.shtml","importance":"important"},{"id":"sinacomos:niwziit4565605","time":1793362317000,"title":"币安开始回补受影响资产 已预留63.4亿美元","text":"币安在社交平台发帖称，已预留逾63.4亿美元公司资金用于应对此次安全事件，其中50亿美元已经以受影响的对应代币持有。 币安正在通过市场及场外交易渠道购买代币资产...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-10-30/doc-iniwziit4565605.shtml","importance":""},{"id":"xq4906672","time":1793362284000,"title":"【金融监管总局：信托公司开展资产管理信托业务应充分说明风险 不得以任何形式承诺保本保收益】国家金融监督管理总局有关司局负责人就《资产管理信托管理办法》答记者问。...","text":"【金融监管总局：信托公司开展资产管理信托业务应充分说明风险 不得以任何形式承诺保本保收益】国家金融监督管理总局有关司局负责人就《资产管理信托管理办法》答记者问。《办法》在资产管理信托销售方面主要有哪些要求？\n\n答：信托公司开展资产管理信托业务，应当向投资者充分说明风险，不得以任何形式承诺保本保收益。一是限制代理销售机构范围。现阶段，只允许信托公司、商业银行、保险公司、证券公司代理销售信托产品。禁止其他机构和个人变相开展信托产品销售。二是严格风险揭示要求。要求信托文件以醒目方式揭示信托产品的风险和风险承担原则。对于拟投资其他资产管理产品的信托产品，需穿透说明下层资产管理产品的投资策略和风险收益特征。三是严格销售管理。要求信托公司加强销售渠道、文件和人员管理，厘清与代理销售机构之间的责任。明确信托公司和代理销售机构在产品销售过程中的禁止性行为。四是坚持风险匹配原则。信托公司应当对信托产品逐个划分风险等级，明确适合销售的投资者范围；对包括自然人在内的普通投资者逐个划分风险承受能力等级，向投资者销售与其风险承受能力相匹配的信托产品。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/414813956","importance":""},{"id":"xq4906671","time":1793362205000,"title":"【金融监管总局：信托公司应当坚持资产管理信托的资产管理产品本质 信托产品坚持私募定位】国家金融监督管理总局有关司局负责人就《资产管理信托管理办法》答记者问。《办...","text":"【金融监管总局：信托公司应当坚持资产管理信托的资产管理产品本质 信托产品坚持私募定位】国家金融监督管理总局有关司局负责人就《资产管理信托管理办法》答记者问。《办法》对资产管理信托如何定位？\n\n答：《办法》将资产管理信托定位为基于信托法律关系的私募资产管理产品，具有以下特征：一是符合资产管理本质。信托公司应当坚持资产管理信托的资产管理产品本质，坚持为投资者利益服务，坚持“卖者尽责、买者自负；卖者失责、依法赔偿”，做好适当性管理、销售管理、投资管理、财产托管、净值管理、信息披露等全流程管理。二是坚持私募定位。信托产品面向合格投资者非公开发行且数量不超过200个。三是严格投资者标准。在落实资管新规投资者标准基础上，对于风险较高的信托产品，实施更为严格的投资者资质和最低投资金额。同时要求信托公司在信托产品销售和份额转让等环节，都要履行合格投资者评估程序。同时，《办法》明确资产管理信托以资金设立、遵循投资者利益优先的原则、由信托公司自主管理，因此资产管理信托业务不应使用“财产权信托”“融资类信托”“事务管理类信托”等类似表述。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/414813720","importance":"hot"},{"id":"sinacomos:niwziir8112371","time":1793362130000,"title":"Z世代告别酒吧，投身跑步俱乐部：在这里收获的不只是友谊","text":"核心要点 年轻成年人正转向休闲体育运动、跑步社团与各类正式赛事，其中就包括知名 DJ 迪普洛主办的 5 公里跑。他们不需要酒精，也借此建立社交联结。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-10-30/doc-iniwziir8112371.shtml","importance":""},{"id":"sinacomos:niwziin5428888","time":1793362124000,"title":"铠侠控股营业利润飙升 受AI数据存储需求激增推动","text":" 受数据中心运营商愿意为闪存芯片支付高价提振，总部位于东京的铠侠控股公布营业利润激增22倍。该公司同时宣布派发中期股息。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-10-30/doc-iniwziin5428888.shtml","importance":""},{"id":"xq4906669","time":1793362096000,"title":"【光峰科技公布三季报，投资布局光互连赛道】\n10月30日，光峰科技公布2026年三季报，财报显示，三季度营收为2.49亿元，研发投入为5053万元；前三季度营收...","text":"【光峰科技公布三季报，投资布局光互连赛道】\n10月30日，光峰科技公布2026年三季报，财报显示，三季度营收为2.49亿元，研发投入为5053万元；前三季度营收为7.26亿元，前三季度研发投入为1.69亿元。\n报告期内，公司稳步推进自研上游核心器件与现有业务的深度融合，加码产业链上游的生态布局。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/414813372","importance":""},{"id":"sinacomos:niwziit4553909","time":1793362089000,"title":"特朗普称伊朗战事将“很快结束”","text":"美国总统特朗普30日在接受采访时表示，伊朗战事将“很快结束”。美国需要得到保证“伊朗永远不会拥有核武器”。","source":"
