importance":""},{"id":"wscn3165696","time":1789496055000,"title":"伊拉克总理：将向德国出口石油。\n","text":"伊拉克总理：将向德国出口石油。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165695","time":1789495559000,"title":"据知情人士透露，裕信银行希望德国商业银行CEO Bettina Orlopp和董事会主席Jens Weidmann（原德国央行行长）离职。\n裕信银行还反对德国政","text":"据知情人士透露，裕信银行希望德国商业银行CEO Bettina Orlopp和董事会主席Jens Weidmann（原德国央行行长）离职。\n裕信银行还反对德国政府“希望保留两个监事会席位”的主张。（路透）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165694","time":1789495530000,"title":"美国众议院将在马西动议下投票弹劾赫格塞思","text":"美国共和党众议员马西（Thomas Massie）将于本周强制推动众议院对国防部长赫格塞思（Pete Hegseth）进行弹劾投票，理由是对伊朗战争相关问题的担忧。\n来自肯塔基州的马西是司法委员会成员，在初选中失利后即将离开国会。他于周二在众议院宣读了对赫格塞思的弹劾条款。马西以”特权动议”（privileged）的形式提出该措施，这意味着该动议将在两个立法日内触发投票。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4892119","time":1789495335000,"title":"据美国国会预算办公室（CBO），伊朗战争头五个月耗费美国380亿美元。","text":"据美国国会预算办公室（CBO），伊朗战争头五个月耗费美国380亿美元。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409404030","importance":"hot"},{"id":"xq4892118","time":1789495293000,"title":"美国国会预算办公室（CBO）预计2027年第一季度PCE年化通胀率将上调0.5个百分点。","text":"美国国会预算办公室（CBO）预计2027年第一季度PCE年化通胀率将上调0.5个百分点。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409404015","importance":"hot"},{"id":"wscn3165693","time":1789495254000,"title":"美国国会预算办公室（CBO）：预计2027年一季度年化PCE通胀将（比之前预期）高出0.5个百分点。\n（美国+以色列挑起的）伊朗战争已经在最近五个月给美国造成3","text":"美国国会预算办公室（CBO）：预计2027年一季度年化PCE通胀将（比之前预期）高出0.5个百分点。\n（美国+以色列挑起的）伊朗战争已经在最近五个月给美国造成380亿美元代价。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirxxxh8212256","time":1789495247000,"title":"卡尼扩大投资税收优惠适用范围 力促投资加拿大","text":" 加拿大总理马克·卡尼正扩大一项重大投资税收抵扣政策的适用范围，将油气管道、矿业资产等纳入加拿大加速折旧扣除适用资产清单。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-16/doc-inirxxxh8212256.shtml","importance":"important"},{"id":"wscn3165692","time":1789495073000,"title":"全球黄金ETF资产管理规模创纪录，机构：金价短期承压不改长期配置价值","text":"8月以来，黄金类ETF持续获得资金流入，截至9月14日，境内黄金相关ETF资金净流入超过百亿元。与此同时，8月全球实物黄金ETF资金净流入约180亿美元。近期，油价上涨及美联储加息预期升温令金价短期承压。但从中长期来看，多家机构认为，央行购金、储备多元化和避险需求仍为黄金提供支撑。(上证报)\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165691","time":1789495053000,"title":"近一个月净流入500亿元，资金借道ETF布局硬科技","text":"在近期的震荡行情中，资金逆势流入硬科技板块。测算显示，过去1个月来，科创50、半导体、通信、人工智能等相关主题ETF资金净流入超过500亿元。此外，近期科技主题基金密集成立，在新成立ETF披露的持有人名单中，频现产业资本和机构投资者的身影。(上证报)\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165690","time":1789495021000,"title":"三大利好共振，资金加速涌入科创债ETF","text":"在政策红利、增量资金预期、底层资产扩容三重利好的共振下，科创债板块行情走强，科创债ETF也迎来资金的持续抢筹。8月以来，24只科创债ETF净申购份额超过1亿份，规模大增132亿元。业内人士认为，随着债券市场“科技板”建设的推进，科创债的供给与机构配置空间有望进一步打开，长期配置价值将持续显现。(上证报)\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxxxq3374025","time":1789494989000,"title":"美联储不会逆市场定论而动 几十年无一例外","text":"债券交易员认为美联储会在周三加息，而且他们笃定的程度之高到了几十年来从未落空的地步。 与美联储会议日期挂钩的利率互换显示，交易员认为主席凯文·沃什及其同僚将基准政...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-16/doc-inirxxxq3374025.shtml","importance":"hot"},{"id":"wscn3165689","time":1789494748000,"title":"美联储不会逆市场定论而动，几十年无一例外","text":"债券交易员认为美联储会在周三加息，而且他们笃定的程度之高到了几十年来从未落空的地步。\n彭博汇总的2008年以来数据显示，每当市场对加息的预期如此之高时，美联储最终无一例外都加以满足。\n“市场没有给按兵不动或者鸽派加息的场景留余地，” Lunate投资研究主管Caesar Maasry说。\n“明天的美联储决定将是一段时间以来影响力最大的一次，” 美国银行外汇策略师Alex Cohen说，“在加息预期达到90%左右的情况下，他们要是维持不变就几乎会是史无前例了。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165688","time":1789494519000,"title":"贝莱德集团CEO Larry Fink：加拿大的行动
