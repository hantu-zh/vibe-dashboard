"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1636556113850","time":1789628743000,"title":"万亿规模垫底！“利润之王”也赚不到钱了","text":"万亿规模垫底！“利润之王”也赚不到钱了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L71MTNMI0519H3R1.html","importance":""},{"id":"wscn3166687","time":1789628727000,"title":"咨询公司Verisk称亚洲粮食安全风险加剧 厄尔尼诺和战争使然","text":"咨询公司Verisk Maplecroft称，极端天气灾害将加剧亚洲的粮食安全风险，并可能在印度、印尼和菲律宾等脆弱的国家引发社会和政局动荡。伊朗冲突本已扰乱了燃料和化肥供应，这两者都是农业领域的重要投入品。现在，与强厄尔尼诺现象相关的极端天气又对该地区的农作物构成进一步威胁。作为全球最大的棕榈油生产国，印尼受到一系列难以控制的野火困扰，收成受到影响。与此同时，全球最大大米出口国印度所依赖的季风降雨量较正常水平低15%，泰国的糖料作物收成也将下滑。Verisk周四发布报告称，战争和天气这双重威胁正在推高食品价格通胀，而这是固有的社会动荡导火索。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166686","time":1789628700000,"title":"沪深两市今日成交额合计18231.34亿元","text":"9月17日，沪深两市全天成交额合计18231.34亿元。其中，沪市成交额为8687.73亿元；深市成交额为9543.61亿元；创业板成交额为4466.47亿元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1634918895280","time":1789628583000,"title":"收评：创业板指冲高回落跌0.4% 农业板块逆势走强","text":"收评：创业板指冲高回落跌0.4% 农业板块逆势走强","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/money/article/L71N6GJM00258105.html","importance":"hot"},{"id":"ths680008762","time":1789628580000,"title":"期货收评：能化大跌！原油暴跌超6%，碳酸锂涨近4%","text":"期货收评：今日收盘，商品跌多涨少，纯苯触及6%跌停，SC原油跌超6%，苯乙烯跌超5%，燃料油跌超4%，液化石油气、对二甲苯跌超3%，苹果、低硫燃料油跌超2%。涨幅方面，集运欧线涨超8%，碳酸锂涨近4%，菜粕涨近3%，胶合板涨超2%。","source":"同花顺","category":"fast","stock":"","url":"http://goodsfu.10jqka.com.cn/20260917/c680008762.shtml","importance":"important"},{"id":"ths680008771","time":1789628580000,"title":"欧洲主要股指开盘集体上涨","text":"欧洲主要股指开盘集体上涨，欧洲斯托克50指数涨0.52%，英国富时100指数涨0.41%，法国CAC40指数涨0.34%，德国DAX指数涨0.39%。","source":"同花顺","category":"fast","stock":"","url":"http://stock.10jqka.com.cn/20260917/c680008771.shtml","importance":""},{"id":"wscn3166685","time":1789628548000,"title":"欧洲斯托克600指数开盘涨0.4%，德国DAX指数涨0.4%，英国富时100指数涨0.4%，法国CA
