3%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165611","time":1789482800000,"title":"美国财长贝森特：美国债券市场是全球表现最佳的市场。\n","text":"美国财长贝森特：美国债券市场是全球表现最佳的市场。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165610","time":1789482788000,"title":"华为郭平：华为差异化布局AI","text":"日前，华为监事会主席郭平在与新员工座谈时表示，AI时代下，华为将依据不同业务场景差异化布局AI：在计算和ICT领域重点建设面向客户的算力与平台能力，目标是成为英伟达；在终端、智能驾驶和云业务中持续推进大模型及智能体能力发展。华为大模型战略与自身业务追求紧密结合，华为坚持投入，但根据业务场景差异化布局。（证券时报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165609","time":1789482764000,"title":"意大利将对西班牙的边境管控措施再延长15天","text":"当地时间9月15日，意大利政府宣布，将港口和机场实施的针对西班牙入境人员的边境检查措施再次延长15天。意大利内政部表示，这一决定是在当天举行的移民与边境安全分析委员会会议进行评估后作出的。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxpis3678919","time":1789482738000,"title":"国产算力、医药、黄金……基金投顾最近买了什么？","text":"近期，A股市场结构分化行情持续演绎。8月底以来，投顾组合也在波动中悄然“调舵”。 记者梳理发现，对待科技，多个投顾组合都关注到了国产算力方向的配置价值。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/marketresearch/2026-09-15/doc-inirxpis3678919.shtml","importance":""},{"id":"wscn3165608","time":1789482716000,"title":"王毅会见东盟秘书长","text":"中共中央政治局委员、外交部长王毅15日在北京会见东盟秘书长高金洪。王毅说，中方高度重视东盟并将东盟作为周边外交的优先方向，今年是中国东盟建立全面战略伙伴关系5周年和建立对话关系35周年，双方关系发展面临新契机。中方将继续支持东盟团结和共同体建设，愿同东盟一道推动构建更为紧密的中国—东盟命运共同体。高金洪说，东盟愿同中方共享机遇，共迎挑战，继续深化拓展各领域务实合作，推进东盟中国关系不断迈上新水平。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165607","time":1789482696000,"title":"思科与英伟达扩大Splunk Agentic AI协议。\n","text":"思科与英伟达扩大Splunk Agentic AI协议。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165606","time":1789482661000,"title":"美国参议院多数党领袖图恩：随着柴油价格飙升，对柴油出口禁令持 “开放” 态度","text":"美国参议院多数派领导人图恩（John Thune）表示，随着全美柴油均价突破每加仑6美元，他对研究柴油出口禁令持 “开放态度”。他在记者提问时回应称：“我们会考量所有具备可行性的方案。我认为，如果国内拥有充足供应，当下却仍向外出口柴油，这或许是缓解价格压力的一个办法。倘若此举能够减轻涨价压力，我愿意研究该方案。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxpis3678329","time":1789482650000,"title":"富国银行：市场回调或将临近","text":"富国银行对股市能否在当前点位继续大幅走高持怀疑态度。 策略师权吴成（Ohsung Kwon）将标普 500 年末目标价由 7950 下调至 7700。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxpis3678329.shtml","importance":""},{"id":"wscn3165605","time":1789482600000,"title":"华为郭平：未来华为核心战略是“聚焦”","text":"华为监事会主席郭平日前在与新员工座谈时表示，未来，华为的核心战略是“聚焦”，即深耕华为擅长的“连接”和“计算”领域，没有业务扩展计划。（证券时报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165604","time":1789482578000,"title":"富国银行权相勋下调标普500目标，科技领域AI担忧加剧","text":"富国银行首席股票策略师权相勋（Ohsung Kwon）下调了标普500指数的年终目标，他表示，长达十年的盈利增长周期终将放缓，而科技板块的风险正在积聚。\n权相勋对科技股的态度更为谨慎，将其评级从”超配”调整为”平配”，并更看好软件股而非半导体股——后者可能重新测试7月份的低点。\n该分析师将医疗保健板块从”平配”上调至”超配”，理由是中期选举中民主党获胜可能带来的潜在利好，包括恢复《平价医疗法案》的增强补贴。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxpiq6904017","time":1789482381000,"title":"美联储未来一年将至少加息两次","text":"大多数受访者现在预测，美联储未来一年至少加息两次，其中三分之一预测三次或更多。这与上月相比形成鲜明变化，当时仅有46%预计会加息。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxpiq6904017.shtml","importance":"important"},{"id":"wscn3165602","time":1789482361000,"title":"道指跌超500点，跌幅扩大至1%，标普跌超0.4%，纳指跌0.6%，生物科技指数跌1.7%，半导体指数涨幅收窄至不足1%。\n","text":"道指跌超500点，跌幅扩大至1%，标普跌超0.4%，纳指跌0.6%，生物科技指数跌1.7%，半导体指数涨幅收窄至不足1%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxpis3676308","time":1789482349000,"title":"贝森特将10年期美债收益率上涨归咎于油价走高","te
