计加息四次、每次25个基点，届时存款利率将升至3.5%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-14/doc-inirvkkq7172095.shtml","importance":"important"},{"id":"wscn3164918","time":1789396978000,"title":"公开数据：霍尔木兹海峡单日通行量降至个位数","text":"据路透社14日报道，霍尔木兹海峡上周末两天内单日船舶通行量仅为个位数，低于10天内每日平均14艘船的通行量。\n报道说，根据14日的船舶追踪信息，上周末两天内，4艘船只驶出霍尔木兹海峡，其中包括运载能源的船只；10艘货船驶入霍尔木兹海峡。\n不过，上述数字不包括通过霍尔木兹海峡时关闭自动识别系统的船只。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164917","time":1789396911000,"title":"戴尔家族办公室与Sequence斥资77亿美元收购Baldwin","text":"迈克尔·戴尔的家族办公室与Sequence Holdings联手，以77亿美元的全现金交易收购Baldwin Insurance Group Inc.。\n根据周一的一份声明，DFO Management与一家专注于人工智能（AI）的控股公司Sequence将组建一家实体，持有这家保险分销和风险管理公司的多数股权，而部分Baldwin员工将保留少数股权。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4890127","time":1789396785000,"title":"美国10年期通胀保值国债（TIPS）收益率触及2.622%，为2008年以来最高。","text":"美国10年期通胀保值国债（TIPS）收益率触及2.622%，为2008年以来最高。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409242217","importance":"hot"},{"id":"sinacomos:nirvkku4360288","time":1789396780000,"title":"美国10年期国债收益率2023年以来首次升破5%","text":"美国10年期国债收益率涨破5%，为2023年10月以来首次。油价飙升加剧通胀之忧，美国基准国债收益率一度上涨4个基点至5.006%，2023年10年债收益率只在5%上方维持了一天。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirvkku4360288.shtml","importance":"hot"},{"id":"xq4890126","time":1789396748000,"title":"由于工作人员配置不足，前往洛杉矶国际机场的航班暂停起飞。","text":"由于工作人员配置不足，前往洛杉矶国际机场的航班暂停起飞。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409242172","importance":""},{"id":"wscn3164916","time":1789396699000,"title":"报告：全球核电装机容量到2060年可能增长两倍","text":"国际原子能机构14日发布《能源、电力与核电估算2060》展望报告显示，到2060年，全球核电装机容量可能增长两倍以上。这是该机构连续第六年上调其对核电扩张的预测。\n报告数据显示，截至2025年底，全球共有在运核反应堆413座，提供377.1吉瓦的核电装机容量。报告预计，到2060年，全球核电装机低估值预测将增至696吉瓦，约为2025年水平的两倍；高估值预测将增至1284吉瓦，约为2025年水平的3.4倍。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164915","time":1789396508000,"title":"广汽一汽重组前，广汽丰田总经理和副总齐齐被调走","text":"广汽集团发布公告称，公司筹划以发行股份的方式购买一汽股份持有的某整车合资公司的部分股权，并募集配套资金。在此次广汽集团宣布和一汽股份重组前，记者了解到，广汽丰田总经理、副总经理均被调走。目前，文大力不再担任广汽丰田汽车有限公司党委书记、委员、董事、执行副总经理职务，调回广汽集团总部工作。望军任广汽零部件有限公司党委委员、副书记、总经理，提名为广汽零部件有限公司董事，不再担任广汽丰田汽车有限公司党委委员、副总经理职务。（第一财经）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4890118","time":1789396475000,"title":"【农业农村部召开全国海洋渔船安全生产监管工作视频会议】农业农村部14日召开全国海洋渔船安全生产监管工作视频会议。会议强调，要聚焦“船、港、人、网”重点领域，扎实...","text":"【农业农村部召开全国海洋渔船安全生产监管工作视频会议】农业农村部14日召开全国海洋渔船安全生产监管工作视频会议。会议强调，要聚焦“船、港、人、网”重点领域，扎实有力推进海洋渔船安全生产专项整治。要着力推动老旧渔船更新改造和减船转产，严格渔船设计、建造等监管，严格执行渔船出港检查、大风天气召回等制度，全链条严把渔船安全关。要加快智慧渔港建设，建立健全船籍港地和靠泊港地安全协同监管制度，全面提升渔港监管水平。要压实船东主体责任，提高船长船东船员的安全意识和能力水平，切实加强海洋渔业执法监管，严厉打击违法违规行为。要强化网具和作业方式监管，严查网证不符问题，规范网具装载标准，从源头管住因网致险隐患。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409241810","importance":"hot"},{"id":"wscn3164913","time":1789396231000,"title":"中共中央办公厅、国务院办公厅、中央军委办公厅印发《退役军人服务和保障“十五五”规划》","text":"《规划》提出，“十五五”时期退役军人工作要坚持党的领导，引导退役军人坚定听党话跟党走；坚持以人为本，保障好、维护好退役军人的合法权益；坚持守正创新，深化重点领域和关键环节改革；坚持军地协同，加强政策制度衔接和工作举措协同；坚持分类施策，增强服务保障的精准性、便捷性、可持续性。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"xq4890112","time":1789396148000,"title":"标普500指数下跌0.8%，触及盘中低点。","text":"标普500指数下跌0.8%，触及盘中低点。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409241179","importance":"hot"},{"id":"1634966770132","time":1789395979000,"title":"一车人都买错票！一大批高铁站，要改名了？","text":"一车人都买错票！一大批高铁站，要改名了？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QP0BCQ0519FM90.html","importance":""},{"id":"sinacomos:nirvkkq7162470","time":1789395958000,"title":"每年亏十几个亿！蓝箭航天烧钱不断，钱到底从哪来？这场资本豪赌，赌的是
