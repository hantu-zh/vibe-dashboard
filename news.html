2492367","time":1790239375000,"title":"【每日收评】三大指数低开低走均跌超1%，两市成交额萎缩至1.65万亿，福建本地股逆势爆发","text":"①今日三大指数集体低开低走，最终深成指与创业板指均跌超2%，全市场超4300收绿，成交额萎缩至1.65万亿；\n②盘面上，热点延续快速轮动，福建本地股午后爆发，10余只成分股涨停，风电、VNA仪器概念逆势活跃，而贵金属、CXO、算力硬件等方向集体调整。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2492367","importance":"important"},{"id":"cls2492247","time":1790236843000,"title":"【VIP日报】VNA仪器概念反复活跃 栏目解读行业前景 核心公司涨停","text":"①AI算力建设推动高速互连加速升级，VNA有望迎来发展机遇，核心公司收获涨停；\n②机器人概念逆势活跃，焦点公司全面布局相关领域，解读后区间涨幅达12.28%。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2492247","importance":"important"},{"id":"cls2492083","time":1790229436000,"title":"AI医疗落地提速：阿里连发两篇顶刊论文 先后推出食管癌筛查及通用影像模型","text":"①阿里达摩院已发布胰腺癌、胃癌、肠癌、食管癌和主动脉夹层等AI模型。\n②上周，其联合浙江大学医学院附属第一医院等机构研发出通用医疗影像AI模型DAMO RADAR，并正式开源。\n③据弗若斯特沙利文预测，从2023年至2033年，中国AI医疗市场规模将从88亿元飙升至3157亿元。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2492083","importance":""},{"id":"cls2492069","time":1790228501000,"title":"黄金牛市远未结束？道明证券：下一轮涨势将突破“5000大关”！","text":"①道明证券认为黄金下行空间有限，有望在2027年再次冲击每盎司5000美元以上的价格；\n②McKay指出，市场已经消化了美联储三次加息的预期。他表示，这给黄金带来了一种不对称风险，因为如果央行未能满足这些预期，可能会加速贵金属价格的上涨。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2492069","importance":"important"},{"id":"cls2492040","time":1790223368000,"title":"【午报】创业板指震荡走低跌近2%，全市场超4300股飘绿，风电、机器人概念股逆势活跃","text":"①今日三大指数低开低走，创业板指跌近2%，全市场超4300只个股下跌，风电、机器人概念股逆势活跃；\n②个股层面，早盘涨停数量为38家，连板股数量为12家，新华文轩晋级5连板。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2492040","importance":"important"},{"id":"cls2491849","time":1790212749000,"title":"市场缩量震荡等待方向选择，科技细分赛道持续受资金青睐","text":"跟踪主线板块的整段生命周期","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2491849","importance":""}];window.EM_STOCK_NAMES={"000572":"海马汽车","000636":"风华高科","000881":"中广核技","000892":"欢瑞世纪","200019":"深粮B","200869":"张  裕Ｂ","300252":"金信诺","301716":"鸿富诚","600487":"亨通光电","688008":"澜起科技","688079":"美迪凯"};window.EM_
