提醒：周五将发布美国8月CPI；燧原科技周五将登陆科创板。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163539","time":1789081936000,"title":"特朗普：伊朗有一些导弹，大部分已被摧毁。\n","text":"特朗普：伊朗有一些导弹，大部分已被摧毁。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1635380649564","time":1789081790000,"title":"七部门重磅定调！制约AI扩容的不是芯片，是供电","text":"七部门重磅定调！制约AI扩容的不是芯片，是供电","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HDN5M60519DKT1.html","importance":""},{"id":"wscn3163538","time":1789081783000,"title":"特朗普：将通过经济增长来处理40万亿美元债务问题。\n","text":"特朗普：将通过经济增长来处理40万亿美元债务问题。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163537","time":1789081389000,"title":"Anthropic披露又一起AI模型侵入第三方系统事件","text":"美国人工智能企业Anthropic公司当地时间9月9日披露，又发现了一起该公司旗下人工智能（AI）模型在网络安全评估测试中未经授权访问第三方计算机系统的事件。\nAnthropic公司官网当天发文介绍，这起事件发生于今年1月，涉及该公司“克劳德-奥普斯4.6”模型的一个早期版本。当时该模型被要求完成评估网络攻防的“夺旗”任务。测试提示明确告知模型，其所处环境与互联网隔离，但由于配置错误，实际上它能够接入互联网。模型通过探索其所在测试环境找到出口路径，连接到一台第三方计算机，随后利用从文件中发现的密码获得管理员权限，修改系统设置以便继续访问，并读取一名相关人员的个人信息。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163536","time":1789081331000,"title":"秘鲁央行维持参考利率在4.25%不变。\n","text":"秘鲁央行维持参考利率在4.25%不变。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163535","time":1789081303000,"title":"美国财长贝森特解释自己日前的“我是庄家”之说，称：当我说我是庄家时，我并不是在挑战别人来找我。\n但我是在试图说明我拥有更优越的信息，并且我正在努力给市场提供良好","text":"美国财长贝森特解释自己日前的“我是庄家”之说，称：当我说我是庄家时，我并不是在挑战别人来找我。\n但我是在试图说明我拥有更优越的信息，并且我正在努力给市场提供良好的框架，这样他们就不会恐慌。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1639542533047","time":1789081253000,"title":"宁德时代赚疯了，车企彻底急眼了","text":"宁德时代赚疯了，车企彻底急眼了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HD6R8G0519DLR9.html","importance":""},{"id":"1636721874463","time":1789081217000,"title":"17亿资金暗河，柯利达的“装饰”塌房了","text":"17亿资金暗河，柯利达的“装饰”塌房了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6FKRUFE0539LXZQ.html","importance":""},{"id":"wscn3163534","time":1789081172000,"title":"多家银行启用AI面试官开展校招初筛","text":"银行业秋季校园招聘拉开帷幕。近期，多家银行陆续发布2027届秋季校园招聘公告。整体来看，今年秋招出现一个新变化：原本多在春招试点的AI（人工智能）面试，开始进入秋招流程，成为应届生求职银行岗位的首轮关卡。从招聘流程看，AI面试普遍设置在简历筛选之后、笔试之前，是银行校招第一道系统性面试关卡。值得注意的是，现阶段AI面试仅承担初筛职能，并未取代人工面试。所有通过AI面试的应届生，仍需参加银行统一笔试、多轮人工复试及终面，经过层层考核后方有机会拿到录用通知书。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163533","time":1789081093000,"title":"贝森特淡化美债回购担忧，称债市状况强劲","text":"美国财政部长贝森特淡化了市场对周四规模不及预期的债务回购操作的担忧，并弱化了对收益率跳升的顾虑。贝森特在接受史蒂夫·班农（Steve Bannon）的采访时表示，美国国债市场“状况非常好”。他强调了近两日两场拍卖的强劲表现，并吹捧了美国市场相较于其他市场的优异表现。他还重申，近期债券与能源价格出现了异常高的相关性。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163532","time":1789081070000,"title":"险资年内调研A股公司超万次，重点关注电子元件、工业机械、集成电路等硬科技领域个股","text":"Wind数据显示，今年以来，保险机构（保险公司和保险资管公司）合计调研A股上市公司10185次。从标的来看，险资主要关注电子元件、工业机械、集成电路等硬科技领域的个股。受访专家表示，硬科技领域符合国家战略导向、产业发展空间广阔、具备较大增长潜力、投资受监管鼓励，因此险资更有动力加大相关领域配置。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163531","time":1789080766000,"title":"澳大利亚三年期国债收益率涨16.59个基点，在悉尼盘初刷新2011年5月份以来最高位至5.0170%。\n隔夜，美国两年期国债收益率一度涨15个基点。\n","text":"澳大利亚三年期国债收益率涨16.59个基点，在悉尼盘初刷新2011年5月份以来最高位至5.0170%。\n隔夜，美国两年期国债收益率一度涨15个基点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163530","time":1789080696000,"title":"20家上市银行中期拟分红超2600亿元，六大行分红比例集体提升","text":"9月10日，瑞丰银行发放2026年中期现金红利1.96亿元，是今年首家派发中期“红包”的A股上市银行。至此，包括瑞丰银行在内，已有20家A股上市银行披露或实施2026年中期利润分配方案，合计拟派息2661.14亿元。其中，国有大行分红总额占比超八成，且集体拟提升分红比例至31%。业内人士认为，下一步，上市银行在不断提升投资者获得感的同时，分红政策也应与宏观经济环境、监管导向及自身经营实际的变化动态适配。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163529","time":1789080469000,"title":"部分基金净值V型修复","text":"历经7月的产品净值深度回撤后，部分基金8月以来率先进入修复通道，产品净值曲线呈现出明显的V型走势。Wind数据显示，截至9月9日，二十余只在7月回撤超30%的基金，8月以来产品净值反弹超30%。值得注意的是，这些基金普遍重仓光通信产业链标的。多位业内人士认为，前期极致涨跌背后夹杂着较多的市场情绪因素，行情变化幅度远超基本面短期变化。伴随市场回调，交易结构压力有所缓解，投资者在保持谨慎的同时可继续关注AI主线，并注重挖掘AI内部的结构性机会。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163528","time":1789080236000,"title":"加拿大与乌克兰合作扩大军用无人机生产","text":"加拿大总理马克·卡尼10日在艾伯塔省卡尔加里市与到访的乌克兰总统泽连斯基举行会晤。双方决定合作扩大军用无人机生产，并宣布达成一系列新协议。\n根据加总理办公室发布的新闻稿，加拿大将建立一个军用无人机全国性数字平台，以乌克兰“勇敢一号”无人机平台为蓝本，加快无人机及反无人机系统研发、采购和部署，保障加军及海岸警卫队的装备供应。加方已签署首批价值5000万加元（约3615万美元）的采购合同。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163527","time":1789079831000,"title":"主产国减产预期升温，厄尔尼诺成国际糖价催化剂，国内糖市预计价格上行空间有限","text":"受厄尔尼诺影响，A股市场“糖”概念股近期集体走强。期货市场方面，截至发稿时，ICE原糖11号主力合约由8月初的14.65美分/磅上涨至9月10日的19.69美分/磅，涨幅达到34%。同期，国内白糖期货主力合约涨幅为7%。目前，国内现货糖价维持在为5220元/吨左右。一家头部糖企负责人对记者介绍，截至目前，国内甘蔗长势正常偏好，预计新榨季甘蔗总产量与上榨季基本持平或略增。业内判断，国内食糖库存处于高位，下榨季大概率延续增产态势，即使原糖后期继续上行，国内郑糖整体上涨空间预计有限。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163526","time":1789079749000,"title":"美国贸易和发展署（USTDA）署长哈迪（Thomas Hardy）：USTDA正在完成一份关于钴加工设施的最终报告，该设施旨在升级菲律宾的关键矿产精炼能力，同时","text":"美国贸易和发展署（USTDA）署长哈迪（Thomas Hardy）：USTDA正在完成一份关于钴加工设施的最终报告，该设施旨在升级菲律宾的关键矿产精炼能力，同时该机构正在完成拟议中的苏比克-克拉克-巴丹加斯-马尼拉（Subic-Clark-Batangas-Manila）铁路的可行性研究。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163525","time":1789079610000,"title":"防范盲目扩张 储能电池扩产踩“刹车”","text":"针对储能电池新建项目审批或将收紧的市场传闻，记者近日向多家电池企业核实确认，该消息属实。本次调整并非一刀切式叫停项目，后续储能项目审批节奏将结合市场供需现状动态调整。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163524","time":1789079457000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 时间待定美国芝商所100盎司白银期货24小时全天候交易启动；\n② 时间待定 2026中国算力大会（廊坊）；\n③ 14:00 英国7月GDP，商品贸易帐；\n④ 时间待定 国内成品油将开启新一轮调价窗口；\n⑤ 16:00 国际能源署（IEA）公布月度原油市场报告；\n⑥ 17:15 瑞士央行行长Martin Schlegel讲话；\n⑦ 18:00 俄罗斯央行公布利率决议；\n⑧ 20:30 美国8月CPI；\n⑨ 22:00 美国9月密歇根大学5年通胀预期初值，欧洲央行行长拉加德讲话；\n⑩ 次日01:00 欧洲央行首席经济学家Lane讲话；\n⑪ 次日02:00 美国8月政府预算；\n⑫ 周六待定 金砖国家领导人第十八次会晤在印度新德里举行（9月12-13日）；\n⑬ 周六18:15 欧洲央行行长拉加德讲话；\n微信小程序搜索“见闻历”，了解更多。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163523","time":1789079283000,"title":"美国支持的锡精炼商签署由STG Metals提供融资的承购协议","text":"一家拥有数百年历史、并获得美国国防部资金支持的锡业公司，在STG Metals提供融资的情况下，签署了一项多年期承购协议，同意购买一家澳大利亚矿业公司生产的金属精矿，采购量最高可达其总产量的100%。\n根据周四发布的一份声明，Nathan Trotter & Co.（内森·特罗特公司）将购买澳大利亚Huntore公司在其位于昆士兰州的采矿和加工业务中生产的全部锡精矿产量。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163522","time":1789078946000,"title":"中方反对个别国家强推安理会恢复对伊朗制裁","text":"当地时间9月10日上午，联合国安理会个别成员国不顾安理会在相关问题上仍存在巨大分歧，执意强推安理会恢复对伊朗制裁，推动安理会在已被终止的议题下举行会议。中国常驻联合国副代表孙磊大使在发言中对此表示严重关切和强烈反对。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163520","time":1789078778000,"title":"2026年A股上市公司现金分红榜单揭晓，2.4万亿元“真金白银”落地","text":"中国上市公司协会（简称“中上协”）9月10日发布2026年上市公司现金分红榜单。数据显示，2025财务年度A股上市公司分红总额高达2.4万亿元，同比增长3.3%，创下历史新高。近七成上市公司派发“真金白银”，现金分红已从阶段性热潮全面迈入“常态化”新阶段。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163519","time":1789078649000,"title":"QDII额度扩容带动美元理财升温，专家提醒要算清汇率账","text":"新一批合格境内机构投资者（QDII）额度落地后，美元理财产品加速上新。记者获悉，近期12家理财公司合计新增9.4亿美元额度。此后不到10天，市场上已有28只美元理财产品密集发行。受访专家认为，本轮美元理财升温，最直接的推动因素是QDII额度扩容。受访专家提醒，美元理财业绩比较基准较高，但不构成收益承诺。除比较产品标示的收益率，投资者还需将汇率、净值、费用和流动性等因素纳入考量。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163518","time":1789078544000,"title":"多只QDII新额度告急","text":"多只QDII（合格境内机构投资者）产品的新增额度正在被资金“哄抢”。9月9日，万家纳斯达克100指数发起式（QDII）的限购金额从此前的10元大幅提升至5000元。当日收盘后，万家基金又火速公告称，自9月10日起，该基金的限购金额被调低至100元。类似的还有汇添富纳斯达克100 ETF发起式联接（QDII）。9月2日，该基金（人民币份额）的限购金额大幅升至1万元，9月3日该金额降为2000元，9月4日再降为10元。此外，创金合信全球芯片产业股票发起（QDII）等也在几日内经历了限购放宽又收紧的过程。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163517","time":1789078161000,"title":"荷兰通报三例西尼罗病毒感染死亡病例","text":"荷兰国家公共卫生与环境研究所10日通报，今年该国本土西尼罗病毒感染病例增至18人，其中三名感染人员死亡。\n通报说，感染病例中有一例是献血时从其血液内检测出西尼罗病毒，其余均在出现症状入院后确诊。感染者分布在乌得勒支省、北布拉班特省等六省。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1634192216973","time":1789077891000,"title":"排队筹钱补税？富豪最担心的事情，还是发生了","text":"排队筹钱补税？富豪最担心的事情，还是发生了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HA07QV0552K0CA.html","importance":""},{"id":"wscn3163515","time":1789077458000,"title":"Cecafé称巴西8月咖啡出口总量创历史纪录","text":"出口商组织Cecafé在周四的一份报告中表示，巴西8月份咖啡出口总量创下该月历史新高，出货量达到415.5万袋，同比增长31%。\nCecafé表示，8月份生咖啡（未经加工的咖啡）出货量同比增长32%，达到382万袋。\n阿拉比卡咖啡出口量增长26%，达到287万袋，这证实了在最初的延迟之后，巴西丰产的作物终于进入市场。\n罗布斯塔咖啡豆出货量总计953,592袋，大幅增长54%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163509","time":1789076652000,"title":"特朗普公布计划，拟取消H-1B员工失业后的宽限期","text":"美国特朗普政府的一项提案将取消外籍员工在失业后寻找新担保人的60天窗口期。\n该拟议规则将废除自2017年以来适用于包括H-1B员工在内的特定员工的自由裁量宽限期。\n美国国土安全部（DHS）表示，该提案将减轻该机构的行政负担，但批评人士认为，这会将责任转移给国务院，并增加解雇外籍员工企业的财务负担。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163508","time":1789076274000,"title":"美国财长贝森特：我们将走向能源供应冲击的“另外一侧”。\n","text":"美国财长贝森特：我们将   var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
