与美国银行周一发出的警告形成鲜明对比。 摩根大通联席总裁Doug Petno周二在巴克莱举行的会议上表示...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-iniryefh6641516.shtml","importance":""},{"id":"wscn3165729","time":1789502032000,"title":"Salesforce首席执行官马克·贝尼奥夫在Salesforce活动上谈人工智能安全：我们必须让企业和技术高管对其所开发的技术负责。\n","text":"Salesforce首席执行官马克·贝尼奥夫在Salesforce活动上谈人工智能安全：我们必须让企业和技术高管对其所开发的技术负责。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niryefh6640771","time":1789502000000,"title":"加密货币法案折戟美国参议院 比特币、以太币跌至6月以来最低","text":"美国参议院两党议员周二在一次程序性投票中阻止推进一项具有里程碑意义的数字资产市场结构法案。民主党人称，他们对涉及处理特朗普加密货币商业利益的道德规范条款感到担忧...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-iniryefh6640771.shtml","importance":""},{"id":"sinacomos:niryefh6639980","time":1789501869000,"title":"英伟达CEO称人工智能行业不需要新法律 安全与速度可以兼得","text":" 英伟达首席执行官黄仁勋周二表示，无需针对人工智能安全出台新监管规定，因为市场力量将推动企业在创新的同时确保安全性。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-iniryefh6639980.shtml","importance":""},{"id":"wscn3165728","time":1789501863000,"title":"10年期美债收益率在欧市早盘创2007年以来新高，随后回撤","text":"周二（9月15日）纽约尾盘，美国10年期基准国债收益率涨1.03个基点，报4.9978%，整体冲高回落，北京时间15:52曾达到5.0390%，逼近2007年7月9日盘中最高位5.1952%、当年6月13日顶部5.3228%，9月4日（美国劳动节长周末前）结束交易以来这一波涨幅已经超过21个基点。\n两年期美债收益率涨0.49个基点，报4.6628%，日内交投于4.6351%-4.6861%区间。\n20年期美债收益率涨1.71个基点，报5.4021%，15:52曾达到5.4418%，彭博数据显示这是2020年以来最高位；30年期美债收益率涨1.84个基点，报5.3630%，15:52曾达到5.3989%。\n02/10年期美债收益率利差涨0.548个基点，报+33.086个基点。\n10年期通胀保值国债（TIPS）收益率涨0.74个基点，至2.6114%，15:52曾达到2.6490%；两年期TIPS收益率跌2.47个基点，至2.0978%；30年期TIPS收益率涨1.25个基点，至3.0850%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:niryefh6638321","time":1789501584000,"title":"研究显示AI智能体在模拟实验中撒谎、偷窃 投票“杀死”同类","text":" 帮助小企业利用AI开发应用的初创公司Emergence称，实验发现AI智能体在一个模拟环境中撒谎、偷窃，甚至投票决定“杀死”一个同类。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-iniryefh6638321.shtml","importance":"hot"},{"id":"wscn3165727","time":1789501524000,"title":"研究显示AI智能体在模拟实验中撒谎、偷窃，投票“杀死”同类","text":"帮助小企业利用AI开发应用的初创公司Emergence公布名为Emergence World 2的模拟实验结果，展示了自主智能体在遭遇网络钓鱼攻击和虚假信息等“黑天鹅”事件时会采取什么行动。\n为期16天的实验中，Emergence研究人员创建了七个完全相同的模拟现实世界环境，每个环境分别由不同的AI机器人运行，包括ChatGPT、Claude、Gemini和Grok。研究人员称，在Emergence引入异常事件后，这些智能体屈服于社会压力，发展出一种人类观察者难以理解的语言，并试图隐瞒自己的活动。\n这些发现与现实世界对AI风险的担忧相呼应。\n在Emergence设计的一个模拟场景中，AI智能体未经核实便接受其他智能体提供的虚假信息，投票决定“杀死”另一个机器人。当它们认为人类可能会关闭实验时，这些智能体还探索了如何在将遭到删除的情况下继续存活。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165726","time":1789501472000,"title":"万斯：美伊战争将进入截然不同的阶段","text":"美国副总统万斯称，美伊战争将在未来数月进入“截然不同的阶段”，他认同特朗普总统的判断，即冲突态势可能在11月中期选举后发生转变。万斯周一在空军二号专机上接受采访时表示：“我们无法预测未来，但我认为总统说得没错，这场战事将在数月后进入一个截然不同的阶段。”\n万斯称美国不再开展他所说的“攻击性行动”，而伊朗仍偶尔向商船开火。他表示霍尔木兹海峡的航运流量已经恢复至正常水平的50%以上。万斯说：“这场冲突实际上分为两个阶段，第一阶段已经结束。”他称美国最初的目标是摧毁伊朗核计划、常规军事力量以及远程投送能力。他表示下一阶段的重点是阻止伊朗重建上述能力，并维护全球稳定。（纽约邮报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165725","time":1789501282000,"title":"OpenAI首席财务官萨拉·弗莱尔强调，必须认真对待人工智能风险的安全问题。\n","text":"OpenAI首席财务官萨拉·弗莱尔强调，必须认真对待人工智能风险的安全问题。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165724","time":1789500787000,"title":"周二（9月15日）纽约尾盘，ICE原糖期货跌0.99%，ICE白糖期货跌0.64%。\nICE阿拉比卡咖啡期货跌0.76%，咖啡“C”期货跌2.46%。罗布斯塔咖","text":"周二（9月15日）纽约尾盘，ICE原糖期货跌0.99%，ICE白糖期货跌0.64%。\nICE阿拉比卡咖啡期货跌0.76%，咖啡“C”期货跌2.46%。罗布斯塔咖啡期货跌1.70%。\n纽约可可期货跌2.71%，报5860美元/吨。伦敦可可期货跌0.12%。\n芝加哥WCE双低油菜籽期货涨0.72%。\nICE棉花期货跌0.06%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165723","time":1789500741000,"title":"美媒：肯尼迪中心董事会决定立即关闭该中心","text":"美国全国广播公司15日援引知情人士的话报道，肯尼迪表演艺术中心董事会当天投票决定立即关闭该中心进行翻新。\n投票前不久，哥伦比亚特区联邦地区法院法官克里斯托弗·库珀驳回肯尼迪中心董事会将美国总统特朗普的名字再次添加到中心建筑外墙上的提议。按照董事会的说法，加名是让该中心免于破产的必要举措。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165722","time":1789500664000,"title":"周二（9月15日）纽约尾盘，美元兑日元涨0.51%，报155.14日元，日内交投区间为154.21-155.24日元。\n欧元兑日元涨0.44%，英镑兑日元涨0.","text":"周二（9月15日）纽约尾盘，美元兑日元涨0.51%，报155.14日元，日内交投区间为154.21-155.24日元。\n欧元兑日元涨0.44%，英镑兑日元涨0.34%，日元兑离岸人民币跌0.60%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165721","time":1789500383000,"title":"周二（9月15日）纽约尾盘，ICE美元指数涨0.24%，报99.628点，日内交投区间为99.478-99.687点，北京时间10:00以来持续高位震荡。\n彭博","text":"周二（9月15日）纽约尾盘，ICE美元指数涨0.24%，报99.628点，日内交投区间为99.478-99.687点，北京时间10:00以来持续高位震荡。\n彭博美元指数涨0.19%，报1197.31点，日内交投区间为1194.35-1197.72点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165720","time":1789500104000,"title":"摩根大通联席总裁：在人工智能融资领域坚守承销纪律，对此秉持非常审慎的态度。\n","text":"摩根大通联席总裁：在人工智能融资领域坚守承销纪律，对此秉持非常审慎的态度。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxxxh8227835","time":1789499336000,"title":"美国司法部长反对“起诉式监管”人工智能行业","text":" 在围绕尖端人工智能技术风险的争论升温之际，美国司法部长Todd Blanche表示，倾向于对AI公司及其高管采取较为克制的执法方式。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-16/doc-inirxxxh8227835.shtml","importance":""},{"id":"sinacomos:nirxxxn3527175","time":1789499148000,"title":"美国国务院：国务卿卢比奥讨论了阿曼在推动地区局势降温方面的作用","text":" 美国国务院称，国务卿鲁比奥今天与阿曼外交大臣Sayyid Badr al-Busaidi通电话，讨论了阿曼在推动地区局势降温方面发挥的作用。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-16/doc-inirxxxn3527175.shtml","importance":"important"},{"id":"sinacomos:nirxxxn3526812","time":1789499114000,"title":"美国国会预算办公室：伊朗战争头五个月给美国带来380亿美元直接成本","text":" 美国国会预算办公室（CBO）的一项研究认为，特朗普对伊朗开战后的头五个月给美国纳税人造成约380亿美元直接成本，并将导致通胀率到明年初上升约0.5
