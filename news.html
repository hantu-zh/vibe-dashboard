om.cn/chanjing/gsnews/2026-09-14/doc-inirveaq9297283.shtml","importance":"important"},{"id":"1639046955172","time":1789391157000,"title":"鸡王、奶吧、轻食：一鸣的第三次转身成败？","text":"鸡王、奶吧、轻食：一鸣的第三次转身成败？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QKHVJQ0519875F.html","importance":""},{"id":"sinacomos:nirveaq9296917","time":1789391156000,"title":"中东冲突加剧，伊朗称在霍尔木兹海峡上空摧毁美军先进无人机","text":"核心要点伊朗军方表示，已在霍尔木兹海峡上空摧毁一架美军先进无人机。特朗普称美国可以夺取伊朗石油，将该设想类比为今年早些时候美国与委内瑞拉达成的协议。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirveaq9296917.shtml","importance":""},{"id":"wscn3164873","time":1789391123000,"title":"微软发布AI行为准则：强调“人比AI重要”，拒绝追逐无边界超级智能","text":"微软人工智能团队发布《人本主义人工智能行为准则》草案，提出以“人比AI重要”为核心理念，作为未来微软AI模型设计、训练和部署的指导文件。微软表示，AI必须始终处于人类有意义的控制和监督之下，并将安全与人类控制置于其他目标之上。该文件目前尚未用于训练模型，微软计划经过为期6周的公众咨询后，于今年年底发布修订版，并从2027年起用于指导模型开发。\n微软表示，AI模型不应拥有权利或法律人格。它们不应被设计成能逃脱人类控制或欺骗用户。如果完成某项任务需要违反AI的指导原则，那么该系统就不应完成该任务。该文件称，微软的“人道主义AI”“拒绝竞相打造可能规避这些保障措施的全能超级智能”。“我们正在打造根本上实用且安全的东西，即使这意味着要在终极通用性、自主性或能力上作出妥协。”（CNBC）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164872","time":1789391076000,"title":"报道：英伟达、Palantir等将限制使用OpenAI和Anthropic最先进AI模型","text":"英伟达、Palantir和Booz Allen Hamilton正要求OpenAI、Anthropic提供新的安全保障，并减少或停止使用两家公司最先进的AI模型。Palantir已说服Anthropic承诺对所有模型提供“不可撤销”的零数据保留（ZDR）保障。部分企业正转向使用自研AI模型处理更敏感的业务任务。（The Information）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nirveau4014710","time":1789391033000,"title":"海湾国家与伊朗推迟霍尔木兹海峡会谈 临时航运方案再遇阻","text":"阿曼外交部宣布，原定周一在塞拉莱举行的伊朗与海湾国家地区会议推迟，新的举行时间尚未确定。此次会议原计划讨论霍尔木兹海峡临时航运路线...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirveau4014710.shtml","importance":""},{"id":"sinacomos:nirveau4005623","time":1789390934000,"title":"昔日彩电大王康佳将退市，已连续三年巨亏","text":"两年康佳在
