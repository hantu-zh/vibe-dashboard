835791357","time":1786150243000,"title":"福特据悉计划推出四门版燃油Mustang 预计2030年前上市","text":"【福特据悉计划推出四门版燃油Mustang 预计2030年前上市】8月7日，据报道，福特计划推出四门版燃油Mustang车型，希望通过增加车内空间，吸引更多家庭用户及希望购买更实用车型的Mustang爱好者。据悉，新车型外观将延续现款双门燃油版Mustang设计，并搭载混合动力V8发动机。该车型已于本周的一场经销商活动中亮相，预计将在2030年前面向消费者销售。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835791357.html","importance":"important"},{"id":"wscn3146947","time":1786150118000,"title":"黎巴嫩：黎以谈判在边界问题等方面取得进展","text":"黎巴嫩总统府8月7日发表声明说，黎巴嫩和以色列日前在意大利首都罗马举行的谈判在边界问题和被扣押人员获释方面取得进展。声明援引黎总统奥恩在内阁会议上的讲话称，本轮谈判围绕停火、边界问题、被扣押人员获释以及“试点区域”撤军相关问题等议题展开。双方在边界问题和被扣押人员获释方面的讨论取得“积极进展”，相关措施有望近期出台。相关方将着手解决停火、“试点区域”问题等剩余议题。 (央视新闻)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"em202608083835789778","time":1786149762000,"title":"京东健康：上半年首发65款新药 已布局近10万个乡镇及村级服务站点","text":"【京东健康：上半年首发65款新药 已布局近10万个乡镇及村级服务站点】8月8日，记者从京东健康获悉，2026年上半年，京东健康累计首发65款新药，覆盖肿瘤、皮肤、慢病等领域。截至目前，京东健康用户中三线及以下城市占比超65%，在全国布局近10万个乡镇及村级服务站点，县域当日达或次日达覆盖率达87.1%。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835789778.html","importance":"hot"},{"id":"sinacomos:nimqccz6652387","time":1786149551000,"title":"从“福利枪”利益链到深层枪支崇拜，泰国为何反复上演枪击悲剧？","text":" 当地时间8月7日上午，泰国暖武里府一所中学发生枪击事件，成为该国今年发生的第二起校园枪击案，折射出该国的枪支管制问题以及深层次的拥枪文化。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimqccz6652387.shtml","importance":""},{"id":"sinacomos:nimqccz6656353","time":1786149515000,"title":"李开复：AI时代，人的优势在“右脑”，做出数据不能预测的事情","text":"当AI逐渐变得远比人类聪明，人类还能做什么？8月7日，在北京大学国家发展研究院举行的李开复《AI未来已来》新书交流会上，零一万物首席执行官李开复就上述问题回答澎湃新闻...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimqccz6656353.shtml","importance":""},{"id":"wscn3146946","time":1786149106000,"title":"浙江海事局启动沿海Ⅰ级防台应急响应","text":"今年第13号台风“白海豚”（强台风级）于8月8日06时在北纬26.9°、东经126.4°，即距温州偏东方向580公里的海面上，中心最大风力14级，中心气压为950百帕，移动方向西偏北，移动速度每小时10—15公里。根据台风态势及走向，浙江海事局决定于8月8日上午8时启动浙江沿海Ⅰ级防台应急响应，提醒相关单位要按照防台预案做好防御台风相关工作，提醒沿海船舶抓紧时间再次对船上关键设施设备开展检查，做好最后的防台准备。 (央视新闻)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"sinacomos:nimpwvz4469219","time":1786149074000,"title":"今日视点：理性看待“地王”再现","text":"■王丽新 7月份以来，多个城市核心地块的土拍市场热度不减。 7月28日，上海杨浦八埭头地块经历219轮竞价后，最终以总价161.2亿元、综合楼面价10.2万元/平方米成交...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-08-08/doc-inimpwvz4469219.shtml","importance":""},{"id":"em202608083835788643","time":1786148970000,"title":"Alphabet启动250亿美元债券发行 期限最长达40年","text":"【Alphabet启动250亿美元债券发行 期限最长达40年】当地时间8月7日，谷歌母公司Alphabet宣布拟发行总额250亿美元的高级无抵押债券，包括浮动利率债券和固定利率债券，期限覆盖2028年至2066年。其中，固定利率债券期限最长为2066年到期，票面利率最高为6.5%。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835788643.html","importance":"important"},{"id":"em202608083835785580","time":1786148880000,"title":"50亿杭州奶粉龙头7000万买下亏损工厂","text":"【50亿杭州奶粉龙头7000万买下亏损工厂】总部位于杭州的贝因美，落地一笔收购。8月6日，贝因美公告，以约7000万元自有资金，收购明一乳业（齐齐哈尔）100%股权事项，正式完成交割。明一乳业将更名，成为“齐齐哈尔贝因美乳业”，同时进行并表。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835785580.html","importance":""},{"id":"wscn3146945","time":1786148831000,"title":"贷款利率定价基准“换锚” 利率市场化再进一步","text":"近期，多家商业银行落地以DR（存款类金融机构间债券回购利率）为定价基准的企业贷款，标志着我国贷款利率定价基准多元化的探索提速。专家表示，持续丰富贷款定价参考基准，构建多元化基准利率体系，既是稳步推进利率市场化改革的重要举措，也有助于提升货币政策传导效能，更好地服务实体经济各类经营主体。 (中证报)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3146943","time":1786148703000,"title":"部分中小银行逆势上调存款利率","text":"在年内多数中小银行延续存款利率下调趋势的背景下，近日，广东、湖北等地部分农商行、村镇银行逆势上调存款利率，涉及一年期至五年期等多个期限的存款品种，调整幅度最高达33个基点。目前中小银行存款利率调整呈现两极分化态势。受访专家认为，在净息差压力之下，中小银行调降存款利率依旧是主流，部分中小银行阶段性调升存款利率，以缓解存款到期流失，但并不普遍。 (证券日报)\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"em202608083835788463","time":1786148610000,"title":"消息称SpaceX收购Cursor交易最快下周完成 新产品或启用Grok品牌","text":"【消息称SpaceX收购Cursor交易最快下周完成 新产品或启用Grok品牌】8月7日，据报道，SpaceX收购AI编程工具公司Cursor的交易最快可能于下周末完成。Cursor品牌名称可能在未来几个月内逐步退出，新产品或采用其他品牌名称。据悉，Cursor即将推出的通用型智能代理产品可能被命名为GrokBot。不过，Cursor现有工具不会立即更名。该交易仍需获得监管批准，预计最晚将在本月底前完成。SpaceX此前于6月宣布将以600亿美元收购Cursor。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835788463.html","importance":""},{"id":"em202608083835788554","time":1786148556000,"title":"A股半年报盘点丨171家上市公司已披露 16家公司净利润超10亿元","text":"【A股半年报盘点丨171家上市公司已披露 16家公司净利润超10亿元】8月8日，A股共39家上市公司披露2026年半年报，其中33家盈利，6家亏损。截至8月8日，A股已累计有171家上市公司披露2026年半年报，其中156家盈利，15家亏损，合计营收为8168.09亿元，同比增29.82%，合计净利润为1131.14亿元，同比增63.34%。从净利润变动幅度来看，131家公司净利润同比增加，40家净利润同比下降。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835788554.html","importance":""},{"id":"em202608083835788089","time":1786148436000,"title":"A股股票回购一览：27家公司披露回购进展","text":"【A股股票回购一览：27家公司披露回购进展】数据显示，8月8日，27家公司共发布27个股票回购相关进展。其中，7家公司首次披露股票回购预案，1家公司回购方案获股东大会通过，9家公司披露股票回购实施进展，10家公司回购方案已实施完毕。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835788089.html","importance":"important"},{"id":"em202608083835787918","time":1786148436000,"title":"A股定增一览：24家公司披露定增进展","text":"【A股定增一览：24家公司披露定增进展】数据显示，8月8日，A股共24家公司发布定增相关公告。其中3家公司披露股票定增预案，6家定增预案获股东大会通过，2家定增预案获交易所通过，10家定增预案获证监会通过，2家定增方案停止实施，1家公司定增方案已完成。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835787918.html","importance":"important"},{"id":"em202608083835787735","time":1786148370000,"title":"QumulusAI与智能代理对冲基金达成英伟达Blackwell GPU算力供应协议","text":"【QumulusAI与智能代理对冲基金达成英伟达Blackwell GPU算力供应协议】当地时间8月7日，AI云基础设施服务商QumulusAI宣布与一家智能代理对冲基金达成协议，为其提供搭载英伟达BlackwellGPU的算力资源。根据协议，QumulusAI将按照市场价格收取算力费用，并获得该基金季度交易利润的一定比例，同时不承担交易亏损风险。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835787735.html","importance":""},{"id":"em2026 st","stock":"","url":"https://finance.eastmoney.com/a/202608083835598697.html","importance":"important"},{"id":"1635988311904","time":1786140496000,"title":"一枚“回旋镖”，击中王思聪","text":"一枚“回旋镖”，击中王思聪","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L3POM1MJ0552K0CA.html","importance":""},{"id":"sinacomos:nimpwwc6752180","time":1786140347000,"title":"8月8日外盘头条：伊朗内部辩论霍尔木兹协议措辞 非农爆冷削弱加息预期 SpaceX将自建发电厂保障电力供应","text":"全球财经媒体昨夜今晨共同关注的头条新闻主要有： 1、伊朗内部辩论霍尔木兹协议措辞 特朗普坚称谈判“正在推进” 2、特朗普力推30亿美元关键矿产投资项目 3...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwwc6752180.shtml","importance":"important"},{"id":"sinacomos:nimpwvx2855533","time":1786140017000,"title":"三菱日联：建议做多澳元/日元 美联储加息押注降温提振套息交易","text":" 三菱日联分析师建议做多澳元兑日元，因干预带来的影响正在消退，而交易员削减对美联储加息的押注改善了套息交易的环境。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwvx2855533.shtml","importance":"hot"},{"id":"wscn3146936","time":1786139955000,"title":"受高温干旱影响，法国籽粒玉米产量或创新低","text":"当地时间7日，法国农业部预测称，2026年法国籽粒玉米（包括种子玉米）产量预计为900万吨，同比下降35%，可能降至1980年以来最低水平。报告显示，受干旱和高温天气影响，今年法国籽粒玉米平均单产预计仅为每公顷7.03吨，同比下降19%。法国是欧洲主要的玉米生产和出口国。籽粒玉米指收获时以完全成熟、低水分的干燥籽粒为主要产品的玉米类型，主要用于粮食、饲料及工业加工。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146935","time":1786139876000,"title":"大摩对日元转向偏空，干预影响逐渐消退","text":"摩根士丹利外汇策略师对日元转向偏空，他们认为，随着事实证明美日当局支撑日元汇率的措施效果短暂，日元将逐步走弱。当局联手支撑日元仅短暂提振了日元需求，并未扭转其长期下行趋势。因此，策略师在维持中性立场的同时，转为偏空倾向。“除非再次联合干预汇市，否则我们预计美元/日元将逐步走高，”David Adams、Andrew Watrous和Molly Nickolin周五写道。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3146933","time":1786138833000,"title":"三菱日联：建议做多澳元/日元 ，美联储加息押注降温提振套息交易","text":"三菱日联分析师建议做多澳元兑日元，因干预带来的影响正在消退，而交易员削减对美联储加息的押注改善了套息交易的环境。\\n“我们预计澳元/日元将继续收复因干预造成的跌幅，因为基本面尚未出现足以支撑日元持续升值的实质性变化，”MUFG分析师Derek Halpenny、Lee Hardman和Abdul-Ahad Lockhart在报告中写道。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3146932","time":1786138631000,"title":"哥伦比亚新任总统德拉埃斯普列亚宣誓就职","text":"8月7日，哥伦比亚当选总统阿韦拉多·德拉埃斯普列亚在该国第三大城市卡利宣誓就职，任期四年。阿韦拉多·德拉埃斯普列亚现年47岁，是哥伦比亚律师、企业家和右翼政治人物，长期活跃于公共事务领域。他此前在竞选时主张以强硬手段打击犯罪，推行自由市场经济政策。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3146931","time":1786138293000,"title":"阿布扎比国家石油公司：已有15艘旗下船只遭袭，1死20伤","text":"阿布扎比国家石油公司当地时间7日发表声明称，自美以伊冲突爆发以来，该公司已有15艘船只在通过霍尔木兹海峡时遭到导弹和无人机袭击，其中包括本周遇袭的3艘。这些袭击共造成1名船员死亡，另有20人受伤。阿布扎比国家石油公司表示，正与有关部门密切合作，采取一切必要措施保护员工、资产和运营安全，同时持续保障客户供应。该公司强调，航行自由以及商船在国际水域中的安全与畅通通行，必须得到尊重和保护，不应受到任何威胁、骚扰或袭击。（央视）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nimpwwc6732646","time":1786137849000,"title":"美国制裁伊朗加密货币交易所 谈判仍在继续","text":" 美国对伊朗加大经济施压，对数字资产交易所以及与伊朗影子银行体系有关的网络实施更多制裁，在有关战争的谈判继续进行之际增加筹码。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwwc6732646.shtml","importance":"important"},{"id":"sinacomos:nimpwvz4448529","time":1786137801000,"title":"美日联手干预见效 对冲基金大幅削减日元空仓","text":"美国和日本当局协同出手稳定了日元后，对冲基金大幅减少了做空押注。 商品期货交易委员会周五公布的数据显示，截至8月4日，期货和期权市场的杠杆基金将日元净空头头寸削减...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwvz4448529.shtml","importance":""},{"id":"wscn3146930","time":1786137784000,"title":"大摩：预计美联储资产负债表将缩减1.5万亿美元","text":"摩根士丹利经济学家Seth Carpenter和Michael Gapen在报告中表示，该行的基准预测是，美联储将在大约两年内把资产负债表规模缩减约1.5万亿美元，最早可能从2027年第一季度开始；合理的缩减区间为6,000亿至2.5万亿美元。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3146929","time":1786137744000,"title":"据知情人士透露，数据中心公司Switch秘密递交IPO申请。（彭博）\\n","text":"据知情人士透露，数据中心公司Switch秘密递交IPO申请。（彭博）\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https 涨19.70%，报368.56点，整体持续走高。\\n在全球市场全天交易的纽约证交所ARCA金矿开采商指数累涨20.16%，报2570.44点，整体持续走高。\\n在美股时段交易的原材料指数累涨7.44%，报249.68点。\\n在美股时段交易的金属与矿业指数累涨7.98%，报295.29点。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3146922","time":1786135177000,"title":"加密货币平台Crypto.com与特朗普传媒科技集团将整合合作伙伴关系调整为营销协议。\\n特朗普媒体与科技集团称，将调整协议方向，面向Truth Social用户","text":"加密货币平台Crypto.com与特朗普传媒科技集团将整合合作伙伴关系调整为营销协议。\\n特朗普媒体与科技集团称，将调整协议方向，面向Truth Social用户群体推广Crypto.com的预测市场业务。\\nYorkville American的业务及其现有和未来ETF产品的计划保持不变。\\n特朗普媒体与科技集团已终止与Crypto.com的业务合并协议，于2026年8月7日生效。\\nCrypto.com、特朗普媒体、Yorkville America已共同同意不再推进此前宣布的合作关系。\\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nimpwvz4427219","time":1786135041000,"title":"特朗普提名的Brett Matsumoto获参议院确认 将出任美国劳工统计局局长","text":" 美国参议院确认Brett Matsumoto出任美国劳工统计局局长。特朗普去年突然解雇前任局长后，这一关键职位如今终于得到填补。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwvz4427219.shtml","importance":""},{"id":"sinacomos:nimpwwc6711155","time":1786134960000,"title":"原油：油价持稳 交易员权衡霍尔木兹海峡谈判和伊朗紧张局势","text":"原油持稳，中东紧张局势升温之际，交易员密切关注伊朗与阿曼就恢复霍尔木兹海峡通航达成协议的进展。 布伦特原油结算价在每桶83美元上方，但本周仍连续第三周下跌。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-08-08/doc-inimpwwc6711155.shtml","importance":""},{"id":"em202608083835596048","time":1786134299000,"title":"据知情人士透露 日本软银集团持股的3D打印机制造商Formlabs考虑IPO","text":"据知情人士透露，日本软银集团持股的3D打印机制造商Formlabs考虑IPO。","source":"东方财富","category":"ann","stock":"","url":"https://finance.eastmoney.com/a/202608083835596048.html","importance":""},{"id":"sinacomos:nimpsqc4552899","time":1786134267000,"title":"8月8日热门中概股多数上涨 小鹏汽车涨3.72%，慧荣科技跌4.23%","text":"8月8日热门中概股多数上涨，纳斯达克中国金龙指数（HXC）收高0.77%。 上涨个股（按市值从高到低）：台积电涨0.44%，阿里巴巴涨1.27%，拼多多涨1.00%，网易涨1.43%...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-08-08/doc-in <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '东方', sub: '东方财富'},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = item.text || item.title || '(无内容)';
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var em = _rawData.filter(function(x){ return x.source === '东方财富'; }).length;
  var hot = _rawData.filter(function(x){ return x.importance === 'hot'; }).length;
  var imp = _rawData.filter(function(x){ return x.importance === 'important'; }).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-em').textContent = em;
  document.getElementById('stat-hot').textContent = hot;
  document.getElementById('stat-imp').textContent = imp;

  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  document.getElementById('last-update').textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
