3165507","time":1789470660000,"title":"BNP Paribas给予牧原食品集团股份有限公司A股跑赢大盘的初始评级。\n","text":"BNP Paribas给予牧原食品集团股份有限公司A股跑赢大盘的初始评级。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165506","time":1789470617000,"title":"央行研究局局长王信：人工智能发展带来的水资源消耗值得高度关注","text":"中国人民银行研究局局长王信指出，近年来，全球算力中心直接耗水规模迅速攀升。具体到我国，目前我国算力中心用水量占全国用水总量的比重还不高，但结构性问题已经逐渐凸显。针对人工智能和算力发展中的水资源问题，可以从算力发展本身以及绿色金融、可持续金融等方面采取相应措施：一是强化水资源计量监测、数据核验和信息披露；二是推广节水技术，完善绿色数据中心资源效率评价机制；三是更好发挥水价的资源配置作用；四是发挥绿色金融作用，支持人工智能与水资源协同发展。（金融时报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165505","time":1789470538000,"title":"克里姆林宫称特朗普提出的俄乌能源休战是个好主意","text":"据国际文传电讯社(IFX)报道，克里姆林宫发言人Dmitry Peskov表示，俄罗斯当局看到了唐纳德·特朗普有关能源休战的帖子，并认为这是一个“好主意”。“我们肯定认为这是一个非常好的主意，总体而言是一项很好的倡议。我们与美国方面保持着联系，并始终支持和平解决方案，”Peskov说。\nPeskov表示，对全球市场而言，问题不在于生产，而在于“确保这些成品油不受阻碍地进入全球市场”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1634365617215","time":1789470485000,"title":"单月再融超40亿断层领跑，三星入股帕西尼：具身感知赛道格局加速收敛","text":"单月再融超40亿断层领跑，三星入股帕西尼：具身感知赛道格局加速收敛","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SVKCKM05318W1H.html","importance":""},{"id":"wscn3165502","time":1789470109000,"title":"凯撒旅业：孙公司遭合同诈骗2695万元 公安机关已立案侦查","text":"凯撒旅业公告称，公司全资孙公司凯撒文产与合同相对方签署演艺服务合同，按约支付2695万元款项后无法与对方取得有效联系，涉嫌合同诈骗，已向公安机关报案并获立案侦查。该事项尚处侦查阶段，或对本期及期后利润造成不利影响，公司已开展内部专项核查并配合调查，全力挽回损失。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165501","time":1789470048000,"title":"张国清出席第五届北斗规模应用国际峰会开幕式并致辞","text":"第五届北斗规模应用国际峰会15日在湖南株洲开幕。中共中央政治局委员、国务院副总理张国清出席开幕式并致辞。\n张国清表示，中国愿同各方一道，积极落实四大全球倡议，始终坚持开放融合、协调合作、兼容互补、成果共享，进一步提高北斗技术创新水平，加强北斗与人工智能、卫星互联网等技术融合，持续推进系统迭代升级，推动北斗产业健康有序发展，加速北斗应用提质扩面，完善卫星导航全球治理，让北斗系统更好服务全球、造福人类。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxaty3751941","time":1789469842000,"title":"“巨懂车”收紧获客线索标准，戳破汽车直播虚假繁荣","text":"9月，汽车主播的抱怨集中涌上社交平台。 有主播表示，过去获得一个线索（用户留下的电话号码等联系方式）平均投流费用约70元，最近一些场次却涨到500元；还有主播称进入9月...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-15/doc-inirxaty3751941.shtml","importance":""},{"id":"wscn3165494","time":1789469802000,"title":"快手电商：未授权任何机构或个人以“快手电商货源市场”名义举办选品会、招商会","text":"快手电商渠道业务中心发布声明称，近期经部分商家反馈及平台核实，市场上存在部分主体冒用“快手电商货源市场”名义，擅自举办所谓“快手电商货源选品会”，并以此向商家进行收费招募，据部分商家反馈收取2万至4万元不等的费用。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165493","time":1789469573000,"title":"本月底起《金融产品网络营销管理办法》正式实施，部分平台已开始排查","text":"本月底起，《金融产品网络营销管理办法》正式实施。目前部分平台已开始排查整治。近期腾讯开展金融广告全域排查，已下架违规金融广告53条、整改合规后重新上架6条；封禁无金融资质账户3个。抖音明确金融营销需具备合法资质并完成平台认证，严禁超范围经营。（每经网）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxhzq8471270","time":1789469447000,"title":"IPO撤单两年后，存储芯企华澜微“嫁给”园林股份？","text":"来源 | 野马财经 华澜微换道进入A股。 作者 | 于婞编辑 | 高岩 在资本市场兜兜转转十年，国产存储控制器芯片“老兵”华澜微这次敲开的不是交易所大门...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxhzq8471270.shtml","importance":"hot"},{"id":"wscn3165491","time":1789469400000,"title":"携程集团：坚决落实在线酒店预订行业合规要求","text":"携程集团发文表示，2026年9月15日，国家市场监督管理总局会同文化和旅游部召开在线酒店预订平台服务行业行政指导会，为企业准确理解监管要求、完善合规机制提供了重要指引。借此机会，公司作出以下表态：\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165488","time":1789469146000,"title":"华为与赛力斯合作模式调整后资源聚焦其余四大品牌","text":"今日，鸿蒙智行发布官方公告，华为与赛力斯合作模式调整，此次调整是在鸿蒙智行合作框架下探索新合作模式。对此，有知情人士透露，本次调整是源于华为长期坚持不造车，核心定位是赋能各合作伙伴。调整之后，问界的产品定义、产品设计、品牌营销、渠道零售、服务体系将由赛力斯主导，华为终端参与赋能。鸿蒙智行聚焦资源到其他四界，将加速其他四界的品牌成功，对鸿蒙智行五界均是利好。（蓝鲸新闻）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstree ,"stock":"","url":"https://www.163.com/dy/article/L6SUFE2T0519JFL1.html","importance":""},{"id":"wscn3165484","time":1789468427000,"title":"信用卡被盗用于订购苹果手机，香港金管局回应“应尽快通知发卡银行”","text":"近日，香港多家银行客户表示其信用卡被盗用于订购苹果手机。\n就此，香港金管局发言人回应称，信用卡交易一直需采取有效措施以确保安全性，保障客户的利益。个别商户可能基于营运考虑而不使用或暂停额外认证安排（如In App 认证或一次性密码）。在此情况下，商户须承担非授权交易的责任及财务损失。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxaty3756313","time":1789468289000,"title":"联博称：放缓AI发展的呼声不会阻碍行业融资","text":" 联博控股（AllianceBernstein）的固定收益专家表示，即便社会各界呼吁放缓人工智能研发节奏，也无法阻止大型科技企业持续开展融资与资本开支。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxaty3756313.shtml","importance":"important"},{"id":"wscn3165483","time":1789468230000,"title":"瑞银策略师认为AI相关股票有广泛上涨的空间","text":"瑞银策略师表示，随着AI相关支出日益转化为工业、医疗保健、公用事业和金融行业的盈利，AI概念驱动的股市涨势并未消退，而是正在扩散。Bhanu Baweja带领的团队青睐维持AI板块敞口，同时针对被市场低估的宏观风险增强保护。他们预计，标普500指数到2026年底将升至8,100点，也就是较周一收盘上涨约6%，并于2027年升至8,900点；预计欧洲斯托克600指数到2026年底将升至690点，涨幅约为8%，到明年底进一步升至760点。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1639683026583","time":1789468219000,"title":"银行业迎来“K型”分化","text":"银行业迎来“K型”分化","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SU85GQ051980A4.html","importance":""},{"id":"sinacomos:nirxatu6996555","time":1789468206000,"title":"韩国与埃及正推进下月举行首脑会晤 能源供应链或为重点议题","text":" 韩国与埃及正推动在下月举行首脑会晤。能源供应链合作，其中包括因中东局势恶化而重要性日益提升的“原油旁路运输网络”，预计将成为会谈核心议题。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxatu6996555.shtml","importance":""},{"id":"sinacomos:nirxats8590462","time":1789468122000,"title":"华为、赛力斯合作模式调整，问界仍属“五界”之一","text":"9月15日，21快讯记者注意到，有消息称“华为与赛力斯（601127.SH）的智选车合作模式将在本周调整，鸿蒙智行将聚焦资源，加速智界、享界、尊界、尚界品牌成功”...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/chanjing/gsnews/2026-09-15/doc-inirxats8590462.shtml","importance":"hot"},{"id":"wscn3165482","time":1789467978000,"title":"流动性“收长放短”，9月买断式逆回购停止加量","text":"9月，两个期限买断式逆回购均为等量续作，结束此前连续两个月加量续作过程。\n9月15日，中国人民银行以固定数量、利率招标、多重价位中标方式开展5000亿元买断式逆回购操作，期限为6个月（181天），到期日为2027年3月15日（遇节假日顺延）。\n由于9月有5000亿元6个月期买断式逆回购到期，这意味着本月实现等量续作。此前，9月3个月期买断式逆回购也为等量续作。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxaty3753531","time":1789467867000,"title":"牛股10连阳，突然急刹车","text":"记者丨万倩倩 编辑丨陶力，张伟贤 三季度以来，资金的风向变了。 前期拥挤度较高的科技股一路震荡调整，而此前鲜有人问津的“老登”板块，却开始悄悄走强。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxaty3753531.shtml","importance":""},{"id":"wscn3165479","time":1789467718000,"title":"世贸组织报告：加强多边贸易体系可提振全球经济","text":"世界贸易组织发布《2026年世界贸易报告》指出，如果加强多边贸易体系，到2050年全球GDP有望较基准情景提高约2.9%，即增加约3万亿美元，全球出口可增长17.9%。报告同时警告，如果各国不采取行动、任由多边贸易规则被削弱，全球产出最多可能下降约10%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxatu6989225","time":1789467592000,"title":"日本夏普公司正式入局AI服务器业务","text":"据夏普，夏普为应对生成式AI普及带来的AI基础设施增长需求，正式入局AI服务器业务。 面向企业、地方政府、科研机构、数据中心运营商等客户...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxatu6989225.shtml","importance":""},{"id":"sinacomos:nirxaty3751137","time":1789467478000,"title":"博通集团收购尔湾办公园区","text":" 博通斥资 3.25 亿美元，买下这座坐落于 5 号与 405 号高速公路交汇处附近、建筑面积 66 万平方英尺的研发园区。（谷歌地图）","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxaty3751137.shtml","importance":""},{"id":"sinacomos:nirxatw3759594","time":1789467451000,"title":"赛百味小食被曝有大量黑色油渣，门店称烤盘没及时更换","text":" 9月15日下午消息，9月14日，有消费者在社交平台发文称，近日，在赛百味浙江海宁爱琴海店点套餐，却发现小食上面全是烤焦的黑色油渣硬碎屑。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/chanjing/gsnews/2026-09-15/doc-inirxatw3759594.shtml","i :"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxats8584395.shtml","importance":"hot"},{"id":"sinacomos:nirxats8584192","time":1789466928000,"title":"“求‘你们’中秋别团圆了”，400亿中药龙头广告翻车","text":"来源：财通社 中秋节临近，A股上市公司华润三九（000999.SZ）却因一则广告文案陷入争议。 9月14日，有江苏网友在社交平台晒出三九胃泰的一则广告...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxats8584192.shtml","importance":"hot"},{"id":"wscn3165470","time":1789466855000,"title":"美债收益率高企吸引力上升 美国投资咨询公司Marsh上调美债配置至中性","text":"美国投资咨询公司Marsh正在上调其向客户推荐的部分投资组合中的美国国债配置，这表明大型投资者正寻求利用当前处于高位的收益率。据该公司全球首席投资官Niall O’Sullivan表示，这家总部位于纽约的公司本周调整了其动态资产配置，将美国政府债券的配置从低配上调至中性。这一调整将作为公司向客户提供投资建议的依据。他说，Marsh为客户管理的8460亿美元资产中，约有2000亿美元所对应的投资组合将考虑这一变化，并考虑增持美国国债。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"cls2483846","time":1789466852000,"title":"高点回撤超三成！“宁王”股价跌至年内新低，这些“大白马”也创今年低点","text":"①今日，宁德时代股价创2025年9月以来近一年新低，同时录得7月10日以来最大单日跌幅。\n②剔除新股，全市场共有90余股盘中创年内新低，电力设备、汽车、机械设备股数量相对较多。\n③上述90余股平均总市值390.355亿元，中位数总市值76.88亿元，其中，超千亿市值股共有6只。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2483846","importance":""},{"id":"sinacomos:nirxats8583247","time":1789466794000,"title":"美联储议息前夜全球承压！A股“否极泰来”还要等多久？","text":"来源：金融投资报 虽然市场对美联储加息已有充分预期，但在加息落地前，市场依旧承压，全球主要市场悉数飘绿。 从A股来看，9月15日，上证指数小幅低开后呈持续震荡走势...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxats8583247.shtml","importance":"important"},{"id":"wscn3165469","time":1789466756000,"title":"着眼于为银行家“减负” 一家AI公司寻求融资1亿美元","text":"据知情人士透露，向投资银行和其他金融机构销售AI软件的初创公司Model ML，正在磋商按逾10亿美元的估值融资逾1亿美元的事宜。知情人士称，此轮融资尚未结束，细节可能会有所变化。其中一位表示，融资规模可能增至1.5亿美元，具体将视投资者的兴趣而定。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165468","time":1789466688000,"title":"德国投资者预期指数小幅上升 对经济复苏势头趋稳的乐观情绪增强","text":"德国9月投资者乐观情绪小幅上升，增强了围绕经济复苏终于开始趋于稳固的希望。ZEW预期指数从上月的34.2升至34.7，但低于预期中值40。经济现状指标改善程度超出预期。“专家们对经济复苏持谨慎乐观态度，”ZEW总裁Achim Wambach周二在声明中表示。“财政措施继续推动经济增长，出口势头也带来进一步推动。不过，风险依然巨大：伊朗冲突持续导致能源价格居高不下，袭击带来的额外不确定性也给经济造成压力。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165467","time":1789466614000,"title":"债市无序波动敲响警钟 美银称投资者过度乐观情绪降温","text":"美国银行的一项调查显示，随着投资者担忧债券收益率无序飙升以及美国中期选举结果，围绕风险资产的乐观情绪正在降温。调查显示，净49%的基金经理目前超配全球股票，低于上月的56%。受访者表示，他们如今认为，债券收益率无序上升是市场面临的最大尾部风险。美国银行策略师Michael Hartnett在一份报告中写道，现金持有比例升至投资组合的3.9%，但仍处于会对风险资产触发“卖出信号”的低位。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxaty3737581","time":1789466508000,"title":"千叶珠宝，死于黄金","text":"千叶珠宝押注黄金饰品，走的是低价路线。2024年，千叶珠宝的毛利率由上一年的22.55%锐减至15.47%。千叶珠宝在2024年年报中写到，其扩大线上销售...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxaty3737581.shtml","importance":"important"},{"id":"wscn3165466","time":1789466477000,"title":"俄罗斯外长拉夫罗夫称俄罗斯已做好在乌克兰问题上寻求合理让步的准备","text":"据国际文传电讯社(IFX)报道，俄罗斯外长拉夫罗夫表示，俄罗斯做好了在乌克兰问题上寻求合理让步的准备，但不会允许边境有北约存在。拉夫罗夫说，自冲突爆发以来，俄罗斯的立场未曾改变。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxats8580727","time":1789466451000,"title":"美联储加息来袭 金银短期承压但下跌并非定局","text":"2026年至今，黄金与白银投资者不得不应对剧烈的市场波动。以黄金为例，今年早些时候金价一度突破每盎司5500美元，但此后从这一历史高点大幅回落...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxats8580727.shtml","importance":"important"},{"id":"cls2483851","time":1789466393000,"title":"人工智能产业大会将至，商业应用加速落地，这些股频获机构调研","text":"2026人工智能产业大会将于10月14日至16日在济南举办。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2483851","importance":""},{"id":"cls2483859","time":1789466328000,"title":"【数据看盘】近8亿元资金买入通鼎互联 北一环路营业部抢筹两只风电人气股","text":"①光纤概念股通鼎互联涨停，获两家机构买入1.14亿，深股通买入4.37亿，国泰海通证券武汉紫阳东路营业部买入1.58亿，国泰海通证券上海江苏路营业部买入0.
