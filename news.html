tegory":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirvkkq7190008","time":1789399344000,"title":"特朗普称俄罗斯和乌克兰同意停止对能源目标的互袭","text":"特朗普在Truth Social平台发帖称：“乌克兰已同意不打击俄罗斯能源目标。俄罗斯也同意不对乌克兰能源目标实施攻击。” “全球柴油价格上涨主要是由俄乌冲突造成的...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-14/doc-inirvkkq7190008.shtml","importance":"hot"},{"id":"sinacomos:nirvkks3962367","time":1789399325000,"title":"能源价格上涨推高通胀担忧 交易员加码押注英国央行和欧洲央行加息","text":"由于能源价格再次飙升加剧了市场对通胀的担忧，交易员加大对欧洲央行和英国央行的加息押注。 货币市场目前充分消化欧洲央行在未来12个月累计加息四次...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-14/doc-inirvkks3962367.shtml","importance":"important"},{"id":"wscn3164933","time":1789399307000,"title":"数据显示霍尔木兹海峡单日通行量降至个位数","text":"船舶追踪信息显示，霍尔木兹海峡上周末两天内单日船舶通行量仅为个位数，低于10天内每日平均14艘船的通行量。根据14日的船舶追踪信息，上周末两天内，4艘船只驶出霍尔木兹海峡，其中包括运载能源的船只；10艘货船驶入霍尔木兹海峡。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164932","time":1789399193000,"title":"特朗普称俄乌同意互不攻击能源目标","text":"美国总统特朗普14日在社交媒体上说，俄罗斯和乌克兰已同意不攻击对方的能源目标。\n特朗普在社交媒体上写道，“乌克兰已同意不攻击俄罗斯的能源目标，俄罗斯也同意同样不攻击乌克兰”，“全球柴油价格上涨主要是由俄乌冲突造成的，而非伊朗”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164931","time":1789399165000,"title":"伊朗与海湾国家未撕破脸仍可能对话","text":"伊朗与海湾国家原定于9月14日在阿曼举行会议，通报伊朗与阿曼商定的霍尔木兹海峡新航道安排。但因巴林的不参与，以及沙特的延期要求，本次会议已被推迟。中国现代国际关系研究院中东研究所副所长秦天指出，伊朗与海湾国家达成共识有难度，但仍保留了未来双方继续通过谈判来探索霍尔木兹海峡通航问题解决方案的可能性。 （CCTV国际时讯）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1636474827170","time":1789399050000,"title":"20万跌到了6万，吐血...","text":"20万跌到了6万，吐血...","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QS989N05198ATO.html","importance":""},{"id":"wscn3164930","time":1789398965000,"title":"曾准确预测10年期美债收益率达5%的策略师称：抛售尚未结束","text":"伦敦标准银行G10策略主管Steven Barrow将其对10年期美债收益率的年底预测上调至5.2%，并预计该收益率将在2027年第一季度达到5.3%。\nBarrow此前关于5%的预测曾被视为极度逆向，但此后美伊冲突引发了能源价格的历史性飙升，目前市场已开始定价美联储的加息周期。\nBarrow表示，推动利率走高的长期结构性力量（包括全球供应链挤压和气候变化的持续影响）比以往任何时候都更加强劲。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1631749629662","time":1789398946000,"title":"财报现重大错误，“万元”错标注为“元”|司见","text":"财报现重大错误，“万元”错标注为“元”|司见","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/money/article/L6QS6H1300258105.html","importance":""},{"id":"wscn3164929","time":1789398919000,"title":"俄罗斯国防部通报，俄空天军使用攻击无人机袭击了敖德萨港内一艘货船。\n该船当时正在为乌克兰武装部队运送物资。\n","text":"俄罗斯国防部通报，俄空天军使用攻击无人机袭击了敖德萨港内一艘货船。\n该船当时正在为乌克兰武装部队运送物资。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4890177","time":1789398769000,"title":"俄罗斯方面表示，其在乌克兰敖德萨港击中了一艘干货船。","text":"俄罗斯方面表示，其在乌克兰敖德萨港击中了一艘干货船。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409244716","importance":""},{"id":"wscn3164928","time":1789398689000,"title":"俄罗斯：打击乌克兰西部铁路基础设施。\n打击乌克兰Odesa Port（敖德萨港口）一艘干散货轮。（国际文传电讯社）\n","text":"俄罗斯：打击乌克兰西部铁路基础设施。\n打击乌克兰Odesa Port（敖德萨港口）一艘干散货轮。（国际文传电讯社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164927","time":1789398660000,"title":"俄国防部称俄军新控制3处居民点","text":"俄罗斯国防部14日在社交媒体发布通报称，俄军过去24小时内在哈尔科夫、顿涅茨克和扎波罗热方向持续推进，新控制3处居民点。\n通报还称，俄军战术航空兵、攻击型无人机、导弹部队和炮兵对乌克兰142个地区的后勤中心、能源和交通基础设施、无人机组装车间和仓库等目标进行打击。此外，俄黑海舰队在克里米亚附近海域摧毁一艘乌军无人艇。\n乌方对此暂未作出回应。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"xq4890171","time":1789398637000,"title":"国际油价涨幅收窄，截至目前，WTI原油期货价格涨2.54%，报102.596美元/桶；布伦特原油期货价格涨2.84%，报107.579美元/桶。","text":"国际油价涨幅收窄，截至目前，WTI原油期货价格涨2.54%，报102.596美元/桶；布伦特原油期货价格涨2.84%，报107.579美元/桶。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430 ","text":"从盈利5.67亿到亏损1.29亿，河钢资源董事长辞职时点微妙","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QR9NN00552C1DU.html","importance":""},{"id":"sinacomos:nirvkku4363870","time":1789397573000,"title":"老股东还没解套，智谱新一轮50亿美元融资落地！股价还在跌","text":"来源：上市之家 50亿美元到账了。股价又跌了。 9月13日晚间，智谱（02513.HK）公告完成约50亿美元融资。20亿美元股份配售，30亿美元可转债。钱到账了。但市场不买账。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-14/doc-inirvkku4363870.shtml","importance":""},{"id":"sinacomos:nirvkks3949507","time":1789397552000,"title":"汽车圈炸了！一汽、广汽“亲密”牵手了！是优势互补，还是抱团取暖？","text":"来源：上市之家 消息又提前漏了？ 周末就有消息传称广汽与一汽在酝酿合并重组。 9月14日，广汽集团A股因“重要事项未公告”被上交所实施全天停牌。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hyyj/2026-09-14/doc-inirvkks3949507.shtml","importance":""},{"id":"sinacomos:nirvkkn9199784","time":1789397382000,"title":"美银的Subramanian将标普500指数年底目标上调至7400点","text":" 美国银行的美国股票及量化策略主管Savita Subramanian周一在报告中表示，该行将标普500指数年底目标位从7100点上调至7400点，称长期看涨逻辑依然成立。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirvkkn9199784.shtml","importance":"hot"},{"id":"wscn3164921","time":1789397356000,"title":"美银的Subramanian将标普500指数年底目标上调至7400点","text":"美国银行的美国股票及量化策略主管Savita Subramanian表示，该行将标普500指数年底目标位从7100点上调至7400点，称长期看涨逻辑依然成立。该行还将标普500指数未来12个月目标位设为7800点。\nSubramanian写道：“我们正进入季节性疲软期，我们认为市场早就应该回调了”。新的年底目标位较标普500指数上周五收盘点位低3.4%。仍对通胀风险以及美联储加息的可能性保持谨慎，称任何推动融资成本上升的催化因素都可能“加速痛苦的到来”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164920","time":1789397331000,"title":"美国矿企签约卢旺达钨矿项目","text":"一家美国矿企正与卢旺达政府合作，在当地采购并加工钨矿。根据具有约束力的协议，卢旺达方面将以提供一处勘探特许权和一张加工许可证的方式，入股Almonty Industries Inc.（阿尔蒙蒂工业）的当地子公司，获得25%的股份。美国政府协助促成了此次卢旺达合作并提供了政治支持，但并未直接提供资金。产出的钨矿将运往美国、欧洲、日本和韩国的客户。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"163790095684","time":1789397298000,"title":"越秀资本换届：58岁李锋连任董事长，51岁吴勇高升总经理","text":"越秀资本换届：58岁李锋连任董事长，51岁吴勇高升总经理","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QQJRDE0552C1DU.html","importance":""},{"id":"wscn3164919","time":1789397196000,"title":"欧盟拟限制15岁以下儿童使用社交媒体和AI聊天机器人","text":"欧盟将于周四公布一项名为“儿童法案”（Kids Act）的旗舰提案，计划限制15岁以下儿童访问社交媒体。\n一份政策文件显示，欧盟委员会将要求社交媒体公司、在线游戏服务和AI聊天机器人对其服务设置年龄门槛，以将年龄最小的青少年拒之门外。根据这份可能在发布前发生变动的草案文件，这些公司还需采用安全功能，以最大限度地减少滥用和成瘾行为。\n根据该提案，欧盟将设定15岁为开设“自主账户”（即无需家长监督的账户）的最低年龄。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1637859113793","time":1789397189000,"title":"汽车巨头整合再曝大动作，一汽股份要成广汽集团第二大股东！","text":"汽车巨头整合再曝大动作，一汽股份要成广汽集团第二大股东！","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QQGE4E0519APGA.html","importance":""},{"id":"sinacomos:nirvkkq7172095","time":1789397015000,"title":"交易员完全计入到2027年底欧洲央行加息四次、英国央行五次的预期","text":"随着能源价格上涨加剧通胀担忧，货币市场加大了对央行加息的押注。 掉期市场显示，到明年底欧洲央行将累计加息四次、每次25个基点，届时存款利率将升至3.5%。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-14/doc-inirvkkq7172095.shtml","importance":"important"},{"id":"wscn3164918","time":1789396978000,"title":"公开数据：霍尔木兹海峡单日通行量降至个位数","text":"据路透社14日报道，霍尔木兹海峡上周末两天内单日船舶通行量仅为个位数，低于10天内每日平均14艘船的通行量。\n报道说，根据14日的船舶追踪信息，上周末两天内，4艘船只驶出霍尔木兹海峡，其中包括运载能源的船只；10艘货船驶入霍尔木兹海峡。\n不过，上述数字不包括通过霍尔木兹海峡时关闭自动识别系统的船只。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164917","time":1789396911000,"title":"戴尔家族办公室与Sequence斥资77亿美元收购Baldwin","text":"迈克尔·戴尔的家族办公室与Sequence Holdings联手，以77亿美元的全现金交易收购Baldwin Insurance Group Inc.。\n根据周一的一份声明，DFO Management与一家专注于人工智能（AI）的控股公司Sequence将组建一家实体，持有这家保险分销和风险管理公司的多数股权，而部分Baldwin员工将保留少数股权。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirvkku4360288","time":1789396780000,"title":"美国10年期国债收益率2023年以来首次升破5%","text":"美国10年期国债收益率涨破5%，为2023年10月以来首次。油价飙升加剧通胀之忧，美国基准国债收益率一度上涨4个基点至5.006%，2023年10年债收益率只在5%上方维持了一天。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-inirvkku4360288.shtml","importance":"hot"},{"id":"wscn3164916","time":1789396699000,"title":"报告：全球核电装机容量到2060年可能增长两倍","text":"国际原子能机构14日发布《能源、电力与核电估算2060》展望报告显示，到2060年，全球核电装机容量可能增长两倍以上。这是该机构连续第六年上调其对核电扩张的预测。\n报告数据显示，截至2025年底，全球共有在运核反应堆413座，提供377.1吉瓦的核电装机容量。报告预计，到2060年，全球核电装机低估值预测将增至696吉瓦，约为2025年水平的两倍；高估值预测将增至1284吉瓦，约为2025年水平的3.4倍。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164915","time":1789396508000,"title":"广汽一汽重组前，广汽丰田总经理和副总齐齐被调走","text":"广汽集团发布公告称，公司筹划以发行股份的方式购买一汽股份持有的某整车合资公司的部分股权，并募集配套资金。在此次广汽集团宣布和一汽股份重组前，记者了解到，广汽丰田总经理、副总经理均被调走。目前，文大力不再担任广汽丰田汽车有限公司党委书记、委员、董事、执行副总经理职务，调回广汽集团总部工作。望军任广汽零部件有限公司党委委员、副书记、总经理，提名为广汽零部件有限公司董事，不再担任广汽丰田汽车有限公司党委委员、副总经理职务。（第一财经）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164913","time":1789396231000,"title":"中共中央办公厅、国务院办公厅、中央军委办公厅印发《退役军人服务和保障“十五五”规划》","text":"《规划》提出，“十五五”时期退役军人工作要坚持党的领导，引导退役军人坚定听党话跟党走；坚持以人为本，保障好、维护好退役军人的合法权益；坚持守正创新，深化重点领域和关键环节改革；坚持军地协同，加强政策制度衔接和工作举措协同；坚持分类施策，增强服务保障的精准性、便捷性、可持续性。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"163230170912","time":1789395979000,"title":"一车人都买错票！一大批高铁站，要改名了？","text":"一车人都买错票！一大批高铁站，要改名了？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QP0BCQ0519FM90.html","importance":""},{"id":"sinacomos:nirvkkq7162470","time":1789395958000,"title":"每年亏十几个亿！蓝箭航天烧钱不断，钱到底从哪来？这场资本豪赌，赌的是中国商业航天的未来吗？","text":"来源：太空科普君 不得不说，蓝箭航天这个国内民营航天企业，花起钱来那是比较顺手的！ 但是蓝箭航天的成绩也是不可否认的，首先按照规模来说排名第二...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/hyyj/2026-09-14/doc
