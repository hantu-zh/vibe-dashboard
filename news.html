行宣布调整个人贵金属代理业务。有银行人士透露，对于代理上金所个人贵金属业务，银行更多是收取手续费，若市场发生剧烈波动，银行可能面临客户穿仓带来的垫资信用风险。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirykph3355284","time":1789512840000,"title":"9月16日隔夜要闻：美股三大指数收跌 沙特供应风险推升油价 金价震荡 市场关注联储决议","text":"市场 9月16日美股收盘：三大指数收跌 油价回升 10年期美债收益率触及19年高位 9月16日美股成交前20：科技股承压 市场关注AI安全 英伟达黄仁勋称AI行业不需要新的安全监管法...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-inirykph3355284.shtml","importance":""},{"id":"wscn3165797","time":1789512648000,"title":"我国火箭单次海上发射载荷重量创新高","text":"9月16日，引力一号遥三运载火箭在我国东海海域点火升空，成功将搭载的8颗千帆星座组网卫星与1颗超高速无线通信技术试验卫星顺利送入预定轨道，发射任务取得圆满成功。\n记者从火箭研制方东方空间（山东）科技有限公司获悉，此次任务创下我国单次海上发射载荷重量和轨道高度新高，净载荷重量超3吨，入轨高度约800公里，验证了海上发射模式对中大型卫星载荷任务的适应能力。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165799","time":1789512564000,"title":"加拿大投资峰会要点总结","text":"一、 加拿大总理马克·卡尼讲话。\n9月15日，卡尼的演讲重点在于吸引全球资本、改善投资环境、推动税制与监管改革，以及明确对美贸易立场。\n1、推出“生产力超级抵扣”税收优惠： 宣布扩大资本支出即期费用化抵扣的适用资产范围，涵盖油气管道、采矿资产、光纤电缆、计算机设备及本国制造客车等。该税收政策（五年内预算约360亿加元）将使加拿大的新投资边际有效税率从13%降至6.4%，成为七国集团（G7）中税收竞争力最高的国家。\n2、开放四大核心机场引入私有资本： 宣布政府将通过长期特许经营权租赁方式，在保持土地与资产国有所有权的前提下，向私有资本开放多伦多皮尔逊、温哥华、蒙特利尔和卡尔加里等四大机场的运营。\n3、提高项目审批效率（简化监管）： 承诺改变政府审批冗长的拖沓作风，提出“一个项目、一次审查、一年完成”的审批机制。\n4、财政政策与动员本国资本： 承诺政府将在下一年实现运营预算平衡；同时宣布本国金融机构及基金已承诺动员超过140亿加元支持人工智能（如Radical Breakouts 40亿加元AI基金）等战略领域的本土企业发展。\n5、美加贸易关系与国际合作： 强调加拿大仍将是美国最重要的合作伙伴，但已准备好深化与海湾地区、亚洲及印度等非美市场的经贸联系。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165796","time":1789512514000,"title":"投顾“精细化”腾挪，看好低拥挤度与确定性","text":"近期，汇添富基金、中欧基金、万家基金等多家机构的投顾组合相继披露最新调仓动向，在A股市场震荡分化背景下，投顾的布局策略呈现一定分歧。梳理发现，尽管科技板块整体仍是关注焦点，但投顾机构在科技内部赛道进行了精细化“腾挪”，同时加大对医药、黄金等行业的配置力度，试图在波动中捕捉确定性机会。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomo s://finance.sina.com.cn/world/2026-09-16/doc-inirykph3347213.shtml","importance":"hot"},{"id":"xq4892148","time":1789511920000,"title":"【一箭九星 引力一号遥三运载火箭发射成功】北京时间2026年9月16日6时00分，我国太原卫星发射中心在上海东部海域使用引力一号遥三运载火箭，将搭载的千帆极轨2...","text":"【一箭九星 引力一号遥三运载火箭发射成功】北京时间2026年9月16日6时00分，我国太原卫星发射中心在上海东部海域使用引力一号遥三运载火箭，将搭载的千帆极轨26组卫星及EUHT技术试验卫星共9颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。此次任务是引力一号运载火箭的第4次飞行。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409411936","importance":"hot"},{"id":"wscn3165792","time":1789511905000,"title":"OpenAI的CFO：我并不担心AI开发的进度放缓问题。（CNBC）\n","text":"OpenAI的CFO：我并不担心AI开发的进度放缓问题。（CNBC）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165791","time":1789511865000,"title":"互联网保险或迎新规：禁止免费赠险诱导投保、静默续保","text":"近日从业内获悉，为规范互联网保险市场发展，有关部门正就进一步规范互联网保险经营有关事项向业内征求意见，拟以负面清单方式，禁止免费赠险诱导投保、静默续保等行为。“我们公司有部门收到了相关通知，通知主要是针对非车险业务。”一家险企相关部门负责人告诉记者，近期公司会组织相关人员围绕通知内容进行培训。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165790","time":1789511792000,"title":"引力一号遥三运载火箭发射成功","text":"9月16日6时00分，我国太原卫星发射中心在上海东部海域使用引力一号遥三运载火箭，将搭载的千帆极轨26组卫星及EUHT技术试验卫星共9颗卫星顺利送入预定轨道，飞行试验任务取得圆满成功。此次任务是引力一号运载火箭的第4次飞行。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1637062289762","time":1789511788000,"title":"贝森特：支持“5000美元支票”，不会增加赤字，众议院议长：方案落地还需时间","text":"贝森特：支持“5000美元支票”，不会增加赤字，众议院议长：方案落地还需时间","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6U7Q67005198NMR.html","importance":""},{"id":"wscn3165789","time":1789511752000,"title":"跨国公司资金池政策全国推广，多地首批业务落地","text":"跨国公司跨境资金管理步入新的便利化阶段。中国人民银行、国家外汇管理局联合发布的《关于跨国公司本外币跨境资金集中运营业务有关事宜的通知》9月14日起施行，跨国公司本外币跨境资金集中运营业务从试点地区走向全国。梳理发现，政策实施以来，天津、浙江、福建、山东、重庆等地首批案例已接续落地，跨境资金“活水”加速汇入，支持企业全球布局。与此同时，9月以来，多地已启动或优化本外币一体化资金池业务试点，跨境资金管理持续释放便利化信号。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165788","time":1789511454000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 07:50 日本8月进出口与商品贸易帐，7月核心机械订单；\n② 时间待定 香港特区公布首个五年规划；\n③ 14:00 英国8月CPI，“豆包手机”发布并上市；\n④ 时间待定 欧盟与加拿大拟宣布全新全方位伙伴关系；\n⑤ 16:00 欧洲央行副行长Vujcic在一个与地缘政治、贸易相关话题的央行年度研讨会上讲话；\n⑥ 17:00 欧元区7月工业产出；\n⑦ 20:30 美国8月零售销售，进口/出口价格指数；\n⑧ 22:30 美国能源信息署（EIA）发布政府版原油库存周报；\n⑨ 次日00:00 欧洲央行管委兼德国央行行长Nagel讲话；\n⑩ 次日01:30 加拿大央行发布会议纪要；\n⑪ 次日02:00 美联储发布联邦公开市场委员会（FOMC）利率决议声明和经济预期概要（SEP，含点阵图）；\n⑫ 次日02:30 美联储主席沃什举行新闻发布会；\n⑬ 次日04:00 美国7月国际资本净流动；\n⑭ 次日05:30 巴西央行公布利率决议；\n⑮ 次日06:45 新西兰二季度GDP；\n微信小程序搜索“见闻历”，了解更多。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165787","time":1789511201000,"title":"近一个月净流入500亿元，资金借道ETF布局硬科技","text":"在近期的震荡行情中，资金逆势流入硬科技板块。Choice测算显示，过去1个月来，科创50、半导体、通信、人工智能等相关主题ETF资金净流入超过500亿元。此外，近期科技主题基金密集成立，在新成立ETF披露的持有人名单中，频现产业资本和机构投资者的身影。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165786","time":1789511148000,"title":"全球黄金ETF资产管理规模创纪录，机构：金价短期承压不改长期配置价值","text":"8月以来，黄金类ETF持续获得资金流入，截至9月14日，境内黄金相关ETF资金净流入超过百亿元。与此同时，世界黄金协会发布的报告显示，8月全球实物黄金ETF资金净流入约180亿美元，创历史第二大单月净流入规模。全球黄金ETF资产管理规模环比增长16%至6150亿美元，黄金持仓增加121吨至4189吨，刷新历史纪录。近期，油价上涨及美联储加息预期升温令金价短期承压。但从中长期来看，多家机构认为，央行购金、储备多元化和避险需求仍为黄金提供支撑。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165785","time":1789511111000,"title":"Meta将推出无摄像头智能眼镜，应对日益加剧的隐私顾虑","text":"据知情人士透露，Meta计划今年秋季推出一款无摄像头智能眼镜。现有智能眼镜的摄像头功能持续引发隐私争议，Meta希望借此扩充硬件产品线。\n这款内部代号为Luna（月神）的新型眼镜，内置6枚麦克风，支持用户与Meta AI聊天机器人、新发布的消费级AI智能体Muse语音交互；镜腿侧边设有按键，可一键唤起Meta AI；搭载开放式扬声器，声音定向传至耳旁，无需封堵耳道。相比雷朋联名款，Luna镜腿设计更加纤细，外观更接近普通民用眼镜。 （The Information）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165784","time":1789510653000,"title":"新西兰联储：助理主席Karen Silk准备离职，其将履职至11月中旬。\n联储准备评估自身高管层的阵容。\n连续将寻找一位负责货币政策的助理主席、寻找一位负责支付","text":"新西兰联储：助理主席Karen Silk准备离职，其将履职至11月中旬。\n联储准备评估自身高管层的阵容。\n连续将寻找一位负责货币政策的助理主席、寻找一位负责支付与现金业务的助理主席。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3165783","time":1789510637000,"title":"【供给趋紧叠加需求回暖，钨供需紧平衡格局有望延续Choice9月15日，A股钨板块表现活跃。数据显示，年初至今，翔鹭钨业、中钨高新两只个股的涨幅均已超过100%","text":"【供给趋紧叠加需求回暖，钨供需紧平衡格局有望延续Choice9月15日，A股钨板块表现活跃。数据显示，年初至今，翔鹭钨业、中钨高新两只个股的涨幅均已超过100%。“本轮钨板块上涨，是AI算力周期拉动相关产业链需求、地缘冲突下关键矿产焦虑带来的超额补库需求，以及供给偏紧等多重因素共同作用的结果。”华安证券金属新材料首席分析师许勇其表示。国金证券研报预计，2026至2028年国内钨供给分别为5.0万、5.0万和5.2万金属吨，而同期需求分别为8.17万、8.77万和9.31万金属吨，国内钨供需紧平衡格局有望延续。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165782","time":1789510575000,"title":"伊朗格什姆岛传出数声爆炸声。（伊朗媒体IRNA）\n","text":"伊朗格什姆岛传出数声爆炸声。（伊朗媒体IRNA）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirykph3336932","time":1789510452000,"title":"高管称Radiant World和Sapphire Minmetals起诉嘉能可 索赔20亿美元","text":"Sapphire Minmetals董事长表示，Radiant World和Sapphire Minmetals已在新加坡对嘉能可提起诉讼，索赔20亿美元。 “我们已在新加坡法院对嘉能可提起诉讼，索赔20亿美元...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-inirykph3336932.shtml","importance":"hot"},{"id":"sinacomos:nirykpe6564091","time":1789510415000,"title":"OpenAI首席执行官Altman“有信心”AI行业能够自行保障安全","text":"OpenAI首席执行官Sam Altman表示，他相信人工智能公司能够安全地开发这项技术，而不会对广大民众造成重大伤害。 “我对我们公司——以及整个行业——安全推进这项技术的能力非常...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-inirykpe6564091.shtml","importance":"hot"},{"id":"wscn3165781","time":1789510402000,"title":"三大利好共振，资金加速涌入科创债ETF","text":"在政策红利、增量资金预期、底层资产扩容三重利好的共振下，科创债板块行情走强，科创债ETF也迎来资金的持续抢筹。8月以来，24只科创债ETF净申购份额超过1亿份，规模大增132亿元。业内人士认为，随着债券市场“科技板”建设的推进，科创债的供给与机构配置空间有望进一步打开，长期配置价值将持续显现。Choice数据显示，今年以来，中证AAA科技创新公司债指
