reetcn.com/live/global","importance":""},{"id":"1637958636208","time":1789374533000,"title":"国务院国资委：中央企业带头及时支付账款","text":"国务院国资委：中央企业带头及时支付账款","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6Q4SK1N0519814N.html","importance":"hot"},{"id":"wscn3164708","time":1789374282000,"title":"国际油价持续走高，布伦特原油涨3.6%，报108.38美元/桶；WTI原油涨3.3%，报103.39美元/桶。\n","text":"国际油价持续走高，布伦特原油涨3.6%，报108.38美元/桶；WTI原油涨3.3%，报103.39美元/桶。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164706","time":1789374214000,"title":"芯碁微装：下半年高阶PCB设备订单交付保持饱满","text":"芯碁微装董事长程卓在今日举行的2026年半年度业绩会上表示，下半年来看，高阶PCB设备订单交付保持饱满，先进封装设备也进入验证与落地阶段；明年AI服务器、相关载板及先进封装扩产仍将带来设备增量。公司二期厂区上半年处于爬坡阶段，整体产能利用率维持高位。全年来看，二期产能将在下半年进入完整释放阶段，依托模块化生产与核心零部件前置备货，持续承接高阶PCB及先进封装设备订单。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1632397363793","time":1789374146000,"title":"市场监管总局：赴部分龙头汽车企业调研，敦促提醒避免滥用优势地位拖欠账款","text":"市场监管总局：赴部分龙头汽车企业调研，敦促提醒避免滥用优势地位拖欠账款","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6Q4HM5E0514R9P4.html","importance":""},{"id":"wscn3164705","time":1789374129000,"title":"胡塞对沙特空军基地发动大规模打击","text":"也门胡塞武装发言人叶海亚·萨雷亚今天（9月14日）表示，过去5天内，沙特出动F-15战机和“台风”战机发动了300余次空袭，袭击了也门大部分省份，战机均从海米斯穆谢特和塔伊夫两座基地起飞。作为回应，也门（胡塞）武装力量使用数十枚弹道导弹和无人机，打击了沙特海米斯穆谢特的哈立德国王空军基地，所有打击均精准命中目标，并给该基地造成了重大损失。叶海亚·萨雷亚表示，胡塞武装将继续坚持“封锁对封锁、升级对升级”的准则，直至沙特停止侵略并解除对也门的封锁。（CCTV国际时讯）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164703","time":1789373767000,"title":"欧洲央行管委：如有必要将毫不犹豫地进一步加息","text":"欧洲央行管理委员会成员Peter Kazimir表示，如有必要，欧洲央行将毫不犹豫地进一步加息，不过确定下一步行动仍需要时间。这位斯洛伐克央行行长在评论文章中表示：“我们将在必要时做出每一项决定，当证据表明需要采取行动时，我们绝不会动摇。”Kazimir认为，通胀风险“显然偏向上行”。Kazimir表示，虽然经济增长强于预期也是推动因素之一，但能源仍是通胀面临的主要风险来源，尤其关注天然气和电力价格。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"1638506745792","time":1789373681000,"title":"OpenAI按下竞速暂停键：大模型退烧，企业 AI进入结果验收时代","text":"OpenAI按下竞速暂停键：大模型退烧，企业 AI进入结果验收时代","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6Q430UO05199KEG.html","importance":""},{"id":"wscn3164702","time":1789373679000,"title":"伊朗：有关核监督机构观察到镐山出现活动的说法毫无根据","text":"在回应有关国际原子能机构称观察到镐山(Pickaxe Mountain)有施工活动的问题时，伊朗外交部发言人Esmail Baghaei表示，“有关该地点的讨论纯属媒体炒作，毫无根据。”“严格来说，我们甚至不能说它是一个核设施”。根据《不扩散核武器条约》规定的义务，我们已向国际原子能机构提供了所有必要或需要提供的信息。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164700","time":1789373470000,"title":"苹果回应“iPhone 17大降价”","text":"苹果客服回应称：“目前苹果官方网站并未发布任何降价通知。”对于第三方渠道的降价行为，客服提醒消费者需警惕风险。 苹果客服表示，第三方渠道主要分为三类：普通无授权第三方价格可能最低，但存在翻新机或不合格货源风险；普通授权店虽拥有销售权，但货源不在苹果官方后台登记，可能混入非官方货源；苹果优质授权店的部分产品可在官方后台查询，相对有保障，但仍不等同于官方零售店。以上三类线下渠道价格可能因店庆或国补优惠出现波动，消费者应谨慎购入。（中新经纬）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164698","time":1789373420000,"title":"恒生指数收盘涨0.45%，恒生科技指数跌0.06%。曦智科技跌超11%，希音跌超9%，智谱跌超9%，群核科技跌近9%。\n","text":"恒生指数收盘涨0.45%，恒生科技指数跌0.06%。曦智科技跌超11%，希音跌超9%，智谱跌超9%，群核科技跌近9%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164696","time":1789373330000,"title":"美股盘前，存储芯片股、光通信股普跌","text":"美股盘前，存储芯片股普跌，SK海力士跌超6%，美光科技跌近5%，西部数据跌近4%，闪迪跌超5%。\n光通信股普跌，迈威尔科技跌约6%，Coherent跌约6%，Credo跌约6%，Lumentum跌约6%，康宁跌约7%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164694","time":1789373055000,"title":"高盛策略师：加息不会阻挡股市牛市","text":"当美联储开始加息时，股市通常会面临压力，但高盛预计牛市将持续下去。以Ben Snider为首的策略师们表示，利率上升对股票估值构成不利因素，但企业盈利仍是推动股市最重要的驱动力。标普500指数的预期市盈率已从年初的22倍降至目前的19倍，但该指数仍处于距纪录高点2%以内的水平。报告指出，市场已反映明年内加息三次以上的预期，且企业盈利和资产负债表均表现强劲。过去几十年，在七次加息周期的前三个月，标普500指数平均下跌2%，但在首次加息后的12个月内上涨9%。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"http
