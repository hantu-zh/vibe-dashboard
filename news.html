<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财经要闻</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#1a1a2e;color:#e0e0e0;font-size:14px;padding:12px;max-width:900px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #333;margin-bottom:12px}
.header h1{font-size:18px;color:#4fc3f7;font-weight:600}
.header .stats{font-size:12px;color:#888}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:4px 12px;border:1px solid #333;border-radius:16px;background:#252540;color:#aaa;cursor:pointer;font-size:12px;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:#4fc3f7;color:#1a1a2e;border-color:#4fc3f7}
.search-wrap{display:flex;gap:8px;margin-bottom:12px}
.search-input{flex:1;padding:8px 12px;background:#252540;border:1px solid #333;border-radius:8px;color:#e0e0e0;font-size:13px;outline:none}
.search-input:focus{border-color:#4fc3f7}
.search-input::placeholder{color:#666}
.news-list{list-style:none}
.news-item{padding:10px 0;border-bottom:1px solid #252540;cursor:pointer;transition:background .15s;position:relative}
.news-item:hover{background:#252540;border-radius:6px;padding:10px 8px}
.news-item .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:#888;margin-bottom:4px}
.news-item .source{padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.news-item .time{margin-left:auto}
.news-item .importance{color:#ff7043;font-weight:600;font-size:10px;padding:1px 4px;border:1px solid #ff7043;border-radius:3px}
.news-item .title{font-size:13px;line-height:1.5;color:#ccc;word-break:break-all}
.news-item .title strong{color:#ff7043;font-weight:600}
.news-item .text{font-size:12px;color:#777;margin-top:3px;line-height:1.4}
.news-item .stock-tag{color:#4fc3f7;font-size:11px;margin-top:2px}
.loading,.error{text-align:center;padding:40px;color:#666;font-size:14px}
.error{color:#ff7043}
.hidden{display:none}
#summary{background:#252540;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:12px;color:#888;display:none}
#summary.show{display:block}
</style>
</head>
<body>
<div class="header">
  <h1>财经要闻</h1>
  <div class="stats" id="stats">加载中...</div>
</div>
<div id="summary"></div>
<div class="filters" id="filters"></div>
<div class="search-wrap">
  <input class="search-input" id="searchInput" placeholder="搜索新闻...">
</div>
<div class="news-list" id="newsList"><div class="loading">加载新闻数据...</div></div>

<script>
var _rawData = null;
var _filter = 'all';
var _search = '';

function init() {
  var DATA_URL = 'news_data.json';
  fetch(DATA_URL)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      _rawData = d.items || [];
      document.getElementById('stats').textContent = '共 ' + _rawData.length + ' 条 | 最后更新: ' + (_rawData[0] && _rawData[0].time_str ? _rawData[0].time_str : 'N/A');
      buildFilters();
      render();
    })
    .catch(function(e) {
      document.getElementById('newsList').innerHTML = '<div class="error">数据加载失败: ' + e + '</div>';
    });
}

function buildFilters() {
  var counts = { all: _rawData.length, fast: 0, hot: 0, policy: 0, market: 0, tech: 0, other: 0 };
  var catMap = { fast: '快讯', hot: '热点', policy: '政策', market: '市场', tech: '科技', other: '其他' };
  _rawData.forEach(function(it) {
    var c = it.category || 'other';
    if (counts[c] !== undefined) counts[c]++;
    else counts.other++;
  });
  var html = '<button class="filter-btn active" data-cat="all">全部 (' + counts.all + ')</button>';
  Object.keys(catMap).forEach(function(k) {
    if (counts[k] > 0) html += '<button class="filter-btn" data-cat="' + k + '">' + catMap[k] + ' (' + counts[k] + ')</button>';
  });
  document.getElementById('filters').innerHTML = html;
  document.getElementById('filters').querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      _filter = this.dataset.cat;
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      this.classList.add('active');
      render();
    });
  });
}

function render() {
  var list = document.getElementById('newsList');
  var s = _search.toLowerCase();
  var filtered = _rawData.filter(function(it) {
    if (_filter !== 'all' && (it.category || 'other') !== _filter) return false;
    if (s && !(it.title + ' ' + (it.text || '')).toLowerCase().includes(s)) return false;
    return true;
  });
  if (filtered.length === 0) { list.innerHTML = '<div class="loading">没有匹配的新闻</div>'; return; }
  var html = '';
  filtered.forEach(function(it) {
    var imp = it.importance === 'important' ? '<span class="importance">重要</span>' : '';
    var src = it.source || '';
    var srcColor = src.indexOf('东方财富') >= 0 ? '#e53935' : src.indexOf('新浪') >= 0 ? '#4fc3f7' : src.indexOf('雪球') >= 0 ? '#4caf50' : src.indexOf('网易') >= 0 ? '#ff9800' : '#888';
    var stock = it.stock ? '<div class="stock-tag">关联: ' + it.stock + '</div>' : '';
    html += '<li class="news-item" data-url="' + (it.url || '#') + '">';
    html += '<div class="meta"><span class="source" style="background:' + srcColor + ';color:#fff">' + src + '</span><span class="time">' + (it.time_str || '') + '</span>' + imp + '</div>';
    html += '<div class="title">' + escapeHtml(it.title || '') + '</div>';
    if (it.text && it.text !== it.title) html += '<div class="text">' + escapeHtml(it.text || '') + '</div>';
    html += stock + '</li>';
  });
  list.innerHTML = html;
  list.querySelectorAll('.news-item[data-url]').forEach(function(item) {
    item.addEventListener('click', function() {
      var url = this.dataset.url;
      if (url && url !== '#') window.open(url, '_blank');
    });
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('searchInput').addEventListener('input', function() {
  _search = this.value;
  render();
});

init();
</script>
</body>
</html>
