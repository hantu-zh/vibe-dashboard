phabet","text":"由10家银行组成的银团正向黑石集团与谷歌母公司Alphabet Inc.旗下新云venture Crux AI提供220亿美元芯片贷款，这是人工智能（AI）关键处理器融资竞赛中的最新一笔超大型债务交易。\n据知情人士透露，该笔债务将用于采购张量处理单元（TPU）——即谷歌制造的一类芯片，并以这些芯片的价值及Crux AI的客户合同作为抵押。\n参与该笔贷款的银行包括高盛集团、三井住友银行（Sumitomo Mitsui Banking Corp.）、巴克莱银行、法国巴黎银行以及加拿大丰业银行，该银行团目前正通过银团化方式引入更多贷款方以分担风险。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nisaier3592962","time":1789587412000,"title":"美联储声明及点阵图对比：一致决定加息 多数官员料年内至少再升一次","text":"美联储周三一如市场所望加息25个基点，会后声明依然简洁且与前次变动不大。所有参与表决的决策者都投下了赞成票。“点阵图”依旧发布...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-17/doc-inisaier3592962.shtml","importance":"important"},{"id":"wscn3166459","time":1789587398000,"title":"周三（9月16日）纽约尾盘，美元兑日元涨0.68%，刷新日高至156.19日元，北京时间02:00美联储宣布加息、披露FOMC利率预测点阵图之时刷新日低至154","text":"周三（9月16日）纽约尾盘，美元兑日元涨0.68%，刷新日高至156.19日元，北京时间02:00美联储宣布加息、披露FOMC利率预测点阵图之时刷新日低至154.86，随后打破日内稍早的低位窄幅震荡状态、并显著拉升。\n欧元兑日元大致持平，英镑兑日元跌0.03%，日元兑离岸人民币跌0.65、刷新日低至4.2987元。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"xq4892580","time":1789587324000,"title":"【比利时法院裁定比财政部无权拒绝解冻俄BCS银行资产】比利时最高行政法院近日裁定，比利时财政部缺乏相应法律权限，无权拒绝解冻俄罗斯BCS银行被冻结在欧洲清算银行...","text":"【比利时法院裁定比财政部无权拒绝解冻俄BCS银行资产】比利时最高行政法院近日裁定，比利时财政部缺乏相应法律权限，无权拒绝解冻俄罗斯BCS银行被冻结在欧洲清算银行的资产。但裁决未要求立即解冻BCS银行被冻结资产，目前尚不明确该银行是否可以取回相关资产。2024年7月，BCS银行申请解冻其被欧洲清算银行控制的资产，但遭到比利时财政部拒绝。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409560707","importance":""},{"id":"wscn3166458","time":1789587208000,"title":"周三（9月16日）纽约尾盘，彭博谷物分类指数涨0.07%，报34.9196点，北京时间02:00美联储宣布加息后短线拉升、日内整体转涨。\nCBOT玉米期货跌0.","text":"周三（9月16日）纽约尾盘，彭博谷物分类指数涨0.07%，报34.9196点，北京时间02:00美联储宣布加息后短线拉升、日内整体转涨。\nCBOT玉米期货跌0.33%，CBOT小麦期货涨0.55%，CBOT大豆期货涨0.21%，豆粕期货涨0.41%，豆油期货跌1.19%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nisai "","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3166451","time":1789586263000,"title":"摩根资管：债市已至“最大痛苦点”，开始买入长端债券","text":"摩根资产管理全球固收主管鲍勃·米歇尔（Bob Michele）表示，其团队已开始买入美国、日本和澳大利亚的长端债券，称当前价格“实在太便宜”，市场已达到“最大痛苦点”。米歇尔认为，欧洲央行、美联储和日本央行的一系列加息行动，以及中东局势可能趋稳，将成为债市的支撑因素。他同时指出，近期美债抛售过度，财政部长贝森特的长债回购计划是重要的稳定力量。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nisaieu9612248","time":1789586141000,"title":"高盛CEO警告固定收益业务表现将较弱 公司整体支出料增加","text":"高盛首席执行官所罗门警告称，该行固定收益交易业务表现弱于过去几个季度，全公司的支出也在上升。 所罗门周三在巴克莱的一场会议上表示...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-17/doc-inisaieu9612248.shtml","importance":""},{"id":"wscn3166450","time":1789586126000,"title":"美联储主席沃什新闻发布会要点总结","text":"1、美联储撤走宽松，致力恢复价格稳定性。\n美联储主席凯文·沃什指出，当前美国经济表现强劲，劳动力市场形势良好，且美联储不相信必须通过伤害劳动力市场来实现目标。然而通胀依然居高不下且持续时间过长，太多品类的价格涨幅超过3%，FOMC对通胀正朝着2%目标移动缺乏信心。因此，FOMC决定撤走一剂宽松，主要聚焦于价格稳定性这一侧职责，以筑牢经济增长的根基。\n2、加息决定达成高度共识，政策不设前瞻指引。\n沃什强调，今天的加息决定展现了FOMC内部坚定的一致意见，此举表明美联储对抑制通胀的态度是极为认真的。同时，美联储当前不提供前瞻指引，不会预判未来的任何FOMC利率决定。此外，中性利率并未对本次利率决定构成可操作的影响，通胀趋势也几乎没有通过考验的迹象。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"xq4892576","time":1789586109000,"title":"【“新债王”冈拉克：联邦基金利率已经见顶的可能性几乎不存在】“新债王”冈拉克表示，联邦基金利率已经见顶的可能性几乎不存在。如果数据维持目前状况，会支持美联储在1...","text":"【“新债王”冈拉克：联邦基金利率已经见顶的可能性几乎不存在】“新债王”冈拉克表示，联邦基金利率已经见顶的可能性几乎不存在。如果数据维持目前状况，会支持美联储在10月加息。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409560206","importance":"important"},{"id":"wscn3166449","time":1789585907000,"title":"高盛股价跌幅扩大至4%。\n费城银行指数跌超3.3%。\n","text":"高盛股价跌幅扩大至4%。\n费城银行指数跌超3.3%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3166448","time":1789585332000,"title":"交易员们预计美联储10月加息的可能性为50%左右。\n","text":"交易员们预计美联储10月加息的可能性为50%左右。\n","source":"华尔街见闻","c
