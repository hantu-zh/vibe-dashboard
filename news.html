ve/global","importance":""},{"id":"wscn3164810","time":1789382576000,"title":"广州：聚焦海上商业航天发射、回收、测试、运维拓展产业链","text":"广州市人民政府办公厅近日印发《广州市海洋经济发展“十五五”规划》。其中提出，促进“海洋+低空航天”融合发展。推动无人机在海洋监测、海上物流、海上文旅、应急救援等场景的规模化应用。聚焦海上商业航天发射、回收、测试、运维拓展产业链。依托低轨卫星星座组网，发展海洋通信、船舶精准导航定位、深远海环境监测等海洋专业技术服务业。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164808","time":1789382531000,"title":"广州：推动海洋药物和生物制品业加速起势","text":"广州市人民政府办公厅近日印发《广州市海洋经济发展“十五五”规划》提出，推动海洋药物和生物制品业加速起势。提升深海生物资源利用水平，建设南海药源生物基因库和信息库。创新“AI+海洋药物”智能化开发新范式，攻关鱼油、鱼胶原蛋白、壳聚糖、海藻多糖等海洋生物资源的提取利用核心技术，发展糖类药物、肽类药物，打造具有热带海洋生物资源特色的“南海药库”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3164807","time":1789382505000,"title":"广州：到2030年海洋生产总值突破7300亿元","text":"广州市人民政府办公厅近日印发《广州市海洋经济发展“十五五”规划》提出，到2030年，海洋经济综合竞争力大幅跃升，海洋生产总值突破7300亿元，基本建成彰显海洋特色的现代化城市。海洋科技创新策源能力显著增强，科技转化能力大幅提高，现代海洋产业体系加速构建，海洋资源利用与生态保护效能持续提高，现代海洋服务与治理能力不断增强，“蓝色朋友圈”不断拓展，海洋特色文旅休闲功能进一步提升，人民群众对海洋的多层次、多样化需求得到进一步满足，千年商都向海焕发时代新活力。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"163706632199","time":1789382347000,"title":"推出880元精品摘要，金沙酒业胜算几何？","text":"推出880元精品摘要，金沙酒业胜算几何？","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QC1NS40552DMMD.html","importance":""},{"id":"wscn3164806","time":1789382319000,"title":"胡塞武装持续袭击引发沙特不满 伊朗与海湾国家会谈推迟","text":"伊朗与几个海湾阿拉伯国家原定就开辟一条经霍尔木兹海峡的临时航道举行会议，但会议被推迟，凸显这些国家与伊朗之间的紧张关系。伊朗外交部表示，会谈原定周一在阿曼举行，但应沙特阿拉伯要求“暂时”推迟。据一位知情人士透露，原因之一是沙特对胡塞武装等伊朗支持的组织持续袭击其领土感到不满。伊朗外交部周一表示，“沙特阿拉伯要求推迟地区峰会，并将原因归咎于也门局势，是在转移外界对这场危机根源的注意力。”（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3164805","time":1789382065000,"title":"董军同老挝副总理兼国防部长举行会谈","text":"国防部长董军14日在北京八一大楼同来访的老挝副总理兼国防部长坎良举行会谈。坎良说，老方愿同中方加强两军高层沟通和各层级交往，推动各领域务实合作取得更多成果。（新华社）\n","source":"华尔街见闻","category":"fa 韧性的美国经济构成风险。如果经济放缓迫使美联储重新考虑其紧缩路径，那么对利率变化最为敏感的两年期美债收益率可能会下降。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1634931887442","time":1789380169000,"title":"高校开始砸钱买房，大学生批量住进小区","text":"高校开始砸钱买房，大学生批量住进小区","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6QA8O4V0519APGA.html","importance":""},{"id":"cls2482524","time":1789380153000,"title":"南向资金追踪｜净买入超44亿港元 买入智谱连续流出中芯国际","text":"①南向资金当日成交约725亿港元，资金持续流入哪些个股？\n②资金流入智谱约12亿港元，近期持仓趋势有何变化？","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2482524","importance":"hot"},{"id":"wscn3164784","time":1789380153000,"title":"伊朗将霍尔木兹海峡不合规船只名单更新至77艘","text":"伊朗的波斯湾海峡管理局表示，该国将霍尔木兹海峡“不合规船只”名单更新至77艘。该机构表示，名单上的船只未来通行将受到限制，可能面临罚款、扣留或没收。该机构并称，有货物进出波斯湾的货主应在租船前查看这份名单，以避免可能出现的问题。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niruxus9355366","time":1789380114000,"title":"亚马逊暂停与21航空合作，起因迈阿密坠机事故","text":"此次坠机事件让这家航空公司及其所有人 —— 物流大亨、休斯顿太空人队老板吉姆・克兰，被推至公众视野内容简述： 一架亚马逊货运飞机在迈阿密国际机场冲出跑道...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-14/doc-iniruxus9355366.shtml","importance":""},{"id":"wscn3164783","time":1789380072000,"title":"前八月14家理财公司含权产品净增近2万亿元！现金类产品压降超1800亿元","text":"从业内可信渠道汇总的数据显示，管理规模超过1万亿元的14家理财公司（含6家国有行理财、8家股份行理财公司，约占市场份额80%）截至8月末的存续规模达到约27.4万亿元，环比7月继续净流入超2800亿元。今年前8个月，14家主要理财公司存续规模净增约1.96万亿元。分品类来看，其中含权产品规模新增约超1.98万亿元，非现金纯债类产品仅较年初增长约1760亿元，现金类产品规模较年初下降超1800亿元。（证券时报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:niruxus9353127","time":1789379765000,"title":"理想汽车告别舒适区","text":"来源：财熵 资料图。 理想汽车告别舒适区 田文 从“最会赚钱的新势力”到半年亏掉近40亿元，理想汽车只用了不到一年。从近期发布的今年上半年财报数字来看，其毛利率...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-14/doc-iniruxus9353127.shtml","imp
