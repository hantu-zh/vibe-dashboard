张国清出席开幕式并致辞。\n张国清表示，中国愿同各方一道，积极落实四大全球倡议，始终坚持开放融合、协调合作、兼容互补、成果共享，进一步提高北斗技术创新水平，加强北斗与人工智能、卫星互联网等技术融合，持续推进系统迭代升级，推动北斗产业健康有序发展，加速北斗应用提质扩面，完善卫星导航全球治理，让北斗系统更好服务全球、造福人类。（新华社）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"sinacomos:nirxaty3751941","time":1789469842000,"title":"“巨懂车”收紧获客线索标准，戳破汽车直播虚假繁荣","text":"9月，汽车主播的抱怨集中涌上社交平台。 有主播表示，过去获得一个线索（用户留下的电话号码等联系方式）平均投流费用约70元，最近一些场次却涨到500元；还有主播称进入9月...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/jjxw/2026-09-15/doc-inirxaty3751941.shtml","importance":""},{"id":"wscn3165494","time":1789469802000,"title":"快手电商：未授权任何机构或个人以“快手电商货源市场”名义举办选品会、招商会","text":"快手电商渠道业务中心发布声明称，近期经部分商家反馈及平台核实，市场上存在部分主体冒用“快手电商货源市场”名义，擅自举办所谓“快手电商货源选品会”，并以此向商家进行收费招募，据部分商家反馈收取2万至4万元不等的费用。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165493","time":1789469573000,"title":"本月底起《金融产品网络营销管理办法》正式实施，部分平台已开始排查","text":"本月底起，《金融产品网络营销管理办法》正式实施。目前部分平台已开始排查整治。近期腾讯开展金融广告全域排查，已下架违规金融广告53条、整改合规后重新上架6条；封禁无金融资质账户3个。抖音明确金融营销需具备合法资质并完成平台认证，严禁超范围经营。（每经网）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxhzq8471270","time":1789469447000,"title":"IPO撤单两年后，存储芯企华澜微“嫁给”园林股份？","text":"来源 | 野马财经 华澜微换道进入A股。 作者 | 于婞编辑 | 高岩 在资本市场兜兜转转十年，国产存储控制器芯片“老兵”华澜微这次敲开的不是交易所大门...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/s/2026-09-15/doc-inirxhzq8471270.shtml","importance":"hot"},{"id":"wscn3165491","time":1789469400000,"title":"携程集团：坚决落实在线酒店预订行业合规要求","text":"携程集团发文表示，2026年9月15日，国家市场监督管理总局会同文化和旅游部召开在线酒店预订平台服务行业行政指导会，为企业准确理解监管要求、完善合规机制提供了重要指引。借此机会，公司作出以下表态：\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3165488","time":1789469146000,"title":"华为与赛力斯合作模式调整后资源聚焦其余四大品牌","text":"今日，鸿蒙智行发布官方公告，华为与赛力斯合作模式调整，此次调整是在鸿蒙智行合作框架 ance.sina.com.cn/jjxw/2026-09-15/doc-inirxaty3751399.shtml","importance":""},{"id":"1636904584297","time":1789468464000,"title":"近万亿元！债券ETF市场再扩容，机构最新研判","text":"近万亿元！债券ETF市场再扩容，机构最新研判","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SUFE2T0519JFL1.html","importance":""},{"id":"wscn3165484","time":1789468427000,"title":"信用卡被盗用于订购苹果手机，香港金管局回应“应尽快通知发卡银行”","text":"近日，香港多家银行客户表示其信用卡被盗用于订购苹果手机。\n就此，香港金管局发言人回应称，信用卡交易一直需采取有效措施以确保安全性，保障客户的利益。个别商户可能基于营运考虑而不使用或暂停额外认证安排（如In App 认证或一次性密码）。在此情况下，商户须承担非授权交易的责任及财务损失。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"sinacomos:nirxaty3756313","time":1789468289000,"title":"联博称：放缓AI发展的呼声不会阻碍行业融资","text":" 联博控股（AllianceBernstein）的固定收益专家表示，即便社会各界呼吁放缓人工智能研发节奏，也无法阻止大型科技企业持续开展融资与资本开支。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxaty3756313.shtml","importance":"important"},{"id":"wscn3165483","time":1789468230000,"title":"瑞银策略师认为AI相关股票有广泛上涨的空间","text":"瑞银策略师表示，随着AI相关支出日益转化为工业、医疗保健、公用事业和金融行业的盈利，AI概念驱动的股市涨势并未消退，而是正在扩散。Bhanu Baweja带领的团队青睐维持AI板块敞口，同时针对被市场低估的宏观风险增强保护。他们预计，标普500指数到2026年底将升至8,100点，也就是较周一收盘上涨约6%，并于2027年升至8,900点；预计欧洲斯托克600指数到2026年底将升至690点，涨幅约为8%，到明年底进一步升至760点。（彭博）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1635675820960","time":1789468219000,"title":"银行业迎来“K型”分化","text":"银行业迎来“K型”分化","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SU85GQ051980A4.html","importance":""},{"id":"sinacomos:nirxatu6996555","time":1789468206000,"title":"韩国与埃及正推进下月举行首脑会晤 能源供应链或为重点议题","text":" 韩国与埃及正推动在下月举行首脑会晤。能源供应链合作，其中包括因中东局势恶化而重要性日益提升的“原油旁路运输网络”，预计将成为会谈核心议题。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/usstock/c/2026-09-15/doc-inirxatu6996555.shtml","importance":""},{"id":"sinacomos:nirxats8590462","time":1789468122000,"title":"华
