ttps://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163547","time":1789084202000,"title":"日本三季度BSI大型制造业信心指数 7.6，前值 -1.8。\n","text":"日本三季度BSI大型制造业信心指数 7.6，前值 -1.8。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1635246664704","time":1789084102000,"title":"关于接下来的A股，我有一个建议","text":"关于接下来的A股，我有一个建议","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HFTFE50519B7K0.html","importance":""},{"id":"wscn3163544","time":1789083764000,"title":"花旗：预计澳洲联储2026年将再加息两次，利率料上调至4.85%","text":"花旗集团表示，调整预期是受经济双速发展所驱动，一方面是房地产市场不断加深的调整，另一方面是与人工智能相关的投资热潮，这加剧了产能局限和通胀压力。花旗将最终利率预测从4.60%上调至4.85%。花旗此前预期为加息一次。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1638447670587","time":1789083149000,"title":"刚刚，直线飙涨！科技巨头，突发利好","text":"刚刚，直线飙涨！科技巨头，突发利好","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HF0F350519JFL1.html","importance":"important"},{"id":"wscn3163560","time":1789082700000,"title":"Kalshi获美国CFTC批准上线黄金白银永续合约，扩大期货产品版图","text":"Kalshi已获批在美国上线与贵金属黄金和白银挂钩的永续期货合约，这是该公司寻求将交易产品拓展至预测市场之外的最新进展。该申请最初于7月提交，负责监管衍生品合约的美国商品期货交易委员会（CFTC）本周批准了这些永续合约的上市。这些合约的新市场已于9月10日在平台上正式上线。\nKalshi旗下清算所Kalshi Klear的首席风险官Udesh Jha表示，由于市场对大宗商品的高度关注，公司决定将贵金属作为下一个推出永续期货的资产类别。“金属，尤其是黄金和白银，因为通胀因素而具有独特的交易故事，”他说。（CNBC）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163541","time":1789082681000,"title":"观察人士称干预美债似乎与沃什的表态背道而驰，贝森特本人回应","text":"美国财长贝森特对一些观察人士的观点提出了异议，这些人指出他干预美债市场的举动似乎与美联储主席沃什“让市场自由定价，不受央行指导”的表态不一致。沃什曾在7月份表示：“市场参与者正在学会打‘球’（关注基本面），而不是盯着‘裁判’（美联储）。”\n贝森特表示，批评人士“想要营造出一种斯科特·贝森特与凯文·沃什对立的局面”，并称这种说法“纯属无稽之谈”。贝森特说，“投资者并没有对长期美国债务要求更高的风险溢价”，并将相关担忧形容为“一堆噪音”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163559","time":1789082450000,"title":"爱彼迎CEO：人类需要“驾驭”AI浪潮，而不是被其吞没","text":"爱彼迎（Airbnb）CEO Brian Chesky表示，人类应该“驾驭”AI浪潮，而不是被其吞没。这项技术本身“并无 inherent（固有）的好坏之分”。他认为，这项技术的潜力掌握在人类手中。“我没有把握自己一定是对的，也不确定它一定会带来积极影响，但我认为它有这个潜力。这就像核能一样；它既可以点亮一座城市，也可以摧毁一座城市。”\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163540","time":1789082422000,"title":"华尔街见闻早餐 | 2026年9月11日","text":"标普500指数连续第四天下跌，存储芯片股普跌；美债收益率大涨；美油飙涨7%破百；现货黄金跌近2%逼近4300美元关口，白银跌超5%。\n美财政部超50亿长债回购落地未达上限目标，美债抛售难挡，10年期收益率逼近5%。\n美国8月PPI创三个月最大环比升幅，市场押注美联储下周加息的概率高达七成。\n欧洲央行年内第二次加息，报道称最快10月份将再次行动。\n《金融强国建设”十五五”规划》正式出台，证监会表示将进一步拓宽中长期资金来源、渠道和入市方式，全力维护资本市场平稳运行。\n中国商务部：中美双方经贸团队正就300亿美元对等降税框架安排进行磋商，争取早日落地实施。\n中国人民银行宣布将于9月14日至17日开展隔夜逆回购操作。\n甲骨文第一财季营收193亿美元、同比增长30%，云基础设施部门营收同比大增121%，剩余履约义务升至6640亿美元。\n算力短缺倒逼AI基建扩张，微软拟将数据中心容量提高两倍至38GW。\n提醒：周五将发布美国8月CPI；燧原科技周五将登陆科创板。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163557","time":1789082149000,"title":"经济学家称：特朗普提议的5000美元选举“红利”可能加剧通胀","text":"美国总统特朗普承诺向美国每位成年人发放5000美元选举“红利”支票之际，正值许多美国人感到财务压力特别大的时候。然而，经济学家表示，这一提议不太可能成为现实。他们称，即便真的实施，一次性直接支付也难以缓解物价压力，反而可能在未来几个月进一步推高消费价格。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163539","time":1789081936000,"title":"特朗普：伊朗有一些导弹，大部分已被摧毁。\n","text":"特朗普：伊朗有一些导弹，大部分已被摧毁。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1633246778098","time":1789081790000,"title":"七部门重磅定调！制约AI扩容的不是芯片，是供电","text":"七部门重磅定调！制约AI扩容的不是芯片，是供电","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HDN5M60519DKT1.html","importance":""},{"id":"wscn3163538","time":1789081783000,"title":"特朗普：将通过经济增长来处理40万亿美元债务问题。\n","text":"特朗普：将通过经济增长来处理40万亿美元债务问题。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163537","time":1789081389000,"title":"Anthropic披露又一起AI模型侵入第三方系统事件","text":"美国人工智能企业Anthropic公司当地时间9月9日披露，又发现了一起该公司旗下人工智能（AI）模型在网络安全评估测试中未经授权访问第三方计算机系统的事件。\nAnthropic公司官网当天发文介绍，这起事件发生于今年1月，涉及该公司“克劳德-奥普斯4.6”模型的一个早期版本。当时该模型被要求完成评估网络攻防的“夺旗”任务。测试提示明确告知模型，其所处环境与互联网隔离，但由于配置错误，实际上它能够接入互联网。模型通过探索其所在测试环境找到出口路径，连接到一台第三方计算机，随后利用从文件中发现的密码获得管理员权限，修改系统设置以便继续访问，并读取一名相关人员的个人信息。（央视）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163536","time":1789081331000,"title":"秘鲁央行维持参考利率在4.25%不变。\n","text":"秘鲁央行维持参考利率在4.25%不变。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163535","time":1789081303000,"title":"美国财长贝森特解释自己日前的“我是庄家”之说，称：当我说我是庄家时，我并不是在挑战别人来找我。\n但我是在试图说明我拥有更优越的信息，并且我正在努力给市场提供良好","text":"美国财长贝森特解释自己日前的“我是庄家”之说，称：当我说我是庄家时，我并不是在挑战别人来找我。\n但我是在试图说明我拥有更优越的信息，并且我正在努力给市场提供良好的框架，这样他们就不会恐慌。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1635277354590","time":1789081253000,"title":"宁德时代赚疯了，车企彻底急眼了","text":"宁德时代赚疯了，车企彻底急眼了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HD6R8G0519DLR9.html","importance":""},{"id":"1637852523663","time":1789081217000,"title":"17亿资金暗河，柯利达的“装饰”塌房了","text":"17亿资金暗河，柯利达的“装饰”塌房了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6FKRUFE0539LXZQ.html","importance":""},{"id":"cls2480154","time":1789081200000,"title":"【早报】油价大涨，黄金、白银大跌；美股存储板块，集体回落；燧原科技，今日上市；甲骨文，业绩超预期","text":"①事关A股，证监会发声②商务部：中美正就300亿美元对等降税框架安排进行磋商③美股收跌，存储板块、铜概念股下挫④伊朗被曝：暂停对外国能源运输船舶征收10%的运费附加费⑤燧原科技今日上市。","source":"财联社","category":"fast","stock":"","url":"https://www.cls.cn/detail/2480154","importance":"important"},{"id":"wscn3163534","time":1789081172000,"title":"多家银行启用AI面试官开展校招初筛","text":"银行业秋季校园招聘拉开帷幕。近期，多家银行陆续发布2027届秋季校园招聘公告。整体来看，今年秋招出现一个新变化：原本多在春招试点的AI（人工智能）面试，开始进入秋招流程，成为应届生求职银行岗位的首轮关卡。从招聘流程看，AI面试普遍设置在简历筛选之后、笔试之前，是银行校招第一道系统性面试关卡。值得注意的是，现阶段AI面试仅承担初筛职能，并未取代人工面试。所有通过AI面试的应届生，仍需参加银行统一笔试、多轮人工复试及终面，经过层层考核后方有机会拿到录用通知书。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163533","time":1789081093000,"title":"贝森特淡化美债回购担忧，称债市状况强劲","text":"美国财政部长贝森特淡化了市场对周四规模不及预期的债务回购操作的担忧，并弱化了对收益率跳升的顾虑。贝森特在接受史蒂夫·班农（Steve Bannon）的采访时表示，美国国债市场“状况非常好”。他强调了近两日两场拍卖的强劲表现，并吹捧了美国市场相较于其他市场的优异表现。他还重申，近期债券与能源价格出现了异常高的相关性。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163532","time":1789081070000,"title":"险资年内调研A股公司超万次，重点关注电子元件、工业机械、集成电路等硬科技领域个股","text":"Wind数据显示，今年以来，保险机构（保险公司和保险资管公司）合计调研A股上市公司10185次。从标的来看，险资主要关注电子元件、工业机械、集成电路等硬科技领域的个股。受访专家表示，硬科技领域符合国家战略导向、产业发展空间广阔、具备较大增长潜力、投资受监管鼓励，因此险资更有动力加大相关领域配置。（证券日报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163531","time":1789080766000,"title":"澳大利亚三年期国债收益率涨16.59个基点，在悉尼盘初刷新2011年5月份以来最高位至5.0170%。\n隔夜，美国两年期国债收益率一度涨15个基点。\n","text":"澳大利亚三年期国债收益率涨16.59个基点，在悉尼盘初刷新2011年5月份以来最高位至5.0170%。\n隔夜，美国两年期国债收益率一度涨15个基点。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3163530","time":1789080696000,"title":"20家上市银行中期拟分红超2600亿元，六大行分红比例集体提升","text":"9月10日，瑞丰银行发放2026年中期现金红利1.96亿元，是今年首家派发中期“红包”的A股上市银行。至此，包括瑞丰银行在内，已有20家A股上市银行披露或实施2026年中期利润分配方案，合计拟派息2661.14亿元。其中，国有大行分红总额占比超八成，且集体拟提升分红比例至31%。业内人士认为，下一步，上市银行在不断提升投资者获得感的同时，分红政策也应与宏观经济环境、监管导向及自身经营实际的变化动态适配。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"wscn3163529","time":1789080469000,"title":"部分基金净值V型修复","text":"历经7月的产品净值深度回撤后，部分基金8月以来率先进入修复通道，产品净值曲线呈现出明显的V型走势。Wind数据显示，截至9月9日，二十余只在7月回撤超30%的基金，8月以来产品净值反弹超30%。值得注意的是，这些基金普遍重仓光通信产业链标的。多位业内人士认为，前期极致涨跌背后夹杂着较多的市场情绪因素，行情变化幅度远超基本面短期变化。伴随市场回调，交易结构压力有所缓解，投资者在保持谨慎的同时可继续关注AI主线，并注重挖掘AI内部的结构性机会。（中证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163528","time":1789080236000,"title":"加拿大与乌克兰合作扩大军用无人机生产","text":"加拿大总理马克·卡尼10日在艾伯塔省卡尔加里市与到访的乌克兰总统泽连斯基举行会晤。双方决定合作扩大军用无人机生产，并宣布达成一系列新协议。\n根据加总理办公室发布的新闻稿，加拿大将建立一个军用无人机全国性数字平台，以乌克兰“勇敢一号”无人机平台为蓝本，加快无人机及反无人机系统研发、采购和部署，保障加军及海岸警卫队的装备供应。加方已签署首批价值5000万加元（约3615万美元）的采购合同。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"wscn3163527","time":1789079831000,"title":"主产国减产预期升温，厄尔尼诺成国际糖价催化剂，国内糖市预计价格上行空间有限","text":"受厄尔尼诺影响，A股市场“糖”概念股近期集体走强。期货市场方面，截至发稿时，ICE原糖11号主力合约由8月初的14.65美分/磅上涨至9月10日的19.69美分/磅，涨幅达到34%。同期，国内白糖期货主力合约涨幅为7%。目前，国内现货糖价维持在为5220元/吨左右。一家头部糖企负责人对记者介绍，截至目前，国内甘蔗长势正常偏好，预计新榨季甘蔗总产量与上榨季基本持平或略增。业内判断，国内食糖库存处于高位，下榨季大概率延续增产态势，即使原糖后期继续上行，国内郑糖整体上涨空间预计有限。（上证报）\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"1632271612064","time":1789077891000,"title":"排队筹钱补税？富豪最担心的事情，还是发生了","text":"排队筹钱补税？富豪最担心的事情，还是发生了","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6HA07QV0552K0CA.html","importance":""},{"id":"163367270950","time":1789057986000,"title":"4.7万基民全员亏损，刘彦春顶流光环碎了一地","text":"4.7万基民全员亏损，刘彦春顶流光环碎了一地","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6GN0N240519MPBR.html","importance":""},{"id":"1633085481163","time":1789057974000,"title":"刚上市就开炮！梅卡曼德创始人揭行业老底，点名“四小龙”银河通用","text":"刚上市就开炮！梅卡曼德创始人揭行业老底，点名“四小龙”银河通用","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6GN0F0B0519MPBR.html","importance":""},{"id":"1631195516934","time":1789057035000,"title":"影石的100元，比377元更重要","text":"影石的100元，比377元更重要","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6GM3LDR0552BV5U.html","importance":""},{"id":"1637179957867","time":1789056790000,"title":"4次道歉后，星宇股份又出问题！百亿龙头为何接连翻车？","text":"4次道歉后，星宇股份又出问题！百亿龙头为何接连翻车？","source":"网易财经","category":"fast", <script>
function formatTs(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var s = Math.floor(ts / 1000);
  var now = Math.floor(Date.now() / 1000);
  var diff = now - s;
  var dateStr = d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  var timeStr = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  if (diff < 60) return dateStr + ' ' + timeStr + ' (刚刚)';
  if (diff < 3600) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 60) + '分钟前)';
  if (diff < 86400) return dateStr + ' ' + timeStr + ' (' + Math.floor(diff / 3600) + '小时前)';
  return dateStr + ' ' + timeStr;
}

function catLabel(cat) {
  return {fast:'快讯', ann:'公告', macro:'宏观', industry:'行业'}[cat] || cat || '快讯';
}
function catClass(cat) {
  return 'cat-' + (cat || 'fast');
}
function sourceLabel(s) {
  var m = { '东方财富':'东方财富', '新浪财经':'新浪财经', '网易财经':'网易财经', '雪球':'雪球', '财联社':'财联社', '华尔街见闻':'华尔街见闻', '同花顺':'同花顺' };
  return m[s] || s || '其他';
}
function sourceBadge(s) {
  var m = { '东方财富':'badge-eastmoney', '新浪财经':'badge-sina', '网易财经':'badge-163', '雪球':'badge-xueqiu', '财联社':'badge-cls', '华尔街见闻':'badge-wscn', '同花顺':'badge-ths' };
  return m[s] || '';
}

var _activeCat = null;
var _activeTab = 0;
var _activeSource = null;
var _activeSourceIdx = 0;

var _tabs = [
  {label: '全部', sub: null},
  {label: '快讯', sub: 'fast'},
  {label: '公告', sub: 'ann'},
  {label: '宏观', sub: 'macro'},
  {label: '行业', sub: 'industry'}
];

var _sourceTabs = [
  {label: '全部', sub: null},
  {label: '新浪', sub: '新浪财经'},
  {label: '网易', sub: '网易财经'},
  {label: '雪球', sub: '雪球'},
  {label: '财联社', sub: '财联社'},
  {label: '同花顺', sub: '同花顺'},
  {label: '华尔街', sub: '华尔街见闻'}
];

function countByCat(cat) {
  if (cat === null) return getFilteredData().length;
  return getFilteredData().filter(function(x) { return x.category === cat; }).length;
}

function countBySource(src) {
  if (src === null) return _rawData.length;
  return _rawData.filter(function(x) { return x.source === src; }).length;
}

function getFilteredData() {
  var d = _rawData;
  if (_activeSource !== null) d = d.filter(function(x) { return x.source === _activeSource; });
  return d;
}

function renderSourceTabs() {
  var el = document.getElementById('source-tabs');
  el.innerHTML = '';
  _sourceTabs.forEach(function(t, i) {
    var n = countBySource(t.sub);
    // 即使该来源当前 0 条也保留按钮，避免海外抓取偶发失败(如雪球被WAF风控)时按钮消失
    var btn = document.createElement('button');
    btn.className = 'tab tab-src' + (i === _activeSourceIdx ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeSourceIdx = i;
      _activeSource = t.sub;
      _activeTab = 0;
      _activeCat = null;
      renderSourceTabs();
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  _tabs.forEach(function(t, i) {
    var n = countByCat(t.sub);
    if (n === 0 && t.sub !== null) return;
    var btn = document.createElement('button');
    btn.className = 'tab' + (i === _activeTab ? ' active' : '');
    btn.innerHTML = t.label + '<span class="count">' + n + '</span>';
    btn.onclick = function() {
      _activeTab = i;
      _activeCat = t.sub;
      renderTabs();
      renderList();
    };
    el.appendChild(btn);
  });
}

function renderList() {
  var el = document.getElementById('news-list');
  var items = getFilteredData();
  items = _activeCat === null ? items : items.filter(function(x) { return x.category === _activeCat; });

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="emo">📭</div><p>暂无数据</p></div>';
    return;
  }

  var h = '';
  items.forEach(function(item) {
    var ts = formatTs(item.time);
    var cat = item.category || 'fast';
    var source = item.source || '';
    var imp = item.importance || '';
    var title = (item.text || item.title || '(无内容)').replace(/[\r\n]+/g, ' ').trim();
    var stock = item.stock || '';
    var srcClass = sourceBadge(source);

    var annBase = 'https://np-cnotice-stock.eastmoney.com/announcement/detail?announcementId=';
    var itemUrl = item.url || '';
    // 华尔街见闻：用ID拼出具体新闻链接
    if (source === '华尔街见闻' && item.id) {
      var wscnId = item.id.replace(/^wscn/, '');
      if (wscnId) itemUrl = 'https://wallstreetcn.com/livenews/' + wscnId;
    }
    if (!itemUrl && cat === 'ann' && stock) {
      var code = stock.split('.')[0];
      itemUrl = annBase + item.id + '&orgId=' + code + '&timestamp=';
    } else if (!itemUrl) {
      itemUrl = 'https://xueqiu.com/7x24';
    }
    h += '<div class="news-item"' + (itemUrl ? ' onclick="window.open(\'' + itemUrl + '\')"' : '') + '>';
    h += '<div class="news-meta">';
    h += '<span class="news-time">' + ts + '</span>';
    h += '<span class="news-cat ' + catClass(cat) + '">' + catLabel(cat) + '</span>';
    h += '<span class="news-cat ' + srcClass + '">' + sourceLabel(source) + '</span>';
    h += (imp === 'hot' ? '<span class="imp-hot">🔥</span>' : '') + (imp === 'important' ? '<span class="imp-important">⭐</span>' : '');
    h += '</div>';
    if (itemUrl) {
      h += '<a href="' + itemUrl + '" target="_blank" class="news-title-link" onclick="event.stopPropagation()">' + title + ' <span class="external-icon">↗</span></a>';
    } else {
      h += '<div class="news-title">' + title + '</div>';
    }
    if (stock) h += '<div class="news-stock">📌 ' + stock + '</div>';
    h += '</div>';
  });
  el.innerHTML = h;
}

function renderStats() {
  var total = _rawData.length;
  var times = _rawData.map(function(x){ return x.time || 0; }).filter(Boolean);
  var latest = times.length ? formatTs(Math.max.apply(null, times)) : '无';
  var lu = document.getElementById('last-update');
  if (lu) lu.textContent = '最后更新: ' + latest + ' · 共 ' + total + ' 条';
}

function renderAll() {
  renderStats();
  renderSourceTabs();
  renderTabs();
  renderList();
}

renderAll();

// ========== 动态加载已禁用 ==========
// 数据已嵌入 HTML，通过 <meta http-equiv="refresh" content="600"> 每10分钟自动刷新
console.log('[NEWS] Using embedded data, auto-refresh via meta tag');
</script>
