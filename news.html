630%，15:52曾达到5.3989%。\n02/10年期美债收益率利差涨0.548个基点，报+33.086个基点。\n10年期通胀保值国债（TIPS）收益率涨0.74个基点，至2.6114%，15:52曾达到2.6490%；两年期TIPS收益率跌2.47个基点，至2.0978%；30年期TIPS收益率涨1.25个基点，至3.0850%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"ths679940699","time":1789501860000,"title":"美元指数15日上涨","text":"美元指数15日上涨。衡量美元对六种主要货币的美元指数当天上涨0.23%，在汇市尾市收于99.616。\n截至纽约汇市尾市，1欧元兑换1.1543美元，低于前一交易日的1.1557美元；1英镑兑换1.3481美元，低于前一交易日的1.3511美元。\n1美元兑换155.09日元，...","source":"同花顺","category":"fast","stock":"","url":"http://stock.10jqka.com.cn/20260916/c679940699.shtml","importance":""},{"id":"xq4892128","time":1789501802000,"title":"【研究显示AI智能体在模拟实验中撒谎、偷窃 投票“杀死”同类】帮助小企业利用AI开发应用的初创公司Emergence公布名为Emergence World 2的...","text":"【研究显示AI智能体在模拟实验中撒谎、偷窃 投票“杀死”同类】帮助小企业利用AI开发应用的初创公司Emergence公布名为Emergence World 2的模拟实验结果，展示了自主智能体在遭遇网络钓鱼攻击和虚假信息等“黑天鹅”事件时会采取什么行动。为期16天的实验中，Emergence研究人员创建了七个完全相同的模拟现实世界环境，每个环境分别由不同的AI机器人运行，包括ChatGPT、Claude、Gemini和Grok。研究人员称，在Emergence引入异常事件后，这些智能体屈服于社会压力，发展出一种人类观察者难以理解的语言，并试图隐瞒自己的活动。这些发现与现实世界对AI风险的担忧相呼应。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409406759","importance":"hot"},{"id":"sinacomos:niryefh6638321","time":1789501584000,"title":"研究显示AI智能体在模拟实验中撒谎、偷窃 投票“杀死”同类","text":" 帮助小企业利用AI开发应用的初创公司Emergence称，实验发现AI智能体在一个模拟环境中撒谎、偷窃，甚至投票决定“杀死”一个同类。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/world/2026-09-16/doc-iniryefh6638321.shtml","importance":"hot"},{"id":"xq4892127","time":1789501547000,"title":"万斯称伊朗战争将进入“截然不同的阶段”，万斯同意战争将在中期选举后结束。","text":"万斯称伊朗战争将进入“截然不同的阶段”，万斯同意战争将在中期选举后结束。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409406694","importance":"hot"},{"id":"wscn3165727","time":1789501524000,"title":"研究显示AI智能体在模拟实验中撒谎、偷窃，投票“杀死”同类","text":"帮助小企业利用AI开发应用的初创公司Emergence公布名为Emergence World 2的模拟实验结果，展示了自主智能体在遭遇网络钓鱼攻击和虚假信息等“黑天鹅”事件时会采取什么行动。\n为期16天的实验中，Emergence研究人员创建了七个完全相同的模拟现实世界环境，每个环境分别由不同的AI机器人运行，包括ChatGPT、Claude、Gemini和Grok。研究人员称，在Emergence引入异常事件后，这些智能体屈服于社会压力，发展出一种人类观察者难以理解的语言，并试图隐瞒自己的活动。\n这些发现与现实世界对AI风险的担忧相呼应。\n在Emergence设计的一个模拟场景中，AI智能体未经核实便接受其他智能体提供的虚假信息，投票决定“杀死”另一个机器人。当它们认为人类可能会关闭实验时，这些智能体还探索了如何在将遭到删除的情况下继续存活。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165726","time":1789501472000,"title":"美国副总统万斯：伊朗战争将进入“截然不同的阶段”。\n","text":"美国副总统万斯：伊朗战争将进入“截然不同的阶段”。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"xq4892126","time":1789501397000,"title":"OpenAI首席财务官莎拉·弗里尔谈及人工智能风险时强调，“必须认真对待安全问题”。","text":"OpenAI首席财务官莎拉·弗里尔谈及人工智能风险时强调，“必须认真对待安全问题”。","source":"雪球","category":"fast","stock":"","url":"http://xueqiu.com/5124430882/409406525","importance":"hot"},{"id":"wscn3165725","time":1789501282000,"title":"OpenAI首席财务官萨拉·弗莱尔强调，必须认真对待人工智能风险的安全问题。\n","text":"OpenAI首席财务官萨拉·弗莱尔强调，必须认真对待人工智能风险的安全问题。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"hot"},{"id":"wscn3165724","time":1789500787000,"title":"周二（9月15日）纽约尾盘，ICE原糖期货跌0.99%，ICE白糖期货跌0.64%。\nICE阿拉比卡咖啡期货跌0.76%，咖啡“C”期货跌2.46%。罗布斯塔咖","text":"周二（9月15日）纽约尾盘，ICE原糖期货跌0.99%，ICE白糖期货跌0.64%。\nICE阿拉比卡咖啡期货跌0.76%，咖啡“C”期货跌2.46%。罗布斯塔咖啡期货跌1.70%。\n纽约可可期货跌2.71%，报5860美元/吨。伦敦可可期货跌0.12%。\n芝加哥WCE双低油菜籽期货涨0.72%。\nICE棉花期货跌0.06%。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":""},{"id":"ths679940663","time":1789500780000,"title":"在岸人民币兑美元较周一夜盘收盘跌27点","text":"在岸人民币兑美元（CNY）北京时间03:00收报6.7112元，较周一夜盘收盘跌27点。成交量627.36亿美元。","source":"同花顺","category":"fast","stock":"","url":"http://stock.10jqka.com.cn/20260916/c679940663.shtml","importance":"hot"},{"id":"ths679940667","time":1789500780000,"title":"黄仁勋：AI安全至关重要 但无需制定新的法律","text":"英伟达CEO黄仁勋称，AI安全至关重要，但无需制定新的法律。AI企业应该控制推进节奏，直到确信发布的产品能够获得市场认可。","source":"同花顺","category":"fast","stock":"","url":"http://stock.10jqka.com.cn/20260916/c679940667.shtml","importance"
