报告》。《规划》提到，要加大招商引资力度，大力引导产业发展。采取促进产业和投资的优惠政策引导产业发展。加快引进行业龙头和不同企业在香港设立管理离岸贸易及供应链的区域或国际总部和财资中心。面向中东、东盟、欧美长线资金，进一步壮大香港的总部经济及推广香港家族办公室。聚焦人工智能、数字经济、生命健康、新型工业化、绿色发展等创科领域重点产业，制订目标企业清单与年度招商行动计划。完善跨部门协调与项目落地机制，为企业提供个案服务，强化重点招商项目在土地、规划、通关、人才、监管等方面的一站式协调服务。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1636179836775","time":1789533254000,"title":"信诺维科创板上市：研发与商业化双轮驱动，中国创新药出海路径渐明","text":"信诺维科创板上市：研发与商业化双轮驱动，中国创新药出海路径渐明","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6US8QI60519WTTG.html","importance":""},{"id":"sinacomos:niryvay6698911","time":1789533151000,"title":"宁德时代半日跌3.8%，易方达持有3958万股浮亏4.7亿元，华夏基金持2115万股浮亏2.5亿元（名单）","text":"9月16日，宁德时代股价继续下跌，截至午盘跌3.8%，报304.31元/股，成交162亿元，换手率1.25%，总市值14354亿元。 Wind数据显示，公募基金2026二季度3102只产品合计持3...","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/stock/observe/2026-09-16/doc-iniryvay6698911.shtml","importance":""},{"id":"sinacomos:niryvce3076242","time":1789533029000,"title":"逆势涨近8%站稳4000亿港元 联想集团CFO郑孝明：AI基建持续放量正成为新增长支撑","text":" 9月16日，港股科技板块整体表现偏弱，恒生指数走低。相比之下，截至11时48分，联想集团逆势上涨近8%，市值继续稳居4000亿港元上方。","source":"新浪财经","category":"fast","stock":"","url":"https://finance.sina.com.cn/hy/hyjz/2026-09-16/doc-iniryvce3076242.shtml","importance":""},{"id":"wscn3165967","time":1789532896000,"title":"早间要闻汇总","text":"科创50指数半日涨4.5%，创业板指涨超2%，算力硬件、半导体板块集体走强。\n恒指半日涨0.12%，恒生科技指数涨0.87%，智谱大涨逾8%，华虹宏力、联想涨逾7%。\n香港发布首个五年规划：聚焦人工智能产业，强化全球最大离岸人民币枢纽功能。\n中国央行行长潘功胜：不能简单以信贷增速衡量金融支持实体经济的力度。\n中国平陆运河正式建成通航，可通航5000吨级船舶。\n","source":"华尔街见闻","category":"fast","stock":"","url":"https://wallstreetcn.com/live/global","importance":"important"},{"id":"1637902392884","time":1789532884000,"title":"梁文锋找了个“首席翻译官”","text":"梁文锋找了个“首席翻译官”","source":"网易财经","category":"fast","stock":"","url":"https://www.163.com/dy/article/L6SNG2C505399DAP.html","importance":""},{"id":"wscn3165966","time":1789532882000,"title":"提醒：日内请重点关注（以下均为北京时间）","text":"① 14:00 英国8月
