name: 🌅 早盘选股 (08:00-10:30)

on:
  schedule:
    # 北京时间 08:00 = UTC 00:00（GitHub Actions 用 UTC）
    - cron: '7 0 * * 1-5'   # 周一-周五 08:00
    - cron: '11 2 * * 1-5'   # 周一-周五 10:00
  workflow_dispatch:         # 手动触发
  push:
    paths:
      - '.github/workflows/01_morning_picks.yml'

concurrency:
  group: morning-picks
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check_trading_day:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.td.outputs.open }}
    steps:
      - name: 🚦 交易日检查（跳过周末与法定节假日）
        id: td
        run: |
          pip install -q chinese-calendar || echo "日历库安装失败，按工作日规则处理"
          python - <<'PY'
          import datetime, os
          today = datetime.date.today()
          try:
              from chinese_calendar import is_holiday
              sh = bool(is_holiday(today))
          except Exception as e:
              sh = False
              print("日历库不可用，按工作日处理:", e)
          # A股交易日 = 周一~周五 且 非法定节假日（调休周末股市仍休市）
          open_today = (today.weekday() < 5) and (not sh)
          print("今天", today, "A股交易日:", open_today)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("open=%s\n" % ("true" if open_today else "false"))
          PY

  morning-picks:
    needs: check_trading_day
    if: needs.check_trading_day.outputs.open == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
      MX_APIKEY: ${{ secrets.MX_APIKEY }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          # 2026-10-02: 补 akshare（growth_rank_step1.py 与 gaoxin_money_flow_akshare.py 依赖，
          # 版本与 requirements.txt 对齐；此前缺失导致 01 里 Step1 每天 sys.exit(1) 静默失败）
          pip install requests pandas numpy chinese-calendar lxml beautifulsoup4 openai akshare==1.18.94

      - name: 🌅 高欣-资金净流入 + 季度环比
        # 2026-10-02 审计：gaoxin_money_flow_akshare.py 从未提交到仓库（本地亦无），
        # 原写法只报 No such file 且被 continue-on-error 吞掉 → 「高欣资金净流入」卡片自 07-13 停更。
        # 改为存在才跑：脚本补进仓库后本步骤自动恢复。
        run: |
          if [ -f gaoxin_money_flow_akshare.py ]; then
            python gaoxin_money_flow_akshare.py
          else
            echo ">> skip gaoxin_money_flow_akshare.py（尚未提交到仓库）"
          fi
        continue-on-error: true

      - name: 🏴‍☠️ 杰克船长信号
        run: python jack_captain.py
        continue-on-error: true

      - name: 💪 大力水手 Step1 + Step2 + 训练
        run: |
          python popeye_training.py
          python growth_rank_step1.py
          python growth_rank_step2.py
        continue-on-error: true

      - name: 🚀 慢涨强势股 (10:00)
        run: python hot_chase_picks.py
        continue-on-error: true

      - name: 📊 RPS 早盘快照
        run: python RPS_thermal_dingtalk.py
        continue-on-error: true

      - name: 🔥 慢热板块刷新(真实榜)
        run: python refresh_slowrise.py
        continue-on-error: true

      - name: 🎣 船长钓鱼战法
        run: python captain_fishing.py
        continue-on-error: true

      - name: 📤 推送到 GitHub
        # ⚠️ 加固版：原用 `git pull --rebase origin main` 处理与 sync.yml（每15分钟）的并发提交。
        # 实测 rebase 会在多个 JSON 产物上冲突 → detached HEAD → push 失败被静默吞掉 → 数据丢失。
        # 改成 `git fetch + git reset --mixed FETCH_HEAD`：HEAD 平移到最新 origin/main，不做三方合并，
        # 永不冲突，且一定能快进推送。重试 5 次 + 随机抖动 3~8 秒避开并发踩踏。
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          BASE=$(git rev-parse HEAD)
          # BUGFIX(2026-10-03): 只 stage 本次 job 自己改动/新增的文件（相对 checkout 基线 BASE）。
          # 其余差异 = job 启动之后他人推到 main 的更新，若用 `git add -A` 会被整体回滚
          # （实测 2026-10-02 把 5 秒前手动推的 dingtalk_style.py 修复冲掉，线上重新出现 SyntaxError）。
          stage_job_files() {
            git diff --name-only "$BASE" | while read -r f; do [ -e "$f" ] && git add -- "$f"; done
            git ls-files --others --exclude-standard | while read -r f; do git add -- "$f"; done
            git diff --name-only --diff-filter=D "$BASE" | while read -r f; do git rm --cached --ignore-unmatch -- "$f" >/dev/null; done
          }
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1
            git fetch origin main || { sleep $((RANDOM % 6 + 3)); continue; }
            git reset --mixed FETCH_HEAD          # index 对齐最新 main，工作区保留本次产物
            stage_job_files
            if git diff --cached --quiet; then echo "与远端一致，无需推送"; exit 0; fi
            git commit -m "🌅 早盘选股数据更新 $(date '+%Y-%m-%d %H:%M')"
            if git push; then echo "推送成功 (第 $i 次)"; exit 0; fi
            sleep $((RANDOM % 6 + 3))            # 随机抖动，避开并发推送的踩踏窗口
          done
          echo "::error::早盘选股推送失败（重试 5 次）"
          exit 1
