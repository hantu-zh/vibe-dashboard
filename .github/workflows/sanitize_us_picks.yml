name: sanitize us_picks

on:/n  schedule:/n    - cron: "*/10 * * * *"
  workflow_dispatch:/n/npermissions:/n  contents: write

jobs:/n  sanitize:/n    runs-on: ubuntu-latest
    steps:/n      - name: Checkout
        uses: actions/checkout@v4
      - name: Sanitize us_picks.json (defend against stale-snapshot NaN regen)
        env:/n          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sanitize_us_picks.py
