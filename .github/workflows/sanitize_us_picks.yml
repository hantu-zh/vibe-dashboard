name: sanitize us_picks

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanitize-us-picks
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sanitize us_picks.json (defend against stale-snapshot NaN regen)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sanitize_us_picks.py
