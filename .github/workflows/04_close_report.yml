            git fetch origin main || { sleep $((RANDOM % 6 + 4 + i * 2)); continue; }
            git reset --mixed FETCH_HEAD          # index 对齐最新 main，工作区保留本次产物
            stage_job_files
            if git diff --cached --quiet; then echo "无变化，跳过推送"; exit 0; fi
            git commit -m "📖 市场深度解读 $(date '+%Y-%m-%d %H:%M')"
            if git push; then echo "推送成功 (第 $i 次)"; ok=1; break; fi
            sleep $((RANDOM % 6 + 4 + i * 2))
          done
          if [ $ok -ne 1 ]; then echo "::error::市场深度解读推送失败（重试 5 次）"; exit 1; fi

