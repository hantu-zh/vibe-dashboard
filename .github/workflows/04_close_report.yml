name: 🌃 收盘报告 + AI 复盘 (15:30-16:30)

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30
    - cron: '33 7 * * 1-5'
    # 北京时间 15:45 = UTC 07:45
    - cron: '53 7 * * 1-5'
    # 北京时间 16:00 = UTC 08:00
    - cron: '13 8 * * 1-5'
    # 北京时间 16:30 = UTC 08:30 (AI 复盘)
    - cron: '43 8 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/04_close_report.yml'

concurrency:
  group: close-report
  cancel-in-progress: false   # 报告任务不取消

permissions:
  contents: write

jobs:
  check_trading_day:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.td.outputs.open }}
    steps:
      - name: 🚦 交易日检查（跳过周末与法定节假日）
        id: td
        run: |
          pip install -q chinese-calendar || echo "日历库安装失败，按工作日规则处理"
          python - <<'PY'
          import datetime, os
          today = datetime.date.today()
          try:
              from chinese_calendar import is_holiday
              sh = bool(is_holiday(today))
          except Exception as e:
              sh = False
              print("日历库不可用，按工作日处理:", e)
          # A股交易日 = 周一~周五 且 非法定节假日（调休周末股市仍休市）
          open_today = (today.weekday() < 5) and (not sh)
          print("今天", today, "A股交易日:", open_today)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("open=%s\n" % ("true" if open_today else "false"))
          PY

  rps-snapshot:
    name: 📊 RPS 收盘快照
    needs: check_trading_day
    if: ${{ needs.check_trading_day.outputs.open == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4
      - name: RPS 收盘
        run: python RPS_thermal_dingtalk.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          ok=0
          BASE=$(git rev-parse HEAD)
          # BUGFIX(2026-10-03): 只 stage 本次 job 自己改动/新增的文件（相对 checkout 基线 BASE）。
          # 其余差异 = job 启动之后他人推到 main 的更新，若用 `git add -A` 会被整体回滚
          # （实测 2026-10-02 把 5 秒前手动推的 dingtalk_style.py 修复冲掉，线上重新出现 SyntaxError）。
          # BUGFIX(2026-10-09): 原 `git diff | while read ... git add` 会在管道内并发访问 index，
          # 触发 .git/index.lock 已存在错误。改用 mapfile 先收集文件名再处理，避免并发 git 进程。
          stage_job_files() {
            local -a files
            mapfile -t files < <(git diff --name-only "$BASE")
            for f in "${files[@]}"; do [ -e "$f" ] && git add -- "$f"; done
            mapfile -t files < <(git ls-files --others --exclude-standard)
            for f in "${files[@]}"; do git add -- "$f"; done
            mapfile -t files < <(git diff --name-only --diff-filter=D "$BASE")
            for f in "${files[@]}"; do git rm --cached --ignore-unmatch -- "$f" >/dev/null; done
          }
          for i in 1 2 3 4 5; do
            [ -f .git/index.lock ] && rm -f .git/index.lock
            git fetch origin main || { sleep $((RANDOM % 6 + 3)); continue; }
            git reset --mixed FETCH_HEAD          # index 对齐最新 main，工作区保留本次产物
            stage_job_files
            if git diff --cached --quiet; then echo "无变化，跳过推送"; exit 0; fi
            git commit -m "📊 RPS 收盘 $(date '+%Y-%m-%d %H:%M')"
            if git push; then echo "推送成功 (第 $i 次)"; ok=1; break; fi
            sleep $((RANDOM % 6 + 3))
          done
          if [ $ok -ne 1 ]; then echo "::error::RPS 收盘推送失败（重试 5 次）"; exit 1; fi

