name: 🌃 收盘报告 + AI 复盘 (15:30-16:30)

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30
    - cron: '30 7 * * 1-5'
    # 北京时间 15:45 = UTC 07:45
    - cron: '45 7 * * 1-5'
    # 北京时间 16:00 = UTC 08:00
    - cron: '0 8 * * 1-5'
    # 北京时间 16:30 = UTC 08:30 (AI 复盘)
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/04_close_report.yml'

concurrency:
  group: close-report
  cancel-in-progress: false   # 报告任务不取消

permissions:
  contents: write

jobs:
  rps-snapshot:
    name: 📊 RPS 收盘快照
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4
      - name: RPS 收盘
        run: python RPS_thermal_dingtalk.py
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "📊 RPS 收盘 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

  strong-pick:
    name: 💎 强势股精选
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4
      - name: 强势股精选
        run: python strong_stock_pick_v3.py
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "💎 强势股精选 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

  eight-dimension:
    name: 🎯 八大维度收盘研报
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4
      - name: 八大维度研报
        run: python eight_dimension_report.py
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "🎯 八大维度研报 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

  slowrise:
    name: 🌡️ 慢热板块 Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4
      - name: 慢热板块更新(刷新真实榜+固定宇宙)
        run: python refresh_slowrise.py
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "🌡️ 慢热板块 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

  market-depth:
    name: 📖 市场深度解读
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4
      - name: 市场深度解读
        run: python market_depth_report.py
        env:
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "📖 市场深度解读 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi

  ai-analysis:
    name: 🤖 AI 复盘（DeepSeek）
    needs: [rps-snapshot, strong-pick, eight-dimension, slowrise]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4 openai
      - name: 生成 AI 复盘报告
        run: python ai_report_gen.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      - name: 生成 AI 复盘 HTML
        run: python ai_analysis.py --serve
      - name: 推送
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "🤖 AI 复盘 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
