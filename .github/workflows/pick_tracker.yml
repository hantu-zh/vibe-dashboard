name: pick_tracker daily

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: echo "pick_tracker 仅依赖 Python 标准库，无需额外安装"
      - name: Run pick_tracker
        run: python pick_tracker.py
      - name: Commit pick_tracker.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pick_tracker.json
          git commit -m "auto: refresh pick_tracker.json" || echo "no change"
          git push
