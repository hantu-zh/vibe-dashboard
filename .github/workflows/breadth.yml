# ============================================================================
# 市场情绪 · 赚钱效应 —— 通道 2 每日兜底快照 / 历史  【仓库内版本 · 推送后生效】
#
# 文件位置：.github/workflows/breadth.yml（仓库根目录相对）
#
# 时间口径（最易错，三条都要保留）：
#   1) GitHub Actions 的 cron 恒按 UTC 解释，与 env.TZ 无关。
#      '25 8 * * 1-5' = UTC 08:25 周一~周五 = Asia/Shanghai 16:25（收盘后错峰）。
#   2) env.TZ: Asia/Shanghai 只作用于容器内 datetime / date.today()，
#      trading_day.py 与 gen_breadth.py 都依赖它。缺了会错一天，而 T-1 实测：
#      东财三池传「未来日 date」会静默回落「当日」数据，不报错、只是拿错数。
#      方案 §4.6 的 ZoneInfo("Asia/Shanghai") 硬约束在此落地。
#   3) cron 的 1-5 只排周末，法定节假日由 trading_day.py 闸门再排一次；
#      非交易日直接跳过，不写空快照、不覆盖上一交易日、不把 0 家涨停记 0 分。
#   4) 2026-11-19 补强：主跑之外加同日兜底（2026-11-20 起主跑 16:25 / 兜底 21:40；Actions cron 常延迟
#      数小时，11-18 那次拖到次日 00:41 才跑，被跨午夜守卫正确拦下）。
#      workflow_dispatch 可传 trading_day 显式回填历史交易日；历史回填时
#      clist 无日期接口 → 该源显式失败，绝不用「当日实时涨跌家数」冒充历史。
#      常规运行若当日已有有效 close 快照则跳过，不重复覆盖。
#   5) 2026-11-20 方案 A（凌晨自动回填）：schedule 实测连续 5 天延迟 8~9h
#      （00:41/01:00/00:44/04:02），两个窗口全部跨午夜、全被守卫拦下 →
#      11-19 缺档。00:00-09:15（竞价前）落地时行情仍是上一交易日冻结收盘，
#      此时不再丢弃，而是自动按上一交易日入库：status=backfill、4 源全取
#      （三池显式传 date，clist 拿冻结收盘 = 真实收盘涨跌家数，绝不造数）。
#      同日已有有效快照则 success 跳过（兜底 run 不再红叉）；09:15 后的
#      延迟 run（盘中数据）仍被守卫拒绝，原守卫分支一字未动。
#
# 落地前 3 项核实结论（2026-11-10 20:0x，git 层只读核验，远端 main=77816c46）：
#   a) 已解决：gen_breadth.py 的 T0 改为 HERE；前端 breadth.html 两个资源 URL
#      同样改为仓库内相对路径。配置与纯函数随本次提交一起入仓。
#   b) 部分解决：远端 secrets_conf.py 存在（纯 os.environ，无硬编码密钥）；
#      sync_func.py 顶层 import paths / secrets_conf / certifi。本工作流已
#      `pip install certifi chinese_calendar` 并做显式 import 检查，失败即 exit 1。
#      首次真实运行仍需观察 paths.py 是否在 Actions 可导入（见 DEPLOY_MANIFEST）。
#   c) 已解决：secret 名 = secrets.GITHUB_TOKEN（与 sync.yml 一致）；
#      sync_func._gh_token() 优先读环境变量 GITHUB_TOKEN，缺失才回退 .github_token。
#
# ============================================================================

name: breadth-daily

on:
  schedule:
    - cron: '25 8 * * 1-5'     # 上海 16:25 主跑（收盘后错峰，2026-11-20 直连）
    - cron: '40 13 * * 1-5'     # 上海 21:40 同日兜底（主跑延迟/失败时补上）
  workflow_dispatch:            # 手动补跑 / 显式交易日回填
    inputs:
      trading_day:
        description: '回填目标交易日 YYYY-MM-DD；留空 = 按上海今日常规跑'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: breadth-daily
  cancel-in-progress: false     # 不与 sync.yml 抢提交；同组排队而非互杀

env:
  TZ: Asia/Shanghai

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 生成器与校验器共用同一个「目标交易日」入口；schedule 时为空字符串。
      BREADTH_TRADING_DAY: ${{ inputs.trading_day }}
    steps:
      - name: 检出 main（浅克隆，不用于整树提交）
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 + 验证时区与交易日历真实可用（不静默降级）
        shell: bash
        run: |
          python -m pip install --quiet certifi chinese_calendar
          python - <<'PY'
          from zoneinfo import ZoneInfo
          from datetime import datetime
          import chinese_calendar
          print('TZ check   :', datetime.now(ZoneInfo('Asia/Shanghai')).isoformat())
          print('calendar   : chinese_calendar import OK')
          try:
              print('calendar DB:', chinese_calendar.is_workday(datetime.now(ZoneInfo('Asia/Shanghai')).date()))
          except Exception as e:
              # chinese_calendar 数据有年份上限；超限时 trading_day.py 会静默退化为周末判断
              print('::warning::chinese_calendar 数据不可用，将退化为仅排周末:', e)
          PY

      - name: 目标交易日决策（显式回填 / 凌晨自动回填 / 常规闸门）
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo('Asia/Shanghai'))
          hm = now.hour * 60 + now.minute
          explicit = os.environ.get('BREADTH_TRADING_DAY', '').strip()
          out, envf = os.environ['GITHUB_OUTPUT'], os.environ['GITHUB_ENV']

          def prev_trading_day(d):
              # 与 trading_day.py 同口径：chinese_calendar 优先，超限退化为仅排周末
              cur = d - timedelta(days=1)
              for _ in range(30):
                  try:
                      from chinese_calendar import is_workday
                      ok = is_workday(cur)
                  except Exception:
                      ok = cur.weekday() < 5
                  if ok:
                      return cur
                  cur -= timedelta(days=1)
              raise RuntimeError('30 天内找不到上一交易日')

          if explicit:
              with open(envf, 'a') as f:
                  f.write('BREADTH_MODE=explicit\n')
              with open(out, 'a') as f:
                  f.write('run=true\nmode=explicit\n')
              print('mode=explicit：显式交易日回填 %s，合法性由 gen_breadth.py 校验' % explicit)
          elif hm < 9 * 60 + 15:
              # schedule 任何 cron 都不在 00:00-09:15 触发，落在此窗口的必是延迟
              # run；此刻（竞价前）行情 = 上一交易日冻结收盘 → 自动按上一交易
              # 日入库（方案 A）。同时修复了延迟落到周末凌晨时被交易日闸门
              # 整体跳过的问题：目标日按日历反推，必为交易日。
              pt = prev_trading_day(now.date())
              with open(envf, 'a') as f:
                  f.write('BREADTH_TARGET_DAY=%s\n' % pt.isoformat())
                  f.write('BREADTH_PREDAWN=1\n')
                  f.write('BREADTH_MODE=predawn\n')
              with open(out, 'a') as f:
                  f.write('run=true\nmode=predawn\ntarget=%s\n' % pt.isoformat())
              print('mode=predawn：写入时刻 %02d:%02d 在竞价前，自动回填上一交易日 %s'
                    % (now.hour, now.minute, pt.isoformat()))
          else:
              r = subprocess.run([sys.executable, 'trading_day.py'])
              if r.returncode == 0:
                  with open(envf, 'a') as f:
                      f.write('BREADTH_MODE=normal\n')
                  with open(out, 'a') as f:
                      f.write('run=true\nmode=normal\n')
                  print('mode=normal：交易日，按上海今日继续生成')
              else:
                  with open(out, 'a') as f:
                      f.write('run=false\nmode=skip\n')
                  print('⏭ 非交易日（周末/节假日）跳过：不写空快照、不覆盖上一交易日')
          PY

      - name: 若目标交易日已有有效快照则跳过（避免同日重复覆盖 / 兜底 run 红叉）
        id: dup
        if: steps.gate.outputs.run == 'true' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          mode = os.environ.get('BREADTH_MODE', 'normal')
          snap = json.load(open('breadth_snapshot.json', encoding='utf-8'))
          if mode == 'predawn':
              # 目标=上一交易日：快照已是该日的有效数据（常规 close 或凌晨回填）
              # 即跳过；displayable=false 的降级回填不跳过，允许凌晨全量覆盖升级
              target = os.environ.get('BREADTH_TARGET_DAY', '')
              valid = (snap.get('trading_day') == target
                       and snap.get('displayable') is True)
              print('duplicate check(predawn): target=%s snap_day=%s valid=%s' % (
                  target, snap.get('trading_day'), valid))
          else:
              day = datetime.now(ZoneInfo('Asia/Shanghai')).strftime('%Y-%m-%d')
              valid = (snap.get('trading_day') == day
                       and snap.get('status') in ('close', 'closing')
                       and snap.get('displayable') is True
                       and not snap.get('backfill'))
              print('duplicate check(normal): day=%s status=%s valid=%s' % (
                  day, snap.get('status'), valid))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(('skip=true' if valid else 'skip=false') + '\n')
          PY

      - name: 生成 breadth_snapshot.json / breadth_history.json
        if: steps.gate.outputs.run == 'true' && steps.dup.outputs.skip != 'true'
        run: python gen_breadth.py

      - name: 产物校验（版本一致 / 目标交易日 / 同日唯一 / 上限 / 源状态 / 跨午夜双保险 + 凌晨回填分支）
        if: steps.gate.outputs.run == 'true' && steps.dup.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          snap = json.load(open('breadth_snapshot.json', encoding='utf-8'))
          hist = json.load(open('breadth_history.json', encoding='utf-8'))
          cfg  = json.load(open('breadth_factors.json', encoding='utf-8'))
          now  = datetime.now(ZoneInfo('Asia/Shanghai'))
          day  = now.strftime('%Y-%m-%d')
          hhmm = now.strftime('%H:%M')
          mode   = os.environ.get('BREADTH_MODE', 'normal')
          target = (os.environ.get('BREADTH_TRADING_DAY', '').strip()
                    or os.environ.get('BREADTH_TARGET_DAY', '').strip() or day)
          historical = mode == 'explicit' and target != day   # 显式回填过去交易日
          errs = []
          if snap.get('trading_day') != target:
              errs.append('trading_day %r != 目标交易日 %r（上海今日 %r）'
                          % (snap.get('trading_day'), target, day))
          # ── 跨午夜守卫（2026-11-18 事故修复，2026-11-19 扩展到回填分支）──
          # 常规运行（含 schedule 与传今日的 dispatch）：只接受 close/closing 且写入 ≥15:00。
          # 显式回填历史日：status 必须是 backfill，且 clist 必须显式失败——
          # clist 无 date 参数，任何 ok=true 都意味着用「当日实时涨跌家数」冒充历史。
          # 凌晨自动回填（2026-11-20 方案 A）：00:00-09:15 竞价前落地时行情 =
          # 上一交易日冻结收盘，须同时满足 status=backfill / trading_day 早于
          # as_of 日期 / as_of 在 09:15 前 / clist ok=true（数据真实拉到）。
          if mode == 'predawn':
              if snap.get('status') != 'backfill' or not snap.get('backfill'):
                  errs.append('predawn 快照 status=%r / backfill=%r 不合法：'
                              '凌晨自动回填必须为 backfill=true'
                              % (snap.get('status'), snap.get('backfill')))
              as_of = datetime.fromisoformat(snap.get('as_of'))
              if as_of.strftime('%H:%M') >= '09:15':
                  errs.append('predawn as_of=%s 不在竞价前窗口（须 < 09:15）'
                              % as_of.strftime('%H:%M'))
              if snap.get('trading_day', '') >= as_of.strftime('%Y-%m-%d'):
                  errs.append('predawn trading_day %r 未早于 as_of 日期（非跨午夜语义）'
                              % snap.get('trading_day'))
              srcmap = {s.get('name'): s for s in (snap.get('sources') or [])}
              if not (srcmap.get('clist') or {}).get('ok'):
                  errs.append('predawn clist ok=false：凌晨快照应拿到冻结收盘涨跌家数，'
                              '失败则说明数据不可信，拒绝入库')
              if hhmm >= '09:15':
                  errs.append('predawn 校验时刻 %s 已过竞价窗口，拒绝入库' % hhmm)
          elif historical:
              if snap.get('status') != 'backfill' or not snap.get('backfill'):
                  errs.append('回填快照 status=%r / backfill=%r 不合法：'
                              '显式历史回填必须为 backfill=true'
                              % (snap.get('status'), snap.get('backfill')))
              srcmap = {s.get('name'): s for s in (snap.get('sources') or [])}
              if (srcmap.get('clist') or {}).get('ok'):
                  errs.append('历史回填的 clist ok=true：clist 无历史日期接口，'
                              '拒绝使用当日实时涨跌家数')
          else:
              if snap.get('status') not in ('close', 'closing'):
                  errs.append('快照 status=%r 非 close/closing：疑似 Actions 延迟跨午夜，'
                              '数据实为上一交易日收盘状态，拒绝按今日入库'
                              % snap.get('status'))
              if hhmm < '15:00':
                  errs.append('写入时刻 %s < 15:00：非收盘后窗口，拒绝推送' % hhmm)
              if snap.get('backfill'):
                  errs.append('常规运行快照不得标记 backfill=true')
          if snap.get('factors_spec_version') != cfg.get('version'):
              errs.append('factors_spec_version %r != config %r' % (
                  snap.get('factors_spec_version'), cfg.get('version')))
          days = hist.get('days') or []
          if not days:
              errs.append('history 为空')
          if len([d for d in days if d.get('trading_day') == target]) != 1:
              errs.append('目标交易日 %s 的 history 不是恰好 1 条（upsert 去重失败）' % target)
          if len(days) > 120:
              errs.append('history 超过 120 条上限')
          src = snap.get('sources') or []
          if not src or any(not s.get('ok') for s in src):
              # 源失败不是硬错误（scoreFactors 会按 coverage 归一化），但必须在日志显式列出
              print('::warning::存在失败源:', [s.get('name') for s in src if not s.get('ok')])
          if snap.get('score') is not None and not snap.get('displayable'):
              print('::warning::coverage 不足，总分已算出但页面将不展示（displayable=false）')
          print('校验汇总: target=%s today=%s mode=%s ver=%s sources=%d/%d score=%s coverage=%s/%s displayable=%s' % (
              target, day, mode,
              snap.get('factors_spec_version'),
              sum(1 for s in src if s.get('ok')), len(src),
              snap.get('score'), snap.get('coverage'), snap.get('coverage_total'),
              snap.get('displayable')))
          if errs:
              for e in errs: print('::error::' + e)
              sys.exit(1)
          PY

      - name: 校验推送通道可导入
        if: steps.gate.outputs.run == 'true' && steps.dup.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "from sync_func import push_file; print('sync_func.push_file OK')" || {
            echo '::error::sync_func 不可导入（缺 paths/secrets_conf/certifi？），拒绝静默跳过推送'
            exit 1
          }

      - name: 推送两个 JSON（Git Data API，带 SHA 与 409 重试）
        if: steps.gate.outputs.run == 'true' && steps.dup.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 不做整树 git commit：sync.yml 每 15 分钟也在写 main，
          # 历史教训是 19:21 回填被 19:25 sync commit 整段回退 -6549 行。
          # 逐文件 PUT + 远端 SHA + 409 重试，最小作用域且不会带走别人的改动。
          python - <<'PY'
          import json, os, sys
          from sync_func import push_file
          snap = json.load(open('breadth_snapshot.json', encoding='utf-8'))
          day = snap['trading_day']
          mode = os.environ.get('BREADTH_MODE', 'normal')
          if mode == 'predawn':
              msg = 'breadth: %s 收盘快照（延迟跨午夜自动回填，竞价前冻结数据）' % day
          elif snap.get('backfill'):
              msg = 'breadth backfill: %s 显式回填（clist 源失败，coverage 降级）' % day
          else:
              msg = 'breadth: %s 收盘快照（T1, Asia/Shanghai 16:25）' % day
          ok = True
          for p in ('breadth_snapshot.json', 'breadth_history.json'):
              with open(p, encoding='utf-8') as f:
                  content = f.read()
              ok = push_file(p, content, msg) and ok
          print('push result:', 'OK' if ok else 'FAILED')
          sys.exit(0 if ok else 1)
          PY
