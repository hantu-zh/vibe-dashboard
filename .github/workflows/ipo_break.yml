name: 深度破发观察池每日重算

on:
  schedule:
    # 北京时间 15:35 收盘后 = UTC 07:35（GitHub Actions cron 一律按 UTC）
    # 注意：仓库内若干旧 workflow 的「北京时间」注释与 UTC+8 换算不符，此处按标准换算书写。
    - cron: '35 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ipo-break-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成深度破发观察池
        run: python gen_ipo_break.py

      - name: 产物校验
        run: |
          python - <<'PY'
          import json
          j = json.load(open('ipo_break.json', encoding='utf-8'))
          m, items = j['meta'], j['items']
          assert m['rules_version'] and m['generated_at'] and m['as_of'], 'meta 缺字段'
          assert m['rules_version'] == 'v5', '规则版本不是 v5'
          assert items, '入池为空，拒绝推送'
          assert m['funnel']['final'] == len(items), '漏斗计数与入池数不一致'
          assert all('adj_pct' in i and 'nominal_pct' in i and 'depth_tier' in i for i in items), '缺双列口径字段'
          assert all(i.get('duration') for i in items), '缺破发持续期字段（v2）'
          assert all(i.get('fundflow') for i in items), '缺资金流字段（v3，降级时也应写对象）'
          assert all(i.get('lift') and 'lift_type' in i['lift'] for i in items), '缺解禁类型字段（v3）'
          assert m['funnel']['universe'] > 0 and m['funnel']['nominal_break'] >= len(items), '漏斗异常'
          # v4：同行 PR / 信号保质期 / 业绩催化 / 四维共振
          peer_ok = sum(1 for i in items if (i.get('industry_stat') or {}).get('peer_pr') is not None)
          sig_ok = sum(1 for i in items if 'signal_state' in (i.get('micro') or {}))
          assert all(i.get('catalyst') and i.get('resonance') for i in items), '缺 v4 业绩催化/共振字段'
          assert peer_ok >= len(items) * 0.8, '同行 PR 覆盖率过低（%d/%d）' % (peer_ok, len(items))
          assert sig_ok >= len(items) * 0.8, '信号保质期覆盖率过低（%d/%d）' % (sig_ok, len(items))
          assert m['funnel']['resonance'] == sum(1 for i in items if (i.get('resonance') or {}).get('hit')), '共振计数不一致'
          assert m['funnel']['finance_double_up'] == sum(1 for i in items if (i.get('catalyst') or {}).get('finance_cls') == 'good'), '业绩双增计数不一致'
          assert m['funnel']['signal_valid'] == sum(1 for i in items if '有效' in ((i.get('micro') or {}).get('div_state'), (i.get('micro') or {}).get('mild_state'))), '有效信号计数不一致'
          # v5：尾盘拆分 / 解禁股东类型 / 板块联动（均为增强信号，源 flaky，覆盖率不足只降级不阻断）
          fs_ok = sum(1 for i in items if (i.get('fundflow') or {}).get('flow_split') is not None)
          sec_ok = sum(1 for i in items if (i.get('sector') or {}).get('matched'))
          if fs_ok < len(items) * 0.6:
              print('⚠ 尾盘拆分覆盖率偏低（%d/%d），尾盘偷袭标记降级为「分时数据缺失」（源 flaky，次日重试）' % (fs_ok, len(items)))
          if sec_ok < len(items) * 0.6:
              print('⚠ 板块联动匹配率偏低（%d/%d），板块联动列降级为「未匹配」（源 flaky，次日重试）' % (sec_ok, len(items)))
          tail = sum(1 for i in items
                     if (i.get('fundflow') or {}).get('flow_split') is not None
                     and ((i.get('fundflow') or {}).get('flow_split') or {}).get('raid'))
          assert m['funnel']['tail_raid'] == tail, '尾盘偷袭计数不一致'
          assert m['funnel']['holder_vcpe'] == sum(1 for i in items if '创投' in str((i.get('lift') or {}).get('holder_type'))), '创投解禁计数不一致'
          assert m['funnel']['holder_state'] == sum(1 for i in items if '国资' in str((i.get('lift') or {}).get('holder_type'))), '国资解禁计数不一致'
          assert m['funnel']['sector_matched'] == sec_ok, '板块联动计数不一致'
          print('校验通过：%d 只入池，深度 %d 只，微观 %d/%d，资金流5日 %d/%d，同行PR %d/%d，信号保质期 %d/%d，四维共振 %d 只' % (
              len(items), m['funnel']['deep'],
              sum(1 for i in items if i.get('micro')), len(items),
              m['funnel']['fundflow_5d'], len(items),
              peer_ok, sig_ok, len(items), m['funnel']['resonance']))
          PY

      - name: 生成每日候选研报
        run: python gen_ipo_report.py

      - name: 研报校验
        run: |
          python - <<'PY'
          import os
          assert os.path.exists('ipo_break_pick.html'), '研报未生成'
          html = open('ipo_break_pick.html', encoding='utf-8').read()
          assert 'DATA' in html and '交易位' in html, '研报内容异常'
          print('研报校验通过：%d 字节' % len(html))
          PY

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- ipo_break.json ipo_break_pick.html; then
            echo "无变化（非交易日或池子未变动），跳过提交"
            exit 0
          fi
          git add ipo_break.json ipo_break_pick.html
          git commit -m "data: 深度破发观察池 + 候选研报 $(date -u +%F)"
          ok=0
          for i in 1 2 3 4 5 6; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              ok=1
              break
            fi
            echo "推送失败，$i 秒后重试..."
            sleep 8
          done
          if [ "$ok" != "1" ]; then
            echo "::error:: 深度破发观察池推送最终失败"
            exit 1
          fi
