name: auto-trader daily

# 每天收盘后自动跑一轮自动交易引擎（模拟盘），把账户快照写回仓库，GitHub Pages 展示页自动更新。
#
# 数据时序（2026-11-07 修复）：
#   旧版 cron '30 0' 经排队延迟补偿后约 15:30 CST 运行，但 kline_cache.json /
#   strong_stocks.json 由 dashboard-gen 在 16:35~17:08 CST 才生成，实测 11-06 日志
#   「kline_cache updated=2026-11-05，28 只持仓仅 14 只拿到真实收盘价」，其余仍按信号价建仓。
#   现把本任务排到 dashboard-gen 之后，并加「等待当日收盘数据」step；引擎内还有硬闸
#   （close_data_fresh），数据未就绪时只盯市结算、不新建仓。
#   注：cron 为 UTC；本仓库定时任务按「cron + 约 7h 排队延迟」补偿，
#       UTC 03:30 ≈ 北京 18:30，晚于 dashboard-gen 的 16:35~17:08。
on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:            # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: auto-trader-daily
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Self-test (regime units / costs / filters / close gate)
        run: python -m unittest auto_trader/test_daily_run.py -v

      # 排队延迟不固定，光靠 cron 排序仍可能抢在收盘数据落盘之前；轮询等待最多 12 分钟。
      - name: Wait for fresh close data (kline_cache)
        run: |
          set -e
          TODAY=$(TZ=Asia/Shanghai date +%F)
          echo ">> 等待 $TODAY 的收盘数据（kline_cache.json）"
          for i in $(seq 1 12); do
            git fetch -q origin main:refs/remotes/origin/main || true
            UPD=""
            if git cat-file -e origin/main:kline_cache.json 2>/dev/null; then
              UPD=$(git show origin/main:kline_cache.json | python -c "import sys,json; print(json.load(sys.stdin).get('updated',''))" 2>/dev/null || true)
            fi
            if [ "$UPD" = "$TODAY" ]; then
              echo ">> 当日收盘数据已就绪（第 $i 次检查）"
              # 对齐工作树，确保引擎读到的是刚生成的收盘价与当日信号
              git checkout origin/main -- kline_cache.json strong_stocks.json strongbuy_data.json cffex_net_position.json daily_picks.json 2>/dev/null || true
              exit 0
            fi
            echo ">> 第 $i 次：updated='$UPD'，60 秒后重试"
            sleep 60
          done
          echo "::warning::当日收盘数据 12 分钟内未就绪，引擎将只盯市结算、不新建仓"

      - name: Run daily engine
        run: python auto_trader/daily_run.py

      - name: Commit & push snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trader_state.json trader_snapshot.json trader.html
          if git diff --cached --quiet; then
            echo ">> 快照无变化，不提交"
            exit 0
          fi
          git commit -m "auto-trader daily: $(date -u '+%Y-%m-%d') 账户快照更新"

          export GIT_EDITOR=true
          # 健壮推送：先合并最新 main，冲突时以本轮由账本重新生成的文件为准（ours=当前分支=每日生成版），
          # 再推送；被并发提交挡住就重新拉取合并重试，最多 6 次。杜绝旧逻辑 rebase 冲突被 || true 吞掉。
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git merge -X ours --no-edit origin/main && git push origin HEAD:main; then
              echo ">> pushed (attempt $i)"
              exit 0
            fi
            echo ">> retry $i"; sleep 5
          done
          echo ">> push failed after retries"
          exit 1
