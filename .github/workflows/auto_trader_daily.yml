name: auto-trader daily

# 每天收盘后自动跑一轮自动交易引擎（模拟盘），把账户快照写回仓库，GitHub Pages 展示页自动更新。
on:
  schedule:
    - cron: '0 9 * * 1-5'      # UTC 09:00 = 上海 17:00（周一至周五，收盘后）
  workflow_dispatch:            # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: auto-trader-daily
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily engine
        run: python auto_trader/daily_run.py

      - name: Commit snapshot
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trader_state.json trader_snapshot.json
          if git diff --cached --quiet; then
            echo ">> 快照无变化，不提交"
            exit 0
          fi
          git commit -m "auto-trader daily: $(date -u '+%Y-%m-%d') 账户快照更新"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo ">> pushed"; exit 0
            fi
            echo ">> push retry $i"; sleep 5
          done
          echo ">> push failed after retries"
          exit 1
