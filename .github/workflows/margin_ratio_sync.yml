# 融资融券担保比 标签页 每日同步
#
# 背景：cffex.html 的「融资融券担保比」标签页两个序列都改为每日静态文件，不再浏览器实时拉取：
#   - margin_ratio.json   : 融资余额占流通市值比（RPT_MARGIN_TOTALDATA）
#   - margin_m227.json    : 全市场平均担保比例（市值加权，RPTA_WEB_MARGIN_DAILYTRADE.AVG_GUARANTEE_RATIO）
#                           + 融资余额（FIN_BALANCE），用于「平均担保比例 vs 资金敏感阈值 227%」图
# 前端直接 fetch 同源静态文件（与全站 cffex_data.json 等一致）。
#
# 跑在 GitHub Actions（云端，云 IP 可稳定访问东财数据中心），不依赖本地机器。
name: margin ratio sync

on:
  # 上海 16:00–21:30 每 30 分钟（UTC 08:00–13:30），工作日。
  # 收盘后东财两融汇总数据就绪；首轮可能尚早，脚本内部拉不到当日则由下一轮 cron 补上。
  schedule:
    - cron: '*/30 8-13 * * 1-5'
  # 早间补跑（UTC 00:15/01:15/02:15 = 北京 08:15/09:15/10:15）：
  # 东财两融数据为 T+1 上午发布，只跑晚間会让「数据截至」全天滞后一天；
  # 早间跑一轮即可把 T-1 数据在上午挂到页面。
  - cron: '15 0-2 * * 1-5'
  # 手动触发（Actions 页面 / API）
  workflow_dispatch:

permissions:
  contents: write   # 允许 gen_margin_ratio.py 通过 REST API 写回仓库

concurrency:
  group: margin-ratio-sync
  cancel-in-progress: false   # 串行排队，避免并发 push 冲突

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生成并推送 融资余额占比（自拉自推）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Shanghai
        run: |
          python gen_margin_ratio.py
          python gen_margin_m227.py
          python gen_margin_hs300.py
