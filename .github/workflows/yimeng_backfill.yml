name: yimeng backfill (补算益盟强买)

# 独立并发组：不与 sync.yml 的 15 分钟自续队列抢位。
# 用途：非交易日发现 strongbuy_data.json 的 yimeng 列表是旧的时，手动触发补算。
# 脚本基于最近一个收盘日的数据计算（Sina 换手榜 + 东财历史资金流），结果 = 上一交易日列表。
on:
  workflow_dispatch:
  push:
    paths:
      - '.triggers/yimeng_backfill'

permissions:
  contents: write

concurrency:
  group: yimeng-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 补算益盟强买并推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # BUGFIX(2026-10-03): 仓库实际配置的 secret 名是 DINGTALK_WEBHOOK（完整 URL），从来没有 DINGTALK_TOKEN，这里注入的一直是空串。
          # 旧版 yimeng_strongbuy.py 靠写死的明文 token 兜底才推得出去（也就是那串泄露的 webhook）；新版本 fail-closed，必须注入正确的 Secret。
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
        run: |
          set +e
          python yimeng_strongbuy.py
          echo "exit=$?"

      - name: 刷新板块K线缓存并推送
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python -c "import ai_daily; ai_daily.write_board_klines(30)"
          echo "gen exit=$?"
          python - <<'PYEOF'
          import base64, json, os, urllib.request
          p = "ai_analysis_board_kline.json"
          if not os.path.exists(p):
              print("no board kline file"); raise SystemExit
          tok = os.environ["GITHUB_TOKEN"]
          api = "https://api.github.com/repos/hantu-zh/vibe-dashboard/contents/" + p + "?ref=main"
          req = urllib.request.Request(api, headers={"Authorization": "token " + tok, "Accept": "application/vnd.github+json", "User-Agent": "backfill"})
          try:
              sha = json.loads(urllib.request.urlopen(req, timeout=30).read())["sha"]
          except Exception:
              sha = None
          body = {"message": "chore: backfill 刷新板块K线缓存", "content": base64.b64encode(open(p, "rb").read()).decode(), "branch": "main"}
          if sha:
              body["sha"] = sha
          req2 = urllib.request.Request("https://api.github.com/repos/hantu-zh/vibe-dashboard/contents/" + p,
              data=json.dumps(body).encode(), method="PUT")
          req2.add_header("Authorization", "token " + tok)
          req2.add_header("Accept", "application/vnd.github+json")
          req2.add_header("Content-Type", "application/json")
          req2.add_header("User-Agent", "backfill")
          r = json.loads(urllib.request.urlopen(req2, timeout=60).read())
          print("pushed commit:", r["commit"]["sha"][:10])
          PYEOF
