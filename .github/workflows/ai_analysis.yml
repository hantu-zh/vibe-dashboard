name: 🤖 AI 复盘（采集 + 报告 + 渲染）

# 独立工作流，专门驱动 ai_analysis.html 的更新。
# 背景：此前 ai_analysis.html 永久停在 2026-08-17，根因为
#   1) 生成脚本 ai_daily.py 因 paths.w 被误删而在 import 阶段崩溃，从未成功运行；
#   2) 04_close_report.yml 里的 AI 作业被 `needs` 门控在多个长期失败的作业之后 → 被 skipped，
#      且 04 的调度在本仓库也未实际触发。
# 本工作流独立于其它作业，拥有自己的调度，确保 AI 复盘每日收盘后稳定更新。
on:
  schedule:
    # 北京时间 16:35 = UTC 08:35（收盘后，等强买/慢热等信号源先落库）
    - cron: '35 8 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ai-analysis
  cancel-in-progress: false

jobs:
  ai-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests pandas numpy chinese-calendar lxml beautifulsoup4 openai
      - name: 采集数据 + 生成 AI 报告
        run: python ai_daily.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      - name: 渲染 AI 复盘 HTML
        run: python ai_analysis.py --serve
      - name: 推送
        # ⚠️ 这里曾经用 `git pull --rebase origin main` 处理与 sync.yml（每15分钟）的并发提交。
        # 实测 2026-09-30 10:59 那次：本作业刚生成完 ai_analysis.html，sync 抢先提交了同一批
        # JSON → rebase 在 ai_analysis_data.json 等 4 个文件上冲突 → rebase 中断、HEAD 变成
        # detached → `git push` 报 "You are not currently on a branch" 失败。而失败发生在
        # `for` 循环里被吞掉，步骤仍显示成功 → **页面渲染结果被静默丢弃，用户看到的是旧快照**。
        # 改成 `reset --soft FETCH_HEAD`：把本地生成结果整体平移到最新 origin/main 之上，
        # 不做三方合并，因此永远不会冲突，且一定可以快进推送（本作业产物优先级最高）。
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          FILES="ai_analysis_data.json ai_analysis_report.json ai_analysis.html slowrise_stocks.json ai_analysis_board_kline.json"
          git add $FILES
          if git diff --cached --quiet; then echo "无变化，跳过推送"; exit 0; fi
          for i in 1 2 3 4 5; do
            git rebase --abort >/dev/null 2>&1
            git fetch origin main || { sleep $((RANDOM % 6 + 3)); continue; }
            git reset --mixed FETCH_HEAD          # 本地改动保留在索引里，HEAD 挪到最新 main
            git add $FILES
            if git diff --cached --quiet; then echo "与远端一致，无需推送"; exit 0; fi
            git commit -m "🤖 AI 复盘 $(date '+%Y-%m-%d %H:%M')"
            if git push; then echo "推送成功 (第 $i 次)"; exit 0; fi
            sleep $((RANDOM % 6 + 3))            # 随机抖动，避开并发推送的踩踏窗口
          done
          echo "::error::AI 复盘推送失败（重试 5 次）"
          exit 1
