name: chan_report daily

# 大盘缠论 / 艾略特波浪 / 支撑压力量化报告：
#   腾讯接口拉指数日K/周K → 本地引擎（chan.py + elliott.py + levels.py）算中枢/背驰/浪型/支撑压力
#   → report.py 生成 chan_report.html → GITHUB_TOKEN 回写仓库（GitHub Pages 自动发布）。
# 数据兜底：fetch_data.py 拉取失败时沿用 data/ 旧缓存，避免单点失败导致整轮挂掉。
# 入口：chan_report.html 由 auto_trader/patch_nav.py 守护，自动补回首页顶部导航「🌀 大盘缠论」。
#
# 说明：本 workflow 由原 chan_report.yml 与 chan_analysis.yml 合并而成 —— 两者此前都生成并
# push 同一个 chan_report.html，存在 push 竞态。现统一为单一调度、单一 push，消除重复与竞争。

on:
  schedule:
    # 每个交易日 16:00 北京时间（UTC+8）收盘后自动刷新
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

# 用 Actions 内置 GITHUB_TOKEN 直接推送，不落任何 PAT 明文
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch K-line & build report
        run: |
          cd chan_analysis
          python fetch_data.py
          python report.py
          cp out/chan_report.html ../chan_report.html

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只回写生成的报告，避免回写源码/data 引发冲突；
          # fetch 对齐最新 main → 仅 add 报告 → 重试 push，避免与其它流水线抢占 main 造成竞态。
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --mixed FETCH_HEAD
            git add chan_report.html
            if git diff --cached --quiet; then
              echo "no report change, skip commit"
              exit 0
            fi
            git commit -m "chore: update chan report [skip ci]"
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i), re-align with remote and retry"
            git reset --soft HEAD~1
            sleep $((i * 5))
          done
          echo "::error::推送失败：5 次重试后仍无法回写缠论报告"
          exit 1
