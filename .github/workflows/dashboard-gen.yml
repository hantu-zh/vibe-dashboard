name: dashboard-gen (kline cache)

on:
  schedule:
    # 北京时间 16:35（收盘后，当日完整K线已就绪），工作日
    - cron: "35 8 * * 1-5"
  workflow_dispatch: {}      # 手动触发：Actions 页面 → Run workflow

permissions:
  contents: write            # 用内置 GITHUB_TOKEN 把 kline_cache.json 推回仓库

concurrency:
  group: dashboard-gen
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate kline_cache.json
        run: python dashboard-gen/gen_kline_cache.py

      - name: Commit & push
        run: |
          git config user.email "bot@workbuddy.local"
          git config user.name "workbuddy-bot"
          git add kline_cache.json
          if git diff --cached --quiet; then
            echo "kline_cache.json 无变化，跳过提交"
          else
            git commit -m "data: 自动刷新 kline_cache.json ($(date +%F))"
            git push
          fi
