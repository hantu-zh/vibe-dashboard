name: trend-features
# 近似走势查找 · 特征库夜间生成
# 部署位置：仓库 .github/workflows/trend_features.yml
# 说明：仅在收盘后跑一次，产出 trend_features.json + trend_features_index.json（与 similar.html 同级）。
#       全量 A 股经腾讯日线计算 K线 + 四合一(强弱线QX) 特征；股票池由 gen_trend_features.js 内部
#       从东财 datacenter-web 翻页拉全市场（含 年线上方 过滤所需 ema250/close），无需外部 universe.json。
on:
  schedule:
    - cron: '40 10 * * 1-5'   # 北京时间约 18:40（工作日），收盘后
  workflow_dispatch: {}   # 支持手动触发全量生成

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # 生成特征库（内部自动翻页拉全 A 股票池，写入 trend_features.json 与 trend_features_index.json）
      - name: generate features
        working-directory: trend_features
        run: node gen_trend_features.js

      # 提交（soft reset + 重试，规避并发碰撞，对齐现有 sync.yml 约定）
      - name: commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trend_features.json trend_features_index.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          for i in 1 2 3 4 5; do
            git commit -m "chore: update trend_features [skip ci]" && break
            git pull --ff-only origin ${{ github.ref_name }} || true
          done
          for i in 1 2 3 4 5; do
            git push origin HEAD && break
            sleep $((i*3))
            git pull --ff-only origin ${{ github.ref_name }} || true
          done
