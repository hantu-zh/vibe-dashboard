name: 🌇 午后选股 (14:00-15:00)

on:
  schedule:
    # 北京时间 14:00 = UTC 06:00
    - cron: '3 6 * * 1-5'
    # 北京时间 14:30 = UTC 06:30
    - cron: '33 6 * * 1-5'
    # 北京时间 14:50 = UTC 06:50
    - cron: '53 6 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/03_afternoon_picks.yml'

concurrency:
  group: afternoon-picks
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  check_trading_day:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.td.outputs.open }}
    steps:
      - name: 🚦 交易日检查（跳过周末与法定节假日）
        id: td
        run: |
          pip install -q chinese-calendar || echo "日历库安装失败，按工作日规则处理"
          python - <<'PY'
          import datetime, os
          today = datetime.date.today()
          try:
              from chinese_calendar import is_holiday
              sh = bool(is_holiday(today))
          except Exception as e:
              sh = False
              print("日历库不可用，按工作日处理:", e)
          # A股交易日 = 周一~周五 且 非法定节假日（调休周末股市仍休市）
          open_today = (today.weekday() < 5) and (not sh)
          print("今天", today, "A股交易日:", open_today)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write("open=%s\n" % ("true" if open_today else "false"))
          PY

  afternoon:
    needs: check_trading_day
    if: needs.check_trading_day.outputs.open == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      TZ: Asia/Shanghai
      MX_APIKEY: ${{ secrets.MX_APIKEY }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install akshare requests pandas numpy chinese-calendar lxml beautifulsoup4

      - name: 🧬 高欣-季度环比增长
        # 不再用 continue-on-error 静默吞错：脚本缺失或运行失败都会在 Actions 日志里以
        # ::error:: 高亮显示，便于第一时间发现【高欣季度环比增长】卡片停更。
        # 用 set +e + exit 0 包裹，保证本步骤报错不拖累后续选股步骤。
        run: |
          set +e
          if [ ! -f _gx_quarter_rank.py ]; then
            echo "::error::_gx_quarter_rank.py 缺失，【高欣季度环比增长】卡片将停更"
            exit 0
          fi
          python _gx_quarter_rank.py
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::_gx_quarter_rank.py 退出码 $rc，【高欣季度环比增长】可能无数据（检查 MX_APIKEY / 妙想API）"
          fi
          exit 0

      - name: 🚀 慢涨强势股 (14:00)
        run: python hot_chase_picks.py
        continue-on-error: true

      - name: 🎯 陈小群战法四步选股
        run: python chen_xiaoqun_pick.py
        continue-on-error: true

      - name: 🔮 预测明日涨停
        # 2026-10-02 审计：predict_tomorrow_limit_up.py 从未提交到仓库（本地亦无）→ 该卡片从无数据。
        # 改为存在才跑：脚本补进仓库后本步骤自动恢复。
        run: |
          if [ -f predict_tomorrow_limit_up.py ]; then
            python predict_tomorrow_limit_up.py
          else
            echo ">> skip predict_tomorrow_limit_up.py（尚未提交到仓库）"
          fi
        continue-on-error: true

      - name: 💪 大力水手下午筛选
        run: python popeye_afternoon.py
        continue-on-error: true

      - name: 🥬 大力水手菠菜涨停战法 (Step2)
        run: python growth_rank_step2.py
        continue-on-error: true

      - name: 🔬 高欣-唯科科技形态 (箱体突破)
        run: python scan_breakout_v2.py
        continue-on-error: true

      - name: 📤 推送到 GitHub
        # 修复(2026-10-02): 原用 git pull -X ours（冲突时静默丢弃远端更新）且单次 push，
        # 撞上 sync.yml 每 15 分钟推送即失败丢数据；改为与 01/04 一致的 fetch+reset 重试版。
        # BUGFIX(2026-10-03): 只提交本次 job 自己的产物，杜绝 `git add -A` 回滚他人推送。
        # BUGFIX(2026-10-09): 原 `git diff | while read ... git add` 会在管道内并发访问 index，
        # 触发 .git/index.lock 已存在错误。改用 mapfile 先收集文件名再处理，避免并发 git 进程。
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          BASE=$(git rev-parse HEAD)
          # 单一写入口收敛（2026-10-13）：下面的文件由 sync_func.py 管理——由 sync.yml 的
          # run_task 生成、经三方合并后推送，本 job 一律不提交。本 job 的 git 推送是
          # 「检出基线 + 本 job 产物」的整文件快照，后 push 的会把 sync_func 刚合并好的
          # 版本整份覆盖回旧内容：2026-10-12 实测杰克船长 10-12 批次（11:50 已选出）
          # 即被该类推送覆盖成 picks=[]。本 runner 里这些文件的改动随 job 结束销毁即可，
          # sync_func 会推可靠的版本（这些脚本在 sync.yml 里都有对应 run_task）。
          skip_sync_func_file() {
            case "$1" in
              *.bak_*) return 0;;
              daily_picks.json|slowrise_stocks.json|ai_analysis_data.json|ai_analysis_report.json|ai_analysis_board_kline.json|ai_analysis.html|index.html|rps.html|news.html|news_data.json|em_stock_names.json|strongbuy_data.json|strong.html|us_picks.json|research_data.json|research.html|sector_funnel.json|cffex.html|cffex_net_position.json|market_review.json|midday_review.json|daily_task_state.json|speedrank_history.json|speedrank.html|sector_snapshot.json|market_kline.json|vibe_trend_history.json|fourweek_newhigh.json|fourweek_newhigh_history.json|fourweek_newhigh.csv|strategy_tabs.json|strategy_tabs_kline_cache.json|jack_recommendations.json|chen_xiaoqun_result.json) return 0;;
            esac
            return 1
          }
          stage_job_files() {
            local -a files
            mapfile -t files < <(git diff --name-only "$BASE")
            for f in "${files[@]}"; do skip_sync_func_file "$f" || { [ -e "$f" ] && git add -- "$f"; }; done
            mapfile -t files < <(git ls-files --others --exclude-standard)
            for f in "${files[@]}"; do skip_sync_func_file "$f" || git add -- "$f"; done
            mapfile -t files < <(git diff --name-only --diff-filter=D "$BASE")
            for f in "${files[@]}"; do skip_sync_func_file "$f" || git rm --cached --ignore-unmatch -- "$f" >/dev/null; done
          }
          sleep $((RANDOM % 15))  # 错峰：错开多 job 同时进入推送竞态
          for i in 1 2 3 4 5 6 7 8; do
            [ -f .git/index.lock ] && rm -f .git/index.lock
            git rebase --abort >/dev/null 2>&1
            git fetch origin main || { sleep $((RANDOM % 6 + 4 + i * 2)); continue; }
            git reset --mixed FETCH_HEAD          # index 对齐最新 main，工作区保留本次产物
            stage_job_files
            if git diff --cached --quiet; then echo "与远端一致，无需推送"; exit 0; fi
            git commit -m "🌇 午后选股数据更新 $(date '+%Y-%m-%d %H:%M')"
            if git push; then echo "推送成功 (第 $i 次)"; exit 0; fi
            sleep $((RANDOM % 6 + 4 + i * 2))
          done
          echo "::error::午后选股推送失败（重试 5 次）"
          exit 1
