name: 定增跟踪表 · 每周自动更新

# 定增跟踪表（week 页 dz tab）每周自动增量更新一次：
#   dz_refresh.py 拉东财增发明细(RPT_SEO_DETAIL) + 腾讯行情，
#   新增当前破发的竞价定增标的（auto_added 标记），刷新存量 seed_close，stamp _meta。
# 北京时间每周一 09:05（UTC 01:05）：开盘前，行情为上周五收盘，不影响破发判定。
# 无新增且行情无变化时不产生空提交。
on:
  schedule:
    - cron: '5 1 * * 1'
  workflow_dispatch: {}   # 手动触发：仓库 Actions 页面 → Run workflow

permissions:
  contents: write

concurrency:
  group: dz-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 定增跟踪表刷新
        run: python dz_refresh.py --seed dz_stock_seed.json

      - name: 提交并推送（fetch + reset --mixed，避免覆盖并发改动）
        if: always()
        run: |
          git config user.email "bot@workbuddy.local"
          git config user.name "workbuddy-bot"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep $((RANDOM % 6 + 3)); continue; }
            git reset --mixed FETCH_HEAD
            git add dz_stock_seed.json
            if git diff --cached --quiet; then
              echo "dz_stock_seed.json 无变化，跳过提交"
              exit 0
            fi
            git commit -m "data: 定增跟踪表每周更新 ($(date +%F))"
            if git push; then echo "推送成功 (第 $i 次)"; ok=1; break; fi
            sleep $((RANDOM % 6 + 3))
          done
          if [ $ok -ne 1 ]; then echo "::error::定增跟踪表推送失败（重试 5 次）"; exit 1; fi
