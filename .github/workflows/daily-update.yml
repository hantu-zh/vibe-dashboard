name: 每日跨资产共振数据更新

# 交易日（周一至周五）北京时间 18:00 更新。
# GitHub Actions cron 用 UTC，北京时间 18:00 = UTC 10:00。
# 收盘后 3 小时抓数，避开数据源当日结算延迟。
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # 允许手动触发测试

permissions:
  contents: write

concurrency:
  group: regime-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行每日更新脚本
        # 脚本内置重试+熔断+stale兜底；即使失败也不会输出半成品
        run: python daily_update.py

      - name: 提交更新的数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regime_data.json event_log.csv mc_state.json mc_rerun.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交（周末或数据源未更新）"
          else
            git commit -m "chore: 更新跨资产共振数据 $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
