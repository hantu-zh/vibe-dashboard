name: backtest
# 选股策略受控回测：腾讯/东财/新浪 三源兜底拉历史日K线，固定退出带算胜率/盈亏比/期望值。
# 用 GitHub runner IP（不同于共享沙箱，不被沙箱 IP 限流）抓取；kline_cache 用 actions/cache 跨运行续跑；报告用 GITHUB_TOKEN 回写。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * 5'   # 每周五 00:30 北京时间（UTC 16:30）

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore K-line cache (incremental)
        uses: actions/cache@v4
        with:
          path: kline_cache_backtest.json
          key: kline-cache-${{ github.run_id }}
          restore-keys: |
            kline-cache-
          # BUGFIX(2026-10-03): 默认只在 job 成功时保存缓存；run 37089115878 报告已生成、
          # 仅因 git push 被拒而整轮失败 → 26 分钟抓到的 1026 条 K 线缓存全部作废。
          # 改为始终保存，下一次运行直接命中缓存。
          save-always: true

      - name: Run backtest (online fetch)
        run: python backtest_engine.py
        env:
          OFFLINE: 'false'

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # BUGFIX(2026-10-03): 回测单次跑 26 分钟，期间 sync.yml 每 15 分钟推一次 main，
          # 裸 `git push` 必被 ! [rejected] (fetch first) 拒掉（run 37089115878 实测：报告已生成却整轮判失败）。
          # 改为：先 fetch + reset --mixed 对齐最新 main（工作区保留本次生成的报告），
          # 只 add 报告两个文件（绝不 add -A，避免把他人这半小时的推送整体回滚），再带退避重试推送。
          for i in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --mixed FETCH_HEAD
            git add backtest_report.html backtest_report.json
            if git diff --cached --quiet; then
              echo "no report change, skip commit"
              exit 0
            fi
            git commit -m "chore: update backtest report [skip ci]"
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i), re-align with remote and retry"
            git reset --soft HEAD~1
            sleep $((i * 5))
          done
          echo "::error::推送失败：5 次重试后仍无法回写回测报告"
          exit 1
