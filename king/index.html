<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K线速查 · 箱体+四合一</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#070b14; --panel:#0d1424; --panel2:#0a0f1d; --line:#1e2740;
    --txt:#dfe6ff; --dim:#7b85a8; --dim2:#5f6b8f; --accent:#7fd3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:18px 14px 40px}
  h1{margin:0 0 4px;font-size:1.06em;font-weight:600;letter-spacing:.02em}
  .sub{margin:0 0 16px;color:var(--dim);font-size:.78em}

  /* 搜索区 */
  .bar{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
  .field{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:0 12px;transition:border-color .15s,box-shadow .15s}
  .field:focus-within{border-color:#2d4a7a;box-shadow:0 0 0 3px rgba(127,211,255,.08)}
  .field svg{flex:0 0 auto;opacity:.5}
  input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);
    font-size:1.02em;padding:12px 0;font-family:ui-monospace,Consolas,"Microsoft YaHei",monospace}
  input::placeholder{color:#4d5674;font-family:"Microsoft YaHei",sans-serif}
  button{background:linear-gradient(180deg,#1d3b66,#16294a);color:#dceaff;border:1px solid #2b4a7d;
    border-radius:10px;padding:12px 20px;font-size:.94em;cursor:pointer;font-family:inherit;
    transition:filter .15s,transform .05s}
  button:hover{filter:brightness(1.15)}
  button:active{transform:translateY(1px)}
  .periods{display:flex;gap:6px;margin:12px 0 2px}
  .periods button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:6px 14px;font-size:.82em;border-radius:8px}
  .periods button.on{background:#16273f;border-color:#2d4a7a;color:#bcd6ff}
  .quick{margin:12px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .quick span{color:var(--dim2);font-size:.74em}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:4px 11px;font-size:.76em;cursor:pointer;
    font-family:ui-monospace,Consolas,monospace}
  .chip:hover{border-color:#2d4a7a;color:#bcd6ff}
  /* 最近查询 */
  .recent{margin:10px 0 4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .recent>span{color:var(--dim2);font-size:.74em}
  .recent .chip{display:inline-flex;align-items:center;gap:6px}
  .recent .chip i{color:#4d5674;font-style:normal;cursor:pointer;line-height:1}
  .recent .chip i:hover{color:#ff6b6b}
  .recent .clr{background:none;border:0;color:#4d5674;font-size:.72em;cursor:pointer;padding:2px 6px;font-family:inherit}
  .recent .clr:hover{color:#ff6b6b}

  /* 结果区 */
  #out{margin-top:16px}
  #out .kl-chart,#out .kl-sub{background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  #out .kl-chart{padding:2px 2px 0}
  #out .kl-sub{margin:10px 0 0;padding:4px 2px 1px}
  #out .kl-embed-title{padding:2px 2px 8px}
  #out .kl-sub-label{padding:8px 10px 2px}
  .hint{color:var(--dim2);font-size:.76em;line-height:1.9;margin-top:14px}
  .hint b{color:var(--dim);font-weight:600}
  .empty,.kl-loading{background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .foot{margin-top:26px;padding-top:12px;border-top:1px solid #131b2c;color:#424c68;font-size:.72em}
  @media(max-width:520px){.wrap{padding:14px 10px 30px}button{padding:12px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>K线速查 · 箱体操盘 + 四合一</h1>
  <p class="sub">输入 代码 / 名称 / 拼音首字母（如 yzgz → 阳光照明），查看 K 线主图与通达信「箱体操盘 · 四合一副图」</p>

  <div class="bar">
    <label class="field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9fb0d8" stroke-width="2"
           stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="code" type="text" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="代码 / 名称 / 拼音首字母，如 600000 / yzgz / 阳光照明">
    </label>
    <button id="go">查询</button>
  </div>

  <div class="periods">
    <button data-p="day" class="on">日线</button>
    <button data-p="week">周线</button>
    <button data-p="month">月线</button>
    <button data-p="15m">15分</button>
    <button data-p="30m">30分</button>
    <button data-p="60m">60分</button>
    <span style="width:14px"></span>
    <button data-n="120">120根</button>
    <button data-n="200" class="on">200根</button>
    <button data-n="300">300根</button>
  </div>

  <div class="quick">
    <span>常用：</span>
    <button class="chip" data-c="600000">600000 浦发银行</button>
    <button class="chip" data-c="000001">000001 平安银行</button>
    <button class="chip" data-c="600519">600519 贵州茅台</button>
    <button class="chip" data-c="300750">300750 宁德时代</button>
  </div>

  <div class="recent" id="recent" hidden></div>

  <div id="out"></div>

  <div class="hint">
    <b>说明：</b>主图为前复权日K；副图为通达信「箱体操盘」+ 四合一（MACD / 量比 / 换手率 / RSI），
    含箱体上下轨、买卖点图标与文字信号。
    <br>指标中的 ZIG / PEAKBARS 类函数依赖完整历史，本页取 420 根计算后只显示最近一段，与通达信口径一致。
    换手率需流通股本，到账后副图会自动刷新一次。
  </div>

  <div class="foot">仅用于个人看盘研究，数据来自公开行情接口，不构成投资建议。</div>
</div>

<script src="../kline_popup.js?v=20261002p"></script>
<script>
(function () {
  var out = document.getElementById('out');
  var input = document.getElementById('code');
  var period = 'day';
  var showBars = 200;
  var req = 0;

  // ── 最近查询记录（本机 localStorage，最多 10 条，最新在前，去重） ──
  var RECENT_KEY = 'kl_recent_v1';
  var RECENT_MAX = 10;
  var recentEl = document.getElementById('recent');

  function loadRecent() {
    try {
      var a = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
      a = Array.isArray(a) ? a.filter(function (x) { return x && x.code; }) : [];
      return a.slice(0, RECENT_MAX);
    } catch (e) { return []; }
  }
  function saveRecent(a) {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(a.slice(0, RECENT_MAX))); } catch (e) { }
  }
  function pushRecent(code, name) {
    if (!code) return;
    var a = loadRecent().filter(function (x) { return String(x.code) !== String(code); });
    a.unshift({ code: code, name: name || '', t: Date.now() });
    saveRecent(a);
    renderRecent();
  }
  function removeRecent(code, ev) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    saveRecent(loadRecent().filter(function (x) { return String(x.code) !== String(code); }));
    renderRecent();
  }
  function renderRecent() {
    if (!recentEl) return;
    var a = loadRecent();
    if (!a.length) { recentEl.hidden = true; recentEl.innerHTML = ''; return; }
    recentEl.hidden = false;
    var h = '<span>最近查询：</span>';
    for (var i = 0; i < a.length; i++) {
      var it = a[i];
      var label = (it.name ? it.name + ' ' : '') + it.code;
      var tip = label.replace(/"/g, '&quot;');
      h += '<button class="chip" data-c="' + esc(it.code) + '" title="' + tip + '">' + esc(label) +
        '<i data-rm="' + esc(it.code) + '" title="移除">✕</i></button>';
    }
    h += '<button class="clr" id="recentClr">清空</button>';
    recentEl.innerHTML = h;
    Array.prototype.forEach.call(recentEl.querySelectorAll('.chip'), function (b) {
      b.addEventListener('click', function (e) {
        if (e.target && e.target.getAttribute && e.target.getAttribute('data-rm')) return;
        input.value = b.dataset.c; run();
      });
    });
    Array.prototype.forEach.call(recentEl.querySelectorAll('i[data-rm]'), function (x) {
      x.addEventListener('click', function (e) { removeRecent(x.getAttribute('data-rm'), e); });
    });
    var clr = recentEl.querySelector('#recentClr');
    if (clr) clr.addEventListener('click', function () { saveRecent([]); renderRecent(); });
  }
  // 从渲染后的标题读回股票名（.kl-embed-title 第一个文本节点即名称）
  function titleName() {
    var t = out.querySelector('.kl-embed-title');
    if (!t) return '';
    var f = t.firstChild;
    if (f && f.nodeType === 3) return f.textContent.replace(/^\s+|\s+$/g, '');
    return '';
  }

  function norm(v) {
    v = String(v || '').trim().replace(/\s+/g, '');
    var m = v.match(/^(sh|sz|bj)?(\d{6})$|^(bk\d{4,6})$/i);
    if (!m) return null;
    if (m[3]) return m[3].toUpperCase();
    return (m[1] ? m[1].toLowerCase() : '') + m[2];
  }

  function esc(s) { return String(s).replace(/[<>&]/g, function (ch) { return ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : '&amp;'; }); }

  var NO_MATCH = '未找到匹配的股票（支持 代码 / 名称 / 拼音首字母，如 600000 / 浦发银行 / pfyh）';

  // 东财搜索联想（JSONP，接口无 CORS 头）：代码 / 中文名 / 拼音全拼 / 拼音首字母（ygzm → 阳光照明）。
  // 仅在输入不是纯代码时兜底调用；只取 A 股（6 位代码按首位映射市场前缀，板块 BK 自动排除）。
  function suggest(raw) {
    return new Promise(function (resolve) {
      var fn = '_klSuggest' + Date.now();
      var s = document.createElement('script');
      var done = false;
      function cleanup() {
        if (done) return; done = true;
        clearTimeout(to);
        try { delete window[fn]; } catch (e) { window[fn] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      var to = setTimeout(function () { cleanup(); resolve(null); }, 6000);
      window[fn] = function (j) {
        cleanup();
        var list = (j && j.QuotationCodeTable && j.QuotationCodeTable.Data) || [];
        for (var i = 0; i < list.length; i++) {
          var c = String(list[i].Code || '');
          if (!/^\d{6}$/.test(c)) continue;
          var pre = /^6/.test(c) ? 'sh' : /^(0|3)/.test(c) ? 'sz' : /^(4|8)/.test(c) ? 'bj' : '';
          if (pre) { resolve(pre + c); return; }
        }
        resolve(null);
      };
      s.onerror = function () { cleanup(); resolve(null); };
      s.src = 'https://searchapi.eastmoney.com/api/suggest/get?input=' + encodeURIComponent(raw) +
        '&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=8&cb=' + fn;
      document.head.appendChild(s);
    });
  }

  function run() {
    var raw = input.value;
    var code = norm(raw);
    if (!code) {
      if (!raw.trim()) { out.innerHTML = ''; return; }
      var my0 = ++req;
      out.innerHTML = '<div class="kl-loading">正在搜索「' + esc(raw.trim()) + '」…</div>';
      suggest(raw).then(function (hit) {
        if (my0 !== req) return;
        if (!hit) { out.innerHTML = '<div class="empty">' + NO_MATCH + '</div>'; return; }
        input.value = hit;
        run();
      }).catch(function () { if (my0 === req) out.innerHTML = '<div class="empty">' + NO_MATCH + '</div>'; });
      return;
    }
    var my = ++req;
    if (!window.renderKlinePanelInto) {
      out.innerHTML = '<div class="empty">渲染脚本未就绪，请刷新页面重试</div>';
      return;
    }
    // A（本页）= 全量版：K线 + 全部表格（tables:'all'，后续新增表格自动出现在这里）
    Promise.resolve(window.renderKlinePanelInto(out, code, { period: period, displayBars: showBars, tables: 'all' }))
      .then(function (ok) {
        if (my !== req || !ok) return;
        try { history.replaceState(null, '', '?c=' + encodeURIComponent(code)); } catch (e) { }
        pushRecent(code, titleName());
      })
      .catch(function (e) {
        if (my === req) out.innerHTML = '<div class="empty">加载失败：' + (e && e.message ? e.message : e) + '</div>';
      });
  }

  document.getElementById('go').addEventListener('click', run);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });

  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
    b.addEventListener('click', function () { input.value = b.dataset.c; run(); });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.periods button'), function (b) {
    b.addEventListener('click', function () {
      period = b.dataset.p;
      Array.prototype.forEach.call(document.querySelectorAll('.periods button'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      if (input.value.trim()) run();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('.periods button[data-n]'), function (b) {
    b.addEventListener('click', function () {
      showBars = parseInt(b.dataset.n, 10) || 200;
      Array.prototype.forEach.call(document.querySelectorAll('.periods button[data-n]'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      if (input.value.trim()) run();
    });
  });

  renderRecent();

  // 支持 ?c=600000 直开
  try {
    var q = new URLSearchParams(location.search).get('c');
    if (q) { input.value = q; run(); }
  } catch (e) { }
})();
</script>
</body>
</html>
