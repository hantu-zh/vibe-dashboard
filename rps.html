<!DOCTYPE html>
<!-- RPS强弱快照 独立页面 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS强弱快照 | 方瑟的openclaw</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="行业板块全市场 RPS 相对强弱排名，盘中/收盘滚动更新">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --neon-red: #ff2d2d;
      --neon-green: #39ff14;
      --neon-cyan: #00e5ff;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; background: #0a0a1a; color: #e0e0e0; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .back-link { display: inline-block; margin-bottom: 16px; color: var(--neon-cyan); text-decoration: none; font-size: 0.9em; }
    .back-link:hover { text-decoration: underline; }
    .header { text-align: center; padding: 20px 0; }
    .header h1 { color: #ff9800; font-size: 1.8em; margin-bottom: 8px; }
    .header p { color: #888; font-size: 0.9em; }
    .rps-card { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 16px; margin-top: 16px; }
    /* ===== RPS 荧光样式 (from index.html) ===== */
    .rps-update-time { font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .rps-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
    .rps-table { width: 100%; min-width: 500px; table-layout: auto; border-collapse: collapse; background: rgba(255, 255, 255, 0.02); border-radius: 8px; overflow: hidden; font-size: 0.8rem; }
    .rps-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid rgba(255,45,106,0.3); color: var(--neon-cyan); font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; background: linear-gradient(90deg, rgba(255,0,40,0.15) 0%, rgba(255,0,146,0.15) 100%); }
    .rps-table td { padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .rps-table tr:hover { background: rgba(255,45,106,0.08); }
    .rps-cell { display: flex; align-items: center; gap: 8px; }
    .rps-num { font-weight: 700; min-width: 32px; text-align: right; text-shadow: 0 0 8px currentColor; }
    .rps-sector-name { font-weight: 600; font-size: 0.85rem; }
    .rps-strength { font-size: 0.7rem; padding: 2px 6px; border-radius: 3px; font-weight: 600; white-space: nowrap; }
    .rps-trend { font-size: 0.9rem; }
    .rps-trend.up { color: var(--neon-red) !important; }
    .rps-trend.down { color: var(--neon-green) !important; }
    .rps-bar { height: 6px; border-radius: 3px; transition: width 0.8s ease; min-width: 2px; background: rgba(255,255,255,0.1); overflow: hidden; position: relative; }
    .error-msg { color: rgba(255,255,255,0.5); text-align: center; padding: 30px 16px; line-height: 1.8; }
    .rps-source-badge { font-size: 11px; margin: 6px 0 12px; }
    .src-badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-weight: 600; margin-right: 8px; }
    .src-em { background: rgba(0,229,255,0.15); color: #00e5ff; border: 1px solid rgba(0,229,255,0.4); }
    .src-sina { background: rgba(255,179,51,0.15); color: #ffb333; border: 1px solid rgba(255,179,51,0.4); }
    .src-unknown { background: rgba(255,255,255,0.08); color: #aaa; border: 1px solid rgba(255,255,255,0.2); }
    .degrade-warn { display:block; margin-top:6px; padding:6px 10px; border-radius:6px; background: rgba(255,179,51,0.1); border:1px solid rgba(255,179,51,0.35); color:#ffb333; font-size:11px; line-height:1.5; }
    /* ===== 多周期 RPS 布局 ===== */
    .rps-summary { margin-bottom: 10px; color: rgba(255,255,255,0.62); font-size: 0.8rem; }
    .rps-summary-sub { margin-top: 5px; color: rgba(255,255,255,0.36); font-size: 0.68rem; line-height: 1.55; }
    .rps-table.rps-multi th { text-align: center; }
    .rps-table td.rps-cell-multi { padding: 4px 3px; text-align: center; }
    .rps-cell-multi span { display: inline-block; min-width: 34px; padding: 3px 5px; border-radius: 4px; font-weight: 700; font-size: 0.78rem; }
    .rps-table th.rps-th-name, .rps-name { text-align: left; }
    .rps-name { text-decoration: none; font-weight: 600; }
    .rps-name:hover { text-decoration: underline; }
    .rps-flag { display: inline-block; margin-left: 5px; padding: 1px 5px; border-radius: 3px; font-size: 0.62rem; font-weight: 600; vertical-align: middle; }
    .rps-flag-new { color: #39ff14; background: rgba(57,255,20,0.12); border: 1px solid rgba(57,255,20,0.35); }
    .rps-flag-fade { color: #ffb333; background: rgba(255,179,51,0.12); border: 1px solid rgba(255,179,51,0.35); }
    .rps-trend-cell { font-weight: 700; text-align: center; letter-spacing: 1px; }
    .rps-board { margin-top: 16px; border-radius: 8px; padding: 10px 12px; }
    .rps-board-new { background: rgba(57,255,20,0.05); border: 1px solid rgba(57,255,20,0.22); }
    .rps-board-fade { background: rgba(255,179,51,0.05); border: 1px solid rgba(255,179,51,0.22); }
    .rps-board-hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 0.82rem; font-weight: 700; }
    .rps-board-new .rps-board-hd { color: #39ff14; }
    .rps-board-fade .rps-board-hd { color: #ffb333; }
    .rps-board-sub { font-weight: 400; font-size: 0.68rem; color: rgba(255,255,255,0.45); }
    .rps-board-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 3px 14px; }
    .rps-board-item { display: flex; justify-content: space-between; gap: 8px; font-size: 0.74rem; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
    .rps-board-item:last-child { border-bottom: none; }
    .rps-board-name { color: rgba(255,255,255,0.85); font-weight: 600; }
    .rps-board-num { color: rgba(255,255,255,0.5); white-space: nowrap; }
    .rps-board-num em { font-style: normal; font-weight: 700; }
    .rps-board-num em.up { color: var(--neon-red); }
    .rps-board-num em.down { color: var(--neon-green); }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; 返回主页</a>
    <div class="header">
      <h1>⚡ RPS强弱快照</h1>
      <p>行业板块多周期相对强度 · 固定板块池 · 覆盖 5/20/60/120 日</p>
    </div>
    <div class="rps-card">
      <div class="rps-update-time" id="rps-update-time">⛳ 数据加载中...</div>
      <div class="rps-source-badge" id="rps-source-badge"></div>
      <div id="rps-content"><div class="error-msg">数据加载中...</div></div>
    </div>
  </div>

  <script>
    // ============================================================
    //  RPS 渲染函数 (移植自 index.html，数据来自 daily_picks.json)
    // ============================================================
    function localDateStr(d) {
      d = d || new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function rpsLabel(v) {
      if (v >= 90) return '极强';
      if (v >= 80) return '强势';
      if (v >= 70) return '偏强';
      if (v >= 50) return '中等';
      if (v >= 40) return '偏弱';
      return '弱势';
    }

    function rpsColor(v) {
      if (v >= 90) return '#ff2d2d';
      if (v >= 80) return '#ff6b35';
      if (v >= 70) return '#ffb333';
      if (v >= 50) return '#39ff14';
      if (v >= 40) return '#22bbaa';
      return '#4488cc';
    }

    function rpsBgColor(v) {
      if (v >= 90) return 'rgba(255,45,45,0.15)';
      if (v >= 80) return 'rgba(255,107,53,0.12)';
      if (v >= 70) return 'rgba(255,179,51,0.1)';
      if (v >= 50) return 'rgba(57,255,20,0.08)';
      if (v >= 40) return 'rgba(34,187,170,0.06)';
      return 'rgba(68,136,204,0.05)';
    }

    function rpsStrengthBg(v) {
      if (v >= 90) return 'rgba(255,45,45,0.3)';
      if (v >= 80) return 'rgba(255,107,53,0.25)';
      if (v >= 70) return 'rgba(255,179,51,0.2)';
      if (v >= 50) return 'rgba(57,255,20,0.15)';
      if (v >= 40) return 'rgba(34,187,170,0.12)';
      return 'rgba(68,136,204,0.1)';
    }

    // ============================================================
    //  多周期 RPS 渲染（数据源：板块日K → board_rps.py，固定池分母恒定）
    // ============================================================
    function rpsTone(v) {
      if (v === null || v === undefined) return ['rgba(255,255,255,0.3)', 'rgba(255,255,255,0.05)'];
      if (v >= 90) return ['#ff2d2d', 'rgba(255,45,45,0.22)'];
      if (v >= 80) return ['#ff6b35', 'rgba(255,107,53,0.18)'];
      if (v >= 70) return ['#ffb333', 'rgba(255,179,51,0.15)'];
      if (v >= 50) return ['#39ff14', 'rgba(57,255,20,0.12)'];
      if (v >= 40) return ['#22bbaa', 'rgba(34,187,170,0.10)'];
      return ['#4488cc', 'rgba(68,136,204,0.10)'];
    }

    function fmtPct(v) {
      if (v === null || v === undefined || isNaN(v)) return '–';
      return (v >= 0 ? '+' : '') + Number(v).toFixed(1) + '%';
    }

    function renderBoardPanel(title, sub, list, kind) {
      if (!list.length) return '';
      let h = '<div class="rps-board rps-board-' + kind + '">'
        + '<div class="rps-board-hd"><span>' + title + '</span>'
        + '<span class="rps-board-sub">' + sub + '</span></div><div class="rps-board-list">';
      for (const d of list) {
        const v20 = (d.rps20 === null || d.rps20 === undefined) ? '–' : d.rps20;
        const v120 = (d.rps120 === null || d.rps120 === undefined) ? '–' : d.rps120;
        h += '<div class="rps-board-item"><span class="rps-board-name">' + d.name + '</span>'
          + '<span class="rps-board-num">20日 <b>' + v20 + '</b> · 120日 <b>' + v120 + '</b>'
          + ' <em class="' + (kind === 'new' ? 'up' : 'down') + '">'
          + ((d.fresh > 0 ? '+' : '') + d.fresh) + '</em></span></div>';
      }
      return h + '</div></div>';
    }

    function renderMultiPeriod(container, rows, meta) {
      const strong = rows.filter(d => (d.rps60 || 0) >= 80).length;
      const weak = rows.filter(d => (d.rps60 || 0) < 20).length;
      const N = meta.sector_count || rows.length;

      let html = '<div class="rps-summary">'
        + '<span style="color:var(--neon-red);font-weight:700;">强势 ' + strong + '</span> 个 &nbsp;|&nbsp; '
        + '<span style="color:var(--neon-green);font-weight:700;">弱势 ' + weak + '</span> 个 &nbsp;|&nbsp; '
        + '固定板块池 <b>' + N + '</b> 个（分母恒定，跨日可比）'
        + '<div class="rps-summary-sub">'
        + 'RPS = (1 − 排名/N) × 100，排名由「过去 N 个交易日累计涨幅」在池内横截面排序；'
        + '榜单按综合分（60日 50% + 20日 30% + 120日 20%）排序，避免「RPS60 高但正在崩」的板块霸榜。'
        + '</div></div>';

      html += '<div class="rps-table-wrap"><table class="rps-table rps-multi"><thead><tr>'
        + '<th>#</th><th class="rps-th-name">行业板块</th>'
        + '<th>5日</th><th>20日</th><th>60日</th><th>120日</th>'
        + '<th>60日涨幅</th><th>趋势</th>'
        + '</tr></thead><tbody>';

      for (const d of rows) {
        const tc = rpsTone(d.rps60)[0];
        let cells = '';
        for (const v of [d.rps5, d.rps20, d.rps60, d.rps120]) {
          const tone = rpsTone(v);
          cells += '<td class="rps-cell-multi"><span style="color:' + tone[0] + ';background:' + tone[1] + ';">'
            + ((v === null || v === undefined) ? '–' : v) + '</span></td>';
        }
        let flag = '';
        if (d.fresh >= 60) flag = '<span class="rps-flag rps-flag-new">新晋</span>';
        else if (d.fresh <= -60) flag = '<span class="rps-flag rps-flag-fade">退潮</span>';
        const url = 'https://quote.eastmoney.com/center/boardlist.html#industry_board';
        html += '<tr style="background:' + rpsBgColor(d.rps60) + ';">'
          + '<td style="color:' + tc + ';font-weight:700;">' + d.rank + '</td>'
          + '<td><a class="rps-name" style="color:' + tc + ';" target="_blank" href="' + url
          + '" title="' + d.name + ' 板块详情">' + d.name + '</a>' + flag + '</td>'
          + cells
          + '<td style="color:' + (d.change60 >= 0 ? 'var(--neon-red)' : 'var(--neon-green)') + ';text-align:right;">'
          + fmtPct(d.change60) + '</td>'
          + '<td class="rps-trend-cell" style="color:' + tc + ';">'
          + (d.trendLabel || d.trend || '') + '</td>'
          + '</tr>';
      }
      html += '</tbody></table></div>';

      const fresh = rows.filter(d => (d.fresh || 0) >= 60)
        .sort((a, b) => b.fresh - a.fresh).slice(0, 10);
      const fade = rows.filter(d => (d.fresh || 0) <= -60)
        .sort((a, b) => a.fresh - b.fresh).slice(0, 10);
      html += renderBoardPanel('🚀 新晋主线', '短期强于长期，刚启动', fresh, 'new');
      html += renderBoardPanel('⚠️ 高位退潮', '长期强、近期转弱，注意规避', fade, 'fade');

      container.innerHTML = html;
    }

    function updateRPS(rpsData, meta) {
      meta = meta || {};
      const container = document.getElementById('rps-content');
      if (!container) return;
      const rpsTimeEl = document.getElementById('rps-update-time');
      if (rpsTimeEl && rpsData && rpsData.length > 0) {
        const dataDate = window._rpsDataDate || localDateStr();
        const isToday = dataDate === localDateStr();
        let dateHint = dataDate;
        if (!isToday) dateHint += ' (非今日，沿用最近交易日)';
        const at = (meta.updated_at || '').trim();
        rpsTimeEl.textContent = '⛳ ' + dateHint + (at ? ' · ' + at : '') + ' | v0.0.43';
      }
      // 数据源 / 口径 徽标
      const badgeEl = document.getElementById('rps-source-badge');
      if (badgeEl) {
        let srcLabel = '未知来源', srcCls = 'src-unknown';
        if (meta.source === 'eastmoney') { srcLabel = '东方财富·全市场'; srcCls = 'src-em'; }
        else if (meta.source === 'sina') { srcLabel = '新浪行业·部分口径'; srcCls = 'src-sina'; }
        let bh = '<span class="src-badge ' + srcCls + '">' + srcLabel + '</span>';
        bh += '<span style="color:rgba(255,255,255,0.5);">覆盖 ' + (meta.sector_count || rpsData.length) + ' 个板块</span>';
        if (meta.is_full === false) {
          bh += '<div class="degrade-warn">⚠ 当前为降级数据（新浪行业口径，约 ' + (meta.sector_count || '?') + ' 个板块），并非全市场，RPS 仅反映该子集内分位，仅供参考。</div>';
        }
        badgeEl.innerHTML = bh;
      }
      if (!rpsData || rpsData.length === 0) {
        container.innerHTML = '<div class="error-msg">暂无数据</div>';
        return;
      }

      // 多周期口径（数据带 rps60）走新排版
      if (meta.is_multi) {
        renderMultiPeriod(container, rpsData, meta);
        return;
      }

      const trendIcon = {
        '↑': '<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,2 12,12 2,12" fill="var(--neon-red)"/></svg>',
        '↓': '<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,12 2,2 12,2" fill="var(--neon-green)"/></svg>',
        '→': '<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="2,7 12,3 12,11" fill="#888888"/></svg>'
      };

      const strongCount = rpsData.filter(d => d.rps20 >= 80).length;
      const weakCount = rpsData.filter(d => d.rps20 < 40).length;

      let html = '<div style="margin-bottom:12px;color:rgba(255,255,255,0.6);font-size:0.8rem;">'
        + '<span style="color:var(--neon-red);font-weight:700;">强势 ' + strongCount + '</span> 个 &nbsp;|&nbsp; '
        + '<span style="color:var(--neon-green);font-weight:700;">弱势 ' + weakCount + '</span> 个 &nbsp;|&nbsp; '
        + 'RPS = (1 - 排名/N) × 100　N=' + (meta.sector_count || rpsData.length) + '</div>';

      html += '<table class="rps-table"><thead><tr>'
        + '<th>排名</th><th>行业板块</th><th>涨跌</th><th>RPS</th><th>档位</th><th>强度</th>'
        + '</tr></thead><tbody>';

      for (const d of rpsData) {
        const color = rpsColor(d.rps20);
        html += '<tr style="background:' + rpsBgColor(d.rps20) + ';">'
          + '<td style="color:' + color + ';font-weight:700;">' + d.rank + '</td>'
          + '<td><a href="https://www.baidu.com/s?wd=' + encodeURIComponent(d.name + '板块') + '" target="_blank" style="color:' + color + ';text-decoration:none;" title="查看' + d.name + '板块详情">' + d.name + '</a></td>'
          + '<td style="color:' + (d.change >= 0 ? 'var(--neon-red)' : 'var(--neon-green)') + ';">' + (d.change >= 0 ? '+' : '') + d.change.toFixed(2) + '%</td>'
          + '<td><div class="rps-cell">'
          + '<span class="rps-num" style="color:' + rpsColor(d.rps20) + ';">' + d.rps20 + '</span>'
          + '<div style="flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">'
          + '<div class="rps-bar" style="width:' + d.rps20 + '%;background:' + rpsColor(d.rps20) + ';"></div></div></div></td>'
          + '<td class="rps-trend ' + (d.trend === '↑' ? 'up' : d.trend === '↓' ? 'down' : '') + '" title="档位=按RPS分档">' + (trendIcon[d.trend] || d.trend) + '</td>'
          + '<td><span class="rps-strength" style="color:' + color + ';background:' + rpsStrengthBg(d.rps20) + ';">' + d.strength + '</span></td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // ============================================================
    //  数据加载：从 daily_picks.json 读取 sector_rankings
    //  注意：本页 fetch 本地文件受 CORS 限制，仅 GitHub Pages (https) 可正常加载
    // ============================================================
        // 内嵌快照：file:// 直接打开时 fetch 会被 CORS 拦截，

    // 只取日期型 key —— sector_rankings 里混有 'rankings' / 'date' 等非日期键，
    // 直接 sort().reverse() 会把 'rankings' 当最新日期，导致渲染全 0。
    function srDateKeys(sr) {
      return Object.keys(sr || {})
        .filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(String(k)); })
        .sort()
        .reverse();
    }

    function renderFromSectorRankings(sr, latestKey) {
      const arr = sr[latestKey];
      if (!Array.isArray(arr) || arr.length === 0) throw new Error('最新日期数据为空: ' + latestKey);
      // 兼容新旧数据：旧数据无 source / is_full / updated_at 字段
      // daily_picks.json 的板块用东财代码（BK####），据此补全来源/口径徽标
      const first = arr[0] || {};
      const _src = first.source || (/^BK/i.test(String(first.code || '')) ? 'eastmoney' : 'unknown');
      const meta = {
        source: _src,
        is_full: _src === 'eastmoney' ? true : (first.is_full !== false),
        sector_count: first.sector_count || arr.length,
        updated_at: first.updated_at || ''
      };
      // 多周期口径（新）与单周期口径（旧）共存：旧数据没有 rps60，渲染时自动降级
      const isMulti = arr[0].rps60 !== undefined && arr[0].rps60 !== null;
      const rpsData = arr.map(s => ({
        name: s.name,
        code: s.code || '',
        change: s.change_pct || 0,
        rank: s.rank,
        rps20: isMulti ? s.rps20 : (s.rps || 0),
        trend: s.trend || '-',
        strength: s.strength || '',
        rps5: s.rps5,
        rps60: isMulti ? s.rps60 : undefined,
        rps120: s.rps120,
        change5: s.change5,
        change20: s.change20,
        change60: s.change60,
        change120: s.change120,
        trendLabel: s.trend_label,
        fresh: s.fresh,
        score: s.score
      }));
      rpsData.sort((a, b) => b.rps20 - a.rps20);
      rpsData.forEach((d, i) => { d.rank = i + 1; });
      meta.is_multi = isMulti;
      window._rpsDataDate = latestKey;
      updateRPS(rpsData, meta);
    }

    function showRpsError(e) {
      const el = document.getElementById('rps-content');
      if (el) el.innerHTML = '<div class="error-msg">RPS 数据加载失败<br>本页面需通过 <b>GitHub Pages (https)</b> 访问才能加载最新数据<br><span style="color:rgba(255,255,255,0.35);font-size:0.85em;">' + e.message + '</span></div>';
      const t = document.getElementById('rps-update-time');
      if (t) t.textContent = '⛳ 加载失败 | ' + e.message;
    }

    async function loadRPS() {
      // file:// 直接打开：fetch 被 CORS 拦截，使用内嵌快照
      if (location.protocol.indexOf('http') !== 0) {
        try {
          const sr = window.__RPS_EMBED__ || {};
          const keys = srDateKeys(sr);
          if (keys.length === 0) throw new Error('内嵌数据为空，请通过 GitHub Pages (https) 访问');
          renderFromSectorRankings(sr, keys[0]);
        } catch (e) {
          console.error('[RPS] embedded load failed:', e);
          showRpsError(e);
        }
        return;
      }
      try {
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 8000);
        const resp = await fetch('daily_picks.json', { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(to);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const dp = await resp.json();
        const sr = dp.sector_rankings;
        if (!sr || typeof sr !== 'object') throw new Error('sector_rankings 缺失');
        const keys = srDateKeys(sr);
        if (keys.length === 0) throw new Error('无板块排名数据');
        renderFromSectorRankings(sr, keys[0]);
      } catch (e) {
        // 实时拉取失败，回退到内嵌快照
        try {
          const sr = window.__RPS_EMBED__ || {};
          const keys = srDateKeys(sr);
          if (keys.length > 0) { renderFromSectorRankings(sr, keys[0]); return; }
        } catch (_) {}
        console.error('[RPS] load failed:', e);
        showRpsError(e);
      }
    }

    loadRPS();
    setInterval(loadRPS, 300000); // 5 分钟自动刷新
  </script>
