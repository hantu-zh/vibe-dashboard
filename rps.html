  <script>
    // ============================================================
    //  RPS 渲染函数 (移植自 index.html，数据来自 daily_picks.json)
    // ============================================================
    function localDateStr(d) {
      d = d || new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function rpsLabel(v) {
      if (v >= 90) return '极强';
      if (v >= 80) return '强势';
      if (v >= 70) return '偏强';
      if (v >= 50) return '中等';
      if (v >= 40) return '偏弱';
      return '弱势';
    }

    function rpsColor(v) {
      if (v >= 90) return '#ff2d2d';
      if (v >= 80) return '#ff6b35';
      if (v >= 70) return '#ffb333';
      if (v >= 50) return '#39ff14';
      if (v >= 40) return '#22bbaa';
      return '#4488cc';
    }

    function rpsBgColor(v) {
      if (v >= 90) return 'rgba(255,45,45,0.15)';
      if (v >= 80) return 'rgba(255,107,53,0.12)';
      if (v >= 70) return 'rgba(255,179,51,0.1)';
      if (v >= 50) return 'rgba(57,255,20,0.08)';
      if (v >= 40) return 'rgba(34,187,170,0.06)';
      return 'rgba(68,136,204,0.05)';
    }

    function rpsStrengthBg(v) {
      if (v >= 90) return 'rgba(255,45,45,0.3)';
      if (v >= 80) return 'rgba(255,107,53,0.25)';
      if (v >= 70) return 'rgba(255,179,51,0.2)';
      if (v >= 50) return 'rgba(57,255,20,0.15)';
      if (v >= 40) return 'rgba(34,187,170,0.12)';
      return 'rgba(68,136,204,0.1)';
    }

    function updateRPS(rpsData, meta) {
      meta = meta || {};
      const container = document.getElementById('rps-content');
      if (!container) return;
      const rpsTimeEl = document.getElementById('rps-update-time');
      if (rpsTimeEl && rpsData && rpsData.length > 0) {
        const dataDate = window._rpsDataDate || localDateStr();
        const isToday = dataDate === localDateStr();
        let dateHint = dataDate;
        if (!isToday) dateHint += ' (非今日，沿用最近交易日)';
        const at = (meta.updated_at || '').trim();
        rpsTimeEl.textContent = '⛳ ' + dateHint + (at ? ' · ' + at : '') + ' | v0.0.43';
      }
      // 数据源 / 口径 徽标
      const badgeEl = document.getElementById('rps-source-badge');
      if (badgeEl) {
        let srcLabel = '未知来源', srcCls = 'src-unknown';
        if (meta.source === 'eastmoney') { srcLabel = '东方财富·全市场'; srcCls = 'src-em'; }
        else if (meta.source === 'sina') { srcLabel = '新浪行业·部分口径'; srcCls = 'src-sina'; }
        let bh = '<span class="src-badge ' + srcCls + '">' + srcLabel + '</span>';
        bh += '<span style="color:rgba(255,255,255,0.5);">覆盖 ' + (meta.sector_count || rpsData.length) + ' 个板块</span>';
        if (meta.is_full === false) {
          bh += '<div class="degrade-warn">⚠ 当前为降级数据（新浪行业口径，约 ' + (meta.sector_count || '?') + ' 个板块），并非全市场，RPS 仅反映该子集内分位，仅供参考。</div>';
        }
        badgeEl.innerHTML = bh;
      }
      if (!rpsData || rpsData.length === 0) {
        container.innerHTML = '<div class="error-msg">暂无数据</div>';
        return;
      }

      const trendIcon = {
        '↑': '<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,2 12,12 2,12" fill="var(--neon-red)"/></svg>',
        '↓': '<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="7,12 2,2 12,2" fill="var(--neon-green)"/></svg>',
        '→': '<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="2,7 12,3 12,11" fill="#888888"/></svg>'
      };

      const strongCount = rpsData.filter(d => d.rps20 >= 80).length;
      const weakCount = rpsData.filter(d => d.rps20 < 40).length;

      let html = '<div style="margin-bottom:12px;color:rgba(255,255,255,0.6);font-size:0.8rem;">'
        + '<span style="color:var(--neon-red);font-weight:700;">强势 ' + strongCount + '</span> 个 &nbsp;|&nbsp; '
        + '<span style="color:var(--neon-green);font-weight:700;">弱势 ' + weakCount + '</span> 个 &nbsp;|&nbsp; '
        + 'RPS = (1 - 排名/N) × 100　N=' + (meta.sector_count || rpsData.length) + '</div>';

      html += '<table class="rps-table"><thead><tr>'
        + '<th>排名</th><th>行业板块</th><th>涨跌</th><th>RPS</th><th>档位</th><th>强度</th>'
        + '</tr></thead><tbody>';

      for (const d of rpsData) {
        const color = rpsColor(d.rps20);
        html += '<tr style="background:' + rpsBgColor(d.rps20) + ';">'
          + '<td style="color:' + color + ';font-weight:700;">' + d.rank + '</td>'
          + '<td><a href="https://www.baidu.com/s?wd=' + encodeURIComponent(d.name + '板块') + '" target="_blank" style="color:' + color + ';text-decoration:none;" title="查看' + d.name + '板块详情">' + d.name + '</a></td>'
          + '<td style="color:' + (d.change >= 0 ? 'var(--neon-red)' : 'var(--neon-green)') + ';">' + (d.change >= 0 ? '+' : '') + d.change.toFixed(2) + '%</td>'
          + '<td><div class="rps-cell">'
          + '<span class="rps-num" style="color:' + rpsColor(d.rps20) + ';">' + d.rps20 + '</span>'
          + '<div style="flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;">'
          + '<div class="rps-bar" style="width:' + d.rps20 + '%;background:' + rpsColor(d.rps20) + ';"></div></div></div></td>'
          + '<td class="rps-trend ' + (d.trend === '↑' ? 'up' : d.trend === '↓' ? 'down' : '') + '" title="档位=按RPS分档">' + (trendIcon[d.trend] || d.trend) + '</td>'
          + '<td><span class="rps-strength" style="color:' + color + ';background:' + rpsStrengthBg(d.rps20) + ';">' + d.strength + '</span></td>'
          + '</tr>';
      }
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function renderFromSectorRankings(sr, latestKey) {
      const arr = sr[latestKey];
      if (!Array.isArray(arr) || arr.length === 0) throw new Error('最新日期数据为空: ' + latestKey);
      // 兼容新旧数据：旧数据无 source / is_full / updated_at 字段
      const meta = {
        source: (arr[0] && arr[0].source) ? arr[0].source : 'unknown',
        is_full: arr[0] ? (arr[0].is_full !== false) : true,
        sector_count: (arr[0] && arr[0].sector_count) ? arr[0].sector_count : arr.length,
        updated_at: (arr[0] && arr[0].updated_at) ? arr[0].updated_at : ''
      };
      const rpsData = arr.map(s => ({
        name: s.name,
        change: s.change_pct || 0,
        rank: s.rank,
        rps20: s.rps || 0,
        trend: s.trend || '-',
        strength: s.strength || ''
      }));
      rpsData.sort((a, b) => b.rps20 - a.rps20);
      rpsData.forEach((d, i) => { d.rank = i + 1; });
      window._rpsDataDate = latestKey;
      updateRPS(rpsData, meta);
    }

    function showRpsError(e) {
      const el = document.getElementById('rps-content');
      if (el) el.innerHTML = '<div class="error-msg">RPS 数据加载失败<br>本页面需通过 <b>GitHub Pages (https)</b> 访问才能加载最新数据<br><span style="color:rgba(255,255,255,0.35);font-size:0.85em;">' + e.message + '</span></div>';
      const t = document.getElementById('rps-update-time');
      if (t) t.textContent = '⛳ 加载失败 | ' + e.message;
    }

    async function loadRPS() {
      // file:// 直接打开：fetch 被 CORS 拦截，使用内嵌快照
      if (location.protocol.indexOf('http') !== 0) {
        try {
          const sr = window.__RPS_EMBED__ || {};
          const keys = Object.keys(sr).sort().reverse();
          if (keys.length === 0) throw new Error('内嵌数据为空，请通过 GitHub Pages (https) 访问');
          renderFromSectorRankings(sr, keys[0]);
        } catch (e) {
          console.error('[RPS] embedded load failed:', e);
          showRpsError(e);
        }
        return;
      }
      try {
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 8000);
        const resp = await fetch('daily_picks.json', { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(to);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const dp = await resp.json();
        const sr = dp.sector_rankings;
        if (!sr || typeof sr !== 'object') throw new Error('sector_rankings 缺失');
        const keys = Object.keys(sr).sort().reverse();
        if (keys.length === 0) throw new Error('无板块排名数据');
        renderFromSectorRankings(sr, keys[0]);
      } catch (e) {
        // 实时拉取失败，回退到内嵌快照
        try {
          const sr = window.__RPS_EMBED__ || {};
          const keys = Object.keys(sr).sort().reverse();
          if (keys.length > 0) { renderFromSectorRankings(sr, keys[0]); return; }
        } catch (_) {}
        console.error('[RPS] load failed:', e);
        showRpsError(e);
      }
    }

    loadRPS();
    setInterval(loadRPS, 300000); // 5 分钟自动刷新
  </script>
