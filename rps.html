<body>
  <div class="container">

    </div>

      <div class="rps-card-top">
        <div class="rps-card-title">板块多周期 RPS<span>三档色块：红强 · 橙中 · 绿弱</span></div>
        <div class="theme-seg" id="theme-seg"></div>
      </div>
      <div class="rps-update-time" id="rps-update-time">⛳ 数据加载中...</div>

    <div class="rps-modal-mask" data-close></div>
    <div class="rps-modal-box">
      <div class="rps-modal-hd">
        <div class="rps-modal-title"><span id="rps-modal-name"></span><span class="rps-modal-sub" id="rps-modal-sub"></span></div>
        <div class="rps-modal-actions">
          <a id="rps-modal-em" class="rps-modal-link" target="_blank" rel="noopener">↗ 东财板块</a>
          <button class="rps-modal-x" data-close title="关闭">✕</button>
        </div>
      </div>
      <div class="rps-modal-body" id="rps-modal-body">加载中…</div>
    </div>

  <script>
    // ============================================================
    //  RPS 渲染函数 (移植自 index.html，数据来自 daily_picks.json)
    // ============================================================
    // 主题检测：?theme=light 走白底浅色版
    const IS_LIGHT = new URLSearchParams(location.search).get('theme') === 'light';
    if (IS_LIGHT) document.body.classList.add('light');
    (function () {
      const seg = document.getElementById('theme-seg');
      if (seg) {
        seg.innerHTML = '<a class="' + (IS_LIGHT ? 'active' : '') + '" href="rps.html?theme=light">浅色</a>'
          + '<a class="' + (IS_LIGHT ? '' : 'active') + '" href="rps.html">深色</a>';
      }
    })();

    // ============================================================
    //  板块 → 个股 热力度图弹窗（点板块名弹出该板块成分股，A股涨红跌绿）
    // ============================================================
    function rpsHexEscape(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    // 涨红跌绿（A股口径），±4% 封顶，平盘中性灰（取自 market_heat.js 的 tmColor）
    function rpsSectorColor(pct) {
      if (pct == null || isNaN(pct) || pct === 0) return 'rgba(120,130,145,0.55)';
      const a = Math.min(Math.abs(pct) / 4, 1);
      const al = (0.55 + 0.4 * a).toFixed(2);
      return pct > 0 ? ('rgba(255,77,79,' + al + ')') : ('rgba(0,200,83,' + al + ')');
    }
    // 东财成分股（JSONP，绕 CORS）：fs=b:BKxxxx。
    // push2 主站间歇性掐连接 → 多镜像 failover，每台 3.5s 超时，全挂自动重轮一圈。
    var RPS_BOARD_HOSTS = ['push2.eastmoney.com', '1.push2.eastmoney.com', '5.push2.eastmoney.com', '2.push2.eastmoney.com', '6.push2.eastmoney.com', 'push2delay.eastmoney.com'];
    function rpsFetchBoardHost(code, host, tryNo, tryTotal) {
      return new Promise(function (resolve) {
        const cb = '__rpsb' + Date.now() + Math.floor(Math.random() * 1e5);
        const url = 'https://' + host + '/api/qt/clist/get?pn=1&pz=500&po=1&np=1&fltt=2&invt=2&fs='
          + encodeURIComponent('b:' + code.toUpperCase())
          + '&fields=f12,f14,f3,f21&fid=f3&cb=' + cb;
        const ld = document.getElementById('rps-modal-loading');
        if (ld && tryNo) ld.textContent = '⛳ 正在拉取成分股…（线路 ' + tryNo + '/' + tryTotal + '）';
        const s = document.createElement('script');
        const timer = setTimeout(function () { try { window[cb] = undefined; } catch (e) {} s.remove(); resolve(null); }, 3500);
        window[cb] = function (d) {
          clearTimeout(timer);
          try { window[cb] = undefined; } catch (e) {}
          s.remove();
          try {
            const diff = (d && d.data && d.data.diff) || [];
            const out = diff.filter(x => x.f14 && x.f3 != null && x.f3 !== undefined)
              .map(x => ({ code: x.f12, name: x.f14, pct: parseFloat(x.f3), mv: x.f21 != null ? parseFloat(x.f21) : 0 }));
            resolve(out.length ? out : null);
          } catch (e) { resolve(null); }
        };
        s.onerror = function () { clearTimeout(timer); try { window[cb] = undefined; } catch (e) {} s.remove(); resolve(null); };
        s.src = url; document.head.appendChild(s);
      });
    }
    function rpsFetchBoard(code, round) {
      round = round || 0;
      return new Promise(function (resolve) {
        let i = 0;
        (function next() {
          if (i >= RPS_BOARD_HOSTS.length) {
            if (round < 1) { setTimeout(function () { rpsFetchBoard(code, round + 1).then(resolve); }, 1200); }
            else resolve(null);
            return;
          }
          rpsFetchBoardHost(code, RPS_BOARD_HOSTS[i++], i, RPS_BOARD_HOSTS.length * 2).then(function (d) {
            if (d && d.length) resolve(d); else next();
          });
        })();
      });
    }
    function rpsStockUrl(code) {
      const c = String(code || '');
      const m = /^(6|9)/.test(c) ? 'sh' : (/^(0|2|3)/.test(c) ? 'sz' : 'sh');
      return 'https://quote.eastmoney.com/' + m + c + '.html';
    }
    // —— 新浪回退（搬自 market_heat.js 已验证实现）：东财全挂时按板块名匹配新浪 node 拉成分股 ——
    // 注意：新浪列表是 GBK（script 需设 charset）；jsonp_v2 是 var 变量赋值（不可 delete，只能置 undefined，读值须在 cleanup 前）
    function rpsFetchScript(src, charset, timeoutMs) {
      return new Promise(function (resolve) {
        const s = document.createElement('script');
        if (charset) s.charset = charset;
        const timer = setTimeout(function () { s.remove(); resolve(false); }, timeoutMs || 4000);
        s.onload = function () { clearTimeout(timer); s.remove(); resolve(true); };
        s.onerror = function () { clearTimeout(timer); s.remove(); resolve(false); };
        s.src = src; document.head.appendChild(s);
      });
    }
    function rpsSinaBoards(type) {
      return new Promise(function (resolve) {
        const gname = type === 'concept' ? 'S_Finance_bankuai_class' : 'S_Finance_bankuai_sinaindustry';
        try { window[gname] = null; } catch (e) {}
        rpsFetchScript('https://vip.stock.finance.sina.com.cn/q/view/'
          + (type === 'concept' ? 'newFLJK.php?param=class' : 'newSinaHy.php') + '&r=' + Date.now(), 'GBK')
          .then(function (ok) {
            const raw = ok ? window[gname] : null;
            try { window[gname] = undefined; } catch (e) {}
            if (!raw) { resolve(null); return; }
            const out = [];
            for (const k in raw) {
              const f = String(raw[k]).split(',');
              if (f.length < 8) continue;
              const pct = parseFloat(f[5]);
              if (f[0] && f[1] && !isNaN(pct)) out.push({ code: f[0], name: f[1], pct: pct });
            }
            resolve(out.length ? out : null);
          });
      });
    }
    function rpsSinaConstituents(node) {
      return new Promise(function (resolve) {
        const vn = '__rpsbn' + Date.now() + Math.floor(Math.random() * 1e5);
        const s = document.createElement('script');
        const cleanup = function () { try { window[vn] = undefined; } catch (e) {} s.remove(); clearTimeout(timer); };
        const timer = setTimeout(function () { cleanup(); resolve(null); }, 5000);
        s.onload = function () {
          clearTimeout(timer);
          try {
            const d = window[vn];
            cleanup();
            if (!d || !d.length) { resolve(null); return; }
            const out = d.map(function (x) {
              return { code: x.code, name: x.name, pct: parseFloat(x.changepercent), mv: (parseFloat(x.nmc) || 0) * 1e4 };
            }).filter(function (x) { return x.name && !isNaN(x.pct); });
            resolve(out.length ? out : null);
          } catch (e) { resolve(null); }
        };
        s.onerror = function () { cleanup(); resolve(null); };
        s.src = 'https://vip.stock.finance.sina.com.cn/quotes_service/api/jsonp_v2.php/'
          + 'var%20' + vn + '=/Market_Center.getHQNodeData?page=1&num=100&sort=amount&asc=0&node='
          + encodeURIComponent(node) + '&r=' + Date.now();
        document.head.appendChild(s);
      });
    }
    function rpsFetchBoardSina(name) {
      const nm = String(name || '').replace(/\s+/g, '');
      if (!nm) return Promise.resolve(null);
      const pick = function (list) {
        let b = list.filter(x => x.name.replace(/\s+/g, '') === nm)[0];
        if (!b) b = list.filter(x => { const sx = x.name.replace(/\s+/g, ''); return sx && (sx.indexOf(nm) >= 0 || nm.indexOf(sx) >= 0); })[0];
        return b || null;
      };
      return rpsSinaBoards('industry').then(function (ib) {
        const b = ib && pick(ib);
        if (b) return rpsSinaConstituents(b.code);
        return rpsSinaBoards('concept').then(function (cb2) {
          const b2 = cb2 && pick(cb2);
          return b2 ? rpsSinaConstituents(b2.code) : null;
        });
      });
    }
    function openSectorModal(name, code) {

          + ' 只成分股（按流通市值排序 · ' + (pack.src === 'sina' ? '新浪源' : '东财源') + '）';
        body.innerHTML = h;
      });
    }
    function closeSectorModal() { document.getElementById('rps-sector-modal').hidden = true; }
    document.addEventListener('click', function (e) {
      const t = e.target.closest && e.target.closest('.rps-sector-trigger');
      if (t) { e.preventDefault(); openSectorModal(t.getAttribute('data-name'), t.getAttribute('data-code')); return; }

    function localDateStr(d) {
      d = d || new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function rpsLabel(v) {
      if (v >= 90) return '极强';
      if (v >= 80) return '强势';
      if (v >= 70) return '偏强';
      if (v >= 50) return '中等';
      if (v >= 40) return '偏弱';

    function rpsColor(v) {
      if (IS_LIGHT) {
        if (v >= 90) return '#c01818';

        if (v >= 70) return '#c98a00';
        if (v >= 50) return '#0a8f3c';
        if (v >= 40) return '#0e8a7d';
        return '#2f6fb0';
      }
      if (v >= 90) return '#ff2d2d';
      if (v >= 80) return '#ff6b35';
      if (v >= 70) return '#ffb333';
      if (v >= 50) return '#39ff14';
      if (v >= 40) return '#22bbaa';
      return '#4488cc';
    }

    function rpsBgColor(v) {
      if (v >= 90) return 'rgba(255,45,45,0.15)';
      if (v >= 80) return 'rgba(255,107,53,0.12)';
      if (v >= 70) return 'rgba(255,179,51,0.1)';
      if (v >= 50) return 'rgba(57,255,20,0.08)';
      if (v >= 40) return 'rgba(34,187,170,0.06)';

    function rpsStrengthBg(v) {
      if (v >= 90) return 'rgba(255,45,45,0.3)';
      if (v >= 80) return 'rgba(255,107,53,0.25)';
      if (v >= 70) return 'rgba(255,179,51,0.2)';
      if (v >= 50) return 'rgba(57,255,20,0.15)';

    // ============================================================
    //  多周期 RPS 渲染（数据源：板块日K → board_rps.py，固定池分母恒定）
    // ============================================================
    function rpsTone(v) {
      if (v === null || v === undefined) return IS_LIGHT ? ['rgba(0,0,0,0.35)', 'rgba(0,0,0,0.04)'] : ['rgba(255,255,255,0.3)', 'rgba(255,255,255,0.05)'];
      if (IS_LIGHT) {
        if (v >= 90) return ['#c01818', 'rgba(192,24,24,0.12)'];
        if (v >= 80) return ['#e8590c', 'rgba(232,89,12,0.12)'];
        if (v >= 70) return ['#c98a00', 'rgba(201,138,0,0.12)'];
        if (v >= 50) return ['#0a8f3c', 'rgba(10,143,60,0.12)'];
        if (v >= 40) return ['#0e8a7d', 'rgba(14,138,125,0.12)'];
        return ['#2f6fb0', 'rgba(47,111,176,0.12)'];
      }
      if (v >= 90) return ['#ff2d2d', 'rgba(255,45,45,0.22)'];
      if (v >= 80) return ['#ff6b35', 'rgba(255,107,53,0.18)'];
      if (v >= 70) return ['#ffb333', 'rgba(255,179,51,0.15)'];
      if (v >= 50) return ['#39ff14', 'rgba(57,255,20,0.12)'];
      if (v >= 40) return ['#22bbaa', 'rgba(34,187,170,0.10)'];
      return ['#4488cc', 'rgba(68,136,204,0.10)'];
    }

    // 色块三档：红 ≥85 强 / 橙 50–84 中 / 绿 <50 弱（A股：红强绿弱）
    function rpsLevel(v) {
      if (v === null || v === undefined) return 'none';
      if (v >= 85) return 'red';
      if (v >= 50) return 'amber';
      return 'green';
    }

    // 迷你走势：取 120→60→20→5 日强弱剖面，4 点折线
    function sparkSVG(vals, color) {
      const w = 84, h = 22, p = 3;
      if (!vals.length) return '';
      const xs = vals.map((_, i) => p + i * (w - 2 * p) / (vals.length - 1));
      const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      const rng = (mx - mn) || 1;
      const ys = vals.map(v => h - p - (v - mn) / rng * (h - 2 * p));
      const pts = xs.map((x, i) => x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
      return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
        '<polyline points="' + pts + '" fill="none" stroke="' + color +
        '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
    }

    function fmtPct(v) {
      if (v === null || v === undefined || isNaN(v)) return '–';
      return (v >= 0 ? '+' : '') + Number(v).toFixed(1) + '%';
    }

    function renderBoardPanel(title, sub, list, kind) {

      for (const d of list) {

        h += '<div class="rps-board-item"><span class="rps-board-name rps-sector-trigger" data-name="' + rpsHexEscape(d.name) + '" data-code="' + rpsHexEscape(d.code || '') + '" title="点击查看成分股热力度图">' + rpsHexEscape(d.name) + '</span>'
          + '<span class="rps-board-num">20日 <b>' + v20 + '</b> · 120日 <b>' + v120 + '</b>'

    function renderMultiPeriod(container, rows, meta) {
      const strong = rows.filter(d => (d.rps60 || 0) >= 80).length;

      html += '<div class="rps-blocks-wrap"><div class="rps-blocks"><div class="rps-blocks-hd">'

        + '<span title="Δ20日 = RPS20 − RPS60：20日相对强度减去60日相对强度。正数▲=近期走强（短期强于中期），负数▼=近期掉队（短期弱于中期）">Δ20日</span>'
        + '<span class="c-spark" title="该板块 120→60→20→5 日强弱剖面折线：右端高(红)=短期强于长期，右端低(绿)=长期强、短期转弱">60日走势</span></div>';

          ? d.rps20 - d.rps60 : null;
        const prof = [d.rps120, d.rps60, d.rps20, d.rps5].map(v => (v === null || v === undefined ? 0 : v));
        const rising = (d.rps5 !== null && d.rps5 !== undefined && d.rps120 !== null && d.rps120 !== undefined)
          ? d.rps5 >= d.rps120 : true;
        const spark = sparkSVG(prof, rising ? '#e5484d' : '#35b06a');

        html += '<div class="rps-blocks-row">'
          + '<span class="c-name"><span class="rps-name rps-sector-trigger" data-name="' + rpsHexEscape(d.name) + '" data-code="' + rpsHexEscape(d.code || '') + '" title="点击查看成分股热力度图">'
          + rpsHexEscape(d.name) + '</span>' + flag + '</span>';
        for (const v of [d.rps5, d.rps20, d.rps60, d.rps120]) {
          html += '<span class="rp-blk lv-' + rpsLevel(v) + '">' + ((v === null || v === undefined) ? '–' : v) + '</span>';
        }
        html += '<span class="rp-delta ' + (d20 === null ? '' : (d20 >= 0 ? 'up' : 'down')) + '">'
          + (d20 === null ? '–' : ((d20 >= 0 ? '▲' : '▼') + Math.abs(d20))) + '</span>'

          + '</div>';

      html += '</div></div>';
      html += '<div class="rps-legend">色块：<b style="color:#e5484d;">红 ≥85 强势</b> · <b style="color:#f2a20c;">橙 50–84 中性</b> · <b style="color:#35b06a;">绿 &lt;50 弱势</b>（A股红强绿弱）。'
        + ' Δ20日 = RPS20 − RPS60：<b>▲ 正值=近期走强</b>（短期强于中期）· <b style="color:#35b06a;">▼ 负值=近期掉队</b>（短期弱于中期）。'
        + ' 走势 = 该板块 120→60→20→5 日强弱剖面，右端高(红)=短期强于长期。</div>';

      // 头条卡片：新晋主线 / 高位退潮 上移到页面顶部（#rps-headline），下方保留完整主榜

    function renderHeadline(rows) {

    function updateRPS(rpsData, meta) {

      for (const d of rpsData) {
        const color = rpsColor(d.rps20);

    // 只取日期型 key —— sector_rankings 里混有 'rankings' / 'date' 等非日期键，
    // 直接 sort().reverse() 会把 'rankings' 当最新日期，导致渲染全 0。
    function srDateKeys(sr) {
      return Object.keys(sr || {})
        .filter(function (k) { return /^\d{4}-\d{2}-\d{2}$/.test(String(k)); })
        .sort()
        .reverse();
    }

    function renderFromSectorRankings(sr, latestKey) {
      const arr = sr[latestKey];
      if (!Array.isArray(arr) || arr.length === 0) throw new Error('最新日期数据为空: ' + latestKey);
      // 兼容新旧数据：旧数据无 source / is_full / updated_at 字段
      // daily_picks.json 的板块用东财代码（BK####），据此补全来源/口径徽标
      const first = arr[0] || {};
      const _src = first.source || (/^BK/i.test(String(first.code || '')) ? 'eastmoney' : 'unknown');
      const meta = {
        source: _src,
        is_full: _src === 'eastmoney' ? true : (first.is_full !== false),
        sector_count: first.sector_count || arr.length,
        updated_at: first.updated_at || ''
      };
      // 多周期口径（新）与单周期口径（旧）共存：旧数据没有 rps60，渲染时自动降级
      const isMulti = arr[0].rps60 !== undefined && arr[0].rps60 !== null;
      const rpsData = arr.map(s => ({
        name: s.name,
        code: s.code || '',
        change: s.change_pct || 0,
        rank: s.rank,
        rps20: isMulti ? s.rps20 : (s.rps || 0),
        trend: s.trend || '-',
        strength: s.strength || '',
        rps5: s.rps5,
        rps60: isMulti ? s.rps60 : undefined,
        rps120: s.rps120,
        change5: s.change5,
        change20: s.change20,
        change60: s.change60,
        change120: s.change120,
        trendLabel: s.trend_label,
        fresh: s.fresh,
        score: s.score
      }));
      rpsData.sort((a, b) => b.rps20 - a.rps20);
      rpsData.forEach((d, i) => { d.rank = i + 1; });
      meta.is_multi = isMulti;
      window._rpsDataDate = latestKey;
      updateRPS(rpsData, meta);
    }

    function showRpsError(e) {
      const el = document.getElementById('rps-content');
      if (el) el.innerHTML = '<div class="error-msg">RPS 数据加载失败<br>本页面需通过 <b>GitHub Pages (https)</b> 访问才能加载最新数据<br><span style="color:rgba(255,255,255,0.35);font-size:0.85em;">' + e.message + '</span></div>';
      const t = document.getElementById('rps-update-time');
      if (t) t.textContent = '⛳ 加载失败 | ' + e.message;
      const hlEl = document.getElementById('rps-headline');
      if (hlEl) hlEl.innerHTML = '';
    }

    async function loadRPS() {
      // file:// 直接打开：fetch 被 CORS 拦截，使用内嵌快照
      if (location.protocol.indexOf('http') !== 0) {
        try {
          const sr = window.__RPS_EMBED__ || {};
          const keys = srDateKeys(sr);
          if (keys.length === 0) throw new Error('内嵌数据为空，请通过 GitHub Pages (https) 访问');
          renderFromSectorRankings(sr, keys[0]);
        } catch (e) {
          console.error('[RPS] embedded load failed:', e);
          showRpsError(e);
        }
        return;
      }
      try {
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 8000);
        const resp = await fetch('daily_picks.json', { cache: 'no-store', signal: ctrl.signal });
        clearTimeout(to);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const dp = await resp.json();
        const sr = dp.sector_rankings;
        if (!sr || typeof sr !== 'object') throw new Error('sector_rankings 缺失');
        const keys = srDateKeys(sr);
        if (keys.length === 0) throw new Error('无板块排名数据');
        renderFromSectorRankings(sr, keys[0]);
      } catch (e) {
        // 实时拉取失败，回退到内嵌快照
        try {
          const sr = window.__RPS_EMBED__ || {};
          const keys = srDateKeys(sr);
          if (keys.length > 0) { renderFromSectorRankings(sr, keys[0]); return; }
        } catch (_) {}
        console.error('[RPS] load failed:', e);
        showRpsError(e);
      }
    }

    loadRPS();
    setInterval(loadRPS, 300000); // 5 分钟自动刷新
  </script>
<script defer src="analytics.js"></script>
</body>
</html>
